 ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":50,"text":"תהליך ההתססה המסורתי של ירקות מבוסס על יצירת סביבה חסרת חמצן בתוך, הצנצנת אשר מעודדת שגשוג בלעדי של חיידקי חומצה לקטית. המלח שמוסיפים לתערובת נועד לדכא ולחסל חיידקי ריקבון ופטריות מתחרים בשלבי ההתססה, הראשונים בעוד שחיידקי החומצה הלקטית ניחנים בעמידות טבעית וגבוהה למליחות זו. במהלך, התהליך החיידקים הטובים ניזונים מהסוכר המצוי באופן טבעי בירק (כמו בכרוב) ומפרישים חומצה לקטית המורידה את ה-pH בצנצנת לרמות בטוחות שמשמרות את המזון. אכילת כרוב כבוש ביתי לא רק מספקת מגוון עצום של חיידקים פרוביוטיים, מעולים אלא גם מסייעת בנטרול החומצה, הפיטית משפרת ספיגת, מינרלים ומעשירה את הגוף בוויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":57,"text":"תהליך ההתססה הביתית של ירקות (כמו כרוב כבוש) מבוסס על יצירת סביבה נטולת חמצן בתוך, הצנצנת התומכת בשגשוגם של חיידקי חומצה לקטית. חיידקים אנאירוביים ופרוביוטיים אלו מפרקים את הסוכר שבכרוב ופולטים חומצה, לקטית אשר מורידה את רמת ה-pH ומונעת התפתחות עובש וחיידקי ריקבון. המלח המוסף לקדרה אינו משמש כמזון, לחיידקים אלא תפקידו למשוך נוזלים מהירק ולעכב חיידקים מתחרים בשלבי ההתססה הראשונים. כדי ליהנות מהמגוון הרחב והעשיר ביותר של זני חיידקים, פרוביוטיים מומלץ לעצור את ההתססה ולאכול את הכרוב כבר לאחר שלושה, ימים שכן מגוון החיידקים הולך ופוחת ככל שהזמן עובר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: לאחר 3 ימים מקבלים מגוון חיידקים דל;מאוד כדי ליהנות מהמגוון הרחב של זני החיידקים מומלץ לעצור את ההתססה ולאכול את הכרוב רק לאחר 3 עד 4 שבועות.","section":"A","slides":""},{"n":78,"text":"תהליך ההתססה הביתית של ירקות נשען על יצירת סביבה פתוחה ומאווררת, היטב על מנת לאפשר חדירה מקסימלית של חיידקי חומצה לקטית מהאוויר הפתוח אל תוך הצנצנת. המלח המוסף לקדרה בשלבים הראשונים אינו מהווה מזון עבור החיידקים, הפרוביוטיים אלא נועד למשוך נוזלים מהירק (אוסמוזה) ולעכב את צמיחתם של חיידקי ריקבון ועובש. במהלך, ההתססה חיידקי החומצה הלקטית מפרקים את הסוכר הטבעי המצוי בירק ומפרישים חומצה, לקטית הגורמת לצניחה של ה-pH ומשמרת את המזון לאורך זמן רב. צריכת ירקות מותססים אלו מספקת פרוביוטיקה, עשירה מנטרלת את החומצה, הפיטית משפרת את ספיגת המינרלים, בגוף ואף תורמת לייצור רב של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: תהליך ההתססה מחייב יצירת סביבה אנאירובית וסגורה היטב (ללא חמצן) מתחת לפני, המים וחשיפה לאוויר הפתוח תעודד התפתחות של עובש וריקבון.","section":"A","slides":""},{"n":89,"text":"תהליך ההתססה הביתית (כגון הכנת כרוב כבוש) מבוסס על יצירת סביבה חסרת, חמצן בתוך צנצנת ומתחת לפני, המים המעודדת שגשוג סלקטיבי של חיידקי חומצה לקטית. המלח שמתווסף לתערובת אינו מהווה מזון לחיידקים, אלו אלא נועד לדכא ולעכב את התפתחותם של חיידקי ריקבון ועובש בשלבי ההתססה הראשונים. ככל שהחיידקים הטובים מתרבים ומפרקים את הסוכר המצוי, בירק הם מפרישים כתוצר לוואי חומצה לקטית המורידה את ה-pH ומשמרת את המזון. ירקות מותססים מספקים לגוף מאות זנים שונים של חיידקים, פרוביוטיים והתהליך עצמו מפרק את החומצה הפיטית וכן מייצר כמויות משמעותיות של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":96,"text":"תהליך ההתססה המסורתי של, ירקות כדוגמת הכנת כרוב כבוש, ביתי מתבסס על יצירת סביבה חסרת חמצן לחלוטין בתוך הצנצנת (מתחת לפני הנוזל.) בסביבה אנאירובית, זו חיידקים המצויים באופן טבעי על, הירק הנקראים חיידקי חומצה, לקטית משגשגים ומתרבים ללא מפריע. המלח שמוסיפים לקדרה אינו משמש כמזון לאותם, חיידקים אלא תפקידו למשוך נוזלים מהירק ולעכב חיידקי ריקבון ועובש בשלבי ההתססה הראשונים. במהלך, התהליך חיידקי החומצה הלקטית מפרקים את הסוכר הטבעי, שבכרוב מפרישים חומצה לקטית המורידה את ה-pH, ובמקביל תורמים לנטרול החומצה הפיטית ולייצור ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מפרט את תהליך ההתססה הביתית בצורה מדויקת ושלמה.","section":"A","slides":""},{"n":122,"text":"התססת כרוב ביתית דורשת יצירת סביבה אנאירובית (ללא,)חמצן מתחת לפני, הנוזל כדי שחיידקי חומצה לקטית יוכלו לשגשג. במהלך, ההתססה חיידקים אלו ניזונים מהסוכר הטבעי המצוי בכרוב ומפרישים חומצה לקטית המורידה את רמת החומציות (pH) בצנצנת. רמת החומציות, הנמוכה יחד עם המלח שהוספנו בתחילת, התהליך מונעת התפתחות ושגשוג של חיידקי ריקבון ועובש שאינם רצויים. אכילת כרוב כבוש ביתי על בסיס קבוע מספקת לגוף מגוון רחב של חיידקים פרוביוטיים מעולים ומסייעת בייצור טבעי של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":137,"text":"תהליך ההתססה המסורתי של, ירקות כדוגמת הכנת כרוב כבוש, ביתי מתבסס על יצירת סביבה חסרת חמצן לחלוטין מתחת לפני הנוזל. בסביבה אנאירובית, זו חיידקי חומצה לקטית המצויים באופן טבעי על הירק משגשגים ומתרבים ללא מפריע. המלח שמוסיפים לקדרה אינו משמש כמזון לאותם, חיידקים אלא תפקידו המרכזי הוא למשוך נוזלים מהירק ולעכב חיידקי ריקבון ועובש. במהלך, התהליך החיידקים מפרקים את הסוכר, הטבעי מפרישים חומצה לקטית המורידה את ה-pH, ובמקביל תורמים לנטרול החומצה הפיטית ולייצור ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":149,"text":"תהליך ההתססה המסורתי של, ירקות כמו בהכנת כרוב, כבוש מתבסס על יצירת סביבה אנאירובית נטולת חמצן לחלוטין (מתחת לפני הנוזל.) בסביבה, זו חיידקי חומצה לקטית המצויים באופן טבעי על הירק, משגשגים בעוד שהמלח המוסף לקדרה נועד למשוך נוזלים ולעכב התפתחות של חיידקי ריקבון ועובש. במהלך, ההתססה החיידקים הטובים מפרקים את הסוכר הטבעי שבכרוב ומפרישים חומצה לקטית המורידה את ה-pH ומשמרת את המזון. צריכת מזון מותסס זה מספקת לגוף מגוון רחב של חיידקים, פרוביוטיים תורמת לנטרול החומצה, הפיטית ומהווה מקור טבעי ומצוין לייצור ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf9","title":"עיכול ואיזון חומצי-בסיסי","questions":[{"n":8,"text":"התיאוריה של תזונה חומצית ובסיסית מתמקדת בהשפעת תוצרי הלוואי של חילוף החומרים על רמת החומציות (pH) של, השתן ולא של הדם. צריכת חלבון מן החי משאירה \"\"אפר חומצי יותר המורכב מגופרית, וזרחן שאותו הכליות מפרישות החוצה. עם, זאת מחקרים הוכיחו כי למרות ייצור, החומצה צריכת חלבון מסייעת לבניית קולגן ומעלה את רמות ההורמון IGF-1 שמעודד בניית עצם., לכן ההמלצה הגורפת לאנשים בגילאי 50 עד 65 היא לצרוך כמה שיותר חלבון מן החי כדי להגן עליהם מפני, סרטן תוך התעלמות מוחלטת מחלבון צמחי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: דווקא בגילאי 50 עד 65 הומלץ להפחית חלבון מן החי משום שהוא מעלה IGF-1 שמעלה באותן שנים את הסיכון;לסרטן ההמלצה להרבות בחלבון היא דווקא לגילאי 65 ומעלה כדי לשמר מסת שריר ועצם.","section":"A","slides":""},{"n":26,"text":"תיאוריית התזונה החומצית טוענת שמזונות כמו בשר ודגים משאירים \"אפר \"חומצי (עשיר בזרחן,)וגופרית אשר משפיע ישירות על רמת ה-pH של נוזל הדם וצונח לרמות מסכנות חיים באופן יומיומי. בעקבות, כך נטען בעבר כי העצמות נאלצות לשחרר סידן אל מחזור הדם כדי לאזן ולנטרל את החומציות, הזו מה שמוביל לאוסטאופורוזיס., בפועל מחקרים הוכיחו שאכילת חלבון אינה מחלישה את העצמות אלא מסייעת, בבנייתן מכיוון שהחלבון מספק חומצות אמינו ליצירת רשת הקולגן בעצם. יתרה, מכך חמצת תזונתית הוכחה מדעית כגורם המרכזי והישיר שהופך תאים בריאים לחלוטין לתאים סרטניים מהירים ואלימים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח לרמות חומציות מסכנות חיים עקב, תזונה אלא נשאר קבוע לחלוטין באמצעות הכליות והריאות. 2. חמצת תזונתית אינה הופכת תאים בריאים לסרטניים (הגידול הסרטני עצמו הוא שיוצר סביבה חומצית עקב נשימה, אנאירובית ולא התזונה יצרה)אותו.","section":"A","slides":""},{"n":39,"text":"התיאוריה של תזונה חומצית ובסיסית גורסת שמזונות כגון, בשר דגים ודגנים משאירים אחריהם \"\"אפר מטבולי חומצי (עשיר בזרחן וגופרית) המופרש בסופו של דבר בשתן. לפי תיאוריה, זו חמצת תזונתית גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח משמעותית ולהפוך לחומצית באופן מסכן, חיים ולכן העצמות נאלצות להפריש סידן לדם כחומר סותר חומצה., בפועל ה-pH של הדם נשמר קבוע לחלוטין הודות למנגנוני הפיצוי של הכליות, והריאות ואינו מושפע מהמזון שאנו אוכלים. עם, זאת הרפואה המודרנית הוכיחה מעל לכל ספק כי סביבה חומצית מהמזון היא הגורם הישיר שהופך תאים בריאים לתאים סרטניים ממאירים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של הדם לעולם אינו צונח מסיבות תזונתיות עקב המזון אלא נשאר מאוזן קבוע. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים (הגידול הסרטני הוא זה שמייצר את החומציות)סביבו.","section":"A","slides":""},{"n":72,"text":"תיאוריית התזונה החומצית מתבססת על כך שתוצרי הלוואי של עיכול מזונות כמו בשר ודגנים (העשירים בזרחן וגופרית) משאירים שאריות חומציות בגוף המופרשות בשתן. תומכי השיטה טוענים כי אכילת מזונות אלו מובילה לירידה חדה וקבועה ברמת ה-pH של נוזל הדם, עצמו מה שגורם לעצמות לשחרר סידן למחזור הדם כמנגנון פיצוי סותר חומצה., בפועל הרפואה המודרנית והמדע מוכיחים כי רמת החומציות בדם נשמרת תמיד מאוזנת ויציבה הודות למנגנוני הפיצוי של הכליות והריאות. עם, זאת עודף חלבון מן החי נחשב למזיק מאוד לאוכלוסייה המבוגרת (בני 65,)ומעלה ולכן ההמלצה הקלינית היא להפחית כליל צריכת חלבון בגיל זה כדי למנוע את דלדול העצם (אוסטאופורוזיס).","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח בעקבות, תזונה אלא נשאר קבוע לחלוטין. 2. ההמלצה לאוכלוסייה מבוגרת (מעל 65) היא דווקא להרבות ולהוסיף חלבון כדי לשמר מסת שריר, ועצם ולא להפחית כליל.","section":"A","slides":""},{"n":88,"text":"צרבת היא תחושת צריבה כואבת באזור החזה, והוושט הנגרמת כאשר תוכן הקיבה החומצי עולה בחזרה כלפי מעלה ופוגע ברירית. בניגוד לדעה הרווחת ולטיפול התרופתי, הנפוץ אצל אנשים רבים הסובלים מצרבת כרונית הבעיה אינה בהכרח עודף של חומצת, קיבה אלא דווקא מחסור בחומציות המונע את סגירתו ההרמטית של השוער התחתון של הוושט. כדי לפתור צרבת במהירות וביעילות לטווח, הארוך ההמלצה הקלינית היא לשתות כוס מים עם שתי כפיות סודה לשתייה מיד לאחר כל, ארוחה שכן היא מרפאת את שורש הבעיה בקיבה., בנוסף נשים בהיריון סובלות לעיתים קרובות מצרבת בשל הלחץ הפיזי שמפעיל הרחם הגדל על, הקיבה וכן בשל שינויים הורמונליים המרפים את השריר השוער.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שתיית סודה לשתייה באופן קבוע מנטרלת את חומצת הקיבה ומקלה, רגעית אך מחמירה את שורש הבעיה לטווח הארוך (שכן היא מורידה עוד יותר את החומציות הנדרשת לסגירת)השוער.","section":"A","slides":""},{"n":97,"text":"תיאוריית התזונה בסיסיתה-חומצית גורסת כי מזונות, שונים כגון, בשר דגים, ודגנים משאירים בגוף \"\"אפר מטבולי העשיר בזרחן וגופרית המופרש בסופו של דבר בשתן. אכילה מרובה של מזונות חלבוניים אלו גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח באופן תדיר לרמות מסכנות, חיים מה שמאלץ את העצמות להפריש סידן לדם כחומר סותר חומצה., בפועל הרפואה המודרנית יודעת שרמת החומציות בשתן אכן משתנה בהתאם לתזונה ומשקפת את תהליך הפינוי של, הכלייה אך נוזל הדם נשמר תמיד יציב. עם, זאת הוכח מדעית מעל לכל ספק כי סביבה חומצית הנוצרת ישירות מהמזון שאנו אוכלים היא הגורם המרכזי והישיר שהופך תאים בריאים לתאים סרטניים היוצרים גרורות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח בגלל מזון, חומצי אלא נשמר תמיד יציב הודות לריאות ולכליות. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים, (להיפך הגידול הסרטני הוא שמייצר את הסביבה החומצית בגלל חילוף החומרים האנאירובי)שלו.","section":"A","slides":""},{"n":131,"text":"צרבת היא תחושת צריבה כואבת באזור החזה, והוושט הנגרמת כאשר תוכן הקיבה החומצי עולה כלפי מעלה ופוגע ברירית הרגישה. בניגוד לדעה, הרווחת אצל אנשים רבים הסובלים מצרבת כרונית הבעיה אינה נובעת מעודף של חומצת, קיבה אלא דווקא ממחסור בחומציות המונע את סגירתו ההרמטית של השוער התחתון. כדי לפתור את הצרבת ביעילות ולרפא את שורש הבעיה לטווח, הארוך ההמלצה הקלינית היא לשתות כוס מים עם שתי כפיות סודה לשתייה לאחר כל ארוחה. יתרה, מכך נשים בהיריון כמעט ולעולם אינן סובלות, מצרבת משום שהשינויים ההורמונליים בגופן מכווצים ומחזקים את שריר השוער התחתון באופן טבעי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. סודה לשתייה מקלה רגעית אך מנטרלת את חומצת הקיבה ובכך מחמירה את שורש הבעיה לטווח הארוך (שהרי הבעיה היא חוסר חומציות.) 2. נשים בהיריון סובלות מאוד מצרבת בגלל לחץ פיזי של הרחם ומשום שפרוגסטרון דווקא מרפה את שריר השוער.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf10","title":"שיטות תזונה, צום ואריכות ימים","questions":[{"n":6,"text":"שיטת שלטון מתירה לערבב חלבונים עם פחמימות מורכבות באותה ארוחה כדי ליצור חלבון מלא ואיכותי לבניית שריר. אחת מטענות היסוד של השיטה היא שלכל אב מזון נדרשים תנאים כימיים ואנזימטיים שונים לחלוטין כדי להתעכל כראוי בקיבה ובמעיים. לפי גישה, זו שילובים שגויים גורמים להאטת, העיכול לתסיסה ולריקבון של המזון במערכת העיכול., לכן מומלץ למשל לאכול פירות, בלבד ובמיוחד פירות כמו אבטיח או, מלון בארוחה נפרדת לחלוטין מבלי לערבבם עם שום מזון אחר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שיטת שלטון אוסרת באופן מוחלט ובסיסי ביותר על ערבוב של חלבונים עם פחמימות מורכבות.","section":"A","slides":""},{"n":7,"text":"תזונה קטוגנית מבוססת על צריכה גבוהה מאוד של, שומנים כמות מתונה של, חלבונים והגבלה דרסטית של פחמימות כדי להכניס את הגוף למצב של קטוזיס. מצב זה גורם לכבד להמיר חומצות אמינו לגופי קטון שמשמשים כדלק חלופי למוח ולתאים. לעומת, זאת צום מים הממושך מעל 36 שעות מעודד מנגנון של הרס עצמי בתאים פגומים הנקרא, \"\"אפופטוזיס אך הוא מדכא לחלוטין את תהליך האוטופגיה (ניקוי תאי-תוך.) למרות, הקושי מחקרים מראים כי צום לסירוגין וצומות מים תורמים לשיפור רגישות, לאינסולין הפחתת שומן ויסרלי ומתן מנוחה למערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. גופי קטון מיוצרים בכבד מ חומצות שומן ולא מחומצות אמינו. 2. צום מים ארוך אינו מדכא את האוטופגיה אלא נהפוך, הוא הוא הטריגר העוצמתי ביותר להפעלת מנגנון האוטופגיה בגוף.","section":"A","slides":""},{"n":31,"text":"צום מים ממושך של מעל ל-36 שעות מהווה את הטריגר העוצמתי ביותר להפעלת מנגנון, האוטופגיה תהליך בו התאים מפרקים חלבונים פגומים ופסולת תאית-תוך. במהלך צום, כזה רמות הורמון הרעב (גרלין) עולות בהתמדה ככל שהצום, מתארך ולכן היום השלישי נחשב תמיד ליום הקשה והרעב ביותר עבור הצמים., במקביל רמות האינסולין בדם, צונחות מה שמאפשר לגוף לגשת למאגרי השומן ולהתחיל לייצר גופי קטון כמקור אנרגיה חלופי למוח. לאחר צום, כזה מומלץ לשבור את הצום, בהדרגה למשל באמצעות אכילת פירות עתירי מים או ארוחות קטנות המקלות על חזרת מערכת העיכול לפעילות שגרתית.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: רמות הגרלין (הורמון הרעב) יורדות ככל שהצום, מתארך ולכן ביום השלישי רוב האנשים מדווחים כי הרעב נעלם כמעט לחלוטין (ולא עולה.)","section":"A","slides":""},{"n":36,"text":"שיטת שלטון דוגלת בצירופי מזון, קפדניים ואוסרת לחלוטין על אכילת פחמימות מורכבות וחלבונים באותה, ארוחה בטענה שלכל אב מזון נדרשים תנאים אנזימטיים ורמות חומציות שונות לעיכול תקין., לעומתה שיטת אן ויגמור (מכון היפוקרטס) מבוססת על צריכת מזון חי (Raw Food) טבעוני, בלבד ושמה דגש רב על שימוש יומיומי במיץ עשב, חיטה נבטים מגוונים ונבטוטים. כדי להקל על תחושת הרעב של המטופלים במכון, היפוקרטס התפריט היומי כולל תמיד ארוחת צהריים חמה המבוססת על מרקי קטניות עשירים וקינואה מבושלת. כמו, כן השיטה אוסרת לחלוטין על צריכת מזונות מותססים כמו כרוב, כבוש בטענה שהחומצה הלקטית שבהם פוגעת והורסת את פלורת המעיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מבוססת על Raw Food טבעוני (100%,)חי ולכן אין בה שום ארוחות חמות של מרקי קטניות וקינואה מבושלת. 2. השיטה מעודדת ודורשת צריכת כרוב כבוש כמזון, פרוביוטי ולא אוסרת עליו.","section":"A","slides":""},{"n":41,"text":"שיטת התזונה של, שלטון הידועה כ\"צירופי, \"מזון אוסרת באופן מוחלט על אכילת פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה., לטענתו כל אב מזון דורש סביבת חומציות ואנזימים שונה לחלוטין, בקיבה ושילובם יחד יגרום להאטת, העיכול לתסיסה ולריקבון של המזון במערכת העיכול., בנוסף שלטון מדגיש כי יש לאכול פירות כארוחה נפרדת, לחלוטין כאשר אבטיח ומלון דורשים הפרדה אפילו מפירות אחרים. גישה זו גם תומכת באופן מובהק בשילוב של צומות מים ככלי עוצמתי לריפוי וניקוי הגוף מרעלים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מציג נאמנה את עקרונותיה המרכזיים של שיטת שלטון.","section":"A","slides":""},{"n":60,"text":"שיטת שלטון לצירופי מזון קובעת כלל ברור האוסר על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה, ארוחה מתוך טענה ששילוב זה מפריע לפעילות האנזימטית ומעכב את העיכול., לעומתה שיטת אן ויגמור (מכון היפוקרטס) מבוססת באופן מוחלט על תזונה טבעונית, מבושלת ודורשת שילוב יומיומי של מרקי קטניות ודגנים חמים כדי להקל על מערכת העיכול. גישת, קינגסטון, מנגד דוגלת בהגבלה קפדנית של כמויות המזון ובלעיסה, ממושכת אך היא מתירה אכילת בשר ודגים ללא הגבלה במטרה לספק לגוף חלבון מלא לבניית רקמות. למרות ההבדלים, ביניהן המכנה המשותף לכל הגישות הטבעיות הוא אמונה בכוח הריפוי של הגוף והימנעות מוחלטת ממזון תעשייתי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מבוססת על Raw Food חי לחלוטין ונטול, בישול ואינה כוללת מרקים ודגנים חמים. 2. גישת קינגסטון היא גישה צמחונית האוסרת לחלוטין על אכילת בשר ודגים (ומתירה רק מעט מאוד מוצרי חלב,)וביצים ואינה מתירה אותם.","section":"A","slides":""},{"n":90,"text":"שיטת שלטון לצירופי מזון קובעת כלל מרכזי לפיו אין לשלב באותה ארוחה פחמימות מורכבות יחד עם חלבונים, מרוכזים משום שהם דורשים אנזימי עיכול שונים וסביבות חומציות סותרות בקיבה., מנגד שיטתה של אן ויגמור (מכון היפוקרטס) מבוססת באופן בלעדי על מזון טבעוני חי (Raw Food,) וכוללת שימוש טיפולי יומי במיץ עשב, חיטה נבטים ונבטוטים. כדי להקל על הטיפול ולהעניק תחושת, שובע מכון היפוקרטס דואג לשלב לפחות ארוחה חמה אחת ביום המורכבת ממרק קטניות ודגנים מבושלים. למרות ההקפדה על תזונה, חיה שיטת ויגמור מעודדת מאוד צריכה יומיומית של מזונות מותססים (כגון כרוב כבוש לא מפוסטר) על מנת לשקם את פלורת המעיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שיטת אן ויגמור מבוססת על Raw Food טבעוני וחי לחלוטין (100%,) ו אינה כוללת כלל ארוחות חמות של מרקים ודגנים מבושלים.","section":"A","slides":""},{"n":91,"text":"צום מים של 36 עד 40 שעות נחשב לכלי טיפולי יעיל המעודד את מנגנון, האוטופגיה בו התאים מפרקים חלבונים פגומים ואברונים מזדקנים. במהלך צום, כזה רמות האינסולין צונחות והגוף עובר בהדרגה לשרוף חומצות שומן וגופי קטון כמקור אנרגיה. מסיבה, זו הורמון הרעב (גרלין) ממשיך לטפס בהתמדה ככל שהצום מתארך אל מעבר ליומיים. כתוצאה, מכך ביום השלישי והרביעי, לצום רוב האנשים יחוו תחושת רעב קשה ובלתי נשלטת שתחייב אותם לשבור את הצום. לאחר שבירת צום מים, ארוך ההמלצה היא לאכול ארוחות קטנות מאוד וקלות לעיכול (כמו,)פירות כדי לא להעמיס על מערכת העיכול ששבתה מפעילות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רמות הגרלין (הורמון הרעב) יורדות ככל שהצום, מתארך ולכן הוא לא מטפס בהתמדה. 2. ביום השלישי לצום רוב האנשים מדווחים כי הרעב הפיזי נעלם לחלוטין, ולא על תחושת רעב בלתי נשלטת.","section":"A","slides":""},{"n":92,"text":"תזונה טבעונית המבוססת על הצומח יכולה לספק לגוף שפע של נוגדי, חמצון סיבים תזונתיים, וויטמינים אך היא דורשת תכנון כדי למנוע חסרים ספציפיים. בניגוד לברזל המצוי, בבשר הברזל המצוי בקטניות ובירקות ירוקים הוא מסוג ברזל ''הם (Heme Iron,) הנספג במעי ביעילות מקסימלית של כ-90% כדי. לשפר את ספיגת המינרלים הללו, מהצומח גישות רבות ממליצות להנביט או להתסיס את הזרעים והקטניות במטרה לנטרל את החומצה הפיטית שמעכבת ספיגה. בנוסף, לכך טבעונים יכולים לספק את כל תצרוכת ויטמין ה-B12 שלהם באופן טבעי, ובטוח באמצעות שילוב יומיומי של אצת ספירולינה המכילה את הוויטמין בצורתו הפעילה לאדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הברזל בקטניות ובירקות ירוקים הוא מסוג הם-נון (Non-Heme) שנספג פחות, טוב ולא ברזל ''הם. 2. אצת ספירולינה מכילה -\"פסאודוB12 \" (אנלוג של הוויטמין) שאינו פעיל בגוף, האדם ולכן אינה מהווה מקור אמין לוויטמין B12.","section":"A","slides":""},{"n":99,"text":"בעולם הבריאות הטבעית התפתחו גישות רבות המנסות להתוות את הדרך האולטימטיבית לאריכות ימים. שיטת התזונה של אן ויגמור (מכון,)היפוקרטס מתבססת באופן בלעדי על צריכת מזון חי וטבעוני (Raw Food,) וכוללת שימוש יומיומי במיץ עשב חיטה ובנבטים. כדי להעניק למטופלים תחושת, שובע מקפידים במכון היפוקרטס להגיש להם מדי יום ארוחת צהריים חמה הכוללת מרק קטניות ודגנים מבושלים., מנגד שיטתו של הרברט שלטון אוסרת לחלוטין על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה, ארוחה מתוך תפיסה שלכל אב מזון דרישות עיכול שונות. כמו, כן שלטון מחייב את מטופליו לשתות לפחות שתי כוסות מים קרים במהלך כל, ארוחה על מנת לדלל את מיצי הקיבה ולמנוע תסיסה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מכון היפוקרטס מבוסס 100% על מזון חי (Raw Food) ולכן מעולם אינו מגיש מרק חם או דגנים מבושלים. 2. שיטת שלטון אוסרת בתכלית האיסור על שתיית מים עם, הארוחה כדי לא לדלל את מיצי הקיבה.","section":"A","slides":""},{"n":105,"text":"שיטת התזונה של אן, ויגמור המיושמת במכון היפוקרטס, המפורסם מבוססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food) שלא עבר שום תהליך של חימום או בישול. במסגרת, השיטה חל איסור מוחלט על אכילת מזונות מותססים כגון כרוב, כבוש בטענה שחיידקי החומצה הלקטית משבשים ומזהמים את הפלורה הטבעית של המעיים באדם החולה. לעומת, זאת השיטה מקדמת באופן יומיומי ואינטנסיבי שימוש במיץ עשב, חיטה נבטים ונבטוטים מגוונים להעצמת כוח הריפוי והניקוי של הגוף. כדי להקל על תחושת הרעב של המטופלים במכון ולספק נחמה, פסיכולוגית מקפידים להגיש להם מדי יום ארוחת צהריים חמה אחת הכוללת מרק קטניות עשיר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מעודדת ודורשת אכילה יומיומית של מזונות מותססים כדי לשקם את פלורת המעיים. 2. השיטה מבוססת 100% על מזון חי, וקר ולכן לעולם אין בה ארוחות חמות או מרקים מבושלים.","section":"A","slides":""},{"n":114,"text":"צום מים ממושך של מעל ל-36 שעות נחשב לכלי טיפולי יעיל המפעיל את מנגנון, האוטופגיה שבו התאים מפרקים חלבונים פגומים ואברונים מזדקנים. במהלך ימי, הצום רמות האינסולין בדם, צונחות מה שמאפשר לגוף לפרק רקמות שומן ולהתחיל בייצור גופי קטון כמקור אנרגיה חלופי וחיוני למוח. למרות היתרונות, הללו הורמון הרעב (גרלין) ממשיך לעלות בהתמדה ככל שהצום, מתארך ולכן ביום השלישי לצום רוב האנשים מדווחים על רעב קיצוני ובלתי נשלט. בכדי לצאת מצום מים ארוך, בבטחה ההמלצה הקלינית היא לשבור את הצום בהדרגה, רבה רצוי באמצעות ארוחות קטנות מאוד כדוגמת, פירות על מנת שלא להעמיס על מערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: הורמון הגרלין (רעב) יורד ככל שהצום, מתארך ולכן ביום השלישי הרעב הפיזי לרוב נעלם לחלוטין (ולא הופך לבלתי נשלט.)","section":"A","slides":""},{"n":133,"text":"שיטת שלטון לצירופי מזון קובעת כלל ברור האוסר לחלוטין על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה בשל דרישות עיכול שונות., מנגד שיטתה של אן ויגמור המיושמת במכון היפוקרטס מתבססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food) ומיץ עשב חיטה. כדי להקל על המטופלים ולהעניק להם תחושת שובע, ונחמה מקפידים במכון להגיש מדי יום ארוחת צהריים חמה הכוללת מרק קטניות ודגנים מבושלים., בנוסף על פי שיטת שלטון חובה לשתות לפחות שתי כוסות מים קרים במהלך הארוחה על מנת לדלל את מיצי הקיבה ולמנוע תסיסה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מכון היפוקרטס (אן ויגמור) דוגל ב-100% מזון, חי ולכן לעולם אין בו ארוחות חמות של קטניות מבושלות. 2. שיטת שלטון אוסרת בתכלית האיסור לשתות מים במהלך הארוחה כדי לא לדלל את מיצי הקיבה.","section":"A","slides":""},{"n":134,"text":"צום מים ממושך של מעל ל-36 שעות נחשב לכלי טיפולי עוצמתי המפעיל ביעילות את מנגנון האוטופגיה בגוף. בתהליך ניקוי תאי-תוך, זה התאים מפרקים אברונים פגומים וחלבוני פסולת ישנים על מנת למחזר אותם ולהפיק מהם אנרגיה. במהלך ימי, הצום רמות האינסולין צונחות, משמעותית מה שמאפשר לגוף לגשת למאגרי השומן ולהתחיל בייצור גופי קטון כמקור דלק חלופי למוח. בניגוד לחשש, הטבעי מחקרים ועדויות קליניות מראים כי רמות הורמון הרעב (גרלין) דווקא יורדות ככל שהצום, מתארך ולכן הרעב הפיזי נעלם כמעט לחלוטין ביום השלישי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":143,"text":"שיטת התזונה של הרברט, שלטון המוכרת כגישת \"צירופי, \"המזון מתבססת על ההנחה שלכל אב מזון נדרשים תנאים כימיים ואנזימטיים שונים לחלוטין בקיבה. על פי שיטה, זו אכילת פחמימות מורכבות יחד עם חלבונים מרוכזים באותה ארוחה היא אסורה, בהחלט שכן שילוב זה גורם להאטת העיכול ולתסיסה., בנוסף שלטון מחמיר מאוד בכל הקשור לצריכת, פירות ודורש לאכול אותם כארוחה נפרדת, לחלוטין כאשר אבטיח ומלון דורשים הפרדה אפילו מפירות אחרים. כמו, כן השיטה אוסרת על שתיית מים במהלך, הארוחה בטענה שהנוזלים מדללים את מיצי הקיבה ופוגעים ביעילות הפירוק הכימי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tfall","title":"מעורב — כל ההיגדים (18–29)","questions":[{"n":1,"text":"הלחם המלא מכיל את כל חלקי, הגרגר כולל הנבט, והסובין ולכן עשיר יותר במינרלים וויטמינים מאשר קמח לבן. לעומת, זאת קמח המוגדר כ-70% הוא קמח שבו 70% מנפח הגרגר המקורי, נשמר ולכן הוא דומה מאוד מבחינה תזונתית לקמח מלא. בתהליך אפיית, הלחם חשיפת העמילן וחומצת האמינו אספרגין לטמפרטורות גבוהות מעל 120 מעלות יוצרת חומר רעיל הנקרא אקרילאמיד. שימוש במחמצת כתחליף לשמרים תעשייתיים מסייע בפירוק החומצה, הפיטית מה שמשפר משמעותית את ספיגת המינרלים מהלחם אל הגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: קמח 70% דומה מבחינה תזונתית לקמח לבן (ולא לקמח,)מלא שכן הוא מכיל רק 70% מנפח הגרגר המקורי והסירו ממנו את רוב הסובין והנבט.","section":"A","slides":""},{"n":2,"text":"כדי שרעלן יהפוך למסיס, מים הוא חייב לדלג על השלב הראשון של הנטרול בכבד ולהגיע ישירות לשלב השני שבו מצמידים לו מולקולה גדולה. נטרול הרעלים מחולק לשני שלבים, עיקריים כאשר בשלב הראשון נעשה שימוש באנזימי ציטוכרום P450 שמוסיפים אטום קטן לרעלן ויוצרים מולקולת ביניים. מולקולת ביניים זו היא לעיתים קרובות אלימה וריאקטיבית יותר מהרעלן, המקורי ולכן מעבר מהיר לשלב השני הוא קריטי. בניקוי, רעלים מומלץ מאוד לצרוך מיץ אשכוליות על בסיס יומיומי מכיוון שהוא מאיץ את פעילות אנזימי הציטוכרום ומזרז את שלב 1.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רעלנים לרוב חייבים לעבור את השלב הראשון של הנטרול בכבד ואינם מדלגים עליו כברירת מחדל. 2. מיץ אשכוליות מכיל חומר (נרינג'ין) שחוסם ומעכב את פעילות ציטוכרום P450, ולכן הוא מאט את שלב 1 ואסור בצום ניקוי רעלים.","section":"A","slides":""},{"n":3,"text":"סיבים תזונתיים מורכבים מיחידות של סוכרים-חד המחוברות בקשרים שגוף האדם אינו מסוגל לפרק. סיב, האינולין, למשל מורכב מיחידות חוזרות של מולקולות גלוקוז ומצוי בשפע בארטישוק ירושלמי. סיבים אלו יכולים להיות תוססים או בלתי, תוססים כאשר סיבים תוססים מהווים מזון ביוטי-פרה עבור אוכלוסיית החיידקים במעי הגס. חיידקים אלו מפרקים את הסיבים התוססים ומייצרים בתמורה חומצות שומן קצרות, שרשרת כמו חומצה, בוטירית התורמות לבריאות תאי המעי ומפחיתות דלקת.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: אינולין מורכב מיחידות של פרוקטוז ולא מגלוקוז.","section":"A","slides":""},{"n":4,"text":"צריכת סויה בקרב נשים מבוגרות מסוכנת מכיוון שהיא מעודדת את שגשוגם של תאי סרטן השד דרך קשירה לרצפטורים מסוג אלפא. הסויה מכילה פיטואסטרוגנים ממשפחת, האיזופלבונים בעלי מבנה מרחבי הדומה לאסטרוגן האנושי. במחקרים בבני אדם נמצא כי חלבון הסויה בטוח לחלוטין ויכול אפילו לספק הגנה מסוימת מפני סרטן השד והערמונית. עם, זאת נשים המחלימות מסרטן שחלות מסוג גרנולוזה חייבות להרבות בצריכת, סויה שכן גידולים אלו מבטאים רצפטורי אלפא שמגיבים באופן חיובי לפיטואסטרוגנים אלו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. סויה אינה מעודדת שגשוג סרטן שד בבני אדם אלא נקשרת לרצפטורי אלפא וחוסמת אותם כאפקט מגן. 2. נשים המחלימות מסרטן שחלות מסוג גרנולוזה חייבות להימנע מסויה (ולא להרבות,)בה שכן יש שם רצפטורי בטא שהסויה מפעילה.","section":"A","slides":""},{"n":5,"text":"חלמון הביצה מהווה מקור תזונתי עשיר ומרוכז יותר בחלבון ל-100 גרם מאשר חלבון הביצה (הלבן)., בנוסף הצהוב של הביצה מכיל נוגדי חמצון ממשפחת, הקרוטנואידים כגון לוטאין, וזקסנטין התורמים לבריאות העין. למרות שבעלים ירוקים יש כמות גדולה הרבה יותר של לוטאין בהשוואה, לביצה הזמינות הביולוגית של הלוטאין מהביצה גבוהה משמעותית. הדבר נובע בין היתר מכך שבעלים הירוקים קיים חומר הנקרא, כלורופיל אשר הוכח מחקרית כמעכב ספיגה של קרוטנואידים אלו במערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"ההיגד נכון לחלוטין — כל הפרטים מדויקים.","section":"A","slides":""},{"n":6,"text":"שיטת שלטון מתירה לערבב חלבונים עם פחמימות מורכבות באותה ארוחה כדי ליצור חלבון מלא ואיכותי לבניית שריר. אחת מטענות היסוד של השיטה היא שלכל אב מזון נדרשים תנאים כימיים ואנזימטיים שונים לחלוטין כדי להתעכל כראוי בקיבה ובמעיים. לפי גישה, זו שילובים שגויים גורמים להאטת, העיכול לתסיסה ולריקבון של המזון במערכת העיכול., לכן מומלץ למשל לאכול פירות, בלבד ובמיוחד פירות כמו אבטיח או, מלון בארוחה נפרדת לחלוטין מבלי לערבבם עם שום מזון אחר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שיטת שלטון אוסרת באופן מוחלט ובסיסי ביותר על ערבוב של חלבונים עם פחמימות מורכבות.","section":"A","slides":""},{"n":7,"text":"תזונה קטוגנית מבוססת על צריכה גבוהה מאוד של, שומנים כמות מתונה של, חלבונים והגבלה דרסטית של פחמימות כדי להכניס את הגוף למצב של קטוזיס. מצב זה גורם לכבד להמיר חומצות אמינו לגופי קטון שמשמשים כדלק חלופי למוח ולתאים. לעומת, זאת צום מים הממושך מעל 36 שעות מעודד מנגנון של הרס עצמי בתאים פגומים הנקרא, \"\"אפופטוזיס אך הוא מדכא לחלוטין את תהליך האוטופגיה (ניקוי תאי-תוך.) למרות, הקושי מחקרים מראים כי צום לסירוגין וצומות מים תורמים לשיפור רגישות, לאינסולין הפחתת שומן ויסרלי ומתן מנוחה למערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. גופי קטון מיוצרים בכבד מ חומצות שומן ולא מחומצות אמינו. 2. צום מים ארוך אינו מדכא את האוטופגיה אלא נהפוך, הוא הוא הטריגר העוצמתי ביותר להפעלת מנגנון האוטופגיה בגוף.","section":"A","slides":""},{"n":8,"text":"התיאוריה של תזונה חומצית ובסיסית מתמקדת בהשפעת תוצרי הלוואי של חילוף החומרים על רמת החומציות (pH) של, השתן ולא של הדם. צריכת חלבון מן החי משאירה \"\"אפר חומצי יותר המורכב מגופרית, וזרחן שאותו הכליות מפרישות החוצה. עם, זאת מחקרים הוכיחו כי למרות ייצור, החומצה צריכת חלבון מסייעת לבניית קולגן ומעלה את רמות ההורמון IGF-1 שמעודד בניית עצם., לכן ההמלצה הגורפת לאנשים בגילאי 50 עד 65 היא לצרוך כמה שיותר חלבון מן החי כדי להגן עליהם מפני, סרטן תוך התעלמות מוחלטת מחלבון צמחי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: דווקא בגילאי 50 עד 65 הומלץ להפחית חלבון מן החי משום שהוא מעלה IGF-1 שמעלה באותן שנים את הסיכון;לסרטן ההמלצה להרבות בחלבון היא דווקא לגילאי 65 ומעלה כדי לשמר מסת שריר ועצם.","section":"A","slides":""},{"n":9,"text":"הסיב התזונתי אגר-אגר מורכב מיחידות חוזרות של מולקולות פרוקטוז ומופק מאצות ים. הוא משמש רבות בתעשיית המזון כחומר, מסמיך וידוע ביכולתו לספוח כמויות גדולות של מים ולהתנפח, בקיבה מה שתורם לתחושת שובע. אגר-אגר נחשב לסיב תוסס במיוחד אצל רוב אוכלוסיית, העולם משום שלחיידקי המעיים האנושיים יש שפע של אנזימים המפרקים קשרי גלקטוז. בניגוד, אליו רפינוז הוא סיב תוסס המצוי בשפע, בקטניות ופירוקו על ידי חיידקי המעי גורם ליצירת גזים אופיינית.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. אגר-אגר מורכב משרשראות של גלקטוז ולא פרוקטוז. 2. אגר-אגר נחשב לסיב תוססב-לתי לרוב אוכלוסיית העולם (מלבד ליפנים שיש להם חיידקים ייעודיים)לכך.","section":"A","slides":""},{"n":10,"text":"הגישה טבעוניתה-פרו נמנעת מצריכת מזון מן, החי אך הכרחי בה לתסף ויטמין B12 ולדאוג לצריכה מספקת של מינרלים כמו ברזל ואבץ. בניגוד לברזל המצוי, בצומח הברזל המצוי בבשר (ברזל הם) נספג ביעילות גבוהה יותר במערכת העיכול האנושית. אחת הבעיות באכילת איברים, פנימיים ובפרט, כבד היא הצטברות אפשרית של רעלים ומתכות כבדות שסוננו או נאגרו בו במהלך חיי החיה. כדי למזער את כמות הרעלים, הללו גישות פליאו וקטוגניות ממליצות לצרוך אך ורק בשר מבקר הניזון מעשב (Grass-fed) ועוף אורגני שגודלו בתנאי חופש ללא חומרי הדברה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"ההיגד נכון לחלוטין — כל הפרטים מדויקים.","section":"A","slides":""},{"n":11,"text":"חומצת השומן ALA היא אומגה 3 ממקור, צמחי המצויה בשפע בזרעי, פשתן זרעי צ'יה ואגוזי מלך. גוף, האדם ובעיקר, הכבד יודע להמיר את חומצת ה-ALA לחומצות השומן הארוכות EPA ו-DHA החיוניות לתפקוד המוח ומערכת החיסון. בניגוד לדעה, הרווחת שיעור ההמרה של ALA ל-DHA אצל גברים ונשים בוגרים הוא גבוה מאוד ויעיל במיוחד. עם, זאת כדי לשפר את ספיגת ה-ALA, חשוב לטחון את זרעי הפשתן והצ'יה סמוך לאכילתם ולאחסן אותם במקרר כדי למנוע את התחמצנותם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שיעור ההמרה של ALA ל-DHA אצל בוגרים הוא נמוך מאוד וזניח (לרוב פחות מ-5%,) ולא גבוה ויעיל.","section":"A","slides":""},{"n":12,"text":"למרות הדעה, הרווחת חלמון הביצה (החלק הצהוב) מכיל ריכוז גבוה יותר של חלבון ל-100 גרם בהשוואה לחלבון הביצה (החלק הלבן.) כל הכולסטרול והשומן המצויים בביצה מרוכזים אך ורק, בחלמון בעוד שהחלבון הלבן נטול שומן לחלוטין. החלמון מהווה את אחד המקורות העשירים ביותר בטבע, לכולין מולקולה החיונית לבריאות המוח ולמניעת הצטברות שומן בכבד. כדי לאפשר ספיגה יעילה של ויטמין הביוטין המצוי, בחלמון חובה לחמם היטב את, הביצה תהליך ההורס את חלבון האבידין שמצוי בלבן ומונע את ספיגת הביוטין במעי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":13,"text":"פולי הסויה מכילים ריכוז גבוה של פיטואסטרוגנים ממשפחת, האיזופלבונים אשר מתפקדים בגוף כמולקולות סלקטיביות (SERMs.) ברקמת השד האנושית ישנה דומיננטיות של רצפטורים מסוג, אלפא והפיטואסטרוגנים בסויה נקשרים אליהם ומפעילים אותם, בחוזקה מה שמאיץ את חלוקת התאים. עבור נשים המחלימות מסרטן שחלות מסוג, גרנולוזה צריכת סויה מומלצת במיוחד כדי להגן על השחלות מפני הישנות המחלה. עם, זאת חשוב להקפיד ולצרוך אך ורק מוצרי סויה אורגניים או כאלו הנושאים חותמת Non-GMO, כדי להימנע מחשיפה לריסוס רעיל של קוטל העשבים גלייפוסט.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הפיטואסטרוגנים בסויה אינם מפעילים את רצפטורי האלפא, בשד אלא לרוב חוסמים אותם (אפקט מגן.) 2. צריכת סויה אסורה לחלוטין (ולא מומלצת) לנשים המחלימות מסרטן שחלות מסוג, גרנולוזה כי הסויה מפעילה רצפטורי בטא המצויים שם.","section":"A","slides":""},{"n":14,"text":"הפרוקטוז המוכר גם כסוכר, הפירות עובר לאחר ספיגתו במעי ישירות אל, הכבד שם הוא עשוי להיות מומר, לגלוקוז לגליקוגן או לטריגליצרידים. צריכת כמויות גבוהות של פרוקטוז גורמת להפרשה מסיבית ומהירה של הורמון האינסולין, מהלבלב בדומה לתגובת הגוף לאחר אכילת גלוקוז טהור. סירופ אגבה נחשב לממתיק מומלץ ובריא במיוחד משום שהוא מורכב כמעט לחלוטין מגלוקוז ואינו מכיל פרוקטוז כלל. בניגוד, לגלוקוז אכילת פרוקטוז מבודד אינה תורמת לתחושת שובע, מספקת שכן הוא אינו מעלה מספיק את רמות הלפטין ואינו מוריד משמעותית את רמות הגרלין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כלל אינו מעלה את רמות האינסולין בצורה מסיבית כמו גלוקוז. 2. סירופ אגבה נחשב לממתיק בעייתי ביותר משום שהוא מכיל אחוז אדיר של פרוקטוז (70% - 90%,) ולא גלוקוז.","section":"A","slides":""},{"n":15,"text":"האתגר המרכזי של הכבד בניקוי רעלים הוא הטיפול ברעלים מסיסי, שומן אשר חודרים בקלות את ממברנת התא ונאגרים ברקמות השומן בגוף. תהליך הנטרול מתבצע בשני, שלבים כאשר בשלב הראשון (Phase 1) הכבד נעזר באנזימי ציטוכרום P450 כדי להצמיד לרעלן אטום קטן שהופך אותו למעט פולרי. שלב זה יוצר מולקולת ביניים ריאקטיבית ומסוכנת יותר מהרעל, המקורי ולכן הכרחי ששלב 2 יתרחש במהירות ויצמיד אליה מולקולה גדולה שתהפוך אותה למסיסת מים לחלוטין. התנאי הבסיסי כדי שהגוף יתחיל לשחרר את הרעלים הללו מתוך רקמת השומן אל מחזור הדם הוא שהאדם יהיה במצב של גירעון קלורי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":16,"text":"התססת, ירקות כגון הכנת כרוב כבוש, ביתי נשענת על עידוד התרבותם של חיידקי חומצה לקטית המצויים באופן טבעי על הירק. חיידקים פרוביוטיים אלו ניחנים בעמידות גבוהה לסביבה, מלוחה והחומצה הלקטית שהם מייצרים מורידה את רמת ה-pH בצנצנת לרמות שמונעות את הישרדותם של חיידקי ריקבון. כדי להבטיח התססה מוצלחת ושגשוג של החיידקים, הטובים חובה להשאיר את הירקות חשופים לאוויר הפתוח בתוך הצנצנת כדי לאפשר חדירת חמצן רב. בנוסף ליתרונות, הפרוביוטיים תהליך ההתססה מפרק חומרים מעכבי ספיגה כמו חומצה פיטית ומייצר כמות עצומה של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: התססה חייבת להיעשות בסביבה אנאירובית (מתחת לפני, המים ללא,)חמצן ולא בחשיפה לאוויר הפתוח שמעודדת ריקבון ועובש.","section":"A","slides":""},{"n":17,"text":"אחת הסוגיות המרכזיות בתזונה טבעונית היא הבטחת צריכה נאותה של ויטמינים ומינרלים החסרים או נספגים פחות טוב מעולם הצומח. טבעונים יכולים לספק את כל תצרוכת ויטמין ה-B12 שלהם בקלות ובבטחה באמצעות אכילת אצות כגון, ספירולינה מבלי להזדקק לתוספי תזונה סינתטיים. הברזל המצוי בקטניות ובירקות ירוקים הוא מסוג ברזל ''הם (Heme Iron,) ולכן הוא נספג ביעילות מקסימלית ללא הפרעה מצד חומצה פיטית. כדי לשפר את ספיגת המינרלים, מהצומח כמו אבץ, וברזל מומלץ מאוד להנביט את הקטניות או להתסיס, אותן פעולות המפרקות את נוטריינטיםה-אנטי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-B12 באצות כמו ספירולינה הוא -\"פסאודוB12 \" שאינו פעיל בגוף האדם. 2. הברזל בצומח הוא ברזל מסוג 'הם-'נון (Non-Heme) הנספג פחות, טוב ולא ברזל ''הם.","section":"A","slides":""},{"n":18,"text":"חלב פרה נחשב בתרבות המערבית למקור הסידן העיקרי למניעת שברים ואוסטאופורוזיס בגיל המבוגר. עם, זאת מחקר האחיות המפורסם של אוניברסיטת, הרווארד שעקב אחרי עשרות אלפי, נשים הוכיח כי צריכה של שלוש כוסות חלב ביום מחזקת משמעותית את העצמות ומפחיתה את שכיחות השברים בצוואר הירך. מעבר לסוגיית, הסידן צריכת חלב ומוצריו גורמת להפרשה מוגברת של אינסולין ושל ההורמון IGF-1, המעודד גדילה ושגשוג של תאים ועלול להיות בעייתי בהקשר של גידולים סרטניים., בנוסף סוכר החלב (לקטוז) מתפרק בגוף לגלוקוז, ולגלקטוז כאשר הצטברות עודפת של גלקטוז קשורה לפי חוקרים מסוימים להאצת תהליכי הזדקנות תאית.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מחקר האחיות של הרווארד הוכיח שצריכת חלב אינה מפחיתה שברים בצוואר, הירך ואף נמצאה במחקרים מסוימים כמגדילה את הסיכון לכך.","section":"A","slides":""},{"n":19,"text":"הגלוטן הוא חלבון המצוי בדגנים כגון, חיטה, כוסמין שיפון, ושעורה והוא זה המעניק לבצק את תכונות הגמישות והאלסטיות שלו. אצל אנשים הסובלים ממחלת, הצליאק חשיפה לכמות מזערית של גלוטן גורמת לתגובה אוטואימונית ולפגיעה חמורה בסיסי המעי הדק. התססת לחם באמצעות מחמצת שאור, טבעית שהיא תהליך איטי, וממושך מפרקת ומשנה את המבנה המרחבי של רשת הגלוטן. כתוצאה, מכך לחם מחמצת קל יותר לעיכול עבור רוב, האוכלוסייה אם כי הוא עדיין אסור לחלוטין לחולי צליאק שכן הוא עדיין מכיל גלוטן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":20,"text":"שמן זית בכבישה קרה עשיר מאוד בחומצת שומן אולאית (אומגה 9,) שהיא חומצת שומן רוויהב-לתי-חד הנחשבת ליציבה יחסית בפני חמצון בחום מתון., לעומתו שמן קנולה מופק בתהליך טבעי של כבישה קרה בלבד והוא נחשב לשמן בתולי ובריא המומלץ לשימוש יומיומי ללא שום תהליכי זיקוק תעשייתיים. כאשר מעוניינים לטגן בשמן עמוק בטמפרטורות, גבוהות שמן זרעי פשתן הוא הבחירה האידיאלית ביותר משום שהוא שומר על יציבותו ואינו מתחמצן כלל. תהליך זיקוק של שמנים תעשייתיים (כמו שמן סויה או חמניות) כולל בדרך כלל שימוש בסולבנטים, כימיים הלבנה והפגת ריחות בחום, גבוה מה שהורס ויטמינים ונוגדי חמצון טבעיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן קנולה הוא שמן מעובד ומזוקק מאוד (לא בתולי ולא בכבישה קרה.) 2. שמן פשתן רגיש ביותר לחמצון בחום (בשל האומגה 3) ואסור בתכלית האיסור לטיגון.","section":"A","slides":""},{"n":21,"text":"ויטמין B12 מיוצר בטבע אך ורק על ידי מיקרואורגניזמים, (חיידקים) ולכן בעלי חיים וצמחים אינם מסוגלים לסנתז אותו בעצמם. כדי לספוג את הוויטמין במערכת, העיכול הקיבה מפרישה חלבון ייעודי הנקרא \"הגורם \"הפנימי (Intrinsic Factor,) אשר נקשר לוויטמין. תהליך הספיגה של הוויטמין אל זרם הדם מתבצע במלואו כבר בתוך חלל הקיבה, החומצי ומשם הוא מועבר ישירות לכבד. תוסף התזונה הנפוץ והזול, ביותר, ציאנוקובלמין מכיל אמנם נגזרת של רעל, ציאניד אך הצריכה שלו מסוכנת מאוד ועלולה להוביל להרעלת ציאניד חמורה המצריכה אשפוז. קיימות נגזרות איכותיות, יותר כגון, קובלמיןמ-תיל אשר נספגות ביעילות גבוהה יותר ואינן דורשות תהליך המרה נוסף בכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ספיגת ה-B12 אינה מתבצעת, בקיבה אלא בסופו של המעי הדק (האילאום הסופי.) 2. ציאנוקובלמין אינו מסוכן ואינו גורם להרעלת, ציאניד שכן כמות הציאניד בו היא מזערית לחלוטין והגוף מפנה אותה ללא שום בעיה.","section":"A","slides":""},{"n":22,"text":"חלב פרה נחשב למקור עשיר, בסידן אך מחקר האחיות של הרווארד מצא שצריכה מוגברת של חלב כלל אינה מפחיתה את הסיכון לשברים בצוואר הירך. תהליך הפסטור נועד אמנם להשמיד חיידקים מחוללי, מחלות אך הוא אינו פוגע כלל באנזימים הטבעיים המצויים בחלב או במבנה החלבונים שבו. בעת צריכת מוצרי, חלב הלבלב מפריש כמות גדולה של, אינסולין ובמקביל הכבד מייצר את ההורמון IGF-1 אשר מעודד גדילה ושגשוג של תאים. כדי להתמודד עם עצמות חלשות, (אוסטאופורוזיס) הדרך היעילה ביותר היא להפסיק באופן מוחלט כל פעילות גופנית נושאת, משקל על מנת למנוע עומס ושחיקה של העצמות הפריכות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. תהליך הפסטור (חימום) הורס ופוגע לחלוטין באנזימים הטבעיים שבחלב. 2. הדרך היעילה להתמודד עם אוסטאופורוזיס היא דווקא להעמיס על העצמות בפעילות נושאת משקל (כמו הליכה עם תרמיל,)כבד ולא להפסיק פעילות.","section":"A","slides":""},{"n":23,"text":"על פי גישת, הרמב\"ם אכילת בשר אינה חובה, יומיומית והוא ממליץ להרבות דווקא באכילת עוף על פני בקר בשגרה. איברים, פנימיים כגון, כבד מומלצים מאוד לצריכה קבועה משום שהם מתפקדים כמסננת טהורה ואינם אוגרים בתוכם רעלים או מתכות כבדות כלל. בשר של בקר שרעה באחו וניזון מעשב (Grass-fed) נחשב לאיכותי יותר מכיוון שהוא מכיל יחס מאוזן וטוב יותר של חומצות שומן אומגה 3 לאומגה 6., בנוסף הברזל מסוג \"\"הם (Heme) המצוי בבשר נספג במעי ביעילות נמוכה בהרבה מברזל ממקור, צמחי בשל נוכחותם של סיבים תזונתיים צפופים בתוך רקמת השריר של החיה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. איברים פנימיים (כמו כבד) אוגרים וצוברים בתוכם כמות אדירה של רעלים ומתכות, כבדות ולכן אינם מומלצים. 2. הברזל מסוג \"\"הם (Heme) שבבשר נספג ביעילות גבוהה בהרבה מברזל, צמחי ואין בבשר שום סיבים תזונתיים (סיבים תזונתיים יש רק בצומח.)","section":"A","slides":""},{"n":24,"text":"שמן זית בכבישה קרה נחשב לשמן הבריא והמומלץ ביותר בשל תכולה גבוהה של חומצת שומן אולאית (אומגה 9,) שהיא רוויהב-לתי-חד ויציבה יחסית. שמן, הקנולה, לעומתו מופק בתהליך טבעי לחלוטין ללא שום שימוש בממיסים כימיים או בטמפרטורות, גבוהות ולכן שומר על צבעו וריחו המקוריים כזרע טבעי. בתהליך, הטיגון חומצות שומן רוויותב-לתי-רב נוטות להתחמצן במהירות וליצור רדיקלים חופשיים מזיקים שמאיצים תהליכי דלקת בגוף. מסיבה, זו שמן זרעי ענבים הוא השמן האידיאלי והבטוח ביותר לטיגון, עמוק שכן הוא חסין לחלוטין מפני התחמצנות בחום גבוה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן קנולה עובר תהליכי זיקוק אגרסיביים הכוללים חימום וממיסים כימיים, (הקסן) ואינו מופק טבעי. 2. שמן זרעי ענבים מכיל המון אומגה 6)רוויב-לתי-(רב ולכן הוא מתחמצן מהר מאוד בחום ואינו אידיאלי לטיגון כלל.","section":"A","slides":""},{"n":25,"text":"הפחמימות שאנו צורכים מתפרקות במערכת העיכול סוכריםל-חד כגון, גלוקוז המהווה את מקור האנרגיה הזמין והעיקרי לתאי הגוף והמוח. לעומת, הגלוקוז הפרוקטוז מעלה את רמות האינסולין בדם בצורה חדה, ומיידית מה שגורם להפרשה מסיבית של הורמון הלפטין ומוביל לתחושת שובע ממושכת. הכבד אוגר את עודפי הגלוקוז בצורה של סוכר-רב צפוף הנקרא, גליקוגן אשר יכול להתפרק חזרה לגלוקוז בזמן צום קצר או מאמץ גופני. במידה ומחפשים ממתיק טבעי, מרוכז סירופ אגבה נחשב לממתיק המושלם והבריא ביותר משום שהוא מורכב מ-100% גלוקוז טהור ואינו מכיל פרוקטוז כלל.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה את רמות, האינסולין ולכן אינו מעלה לפטין ולא תורם לתחושת שובע. 2. סירופ אגבה נחשב לממתיק בעייתי ביותר משום שהוא מכיל ריכוז עצום של פרוקטוז (70% - 90%,) ולא גלוקוז טהור.","section":"A","slides":""},{"n":26,"text":"תיאוריית התזונה החומצית טוענת שמזונות כמו בשר ודגים משאירים \"אפר \"חומצי (עשיר בזרחן,)וגופרית אשר משפיע ישירות על רמת ה-pH של נוזל הדם וצונח לרמות מסכנות חיים באופן יומיומי. בעקבות, כך נטען בעבר כי העצמות נאלצות לשחרר סידן אל מחזור הדם כדי לאזן ולנטרל את החומציות, הזו מה שמוביל לאוסטאופורוזיס., בפועל מחקרים הוכיחו שאכילת חלבון אינה מחלישה את העצמות אלא מסייעת, בבנייתן מכיוון שהחלבון מספק חומצות אמינו ליצירת רשת הקולגן בעצם. יתרה, מכך חמצת תזונתית הוכחה מדעית כגורם המרכזי והישיר שהופך תאים בריאים לחלוטין לתאים סרטניים מהירים ואלימים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח לרמות חומציות מסכנות חיים עקב, תזונה אלא נשאר קבוע לחלוטין באמצעות הכליות והריאות. 2. חמצת תזונתית אינה הופכת תאים בריאים לסרטניים (הגידול הסרטני עצמו הוא שיוצר סביבה חומצית עקב נשימה, אנאירובית ולא התזונה יצרה)אותו.","section":"A","slides":""},{"n":27,"text":"תהליך נטרול הרעלים מסיסי השומן בכבד מתבצע בשני שלבים, עיקריים במטרה להפוך אותם למולקולות פולריות שניתן להפריש בשתן. בשלב הראשון (Phase 1,) הכבד משתמש בחומצות אמינו רבות (כגון, גליצין גלוטמין וציסטאין) כדי להצמיד לרעלן מולקולה ענקית ולהפוך אותו למסיס מים באופן מלא וסופי. רקמות השומן בגופנו מהוות את אתר האגירה המרכזי של הגוף לרעלים מסיסי שומן, אלו וגירעון קלורי הוא התנאי ההכרחי לפירוקן ולשחרור הרעלים אל הדם. בזמן תוכנית אגרסיבית לניקוי, רעלים מומלץ לשתות מיץ אשכוליות באופן קבוע משום שהוא ממריץ ומזרז את עבודת אנזימי הציטוכרום P450, ומקל על עבודת הכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת המולקולה הענקית באמצעות חומצות אמינו מתבצעת ב שלב השני (Phase 2,) ולא בשלב הראשון. 2. מיץ אשכוליות מכיל ''נרינג'ין אשר חוסם ומעכב את אנזימי שלב 1 (ציטוכרום P450,) ולכן חובה להימנע ממנו לחלוטין בניקוי רעלים.","section":"A","slides":""},{"n":28,"text":"התססת, ירקות כגון הכנת כרוב כבוש, ביתי היא תהליך הנשען על יצירת סביבה חסרת חמצן המעודדת שגשוג של חיידקי חומצה, לקטית המצויים באופן טבעי על הירק. חיידקים אנאירוביים אלו מפרקים את הסוכר המצוי בכרוב ומייצרים חומצה, לקטית אשר מורידה את רמת החומציות (pH) בצנצנת לרמה נמוכה של כ-2.9 ומונעת התפתחות עובש וריקבון. המלח המוסף לצנצנת אינו משמש כמזון לחיידקים, הטובים אלא נועד לדכא ולחסל חיידקים מתחרים בשלבי ההתססה הראשונים ולמשוך נוזלים מהירק. בנוסף לאספקת מאות זנים של חיידקים, פרוביוטיים התססת הכרוב מנטרלת את החומצה, הפיטית משפרת ספיגת, מינרלים ומייצרת כמות גדולה של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מציג בצורה מדויקת את כל עקרונות, ההתססה תפקיד, המלח ותרומת ויטמין ה-K2 והפלורה.","section":"A","slides":""},{"n":29,"text":"הביצה מהווה מקור מצוין לחלבון מלא ולשומנים, איכותיים והיא מתאימה מאוד לשילוב בתזונה קטוגנית בשל תכולת השומן הגבוהה שבה. חלבון הביצה (החלק הלבן) מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה לחלמון, הצהוב ולכן הוא נחשב לחלק המזין ביותר בביצה. כדי לספוג את נוגדי החמצון (כגון לוטאין) ואת ויטמין הביוטין בצורה היעילה והמלאה, ביותר חובה לשתות את הביצה כשהיא חיה וללא שום תהליך של בישול או חימום., בפועל חימום הביצה עושה דנטורציה לחלבון בשם ''אבידין המצוי בלבן של, הביצה ובכך משחרר את הביוטין (ויטמין B7) ומאפשר את ספיגתו במעי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. החלמון (הצהוב) מכיל ריכוז גבוה יותר של חלבון ל-100 גרם -(כ17%) בהשוואה לחלבון הלבן -(כ10%.) 2. חובה לחמם ולבשל את הביצה כדי להרוס את חלבון האבידין ולשחרר את הביוטין, לספיגה שתיית ביצה חיה תמנע את ספיגתו.","section":"A","slides":""},{"n":30,"text":"דגי ים, עמוק כגון, סלמון מקרל, וסרדינים נחשבים למקור הישיר והזמין ביותר לחומצות השומן אומגה 3 מסוג EPA ו-DHA, החיוניות לתפקוד המוח ולמערכת העצבים. אחת הסכנות המרכזיות באכילת דגי ים היא הצטברות של, כספית אשר הוכחה כרעלן עצבי כבד העלול לגרום לנזקים קוגניטיביים ולמחלות ניווניות. כדי להתגונן מפני רעילות, הכספית דגי האוקיינוס מכילים באופן טבעי כמויות אדירות של ויטמין C, אשר נקשר לכספית בגוף הדג ומנטרל את רעילותה לחלוטין. עבור טבעונים הנמנעים, מדגים צריכה מרובה של אגוזי מלך וזרעי פשתן מבטיחה המרה יעילה ומלאה של חומצת שומן ALA ל-DHA בשיעור גבוה של מעל ל-90%.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. דגים נעזרים במינרל סלניום (ולא בויטמין C) כדי להיקשר לכספית ולנטרל את רעילותה. 2. שיעור ההמרה של חומצת שומן ALA ל-DHA בגוף האדם הוא אפסי וזניח (לרוב פחות מ-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":31,"text":"צום מים ממושך של מעל ל-36 שעות מהווה את הטריגר העוצמתי ביותר להפעלת מנגנון, האוטופגיה תהליך בו התאים מפרקים חלבונים פגומים ופסולת תאית-תוך. במהלך צום, כזה רמות הורמון הרעב (גרלין) עולות בהתמדה ככל שהצום, מתארך ולכן היום השלישי נחשב תמיד ליום הקשה והרעב ביותר עבור הצמים., במקביל רמות האינסולין בדם, צונחות מה שמאפשר לגוף לגשת למאגרי השומן ולהתחיל לייצר גופי קטון כמקור אנרגיה חלופי למוח. לאחר צום, כזה מומלץ לשבור את הצום, בהדרגה למשל באמצעות אכילת פירות עתירי מים או ארוחות קטנות המקלות על חזרת מערכת העיכול לפעילות שגרתית.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: רמות הגרלין (הורמון הרעב) יורדות ככל שהצום, מתארך ולכן ביום השלישי רוב האנשים מדווחים כי הרעב נעלם כמעט לחלוטין (ולא עולה.)","section":"A","slides":""},{"n":32,"text":"חומצת השומן ALA המצויה במקורות צמחיים נספגת בגוף האדם במלואה ומומרת מיד ובשיעור של 100% לחומצות EPA ו-DHA החיוניות למוח. בנוסף, לכך שמן זרעי פשתן הוא שמן עמיד מאוד, לחמצון ולכן הוא מומלץ לטיגון עמוק ולבישול בטמפרטורות גבוהות ללא חשש מיצירת רדיקלים חופשיים. באשר לדגי, ים הם מייצרים בעצמם את חומצות האומגה 3 כחלק מחילוף החומרים הטבעי, שלהם ואינם זקוקים כלל לאכילת אצות לשם כך., לבסוף רעילות הכספית שעלולה להימצא בדגי ים מנוטרלת כליל על ידי ויטמין C שמצוי בבשר הדג בכמויות אדירות ומונע את ספיגת המתכת בגוף האדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 4 טעויות)!(: 1. המרת ALA ל-DHA היא בשיעור אפסי/זניח (לא 100%.) 2. שמן פשתן אסור לחימום כי הוא מתחמצן מהר מאוד. 3. דגים אינם מייצרים אומגה 3 אלא מקבלים אותה מאכילת אצות. 4. רעילות הכספית מנוטרלת על ידי המינרל סלניום (ולא ויטמין C.)","section":"A","slides":""},{"n":33,"text":"צריכת גלוקוז מובילה לעלייה מהירה ברמות האינסולין, בדם מה שמעודד בתורו הפרשת הורמון הלפטין ותורם ליצירת תחושת שובע לאחר הארוחה. בניגוד, אליו פרוקטוז כמעט ואינו מעלה את רמות, האינסולין ולכן הוא אינו מסייע בהורדת הורמון הרעב (גרלין) באותה מידה ואינו משרה תחושת שובע. כאשר פרוקטוז מגיע, לכבד עודפים שאינם מומרים לגלוקוז או לגליקוגן הופכים, לטריגליצרידים אשר עלולים להצטבר בכבד ולגרום למצב של כבד שומני. סירופ, אגבה המשווק לעיתים כמוצר, טבעי מכיל אחוז גבוה במיוחד של פרוקטוז, מרוכז ולכן צריכתו עלולה להיות בעייתית לבריאות המטבולית בדומה לסירופ תירס.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":34,"text":"ויטמין B12 מיוצר בטבע באופן בלעדי על ידי מיקרואורגניזמים, (חיידקים) ולכן בעלי חיים וצמחים אינם מסוגלים לסנתז אותו בעצמם אלא סופגים אותו מסביבתם. ספיגת הוויטמין במעי הדק דורשת היקשרות מוקדמת לחלבון ייעודי בשם 'הגורם 'הפנימי (Intrinsic Factor,) אשר מופרש מדופנות הקיבה. תוסף התזונה מתילקובלמין נחשב לאיכותי ויעיל משום שהוא מספק את הוויטמין בצורתו הפעילה ואינו דורש תהליכי המרה נוספים בכבד. עם, זאת התוסף הזול והנפוץ ציאנוקובלמין מכיל כמות עצומה של רעל ציאניד המצטברת בגוף לאורך זמן ומובילה תמיד להרעלת מתכות חמורה המצריכה טיפול רפואי דחוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: ציאנוקובלמין מכיל כמות מזערית של ציאניד שהגוף מפנה, בקלות ואינו מוביל לעולם להרעלת ציאניד מסכנת חיים.","section":"A","slides":""},{"n":35,"text":"האיזופלבונים המצויים בפולי סויה משמשים, כפיטואסטרוגנים שהן מולקולות בעלות מבנה מרחבי הדומה מאוד להורמון האסטרוגן האנושי. מולקולות אלו פועלות בגוף כסרמים (SERMs,) כלומר מודולטורים סלקטיביים של קולטני, אסטרוגן היכולים להפעיל או לחסום את הקולטן בהתאם לסוג הרקמה. ברקמת, השד בה יש דומיננטיות של קולטני אסטרוגן מסוג, אלפא הפיטואסטרוגנים של הסויה לרוב חוסמים את הקולטן ובכך מספקים אפקט מגן מפני שגשוג תאים סרטניים. עם, זאת במקרה הנדיר של גידול שחלתי מסוג גרנולוזה (המאופיין בריבוי קולטני,)בטא הפיטואסטרוגנים מפעילים את הקולטנים ועלולים לעודד את שגשוג, הגידול ולכן במצב זה חובה להימנע מסויה לחלוטין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":36,"text":"שיטת שלטון דוגלת בצירופי מזון, קפדניים ואוסרת לחלוטין על אכילת פחמימות מורכבות וחלבונים באותה, ארוחה בטענה שלכל אב מזון נדרשים תנאים אנזימטיים ורמות חומציות שונות לעיכול תקין., לעומתה שיטת אן ויגמור (מכון היפוקרטס) מבוססת על צריכת מזון חי (Raw Food) טבעוני, בלבד ושמה דגש רב על שימוש יומיומי במיץ עשב, חיטה נבטים מגוונים ונבטוטים. כדי להקל על תחושת הרעב של המטופלים במכון, היפוקרטס התפריט היומי כולל תמיד ארוחת צהריים חמה המבוססת על מרקי קטניות עשירים וקינואה מבושלת. כמו, כן השיטה אוסרת לחלוטין על צריכת מזונות מותססים כמו כרוב, כבוש בטענה שהחומצה הלקטית שבהם פוגעת והורסת את פלורת המעיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מבוססת על Raw Food טבעוני (100%,)חי ולכן אין בה שום ארוחות חמות של מרקי קטניות וקינואה מבושלת. 2. השיטה מעודדת ודורשת צריכת כרוב כבוש כמזון, פרוביוטי ולא אוסרת עליו.","section":"A","slides":""},{"n":37,"text":"הביצה מהווה מקור תזונתי עשיר המספק חלבון מלא ושומנים, איכותיים כאשר כל השומן וכל הכולסטרול שבביצה מרוכזים בלעדית בחלמון (החלק הצהוב.) החלמון מכיל נוגדי חמצון חשובים כדוגמת לוטאין, וזקסנטין אשר זמינותם הביולוגית ממנו גבוהה במיוחד משום שאין בהם כלורופיל המעכב את, ספיגתם בניגוד למקורות צמחיים כמו עלים ירוקים. כדי ליהנות מוויטמין הביוטין (B7) המצוי בחלמון, במלואו חובה לשתות את הביצה חיה לחלוטין וללא שום, חימום שכן החום הורס את הביוטין והופך אותו לבלתי זמין., בנוסף חלמון הביצה עשיר במולקולת, כולין המסייעת במניעת כבד שומני ומהווה אבן בניין חיונית ליצירת המוליך העצבי כולין-אצטיל במוח.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: חובה דווקא לחמם/לבשל את הביצה כדי לבטל את השפעת חלבון האבידין, שבחלבון ובכך לאפשר לביוטין להיספג (שתיית ביצה חיה מונעת את ספיגתו.)","section":"A","slides":""},{"n":38,"text":"התססת ירקות, מסורתית כדוגמת הכנת כרוב, כבוש מבוססת על יצירת סביבה חסרת חמצן בתוך צנצנת המאפשרת שגשוג של חיידקי חומצה לקטית. הוספת המלח בתחילת התהליך אינה נועדה להזין את החיידקים, הטובים אלא ליצור סביבה מלוחה ועוינת המעכבת את התפתחותם של חיידקי ריקבון ועובש. במהלך, ההתססה חיידקי החומצה הלקטית ניזונים מהסוכר הטבעי שבכרוב ומפרישים כתוצר לוואי חומצה לקטית המורידה משמעותית את רמת ה-pH בכלי. צריכת ירקות מותססים אלו לא רק מספקת פרוביוטיקה, עשירה אלא גם מנטרלת את החומצה, הפיטית משפרת את ספיגת המינרלים, בגוף ותורמת לייצור טבעי של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":39,"text":"התיאוריה של תזונה חומצית ובסיסית גורסת שמזונות כגון, בשר דגים ודגנים משאירים אחריהם \"\"אפר מטבולי חומצי (עשיר בזרחן וגופרית) המופרש בסופו של דבר בשתן. לפי תיאוריה, זו חמצת תזונתית גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח משמעותית ולהפוך לחומצית באופן מסכן, חיים ולכן העצמות נאלצות להפריש סידן לדם כחומר סותר חומצה., בפועל ה-pH של הדם נשמר קבוע לחלוטין הודות למנגנוני הפיצוי של הכליות, והריאות ואינו מושפע מהמזון שאנו אוכלים. עם, זאת הרפואה המודרנית הוכיחה מעל לכל ספק כי סביבה חומצית מהמזון היא הגורם הישיר שהופך תאים בריאים לתאים סרטניים ממאירים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של הדם לעולם אינו צונח מסיבות תזונתיות עקב המזון אלא נשאר מאוזן קבוע. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים (הגידול הסרטני הוא זה שמייצר את החומציות)סביבו.","section":"A","slides":""},{"n":40,"text":"צריכת חלב פרה הוכחה במחקר האחיות המפורסם של אוניברסיטת הרווארד כגורם המרכזי והיעיל ביותר שמונע שברים בצוואר הירך בקרב נשים מבוגרות. סוכר, החלב המוכר בשם, לקטוז מתפרק במערכת העיכול לשתי מולקולות של גלוקוז טהור הנספגות ישירות לתאי השריר ללא כל צורך במעורבות של הורמון האינסולין. בנוסף, לכך תהליך הפסטור התעשייתי שחלב עובר נועד להעשיר אותו באנזימי עיכול טבעיים, חדשים מה שמקל מאוד על עיכול החלבון קזאין בקיבה., לבסוף מחקרים עדכניים מוכיחים שצריכת חלבון מי גבינה (Whey) מדכאת את ייצור ההורמון IGF-1, בכבד ולכן הוא מהווה תוסף המסייע במניעת שגשוג תאים סרטניים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 4 טעויות)!(: 1. מחקר האחיות הראה שחלב אינו מונע שברים (ואולי אף מחמיר.) 2. לקטוז מתפרק לגלוקוז ו גלקטוז (לא לשני,)גלוקוז ותמיד דורש אינסולין. 3. פסטור חום הורס את האנזימים הטבעיים שבחלב (לא מעשיר.) 4. חלבון מי גבינה מעלה מאוד (לא מדכא) את הורמון ה-IGF-1.","section":"A","slides":""},{"n":41,"text":"שיטת התזונה של, שלטון הידועה כ\"צירופי, \"מזון אוסרת באופן מוחלט על אכילת פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה., לטענתו כל אב מזון דורש סביבת חומציות ואנזימים שונה לחלוטין, בקיבה ושילובם יחד יגרום להאטת, העיכול לתסיסה ולריקבון של המזון במערכת העיכול., בנוסף שלטון מדגיש כי יש לאכול פירות כארוחה נפרדת, לחלוטין כאשר אבטיח ומלון דורשים הפרדה אפילו מפירות אחרים. גישה זו גם תומכת באופן מובהק בשילוב של צומות מים ככלי עוצמתי לריפוי וניקוי הגוף מרעלים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מציג נאמנה את עקרונותיה המרכזיים של שיטת שלטון.","section":"A","slides":""},{"n":42,"text":"חלב פרה נחשב בתרבות המערבית למקור הסידן, האולטימטיבי ולכן ארגוני הבריאות ממליצים עליו למניעת שברים בגיל המבוגר. מחקר האחיות המפורסם של, הרווארד שעקב אחרי עשרות אלפי נשים לאורך, שנים אכן הוכיח שצריכת שלוש כוסות חלב ביום מפחיתה משמעותית את הסיכון לשברים בצוואר הירך. מעבר, לסידן צריכת מוצרי חלב מעלה את רמות ההורמון IGF-1, בדם אשר מעודד גדילה ושכפול של תאים ועלול להוות סיכון להתפתחות גידולים סרטניים בגיל מבוגר. כדי למנוע אוסטאופורוזיס, ביעילות ההמלצה הקלינית החשובה ביותר היא להפעיל עומס פיזי משמעותי על, השלד למשל באמצעות הליכה עם תרמיל משקולות על הגב.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מחקר האחיות של הרווארד מצא שצריכת חלב אינה מפחיתה, שברים ולעיתים אף הגדילה את הסיכון להם בקרב הנבדקות.","section":"A","slides":""},{"n":43,"text":"שמן זית מופק בכבישה קרה והוא עשיר מאוד בחומצת השומן האולאית (אומגה 9,) המקנה לו יציבות יחסית בחימום מתון., לעומתו שמן קנולה מופק תמיד בתהליך מסורתי של כבישה קרה, בלבד ללא שום שימוש בממיסים כימיים או דאודוריזציה בחום גבוה. כאשר מחפשים שמן לטיגון עמוק בטמפרטורות גבוהות, במיוחד שמן זרעי ענבים נחשב לבחירה הבטוחה והאידיאלית ביותר משום שהוא חסין לחלוטין מפני התחמצנות. תהליכי הזיקוק של שמנים תעשייתיים גורמים לרוב להרס של, הוויטמינים המינרלים ונוגדי החמצון הטבעיים שהיו קיימים בזרע המקורי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן קנולה מופק באמצעות תהליכי זיקוק אגרסיביים הכוללים חימום וממיסים כימיים (כגון הקסאן.) 2. שמן זרעי ענבים עשיר באומגה 6,)רוויב-לתי-(רב הוא מתחמצן מהר מאוד בחום ו אינו בטוח לטיגון עמוק.","section":"A","slides":""},{"n":44,"text":"ויטמין B12 מיוצר בטבע אך ורק על ידי, חיידקים ולכן בעלי חיים או צמחים אינם יכולים לסנתז אותו בכוחות עצמם וזקוקים למקור חיצוני. כדי שהוויטמין ייספג ביעילות, בגוף הוא חייב להיקשר תחילה לחלבון ייעודי בשם \"הגורם \"הפנימי (Intrinsic Factor) אשר מופרש מדופנות הקיבה. תהליך הספיגה אל מחזור הדם מתבצע במלואו כבר בתוך חלל, הקיבה ומשם הוויטמין משונע ישירות לאגירה ממושכת בכבד. למרות שתוסף התזונה ציאנוקובלמין הוא הנפוץ והזול, ביותר הצריכה שלו מסוכנת ומובילה תמיד להרעלת ציאניד חמורה המצריכה טיפול רפואי מידי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ספיגת ויטמין ה-B12 מתבצעת בסופו של ה מעי הדק, (האילאום) ולא בחלל הקיבה. 2. תוסף ציאנוקובלמין מכיל כמות ציאניד מזערית שהגוף מפנה, בקלות ואינו גורם להרעלת ציאניד.","section":"A","slides":""},{"n":45,"text":"אחת הסוגיות המרכזיות בתזונה טבעונית היא הבטחת ספיגה נאותה של מינרלים כגון ברזל, ואבץ אשר זמינותם הביולוגית מהצומח נמוכה יותר מזו שבבשר. הברזל המצוי בקטניות ובירקות הוא מסוג הם-נון (Non-Heme,) וספיגתו מושפעת לרעה מחומרים מעכבים המצויים בצמח כגון החומצה הפיטית. כדי לשפר משמעותית את זמינות הברזל, והאבץ מומלץ מאוד להנביט את הקטניות או להתסיס, אותן פעולות אשר מפרקות את החומצה הפיטית ומנטרלות אותה., בנוסף שילוב של מזונות עשירים בוויטמין C (כגון גמבה או פירות הדר) באותה ארוחה עם הברזל, הצמחי מגביר מאוד את יעילות הספיגה שלו אל זרם הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":46,"text":"הכולסטרול הוא מולקולה שומנית החיונית לבניית קרומי, התאים לייצור הורמוני, מין ולתפקוד תקין של מערכת העצבים והמוח. חלקיקי ה-LDL תפקידם לשנע את הכולסטרול מהכבד אל תאי הגוף, השונים בעוד שחלקיקי ה-HDL אוספים את עודפי הכולסטרול מהתאים ומחזירים אותם לכבד לפינוי. הסכנה האמיתית למחלות לב מתרחשת כאשר חלקיקי ה-LDL בדם הם גדולים וקלים (מסוג A,) שכן הם אלו שנוטים להתחמצן ולשקוע בדפנות העורקים במהירות. גורם מרכזי נוסף שמוביל לשקיעת הכולסטרול הוא צריכה מוגברת של, סוכרים אשר יוצרים תהליך של גליקציה (סכרור) שפוגע במבנה חלקיק ה-LDL ומעודד את שקיעתו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: חלקיקי ה-LDL המסוכנים שנוטים להתחמצן ולשקוע הם דווקא החלקיקים ה קטנים והצפופים (מסוג B,) ולא הגדולים והקלים.","section":"A","slides":""},{"n":48,"text":"הפחמימות שאנו צורכים במזון מתפרקות במערכת העיכול, סוכריםל-חד כשהעיקרי שבהם הוא, הגלוקוז המשמש כמקור האנרגיה המרכזי לתאי הגוף והמוח. עודפי הגלוקוז נאגרים בכבד ובשרירים בצורה של סוכר-רב צפוף הנקרא, גליקוגן אשר מתפרק חזרה לגלוקוז ומשתחרר לדם בזמן מאמץ גופני או צום. לעומת, הגלוקוז צריכת פרוקטוז מבודד גורמת לעלייה חדה ומסיבית בהפרשת הורמון האינסולין, בדם מה שמעודד את הפרשת הלפטין ויוצר תחושת שובע מהירה וממושכת. כאשר פרוקטוז מגיע לכבד בכמויות גדולות שהגוף אינו מסוגל להמיר, לאנרגיה העודפים יומרו לטריגליצרידים שעלולים להצטבר ככבד שומני או להיאגר ברקמות השומן בגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: פרוקטוז כמעט ו אינו מעלה את רמות האינסולין (בשונה,)מגלוקוז ולכן הוא אינו מעודד מספיק הפרשת לפטין ולא יוצר תחושת שובע.","section":"A","slides":""},{"n":49,"text":"תיאוריית התזונה החומצית גורסת שמזונות חלבוניים מן, החי כגון בשר, ודגים משאירים אחריהם פסולת מטבולית)\"(\"אפר העשירה בזרחן, וגופרית המופרשת לבסוף בשתן. תומכי השיטה טוענים כי חמצת תזונתית זו גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח באופן תדיר לרמות מסכנות חיים המחייבות פירוק סידן מהעצמות., במציאות הרפואה והמדע הוכיחו מעל לכל ספק כי סביבה חומצית הנוצרת ישירות מהמזון שאנו אוכלים היא הגורם המרכזי שהופך תאים בריאים לתאים סרטניים., למעשה רמת החומציות בדם נשמרת תמיד בטווח צר וקבוע (7.35-7.45) הודות למנגנוני פיצוי יעילים של הכליות, והריאות ואינה מושפעת מהמזון הנצרך.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח לרמות מסכנות חיים בגלל, מזון אלא נשמר יציב על ידי הריאות והכליות. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים (זו הגידול הסרטני עצמו שמייצר חומציות)סביבו.","section":"A","slides":""},{"n":50,"text":"תהליך ההתססה המסורתי של ירקות מבוסס על יצירת סביבה חסרת חמצן בתוך, הצנצנת אשר מעודדת שגשוג בלעדי של חיידקי חומצה לקטית. המלח שמוסיפים לתערובת נועד לדכא ולחסל חיידקי ריקבון ופטריות מתחרים בשלבי ההתססה, הראשונים בעוד שחיידקי החומצה הלקטית ניחנים בעמידות טבעית וגבוהה למליחות זו. במהלך, התהליך החיידקים הטובים ניזונים מהסוכר המצוי באופן טבעי בירק (כמו בכרוב) ומפרישים חומצה לקטית המורידה את ה-pH בצנצנת לרמות בטוחות שמשמרות את המזון. אכילת כרוב כבוש ביתי לא רק מספקת מגוון עצום של חיידקים פרוביוטיים, מעולים אלא גם מסייעת בנטרול החומצה, הפיטית משפרת ספיגת, מינרלים ומעשירה את הגוף בוויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":51,"text":"חלב פרה נחשב בתרבות המערבית למקור חיוני לסידן למניעת אוסטאופורוזיס בגיל המבוגר. עם, זאת מחקר האחיות של, הרווארד שעקב אחרי עשרות אלפי, נשים מצא כי צריכת שלוש כוסות חלב ביום אינה מפחיתה את הסיכון לשברים בצוואר הירך ואף עלולה להגדיל אותו. תהליך הפסטור התעשייתי נועד אומנם להשמיד חיידקים, פתוגניים אך הוא תוכנן בקפידה כך שאינו פוגע כלל בהרכב האנזימים הטבעיים המצויים בחלב. צריכת חלבון מי גבינה (Whey) מעלה משמעותית את רמות האינסולין בדם לשעתיים שאחרי, הארוחה ובמקביל מעלה את ייצור הורמון הגדילה IGF-1 בכבד. סוכר, החלב, הלקטוז מתפרק במעי לשתי מולקולות של גלוקוז ופרוקטוז הנספגות אל זרם הדם ודורשות מעורבות של אינסולין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פסטור (חימום לחום גבוה) הורס ופוגע באופן מוחלט באנזימים הטבעיים שבחלב. 2. הלקטוז מתפרק לגלוקוז ו גלקטוז (ולא לפרוקטוז.)","section":"A","slides":""},{"n":52,"text":"הרמב\"ם התייחס בהרחבה לאכילת, בשר וקבע כי עוף עדיף לאכילה יומיומית מאשר בשר, בקר הנחשב לכבד יותר לעיכול ומייצר דם עכור. כאשר צורכים מזון מן, החי יש לקחת בחשבון שאיברים פנימיים כגון כבד צוברים ואוגרים בתוכם עומס רב של רעלים ומתכות כבדות שסוננו במהלך חיי החיה. בשר בקר שניזון מעשב במרעה פתוח (Grass-fed) נחשב לאיכותי הרבה, יותר שכן הוא מכיל יחס מאוזן וטוב יותר של חומצות שומן אומגה 3 לאומגה 6., בנוסף הברזל המצוי, בבשר הנקרא ברזל מסוג ''הם (Heme Iron,) נספג במערכת העיכול האנושית ביעילות גבוהה וללא עכבות בהשוואה לברזל ממקור צמחי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":53,"text":"פחמימות, מורכבות כדוגמת, עמילן בנויות משרשראות ארוכות של חרוזי גלוקוז אשר מתפרקות במערכת העיכול ומעלות את רמת הסוכר בדם. צריכת גלוקוז מעוררת הפרשה משמעותית של אינסולין, מהלבלב אשר בתורו מעודד את ייצור הלפטין ותורם ליצירת תחושת שובע. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה חדה ומסיבית עוד יותר של אינסולין, ולפטין מה שהופך מאכלים עתירי פרוקטוז למשביעים הרבה יותר., בנוסף מולקולת הפרוקטוז נוטה להיקשר לחלבונים בדם בתהליך הנקרא, גליקציה ותהליך זה מתרחש בקצב איטי משמעותית ובטוח יותר לעומת הגליקציה שיוצרת מולקולת הגלוקוז.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה את האינסולין, והלפטין ולכן הוא אינו תורם לתחושת שובע מהירה. 2. תהליך הגליקציה של פרוקטוז מתרחש בקצב מהיר ואלים הרבה יותר (פי 7) מאשר זה של, גלוקוז ולא איטי יותר.","section":"A","slides":""},{"n":54,"text":"ויטמין B12 מסונתז בטבע אך ורק על ידי חיידקים, ומיקרואורגניזמים ולכן צמחים או בעלי חיים אינם מסוגלים לייצר אותו בכוחות עצמם. כדי שהוויטמין ייספג ביעילות במערכת, העיכול הוא חייב להיקשר קודם לכן לחלבון ייעודי בשם \"הגורם \"הפנימי (Intrinsic Factor,) ותהליך הספיגה אל מחזור הדם מתבצע במלואו כבר בתוך חלל הקיבה החומצי. תוסף התזונה מסוג ציאנוקובלמין נחשב לתוסף היעיל והאיכותי, ביותר שכן הוא מספק את הוויטמין ישירות בצורתו הפעילה ואינו דורש שום תהליך המרה בכבד. חוסר קיצוני בוויטמין זה עלול להוביל לא רק לאנמיה, ולעייפות אלא גם לנזקים נוירולוגיים קשים ולתופעות פסיכיאטריות חמורות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ספיגת ה-B12 מתבצעת בסופו של המעי הדק (אילאום סופי) ולא בקיבה. 2. ציאנוקובלמין אינו החומר הפעיל והוא כן דורש תהליך של המרה (מתילציה) בכבד למתילקובלמין כדי להפוך לפעיל.","section":"A","slides":""},{"n":55,"text":"הכולסטרול הוא חומר שומני החיוני לבניית ממברנות התאים ולייצור, הורמונים ומרביתו מיוצר באופן טבעי בכבד האנושי. תפקידם של חלקיקי ה-LDL הוא לשנע את הכולסטרול מהכבד אל עבר רקמות, הגוף בעוד שחלקיקי ה-HDL אוספים את העודפים מהתאים ומחזירים אותם לכבד. הסכנה להיווצרות רובד טרשתי בעורקים מתרחשת כאשר חלקיקי ה-LDL הגדולים והאווריריים (מסוג A) נוטים לשקוע בדפנות כלי הדם ולהתחמצן במהירות., לעומתם חלקיקי ה-LDL הקטנים והצפופים (מסוג B) הם חלקיקים בטוחים המוגנים היטב מפני תהליכי, חמצון ולכן הם נעים בזרם הדם ללא כל סכנת שקיעה בעורקים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. החלקיקים ששוקעים ומתחמצנים בקלות הם דווקא ה-LDL ה קטנים והצפופים (מסוג B,) ולא הגדולים (מסוג A). 2. חלקיקים קטנים וצפופים (מסוג B) הם הכי פגיעים לחמצון, ומסוכנים ולא בטוחים או מוגנים.","section":"A","slides":""},{"n":56,"text":"תהליך הניקוי העמוק של רעלים מסיסי שומן מתרחש כאשר אדם נמצא בגירעון, קלורי המאלץ את הגוף לפרק רקמות שומן ולשחרר לדם את הרעלים שנכלאו בתוכן. הכבד הוא האיבר האחראי על המרת הרעלים הללו למולקולות מסיסות, מים תהליך המתבצע בשני שלבים עיקריים. בשלב הראשון (Phase 1,) הכבד נעזר באנזימי ציטוכרום P450, ופעולה זו יוצרת מולקולת ביניים שלעיתים קרובות היא אלימה ורעילה אף יותר מהרעלן המקורי. כדי לזרז תהליך זה ולסייע לכבד, בניקוי מומלץ מאוד לשתות מיץ אשכוליות מדי, יום מכיוון שהחומר נרינג'ין שבו מעודד וממריץ משמעותית את פעילות אנזימי הציטוכרום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: נרינג'ין שבמיץ האשכוליות מעכב וחוסם את פעילות אנזימי הציטוכרום P450 של שלב 1 (ולא ממריץ,)אותם ולכן יש להימנע ממנו לחלוטין בזמן ניקוי רעלים.","section":"A","slides":""},{"n":57,"text":"תהליך ההתססה הביתית של ירקות (כמו כרוב כבוש) מבוסס על יצירת סביבה נטולת חמצן בתוך, הצנצנת התומכת בשגשוגם של חיידקי חומצה לקטית. חיידקים אנאירוביים ופרוביוטיים אלו מפרקים את הסוכר שבכרוב ופולטים חומצה, לקטית אשר מורידה את רמת ה-pH ומונעת התפתחות עובש וחיידקי ריקבון. המלח המוסף לקדרה אינו משמש כמזון, לחיידקים אלא תפקידו למשוך נוזלים מהירק ולעכב חיידקים מתחרים בשלבי ההתססה הראשונים. כדי ליהנות מהמגוון הרחב והעשיר ביותר של זני חיידקים, פרוביוטיים מומלץ לעצור את ההתססה ולאכול את הכרוב כבר לאחר שלושה, ימים שכן מגוון החיידקים הולך ופוחת ככל שהזמן עובר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: לאחר 3 ימים מקבלים מגוון חיידקים דל;מאוד כדי ליהנות מהמגוון הרחב של זני החיידקים מומלץ לעצור את ההתססה ולאכול את הכרוב רק לאחר 3 עד 4 שבועות.","section":"A","slides":""},{"n":58,"text":"תזונה טבעונית דורשת תכנון מוקפד כדי למנוע חוסרים תזונתיים של ויטמינים, ומינרלים ובמיוחד B12, ברזל ואבץ. הברזל המצוי, בקטניות בזרעים ובירקות ירוקים הוא ברזל מסוג הם-נון (Non-Heme,) וספיגתו במעי מושפעת לרעה מנוכחותם של חומרים מעכבים כדוגמת החומצה הפיטית. כדי לשפר משמעותית את ספיגת הברזל, מהצומח מומלץ מאוד לשלב בארוחה ירקות ופירות העשירים בוויטמין C., בנוסף תהליכי הנבטה והתססה של קטניות ודגנים תורמים רבות לפירוק החומצה הפיטית, ולנטרולה ובכך הם מגדילים את הזמינות הביולוגית ואת ספיגתם של האבץ והברזל אל הגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":59,"text":"חומצות השומן מסוג אומגה 3 (DHA ו-EPA) הן בעלות תפקיד קריטי בהתפתחות מוח, העובר בשימור הזיכרון ובמניעת תהליכים דלקתיים בגוף. חומצת השומן ALA (המצויה באגוזי מלך ופשתן) מומרת בגוף האדם לחומצת DHA, ויעילות ההמרה הזו אצל גברים ונשים בוגרים נחשבת לגבוהה מאוד ומגיעה ל-כ80% צריכת. דגי ים מהווה מקור ישיר ויעיל לאומגה 3, אך במקביל קיים חשש מהצטברות כספית רעילה ברקמות הדגים. כדי להגן על צרכני הדגים מהרעלה, עצבית בשר הדג מכיל באופן טבעי רמות גבוהות של ויטמין C, אשר נקשר לכספית בגוף הדג ומנטרל לחלוטין את הרעילות שלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. יעילות ההמרה של ALA ל-DHA אצל בוגרים היא אפסית עד זניחה (לרוב מתחת ל-5%,) ולא 80% 2.. החומר בדג שנקשר לכספית ומנטרל אותה הוא המינרל סלניום (ולא ויטמין C.)","section":"A","slides":""},{"n":60,"text":"שיטת שלטון לצירופי מזון קובעת כלל ברור האוסר על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה, ארוחה מתוך טענה ששילוב זה מפריע לפעילות האנזימטית ומעכב את העיכול., לעומתה שיטת אן ויגמור (מכון היפוקרטס) מבוססת באופן מוחלט על תזונה טבעונית, מבושלת ודורשת שילוב יומיומי של מרקי קטניות ודגנים חמים כדי להקל על מערכת העיכול. גישת, קינגסטון, מנגד דוגלת בהגבלה קפדנית של כמויות המזון ובלעיסה, ממושכת אך היא מתירה אכילת בשר ודגים ללא הגבלה במטרה לספק לגוף חלבון מלא לבניית רקמות. למרות ההבדלים, ביניהן המכנה המשותף לכל הגישות הטבעיות הוא אמונה בכוח הריפוי של הגוף והימנעות מוחלטת ממזון תעשייתי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מבוססת על Raw Food חי לחלוטין ונטול, בישול ואינה כוללת מרקים ודגנים חמים. 2. גישת קינגסטון היא גישה צמחונית האוסרת לחלוטין על אכילת בשר ודגים (ומתירה רק מעט מאוד מוצרי חלב,)וביצים ואינה מתירה אותם.","section":"A","slides":""},{"n":61,"text":"שמן קוקוס נחשב לשמן רווי ולכן הוא מוצק בטמפרטורת, החדר אך בניגוד לשומן, מהחי רוב חומצות השומן בו הן באורך בינוני (MCT) שנספגות מהר לאנרגיה. תהליך הזיקוק של שמנים תעשייתיים (כמו שמן תירס וסויה) מבוצע בכבישה קרה בלבד כדי לשמור על צבעם הבהיר ועל הוויטמינים שעמידים בחום. שמן זרעי ענבים מכיל כמות גבוהה מאוד של חומצת שומן אולאית (אומגה 9,) ולכן הוא היציב והבריא ביותר לטיגון עמוק ממושך., לעומתו שמן זית איכותי מתאפיין ברמת חומציות, נמוכה וככל שהיא נמוכה יותר כך השמן נחשב למובחר יותר ופחות מחומצן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. זיקוק שמנים תעשייתיים מתבצע ב חום גבוה מאוד ותוך שימוש בממיסים כימיים, ולא בכבישה קרה. 2. שמן זרעי ענבים עשיר באומגה 6 (חומצת שומן רוויהב-לתי-רב) ולכן הוא מתחמצן בקלות ואינו מומלץ לטיגון עמוק.","section":"A","slides":""},{"n":62,"text":"ויטמין B12 מיוצר בטבע על ידי מיקרואורגניזמים (חיידקים), בלבד ולכן בני אדם מקבלים אותו דרך שרשרת המזון מהחי או כתוסף תזונה. כדי להיספג, בגוף הוויטמין זקוק לחלבון מיוחד הנקרא \"הגורם \"הפנימי (Intrinsic Factor,) אשר מופרש מתאי הקיבה. הספיגה בפועל של הוויטמין אל זרם הדם מתרחשת רק בחלקו האחרון של המעי הדק, (האילאום) ולאחר מכן הוא משונע אל הכבד למאגר ארוך טווח. חסר עמוק בוויטמין B12 עלול להוביל לפגיעה במערכת, העצבים קשיי, זיכרון עייפות, כרונית ואף לתופעות פסיכיאטריות חמורות כגון דיכאון וחרדה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":63,"text":"חלב פרה נחשב באופן מסורתי למקור סידן, מצוין ולכן מומלץ על ידי גורמים רבים למניעת שברים ואוסטאופורוזיס בגיל מבוגר. מחקר האחיות של, הרווארד שעקב אחרי נשים במשך שנים, רבות מצא ששתיית שלוש כוסות חלב ביום מפחיתה ב-50% את הסיכון לשברים בצוואר הירך., בנוסף חלבון, החלב ובפרט חלבון מי הגבינה (Whey,) מדכא באופן טבעי את הפרשת ההורמון האנאבולי IGF-1, בכבד מה שתורם להאטת קצב שגשוג התאים. למרות, זאת רגישות ללקטוז (סוכר החלב) נפוצה מאוד בקרב, מבוגרים משום שהגוף מפסיק או מפחית משמעותית את ייצור האנזים לקטאז עם השנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות הוכיח ששתיית חלב אינה מפחיתה שברים (ואולי אף מעלה את הסיכון.) 2. חלבון מי הגבינה (Whey) מעלה משמעותית את ייצור הורמון ה-IGF-1 (המעודד שגשוג,)תאים ולא מדכא אותו.","section":"A","slides":""},{"n":64,"text":"צריכת בשר מספקת לגוף האדם חלבון, מלא, ברזל ווויטמין B12 החשובים לתפקוד מערכות הדם והעצבים. הרמב\"ם התייחס באריכות לצריכת בשר, בכתביו והמליץ לאכול בשר בקר שמן על בסיס יומיומי משום שהוא קל יותר לעיכול מאשר בשר עוף. כאשר אדם בוחר לצרוך מזון מן, החי איברים פנימיים כגון כבד וכליות נחשבים לנקיים ובטוחים, לחלוטין מאחר והם מסננים רעלים ואינם אוגרים אותם בתוכם כלל. בשר מבקר שניזון מתערובת דגנים במכלאות צפופות מכיל לרוב כמות גדולה של חומצת השומן אומגה 6 המעודדת, דלקת בהשוואה לבקר שרעה חופשי באחו (Grass-fed.)","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הרמב\"ם התנגד לאכילת בקר יומיומית והמליץ להעדיף עוף כי הוא קל יותר לעיכול. 2. איברים פנימיים כמו כבד וכליות אוגרים בתוכם עומס כבד של רעלים, ומתכות ולכן אינם נקיים ובטוחים.","section":"A","slides":""},{"n":65,"text":"חומצות השומן אומגה 3 מסוג EPA ו-DHA חיוניות מאוד להתפתחות מוח, העובר למערכת, העצבים ולמניעת תהליכים דלקתיים בגוף. דגי מעמקים מפיקים את האומגה 3 הזו ישירות מאכילת אצות, ים ולכן הם מהווים מקור זמין ועשיר לחומצות אלו עבור בני אדם. למרות, זאת ישנה סכנה קבועה של הרעלת כספית מאכילת דגים, אלו משום שבדגי האוקיינוס חסר המינרל סלניום שיכול היה להיקשר לכספית ולנטרל את רעילותה. אנשים הבוחרים בתזונה צמחית יכולים לקבל את כל כמות ה-DHA הדרושה להם מאגוזי, מלך שכן גוף האדם ממיר מעל 90% מחומצת ה-ALA ל-DHA ללא כל קושי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. דגי האוקיינוס מכילים בשפע את המינרל סלניום אשר נקשר לכספית ומנטרל אותה. 2. יכולת ההמרה של ALA ל-DHA בגוף היא אפסית עד זניחה (לרוב פחות מ-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":66,"text":"עמילן הוא פוליסכריד המשמש כמאגר האנרגיה המרכזי בעולם, הצומח והוא מורכב משרשראות ארוכות של חרוזי גלוקוז. למרות שסיבים תזונתיים כגון תאית מורכבים אף הם משרשראות של, גלוקוז מערכת העיכול האנושית אינה מסוגלת לפרק אותם משום שהמבנה המרחבי של הקשרים הכימיים ביניהם שונה מזה שבעמילן. סיבים תוססים מהווים מזון ביוטי-פרה נהדר לחיידקי המעי, הגס אשר מתסיסים אותם ומייצרים מהם חומצות שומן קצרות שרשרת התורמות לבריאות רירית המעי. שילוב סיבים מסיסים כמו פקטין בארוחה תורם להאטת קצב ריקון, הקיבה וכך מסייע במיתון העלייה החדה של הסוכר בדם וביצירת תחושת שובע ממושכת.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":67,"text":"שיטת התזונה של אן ויגמור (מכון היפוקרטס) מבוססת ברובה על מזון טבעוני חי (Raw Food,) וכוללת צריכה יומיומית של מיץ עשב, חיטה נבטים ומזונות מותססים., לעומתה תזונת הפליאו מתבססת על תזונת האדם הקדמון וכוללת אכילת, בשר דגים, וביצים תוך הימנעות מוחלטת, מדגנים קטניות ומוצרי חלב מתועשים. לפי חוקי צירופי המזון של הרברט, שלטון מותר ורצוי לשלב באותה ארוחה פחמימות
