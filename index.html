ן החלמון וללא כלורופיל המפריע לספיגה.\n4. אכילת ביצים מעלה את ה-LDL באופן כה דרמטי אצל 95% מהאוכלוסייה, עד כי יש להימנע מהן לחלוטין בכל פרוטוקול לטיפול במחלות לב.\n5. לוטאין המצוי בחלמון הוא נוגד חמצון המגן על חלקיקי ה-LDL מחמצון, ובכך הוא מונע את שקיעתם בדפנות העורקים ותורם למניעת טרשת.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–5.","C":"כל הטענות בסעיפים 1–5 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 3, 5). טענה 2 שגויה (אבידין מנוטרל בבישול, לכן חלבון נא חוסם ביוטין). טענה 4 שגויה (השפעת כולסטרול מהמזון זניחה לרוב). טענות 3, 1 ו-5 מדויקות.","slides":"","section":"A"},{"text":"מנגנון אוסטיאופרוזיס ותיאוריית ה\"אפר החומצי\": מהן העובדות המדעיות הנכונות לגבי בריאות העצם והשפעת התזונה עליה?\n\n1. מדד PRAL חיובי מעיד על כך שהמזון ייצור שתן בסיסי, מה שנחשב למדד לאופטימיזציה של צפיפות העצם לפי המדע המודרני.\n2. מינרל הסיליקון (צורן) חשוב ביותר למוצקות וחוזק העצם, ואחד המקורות העיקריים עבורו בתזונה שנלמדה הוא שיבולת שועל.\n3. צריכת חלבון מספקת (גם מהחי) חיונית לבניית העצם מכיוון שהיא מעלה את רמות ה-IGF-1 ומשפרת את ספיגת הסידן במעי.\n4. תיאוריית האפר החומצי הופרכה; הדם מאוזן ברמת דיוק גבוהה על ידי הכליות והריאות, והן אינן זקוקות לסידן מהעצם כבופר מרכזי.\n5. קולגן הוא \"עמודי הבטון\" של העצם; רמות סוכר גבוהות בדם גורמות לגליקציה המחזקת את סיבי הקולגן והופכת אותם לגמישים וחזקים יותר.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","C":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–5."},"answer":["B"],"multi":false,"explanation":"(נכונות: 2, 3, 4). טענה 5 שגויה (גליקציה מחלישה את הקולגן והופכת אותו לשביר). טענה 1 שגויה (PRAL חיובי הוא חומצי, והוא המדד המיושן). טענות 4, 3 ו-2 מדויקות. (גם 5 נכונה, אז סה\"כ 3 נכונות מתוך 5).","slides":"","section":"A"},{"text":"אומגה 3 מהים ומהצומח: מהו המידע המדויק ביותר לגבי המרה, צורכי המוח וסיכוני חמצון?\n\n1. שמן זרעי מרווה מרושתת מכיל DHA ישיר מהצומח, מה שהופך אותו למקור היחיד בטבע שאינו דורש המרה כלל אצל בני אדם.\n2. תהליך המרת האומגה 3 הוא דינמי; הגוף מסוגל להגדיל את אחוזי ההמרה באופן משמעותי כאשר הוא מזהה מצב של \"רעב\" ל-DHA.\n3. זמן מחצית החיים (T 1/2) של DHA במוח הוא ארוך מאוד (כשנתיים וחצי), מה שמסביר מדוע טבעונים אינם מפתחים חסר מוחי מהיר.\n4. שמן דגים בתוספים הוא לרוב יציב מאוד לחמצון, ולכן עדיף לצרוך אותו בקפסולות מאשר לאכול דגים העלולים להכיל כספית.\n5. אחוז המרת ALA ל-DHA בכבד הוא נמוך (אחוזים בודדים), אך המוח זקוק לכמות זעירה בלבד (כ-3.8 מ\"ג ביום) כדי לשמר את פעילותו.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","C":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–5."},"answer":["B"],"multi":false,"explanation":"(נכונות: 2, 3, 5). טענה 4 שגויה (שמן דגים נוטה להתחמצן מאוד בקפסולות). טענה 1 שגויה (מרווה מרושתת מכילה ALA, לא DHA ישיר). טענות 5, 3 ו-2 משקפות את עיקרי המחקר שנלמד.","slides":"","section":"A"},{"text":"מזון מותסס ושיקום פלורת המעי: מהם המנגנונים המאפיינים את תהליך ההתססה הביולוגית והשפעתה הבריאותית?\n\n1. שתיית חצי כוס מי כבושים בבת אחת היא הפעולה הראשונה המומלצת לכל אדם הסובל מ-IBS חריף, כדי \"להפציץ\" את המעי בחיידקים טובים.\n2. כדי להשיג את מגוון זני החיידקים המקסימלי בקרוב כבוש, יש לעצור את תהליך ההתססה לאחר 48 שעות בלבד כדי למנוע את \"מות\" החיידקים הראשונים.\n3. חיידקי חומצה לקטית (LAB) הופכים גלוקוז לחומצה לקטית, המורידה את ה-pH לרמה של כ-3.0, מה שמונע קלקול ושומר על המזון בצורה טבעית.\n4. מזון מותסס נחשב ל\"פוסט-ביוטיקה\" מכיוון שהוא מכיל את תוצרי המטבוליזם של החיידקים (כמו ויטמין K2 וויטמיני B) עוד לפני שנאכל.\n5. התססה של קרוב סגול וקרוב לבן יחד יוצרת סינרגיה של נוגדי חמצון (אנתוציאנינים) וחיידקים מזנים שונים המתפתחים בשלבי pH משתנים.","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","C":"רק טענה 3 נכונה באופן מוחלט."},"answer":["B"],"multi":false,"explanation":"(נכונות: 3, 4, 5). טענה 2 שגויה (התססה של קרוב דורשת כחודש). טענה 1 שגויה (ב-IBS מתחילים בכמויות מזעריות/טיפות). טענות 3, 4 ו-5 מדויקות.","slides":"","section":"A"},{"text":"מטופל בן 45 עם כבד שומני, טריגליצרידים גבוהים (280) וחומצה אורית גבוהה בדם, מדווח על צריכה יומיומית של \"שייק בריאות\" המכיל 5 סוגי פירות וסירופ אגבה. מהו הניתוח המדויק ביותר של מצבו המטבולי?\n\n1. פירוק הפרוקטוז בכבד צורך ATP במהירות רבה, מה שמוביל ליצירת חומצה אורית כתוצר לוואי; חומצה זו מעלה את הסיכון ליתר לחץ דם ולדלקות פרקים (גאוט).\n2. סירופ אגבה נחשב לממתיק בטוח לחולי כבד מכיוון שיש לו אינדקס גליקמי נמוך מאוד והוא אינו מעלה את רמת האינסולין בטווח המיידי.\n3. הפרוקטוז מעודד יצירת שומן ויסרלי (בטני) וגורם לעמידות לאינסולין בטווח הארוך, גם אם אינו גורם להפרשת אינסולין ישירה כמו הגלוקוז.\n4. הבעיה המרכזית היא עומס הגלוקוז בשייק, שכן גלוקוז עובר מטבוליזם בלעדי בכבד והופך ישירות לטריגליצרידים דרך מסלול ה-ATP.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 4 שגויה (פרוקטוז עובר מטבוליזם כבדי, לא גלוקוז). טענה 2 שגויה (סירופ אגבה הוא פרוקטוז מרוכז, ופרוקטוז הוא \"רעל כבדי\" מטבולי). טענות 1 ו-3 מדויקות ומסבירות את הסיכון המטבולי בשייקים של פירות.","slides":"","section":"A"},{"text":"בהקשר של לחם \"מתוקן\" וגלוטן, מטופלת הסובלת מנפיחות כרונית מבקשת להבין את ההבדל בין שיטות ההתפחה. מהן העובדות המדעיות הנכונות?\n\n1. לחם מחמצת שנאפה בתנור ב-220 מעלות נחשב למזון פרוביוטי איכותי המכיל חיידקים חיים המגיעים למעי הגס.\n2. אקרילאמיד נוצר בתגובה בין הסוכר לחומצה האמינית ליזין; תהליך המחמצת מעלה את רמת האקרילאמיד בבצק בשל החומציות הגבוהה.\n3. התפחה במחמצת מנטרלת את החומצה הפיטית שבקמח המלא, ובכך משפרת את הזמינות הביולוגית של מינרלים כמו מגנזיום, אבץ וברזל.\n4. חיידקי המחמצת מפרישים אנזימים המפרקים את הקשרים הכימיים של הגלוטן למקטעים קצרים יותר, מה שמקל משמעותית על העיכול אך אינו הופך את הלחם לבטוח לצליאקים.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 4 ו-3 נכונות ומסבירות את עדיפות המחמצת על שמרים תעשייתיים."},"answer":["D"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 2 שגויה (אקרילאמיד נוצר מאספרגין וסוכר; מחמצת דווקא מפחיתה אותו). טענה 1 שגויה (חיידקים מתים בחום האפייה). טענות 1 (פירוק גלוטן) ו-3 (נטרול חומצה פיטית) נכונות.","slides":"","section":"A"},{"text":"תהליך ה-Detox בכבד דורש איזון עדין. מה קורה כאשר מטופל מבצע צום מיצים קיצוני ללא ליווי מקצועי, במיוחד כשיש לו מסת שריר נמוכה?\n\n1. שלב Phase 1 מייצר מולקולות ביניים ראקטיביות (Reactive Intermediates) שהן פולאריות חלקית ועלולות להזיק לתאי הכבד אם לא ינוטרלו מיד.\n2. רעלנים מסיסי שומן המשתחררים מרקמת השומן בזמן גירעון קלורי עוברים ישירות לכליות ומופרשים בשתן ללא צורך במטבוליזם כבדי.\n3. שלב Phase 2 דורש חומצות אמינו ספציפיות (כגון גלוטמין, ציסטאין וגליצין) לצורך צימוד; חוסר בחלבון במהלך הניקוי יגרום לעיכוב שלב זה ולהצטברות רעלנים מסוכנים.\n4. תפריט עתיר פחמימות פשוטות מומלץ בזמן ניקוי רעלים כדי לספק אנרגיה זמינה לאנזימי הציטוכרום P450.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"\"סימני ניקוי\" כמו כאבי ראש הם עדות לכך ששלב Phase 2 אינו עומד בקצב של Phase 1."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 2 שגויה (רעלים חייבים לעבור בכבד כדי להפוך למסיסי מים). טענה 4 שגויה (סוכר פשוט אינו דרוש ל-Phase 1; חומצות אמינו ונוגדי חמצון דרושים יותר). סעיף 8 נכון כהסבר קליני, אך נשאלנו על 1-4.","slides":"","section":"A"},{"text":"סויה ובריאות העצם: כיצד הפיטואסטרוגנים (איזופלבונים) משפיעים על נשים לאחר גיל המעבר?\n\n1. האיזופלבונים נקשרים בעדיפות גבוהה לרצפטור אסטרוגן מסוג אלפא (ER-alpha) הנמצא בעצמות, ובכך הם מדכאים את פעילות האוסטאוקלסטים (מפרקי העצם).\n2. בניגוד לאסטרוגן האנושי, האיזופלבונים בסויה תמיד מעלים את הסיכון לסרטן השד מכיוון שהם מגרים חלוקה תאית בלתי פוסקת.\n3. סויה נחשבת לגויטרוגן (מעכב יוד) ולכן היא אסורה לחלוטין לכל אדם הסובל מתת-פעילות של בלוטת התריס, גם אם רמות היוד שלו תקינות.\n4. מולקולת האקואול (Equol), המיוצרת על ידי חיידקי מעיים מסוימים מדאידזאין, היא המטבוליט הפעיל ביותר של הסויה והיא בעלת השפעה אסטרוגנית חזקה ומגנה.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"יכולת הגוף להפיק תועלת מהסויה לבניית עצם תלויה בהרכב המיקרוביום (יצרני אקואול)."},"answer":["B"],"multi":false,"explanation":"(נכונות: 4). בין 1–4: טענה 1 שגויה (בסויה זה רצפטור בטא בעצם). טענה 4 נכונה (אקואול). טענה 3 שגויה (סויה מותרת אם יש מספיק יוד). טענה 2 שגויה (סויה מגנה מסרטן השד).","slides":"","section":"A"},{"text":"מהו היתרון הפיזיולוגי של הלוטאין והזקסנטין המגיעים מחלמון הביצה בהשוואה למקורות צמחיים?\n\n1. הלוטאין והזקסנטין בביצה רגישים מאוד לחום, ולכן בישול ביצה ליותר מ-3 דקות הורס אותם לחלוטין.\n2. הלוטאין בביצה מגיע בסביבה שומנית (החלמון) וללא כלורופיל מעכב, מה שהופך את הזמינות הביולוגית שלו לגבוהה פי כמה מזו של עלים ירוקים.\n3. נוגדי חמצון אלו מצטברים במקוּלה שברשתית העין ומגנים עליה מפני נזקי חמצון ואור כחול.\n4. כמות הלוטאין בביצה גבוהה פי 50 מאשר בקייל, ולכן הביצה היא המקור הכמותי העשיר ביותר בטבע.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"צריכת ביצים עשויה להגן על ה-LDL מחמצון בזכות תכולת הלוטאין שבהן."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 4 שגויה (בצומח יש הרבה יותר לוטאין כמותית; בביצה הוא רק זמין יותר). טענה 1 שגויה (הלוטאין בביצה יציב יחסית לחימום). טענות 2 (זמינות שומנית) ו-3 (מקוּלה) נכונות.","slides":"","section":"A"},{"text":"ניתוח מנגנון אומגה 3: מהו המידע המדויק ביותר לגבי ההמרה של ALA (מהצומח) ל-EPA ו-DHA?\n\n1. אחוז ההמרה של ALA ל-DHA הוא נמוך מאוד (כ-1%-5%), אך הוא עולה משמעותית כאשר התזונה דלה בחומצות שומן אומגה 6 (המתחרות על אותם אנזימים).\n2. המוח זקוק לכמות אדירה של DHA בכל יום (כ-500 מ\"ג), ולכן טבעונים שאינם לוקחים תוסף אצות סובלים מירידה קוגניטיבית תוך חודשים ספורים.\n3. הגוף מסוגל להגביר את קצב ההמרה של אומגה 3 במצבי \"רעב\" ל-DHA, מה שמסביר מדוע רמות ה-DHA בדם של טבעונים יציבות יחסית.\n4. זמן מחצית החיים של DHA במוח הוא קצר מאוד (כמה ימים), ולכן ישנה חשיבות קריטית לצריכה יומיומית של דגי ים שמנים.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענה מס' 1 ו-3 נכונות ומסבירות את הדינמיות של מטבוליזם חומצות השומן."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 2 שגויה (המוח צריך מעט מאוד DHA). טענה 4 שגויה (זמן מחצית החיים ארוך מאוד - שנתיים וחצי). טענות 1 (תחרות עם אומגה 6) ו-3 (מנגנון רעב) נכונות.","slides":"","section":"A"},{"text":"סיבים תוססים (כמו אינולין) וחומצות שומן קצרות שרשרת (SCFA): מהם המנגנונים המעודדים בריאות?\n\n1. סיבים תוססים עוברים פירוק על ידי חיידקי המעי הגס המייצרים תוצרי לוואי כמו בוטיראט, המהווה מקור אנרגיה עיקרי לתאי רירית המעי (קולונוציטים).\n2. כל הסיבים המסיסים הם גם תוססים, ולכן פקטין ואגר-אגר משפיעים על המיקרוביום בדיוק באותה צורה.\n3. ייצור SCFA במעי הגס מעלה את ה-pH לרמה בסיסית, מה שמגן על רירית המעי מפני דלקות וכיבים.\n4. חומצות שומן קצרות שרשרת מעודדות ספיגת מינרלים (כמו סידן ומגנזיום) במעי הגס על ידי יצירת סביבה חומצית שממיסה אותם ליונים חופשיים.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-4 נכונות ומתארות את התועלת הפוסט-ביוטית של הסיבים."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 3 שגויה (SCFA מורידות pH - יוצרות סביבה חומצית, לא בסיסית). טענה 2 שגויה (לא כל המסיסים תוססים באותה מידה; אגר-אגר כמעט לא תוסס). טענות 1 ו-4 מדויקות.","slides":"","section":"A"},{"text":"אוסטאופורוזיס ובריאות העצם: מהו הכשל הלוגי בשימוש בסידן בלבד כטיפול, ומהו תפקיד הויטמינים?\n\n1. ויטמין C אינו רלוונטי לבריאות העצם מכיוון שהוא משתתף רק בסינתזה של רקמות רכות כמו חניכיים ואור.\n2. ויטמין K2 חיוני להפעלת חלבון האוסטאוקלצין, המנתב את הסידן מהדם אל תוך העצמות ומונע את שקיעתו בעורקים.\n3. העצם בנויה ממטריצה חלבונית (קולגן) המהווה את ה\"שלד\" של העצם; ללא קולגן תקין, הסידן (המינרלים) אינו יכול להיקשר ולהעניק חוזק.\n4. סוכר גבוה בדם מחזק את סיבי הקולגן דרך תהליך הגליקציה, ובכך מונע מהעצם להפוך לשבירה אצל חולי סכרת.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 2 ו-3 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 4 שגויה (גליקציה מחלישה את הקולגן). טענה 1 שגויה (ויטמין C קריטי לייצור קולגן בעצם). טענות 4 (מבנה העצם) ו-2 (ויטמין K2) נכונות.","slides":"","section":"A"},{"text":"מזון מותסס (כרוב כבוש) מול פרוביוטיקה בכמוסות: מהו היתרון המשמעותי ביותר לפי החומר הנלמד?\n\n1. סיבי הירק במזון המותסס משמשים כ\"מגן פיזי\" וכמצע מזון (פרביוטיקה) לחיידקים בזמן המעבר בסביבה החומצית של הקיבה.\n2. תהליך ההתססה מנטרל לחלוטין את הלקטינים והחומצה הפיטית בירק, ובכך משפר את ספיגת המינרלים.\n3. מזון מותסס מכיל מגוון רחב יותר של זנים (חיידקי חומצה לקטית) המתפתחים באופן טבעי בשלבי pH שונים בזמן ההתססה.\n4. התססת ירקות הופכת אותם למקור זמין לויטמין B12 פעיל, מה שמהווה תחליף מושלם לבשר עבור טבעונים.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 2, 3). טענה 4 שגויה (במזון מותסס אין B12 פעיל לבני אדם). טענות 3, 1 ו-2 נכונות ומסבירות מדוע כרוב כבוש עדיף על כמוסה.","slides":"","section":"A"},{"text":"השוואה בין שיטת אן ויגמור (מכון היפוקרטס) לשיטת 80/10/10 (ד\"ר גרהם): מהם ההבדלים המהותיים במקור האנרגיה?\n\n1. אן ויגמור דוגלת בצמצום פירות מתוקים כדי למנוע הזנת תהליכים דלקתיים וגידולים, בעוד 80/10/10 מבוססת על פירות כמקור אנרגיה כמעט בלעדי (80% מהקלוריות).\n2. בשיטת 80/10/10 קיים סיכון גבוה יותר לחסרים בחלבון ובמינרלים עקב דלילות קלורית וחוסר גיוון לעומת שיטת אן ויגמור העשירה בנבטים.\n3. שתי השיטות דוגלות בצריכה גבוהה של שומנים מרוכזים (אגוזים ואבוקדו) כדי לשפר את תפקוד המוח.\n4. אן ויגמור שמה דגש על מיץ עשב חיטה ומזון מונבט/מותסס, בעוד 80/10/10 שוללת שימוש בטכנולוגיה (מעבד מזון/מיצים) ודוגלת באכילה של מזון שלם בלבד.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 2, 4). טענה 3 שגויה (80/10/10 שוללת שומן מרוכז - רק 10%). טענות 1, 4 ו-2 מדויקות לפי ההשוואה שנלמדה.","slides":"","section":"A"},{"text":"מטופל הסובל מתסמונת מטבולית, כבד שומני ורמות גבוהות של חומצה אורית (Uric Acid), צורך מדי בוקר שייק המבוסס על 6 פירות וסירופ אגבה. מהו הניתוח הביוכימי המדויק למצבו?\n\n1. הבעיה העיקרית היא הגלוקוז שבפירות, אשר עובר מטבוליזם מהיר בכבד והופך ישירות לטריגליצרידים המעלים את רמת ה-LDL.\n2. פירוק הפרוקטוז בכבד כרוך בצריכה מאסיבית של ATP, מה שמוביל ליצירת חומצה אורית כתוצר לוואי; חומצה זו פוגעת בייצור NO בעורקים ומעלה לחץ דם.\n3. הפרוקטוז מעודד עמידות לאינסולין דרך יצירת דלקת כרונית בכבד וסבירת שומן תוך-בטני (ויסרלי), גם ללא העלאת אינסולין ישירה בטווח הקצר.\n4. סירופ אגבה נחשב לממתיק בטוח לחולי כבד בשל האינדקס הגליקמי הנמוך שלו, שאינו מעורר הפרשת אינסולין מיידית.","options":{"A":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","B":"בין סעיפים 1–4 קיימת בדיוק טענה אחת נכונה.","C":"אף טענה בין סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 1 שגויה (פרוקטוז עובר מטבוליזם כבדי, לא גלוקוז). טענה 4 שגויה (אגבה היא פרוקטוז מרוכז, ופרוקטוז הוא \"רעל מטבולי\" לכבד). טענות 2 ו-3 מדויקות ומסבירות את הסיכון המטבולי (חומצה אורית, עמידות לאינסולין).","slides":"","section":"A"},{"text":"בנוגע לשיטות התזונה המודרניות \"המקרוביוטיקה\" ו\"דיאטת האורז\" (של וולטר קמפנר), מהן העובדות המדויקות ביותר?\n\n1. דיאטת האורז נחשבת לאורח חיים מומלץ לטווח ארוך לכל אדם בשל תכולת החלבון הגבוהה והמאוזנת שבה.\n2. שיטת המקרוביוטיקה מעודדת צריכת ירקות סולניים (כגון עגבנייה ופלפל) בשל היותם מזון המעלה את אנרגיית ה\"יאנג\" בגוף.\n3. המקרוביוטיקה היא שיטה המבוססת על איזון אנרגטי (יין ויאנג), דוגלת במזון מבושל ומאודה, ושוללת לחלוטין דגים מכל סוג.\n4. דיאטת האורז של קמפנר פותחה במקור ככלי טיפולי קיצוני לחולי כליה ויתר לחץ דם חמור, והתבססה על אורז לבן, פירות וסוכר בלבד.","options":{"A":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","B":"רק טענה 1 נכונה.","C":"אף טענה בין סעיפים 1–4 אינה נכונה.","D":"טענה מס' 4 היא הנכונה היחידה מבין סעיפים 1–4."},"answer":["D"],"multi":false,"explanation":"טענה 3 שגויה (מקרוביוטיקה מאפשרת דגים). טענה 2 שגויה (מקרוביוטיקה שוללת סולניים כ\"יין\" קיצוני). טענה 1 שגויה (דיאטת האורז דלה בחלבון ואינה מיועדת לטווח ארוך לכל אדם). טענה 4 נכונה היסטורית ומקצועית.","slides":"","section":"A"},{"text":"מהו המנגנון הפיזיולוגי של סיבים תזונתיים מסיסים ותוססים בהקשר של בריאות המעי ומניעת מחלות כרוניות?\n\n1. כל הסיבים המסיסים מעלים את קצב ריקון הקיבה, ולכן הם גורמים לעלייה חדה ומהירה יותר ברמת הסוכר בדם.\n2. חומצת השומן \"בוטיראט\", תוצר של תסיסת סיבים, מהווה מקור אנרגיה עיקרי לתאי האפיתל במעי הגס וקשורה למניעת סרטן המעי.\n3. פקטין (סיב מסיס) יוצר מבנה ג'לטיני שקושר מלחי מרה; הכבד נאלץ להשתמש בכולסטרול קיים מהדם לייצור מרה חדשה, ובכך רמת ה-LDL יורדת.\n4. סיבים תוססים (כגון אינולין) מתפרקים על ידי חיידקי המעי הגס לחומצות שומן קצרות שרשרת (SCFA), המעלות את ה-pH במעי לרמה בסיסית המגנה על הרירית.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה בין סעיפים 1–4 אינה נכונה.","D":"טענות 3 ו-2 מתארות נכונה את פעולת הסיבים."},"answer":["D"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 4 שגויה (SCFA מורידות pH - יוצרות סביבה חומצית, לא בסיסית). טענה 1 שגויה (סיבים מסיסים מעכבים ריקון קיבה וספיגת סוכר). טענות 3 ו-2 מדויקות ביוכימית.","slides":"","section":"A"},{"text":"מקרה קליני: מטופל בתהליך ניקוי רעלים (Detox) חווה כאבי ראש עזים, פריחה בעור וטעם מתכתי בפה. מהי האבחנה המקצועית לפי המנגנונים שנלמדו?\n\n1. התסמינים מעידים על הצטברות של \"מולקולות ביניים ראקטיביות\" (Reactive Intermediates), הנוצרות בשלב Phase 1 ומהוות סכנה גדולה יותר מהרעלן המקורי.\n2. תסמינים אלו הם עדות לכך שהרעלים יוצאים ישירות מהשומן אל השתן מבלי לעבור בכבד, ולכן הכליות חוות עומס יתר.\n3. המצב נובע לרוב מכך ששלב Phase 2 מעוכב עקב מחסור בחומצות אמינו (כמו ציסטאין וגלוטמין) הדרושות לצימוד הרעלן והפיכתו למסיס מים.\n4. במצב כזה מומלץ להגביר את עוצמת הניקוי על ידי מעבר לצום מים מוחלט, כדי \"לשטוף\" את תוצרי הביניים במהירות מרבית.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה בין סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-3 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 2 שגויה (רעלים חייבים לעבור נטרול כבדי כדי לצאת בשתן). טענה 4 שגויה (במצב של \"פקק\" בנטרול רעלים, צום מים יחמיר את המצב; יש להאט את הניקוי). טענות 1 ו-3 מתארות את מנגנון ה\"פקק\" בין Phase 1 ל-Phase 2.","slides":"","section":"A"},{"text":"בניתוח המיטוסים של תזונה חומצית/בסיסית (Acid-Ash Hypothesis) ובריאות העצם, מהן המסקנות המדעיות הנכונות?\n\n1. צריכת חלבון מספקת חיונית לבניית מטריצת הקולגן של העצם ומעלה את רמת ה-IGF-1, הורמון המעודד את האוסטאובלסטים (בוני עצם).\n2. מדד PRAL מודד את חומציות השתן בלבד; שתן חומצי אינו מעיד על חמצת בדם, שכן ה-pH בדם נשמר קבוע (7.4) על ידי הכליות והריאות.\n3. אובדן סידן בשתן קשור בעיקר לצריכה גבוהה של נתרן (מלח), המאלץ את הכליות להפריש סידן יחד איתו, ללא קשר לחלבון.\n4. צריכת חלבון גבוהה (כולל מהחי) נחשבת לאויב העצם, שכן היא גורמת להפרשת סידן מוגברת מהעצמות כבופר נגד החלבון החומצי.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 2, 3). טענה 4 שגויה (חלבון אינו \"אויב העצם\"; תיאוריית האפר החומצי הופרכה). טענות 2, 1 ו-3 נכונות ומייצגות את הדיוק המדעי המעודכן בנושא.","slides":"","section":"A"},{"text":"כיצד פועל מנגנון ה-SERM בסויה ומהן השפעותיו המערכתיות על רקמות שונות בגוף האישה?\n\n1. הפיטואסטרוגנים בסויה (איזופלבונים) נקשרים בעדיפות גבוהה לרצפטור אסטרוגן מסוג בטא (ER-beta) המצוי בעורקים ובעצמות, ומפעילים אותו להגנה.\n2. האיזופלבונים מורידים את רמות הכולסטרול LDL בדם על ידי הפעלת רצפטורים ל-LDL בכבד, אך זאת רק במוצרי סויה מהונדסים גנטית (GMO).\n3. ברקמת השד, שם דומיננטי רצפטור אסטרוגן מסוג אלפא (ER-alpha), הפיטואסטרוגנים חוסמים את הקולטן ומונעים מהאסטרוגן האנושי החזק להמריץ חלוקה תאית.\n4. סויה מעלה את רמת ה-IGF-1 בדם, ובשל כך היא נחשבת לגורם מעודד סרטן השד אצל נשים לאחר גיל המעבר.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה בין סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-3 מייצגות את לב התיאוריה המדעית המגנה על הסויה."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 4 שגויה (IGF-1 גבוה הוא גורם סיכון, וסויה אינה מעלה אותו באופן מסוכן אלא הוכחה כמגינה). טענה 2 שגויה (מנגנון הורדת LDL רלוונטי לכל חלבון סויה, אך מומלץ non-GMO מסיבות רעלים). טענות 1 ו-3 הן לב מנגנון ה-SERM.","slides":"","section":"A"},{"text":"מהם ההיבטים הפיזיולוגיים של צריכת ביצים בהקשר של הגנה על העיניים ותהליכי טרשת עורקים?\n\n1. הלוטאין והזקסנטין בביצה נספגים ביעילות גבוהה יותר מאשר בצומח, בזכות הימצאותם בסביבה שומנית (חלמון) והעדר הכלורופיל המעכב ספיגה.\n2. כולין המצוי בחלמון חיוני לבניית ממברנות תאים, אך חיידקי מעיים מסוימים עלולים להפוך אותו ל-TMAO, מולקולה המאיצה שקיעת פלאק בעורקים.\n3. אכילת ביצים מעלה את ה-LDL אצל כלל האוכלוסייה באופן המצדיק הימנעות מוחלטת בכל גיל על פי המלצות הרמב\"ם והמדע.\n4. בישול החלבון (הלבן) של הביצה הוא קריטי, שכן הוא מנטרל את האבידין שחוסם ספיגת ביוטין; אכילת ביצה חיה לחלוטין עלולה לגרום לחסר בביוטין.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 2, 4). טענה 3 שגויה (הרמב\"ם והמדע המודרני אינם שוללים ביצים באופן גורף; השפעתן על כולסטרול בדם זניחה לרוב). טענות 1, 2 ו-4 מדויקות מדעית (זמינות לוטאין, TMAO ואבידין).","slides":"","section":"A"},{"text":"בנוגע למטבוליזם של אומגה 3 וצורכי המוח, מהו המידע המדויק ביותר המבדיל בין המקורות הצמחיים (ALA) למקורות מהים (DHA/EPA)?\n\n1. אחוז המרת ALA ל-DHA בכבד הוא נמוך (1%–5%), אך המנגנון הוא דינמי וההמרה עולה משמעותית כאשר הגוף מזהה מחסור או \"רעב\" ל-DHA.\n2. המוח זקוק לכמות זעירה בלבד של DHA בכל יום (כ-3.8 מ\"ג), וזמן מחצית החיים שלו במוח הוא ארוך מאוד (כ-2.5 שנים).\n3. DHA מאצות הוא המקור הראשוני בטבע, ודגים מקבלים אותו דרך שרשרת המזון; לכן תוסף DHA מאצות הוא תחליף בטוח וצמחי לשמן דגים.\n4. שמן דגים בתוספים הוא לרוב מחומצן (עקב רגישות הקשרים הכפולים), ולכן עדיף לצרוך דגים קטנים (סרדינים) המכילים סלניום כמגן מפני כספית.","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","D":"אף טענה מתוך סעיפים 1–4 אינה נכונה."},"answer":["A"],"multi":false,"explanation":"כל 4 הטענות נכונות ומסכמות את סוגיית האומגה 4 (דינמיות המרה, צורכי מוח קטנים, חמצון תוספים ואצות כמקור ראשוני).","slides":"","section":"A"},{"text":"ניתוח פיזיולוגי של הלחם \"המתוקן\": מה הופך לחם מחמצת מקמח מלא לבחירה המועדפת במצבי IBS ורגישויות עיכול?\n\n1. חיידקי המחמצת מפרקים את הלקטינים שבחיטה באופן מוחלט, מה שהופך את הלחם לבטוח לצריכה עבור חולי צליאק.\n2. לחם מחמצת לאחר האפייה הוא מקור פרוביוטי חי (מכיל חיידקים פעילים), המגיע למעי הגס ומשקם את פלורת המעיים.\n3. חומציות המחמצת מנטרלת את החומצה הפיטית, ובכך משחררת מינרלים כמו מגנזיום, ברזל ואבץ לספיגה יעילה במעי.\n4. התסיסה הארוכה של המחמצת מפרקת חלק מהפרוקטנים (סוג של FODMAPs), שהם הגורם העיקרי לנפיחות וגזים אצל רגישים לחיטה.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה בין סעיפים 1–4 אינה נכונה.","D":"טענות 4 ו-3 נכונות ומהוות בסיס להמלצה טיפולית."},"answer":["D"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 1 שגויה (לחם מחמצת אינו בטוח לחולי צליאק). טענה 2 שגויה (החיידקים מתים בחום האפייה). טענות 2 (FODMAPs) ו-3 (חומצה פיטית) מדויקות ומנמקות את היתרון ב-IBS.","slides":"","section":"A"},{"text":"מהי החשיבות של מזון מותסס (פוסט-ביוטיקה) ומהו פרוטוקול ההכנסה הנכון למטופל עם IBS?\n\n1. סיבי הירק במזון המותסס מגנים פיזית על החיידקים המועילים מפני חומציות הקיבה, ובכך משפרים את הגעתם כחיידקים חיים למעי הגס.\n2. תהליך ההתססה הופך את הירק לבסיסי מאוד (pH 8.5), ובכך הוא מקל על הכבד בנטרול חומצות מטבוליות.\n3. מזון מותסס מכיל מגוון רחב של חיידקי חומצה לקטית (פרוביוטיקה) וגם את תוצרי המטבוליזם שלהם (פוסט-ביוטיקה) כגון ויטמינים מקבוצה B ו-K2.\n4. לחולי IBS מומלץ להתחיל בצריכה גבוהה של חצי כוס מי-כבושים בבת אחת כדי \"להפציץ\" את המיקרוביום וליצור שינוי מהיר.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 4 שגויה (ב-IBS מתחילים בכמות זעירה כדי לא לעורר תגובה). טענה 2 שגויה (מזון מותסס הוא חומצי מאוד, pH ~3.0). טענות 3 ו-1 מתארות את יתרונות המזון המותסס.","slides":"","section":"A"},{"text":"יועצת תזונה מתבקשת לנתח את מצבו של מטופל בתהליך \"ניקוי רעלים\" החווה \"פקק\" ביוכימי בכבד. מהו ההסבר המדויק למצב זה לפי מנגנוני Phase 1 ו-Phase 2?\n\n1. שלב Phase 1 (צימוד) דורש אספקה שוטפת של חומצות אמינו כגון ציסטאין, גליצין וגלוטמין; מחסור בהן יוצר הצטברות של תוצרי ביניים ראקטיביים שעלולים לגרום נזק חמצוני לתאי הכבד.\n2. רעלים מסיסי שומן נאגרים בעיקר בבלוטת התריס, ולכן ירידה מהירה במשקל משחררת אותם אל מחזור הדם בקצב שאינו תלוי בתפקוד אנזימי הציטוכרום P450.\n3. \"סימני ניקוי\" כגון כאבי ראש ובחילות הם הוכחה לכך ששלב Phase 2 פועל בקצב מהיר משלב Phase 1, ולכן הגוף נמצא במצב של אופטימיזציה מטבולית.\n4. שלב Phase 1 הופך רעלנים מסיסי שומן לתרכובות ביניים פולאריות חלקית, אשר נוטות להיות יציבות יותר ופחות מסוכנות מהרעלן המקורי עד להגעתן לכליות.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["B"],"multi":false,"explanation":"טענה 4 שגויה (תוצרי הביניים של P1 ראקטיביים ורעילים יותר). טענה 2 שגויה (רעלים נאגרים בשומן, לא בבלוטת התריס). טענה 3 שגויה (\"סימני ניקוי\" מעידים על עיכוב ב-Phase 2/פקק תנועה). טענה 1 מדויקת (חשיבות חומצות אמינו לצימוד).","slides":"","section":"A"},{"text":"מהן העובדות הפיזיולוגיות והכימיות המדויקות בנוגע להיווצרות אקרילאמיד בלחם והשפעת המחמצת עליו?\n\n1. אקרילאמיד הוא חומר מסיס שומן בלבד, ולכן הוא אינו יכול להיספג במערכת העיכול של האדם אלא אם כן הלחם נאכל עם חמאה או שמן זית.\n2. אקרילאמיד נוצר בתגובה בין חומצת האמינו ליזין לסוכרים פשוטים בחום גבוה (מעל 120 מעלות), ולכן קרום הלחם והטוסט מכילים את הריכוז הגבוה ביותר שלו.\n3. לחם מחמצת שנאפה בתנור נחשב למזון פרוביוטי \"חי\", שכן מושבות החיידקים המועילים (LAB) שורדות את חום הליבה של הלחם ומיישבות את המעי הגס.\n4. התפחת מחמצת ארוכה (מעל 24 שעות) מפחיתה את כמות האקרילאמיד הנוצר באפייה, מכיוון שחיידקי הלקטובצילוס צורכים את חומצת האמינו אספרגין (חומר המוצא) בזמן התסיסה.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"רק טענה 1 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענה מס' 4 היא הדיוק המדעי היחיד מבין סעיפים 1–4."},"answer":["D"],"multi":false,"explanation":"טענה 2 שגויה (נוצר מאספרגין, לא ליזין). טענה 1 שגויה (אקרילאמיד נספג במעי). טענה 3 שגויה (החיידקים מתים בחום האפייה). טענה 4 מדויקת מדעית (פירוק אספרגין על ידי מחמצת).","slides":"","section":"A"},{"text":"בניתוח השוואתי של סיבים תזונתיים מסיסים (כגון פקטין ואגר-אגר), מהו המידע המדויק לגבי מבנם ותפקודם המטבולי?\n\n1. סיבים מסיסים מעטים את קצב ריקון הקיבה וממתנים את עליית הסוכר בדם לאחר הארוחה, בניגוד לסיבים בלתי מסיסים שאינם משפיעים על האינדקס הגליקמי.\n2. אגר-אגר הוא סיב המורכב משרשראות ארוכות של גלוקוז הפוך, אשר עובר התססה מהירה מאוד על ידי חיידקי המעי הגס והופך לחומצה בוטירית המגנה מסרטן.\n3. פקטין הוא סיב מסיס המצוי בקליפות פירות, אשר יוצר מבנה ג'לטיני הקושר מלחי מרה במעי הדק ומפחית את ספיגת הכולסטרול LDL מחדש לכבד.\n4. סיבים תוססים (Fermentable fibers) מעלים את ה-pH במעי הגס לרמה בסיסית (pH 8.0), ובכך הם משפרים את המסת המינרלים והספיגה שלהם לדם.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-3 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 2 שגויה (אגר עשוי מגלקטוז ואינו תוסס בקלות). טענה 4 שגויה (SCFA מורידות pH - יוצרות סביבה חומצית, לא בסיסית). טענות 4 (פקטין וכולסטרול) ו-1 (סיבים וסוכר) נכונות.","slides":"","section":"A"},{"text":"כיצד הפיטואסטרוגנים בסויה משפיעים על בריאות העצם ועל הסיכון לסרטן השד בהקשר של רצפטורים לאסטרוגן?\n\n1. יכולת הגוף להפיק תועלת מהסויה לבניית עצם תלויה ביכולת של המיקרוביום להפוך דאידזאין למולקולת אקואול (Equol), יכולת הקיימת אצל כ-30% עד 50% מהאוכלוסייה.\n2. האיזופלבונים בסויה נקשרים בעדיפות גבוהה לרצפטור אסטרוגן מסוג בטא (ER-beta), המצוי בעיקר בעצמות ובעורקים, ומשרים שם השפעה אגוניסטית (מפעילה) המגנה על הרקמות.\n3. ברקמת השד, שם דומיננטי רצפטור אסטרוגן מסוג אלפא (ER-alpha), הפיטואסטרוגנים פועלים כאנטגוניסטים סלקטיביים החוסמים את הרצפטור מפני אסטרוגן אנושי חזק.\n4. סויה מעלה את רמת ה-IGF-1 בדם, הורמון המעודד בניית עצם, ובשל כך היא אסורה לצריכה עבור נשים עם היסטוריה משפחתית של סרטן השד.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענה מס' 4 היא השגיאה המדעית היחידה בסעיפים 1–4."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 2, 3). טענה 4 שגויה (סויה דווקא מגנה מסרטן השד ואינה מעלה IGF-1 לרמות מסוכנות). טענות 3 (ER-beta), 3 (ER-alpha) ו-1 (Equol) הן לב הפיזיולוגיה של הסויה.","slides":"","section":"A"},{"text":"בנוגע לצריכת ביצים, כולסטרול ונוגדי חמצון לעיניים – מהן המסקנות המדויקות ביותר שעליך להציג למטופל החושש מטרשת עורקים?\n\n1. הלוטאין והזקסנטין בחלמון הביצה הם בעלי זמינות ביולוגית גבוהה פי כמה מזו שבצומח, בשל היעדר הכלורופיל והימצאותם בסביבה שומנית המאפשרת ספיגה אופטימלית.\n2. אכילת ביצים מעלה את ה-LDL אצל כ-95% מהאוכלוסייה בצורה דרמטית, ולכן במקרי טרשת עורקים יש להימנע מהן לחלוטין לפי ההמלצות שנלמדו.\n3. בישול חלבון הביצה (הלבן) מנטרל את האבידין, חלבון שקושר ביוטין ומונע את ספיגתו; לכן אכילת ביצים חיות עלולה להוביל לחסר בויטמין B7 (ביוטין).\n4. כולין בביצה הוא חומר חיוני לממברנות התאים, אך אצל אנשים עם פלורת מעיים משובשת הוא עלול להפוך ל-TMAO, חומר המזרז הצטברות פלאק טרשתי.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 3, 4). טענה 2 שגויה (השפעת כולסטרול מהמזון על ה-LDL בדם זניחה לרוב האוכלוסייה). טענות 1 (לוטאין), 4 (כולין/TMAO) ו-3 (אבידין/ביוטין) מדויקות מדעית.","slides":"","section":"A"},{"text":"מטופל בתזונה טבעונית מבקש להבין את מטבוליזם האומגה 3 וצורכי המוח. מהו הדיוק המדעי שעליו להתבסס?\n\n1. שמן זרעי מרווה מרושתת מכיל DHA ו-EPA ישירים מהצומח, ולכן הוא מהווה תחליף ביוכימי מושלם לשמן דגים ללא צורך בהמרה בכבד.\n2. המרת אומגה 3 בגוף היא תהליך דינמי; הגוף מסוגל להגדיל את אחוזי ההמרה באופן משמעותי כאשר הוא מזהה מצב של מחסור או \"רעב\" ל-DHA.\n3. זמן מחצית החיים של DHA במוח הוא ארוך מאוד (כשנתיים וחצי), מה שמסביר מדוע טבעונים אינם חווים הידרדרות קוגניטיבית מהירה למרות היעדר צריכת DHA ישירה.\n4. אחוז המרת ALA (מהצומח) ל-DHA בכבד הוא נמוך מאוד (אחוזים בודדים), אך המוח זקוק לכמות זעירה בלבד (כ-3.8 מ\"ג ביום) כדי לשמר את פעילותו התקינה.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3, 4). טענה 1 שגויה (מרווה מרושתת מכילה ALA, לא DHA/EPA ישיר). טענות 2 (המרה וצרכי מוח), 3 (זמן מחצית חיים) ו-2 (דינמיות המרה) נכונות לחלוטין.","slides":"","section":"A"},{"text":"מהו ההבדל המהותי בין שיטות התזונה הפרו-טבעוניות \"קינגסטון\" ו\"המקרוביוטיקה\" לפי עקרונות הריפוי והגדרת המזון?\n\n1. שיטת שלטון (\"ההיגיינה הטבעית\") מעודדת שימוש נרחב במיצי ירקות ובפורמולות ניקוי צמחיות ככלי המרכזי לשיקום רירית המעי.\n2. המקרוביוטיקה מבוססת על איזון אנרגטי של \"יין ויאנג\", דוגלת במזון מבושל ומאודה, שוללת ירקות סולניים ופירות טרופיים, ומאפשרת דגים.\n3. שיטת אן ויגמור (מכון היפוקרטס) היא שיטת Raw Food טבעונית המבוססת על פירות מתוקים כמקור אנרגיה עיקרי לחולי סרטן.\n4. שיטת קינגסטון דומה ברוחה לגישת הרמב\"ם, דוגלת באכילת פירות בבוקר, מאפשרת מוצרי חלב עיזים לא מפוסטרים ושמה דגש על איכות המזון.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 1 שגויה (שלטון התנגד למיצי ירקות ופורמולות, דגל רק בצום מים). טענה 3 שגויה (אן ויגמור צמצמה פירות מתוקים כדי לא להזין סרטן). טענות 4 ו-2 מדויקות.","slides":"","section":"A"},{"text":"בניתוח ביוכימי של סוכרים, מהן ההשלכות של צריכת פרוקטוז (סוכר פירות) לעומת גלוקוז על הכבד והזדקנות הרקמות?\n\n1. גליקציה (AGEs) היא קישור סוכר לחלבון; הפרוקטוז גורם לתהליך זה בקצב מהיר פי 7 מגלוקוז, מה שמאיץ נזקים מבניים בקולגן ובכלי הדם.\n2. פרוקטוז נחשב לממתיק בטוח לסוכרתיים בטווח הארוך, מכיוון שאינו דורש אינסולין לכניסה לתאים ולכן הוא מונע עמידות לאינסולין.\n3. סוכרוז הוא דו-סוכר המורכב מגלוקוז וגלקטוז, וריכוזו בסלק נחשב לנמוך יחסית (כ-10% מסך הסוכרים שבו).\n4. פרוקטוז עובר מטבוליזם כמעט בלעדי בכבד, שם הוא הופך לטריגליצרידים וגורם לעלייה בחומצה אורית כתוצר לוואי של צריכת ATP מהירה ובלתי מבוקרת.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 3 שגויה (סוכרוז = גלוקוז + פרוקטוז; סלק עשיר בסוכרוז 96%). טענה 2 שגויה (פרוקטוז גורם לעמידות לאינסולין). טענות 2 (ATP/חומצה אורית) ו-1 (גליקציה) נכונות.","slides":"","section":"A"},{"text":"מהו המנגנון המדויק שדרכו מזון מותסס (כרוב כבוש) תורם לבריאות המעי והעצם, ומהן המגבלות לפי החומר שנלמד?\n\n1. חיידקי חומצה לקטית (LAB) מייצרים בזמן ההתססה ויטמין K2 (מסוג MK-7), החיוני לניתוב סידן לעצמות ומניעת שקיעתו בעורקים.\n2. תהליך ההתססה הופך את הירק לבסיסי מאוד (pH 8.5), ובכך הוא מנטרל לחלוטין את חומצות הקיבה ומקל על העיכול.\n3. לחולי IBS מומלץ להתחיל ב\"הפצצה\" של חצי כוס מי כבושים ביום כדי ליצור שינוי מהיר ודרמטי בפלורת המעיים.\n4. סיבי הירק במזון המותסס מהווים \"מגן פיזי\" לחיידקים מפני חומציות הקיבה, ובכך משפרים את הגעתם כפרוביוטיקה חיה למעי הגס.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-4 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 3 שגויה (ב-IBS מתחילים בטיפות/כפית בודדת). טענה 2 שגויה (מזון מותסס הוא חומצי מאוד, pH ~3.0). טענות 1 (K2) ו-4 (הגנה פיזית) נכונות.","slides":"","section":"A"},{"text":"בנוגע לאוסטיאופורוזיס ובריאות העצם – מהן העובדות המדעיות המפריכות את המיתוסים המקובלים?\n\n1. צריכת חלבון מספקת (גם מהחי) חיונית לבניית העצם מכיוון שהיא מעלה את רמות ה-IGF-1 ומשפרת את ספיגת הסידן במעי.\n2. קולגן הוא \"השלד\" של העצם; רמות סוכר גבוהות גורמות לגליקציה המחלישה את סיבי הקולגן והופכת את העצם לשבירה, ללא קשר לכמות הסידן.\n3. אובדן סידן בשתן קשור בעיקר לצריכה גבוהה של נתרן (מלח), המאלץ את הכליות להפריש סידן יחד איתו, ללא קשר לחומציות החלבון.\n4. תיאוריית ה\"אפר החומצי\" הופרכה; הדם מאוזן בדייקנות על ידי הכליות והריאות, ואינו זקוק לסידן מהעצם כבופר נגד חלבון מהחי.","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","D":"אף טענה מתוך סעיפים 1–4 אינה נכונה."},"answer":["A"],"multi":false,"explanation":"כל 4 הטענות נכונות ומשקפות את המהפכה המדעית בבריאות העצם (הפרכת האפר החומצי, חשיבות החלבון והנתרן, ומנגנון הגליקציה בקולגן).","slides":"","section":"A"},{"text":"ניתוח פילוסופי-קליני של שיטת שלטון (\"ההיגיינה הטבעית\"): מהם העקרונות המבדילים אותה משיטות טבעוניות אחרות?\n\n1. שיטת שלטון דוגלת בשילוב מקסימלי של סוגי מזון שונים בכל ארוחה (חלבון, פחמימה ושומן) כדי לאתגר את מערכת העיכול ולחזק אותה.\n2. בניגוד לשיטת קינגסטון, שלטון עודד צריכת מוצרי חלב עיזים בתנאי שהם גולמיים (Raw) ולא עברו שום תהליך חימום או פסטור.\n3. שלטון האמין כי הגוף הוא המרפא הבלעדי של עצמו, ולכן שלל לחלוטין שימוש בתוספי תזונה, ויטמינים מרוכזים וצמחי מרפא בזמן מחלה.\n4. הכלי הטיפולי העוצמתי ביותר בשיטה זו הוא צום מים ממושך, המכונה \"סכין המנתחים של הטבע\", שנועד לאפשר לגוף לפרק רקמות חולות (אוטופגיה).","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 3 מדויקת (שלילת תוספים). טענה 4 מדויקת (צום מים ככלי מרכזי). טענה 2 שגויה (שלטון טבעוני לחלוטין, לא מאפשר חלב). טענה 1 שגויה (שלטון דוגל בצירופי מזון פשוטים, לא בערבוב).","slides":"","section":"A"},{"text":"בנוגע לזני חיטה קדומים (כגון כוסמין ופריקה) והפיזיולוגיה של הגלוטן – מהו המידע המדויק ביותר?\n\n1. כוסמין נחשב לזן קדום המכיל פחות גלוטן באופן משמעותי מחיטה מודרנית, אך הגלוטן שבו עדיין מכיל את מקטעי הגליאדין ולכן אינו בטוח לחולי צליאק.\n2. מבנה הגלוטן בבצק שנלוש זמן קצר ובנחת (כפי שממליץ הרמב\"ם) יוצר רשת סיבים צפופה ונוקשה יותר מאשר לישה במעבד מזון תעשייתי.\n3. רגישות לגלוטן שאינה צליאק (NCGS) קשורה לעיתים קרובות לא לפרוטאין עצמו אלא לפרוקטנים (סוג של FODMAP) המצויים בחיטה ומותססים על ידי חיידקי המעי.\n4. פריקה (חיטה ירוקה) היא חיטה שנקצרה לפני הבשלתה ועברה תהליך של קלייה באש; תהליך זה מפרק את הלקטינים והופך אותה לקלה לעיכול עבור חולי קרוהן.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"רק טענה 1 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-3 נכונות ומייצגות את הדיוק המדעי והקליני בנושא."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 1 מדויקת (כוסמין וגלוטן/צליאק). טענה 3 מדויקת (NCGS ופרוקטנים/FODMAPs). טענה 4 שגויה (פריקה אסורה בקרוהן פעיל בגלל גלוטן וסיבים). טענה 2 שגויה (לישה ממושכת בנחת יוצרת גלוטן רך ופרוס יותר, לא נוקשה).","slides":"","section":"A"},{"text":"מהו המנגנון המטבולי של הפרוקטוז וכיצד הוא משפיע על רמות ה-ATP והחומצה האורית בכבד?\n\n1. תוצר הפירוק של ה-AMP בכבד הוא חומצה אורית (Uric Acid); רמות גבוהות של חומצה זו בדם מעכבות ייצור של NO (ניטריק אוקסיד) וגורמות ליתר לחץ דם.\n2. סוכרוז (סוכר לבן) מורכב מ-50% גלוקוז ו-50% גלקטוז, ולכן הוא נחשב למזיק פחות מפרוקטוז טהור מכיוון שהגלקטוז אינו משפיע על הכבד.\n3. הפרוקטוז משפר את הרגישות לאינסולין בשרירים מכיוון שהוא נספג לאט יותר בדם בהשוואה לגלוקוז פשוט.\n4. הפרוקטוז, בניגוד לגלוקוז, עובר מטבוליזם מהיר בכבד ללא בקרה של האנזים פוספו-פרוקטו-קינאז, מה שגורם לצריכת ATP מסיבית ויצירת עודף של AMP.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 3 ו-4 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 4 מדויקת (חוסר בקרה ביוכימית). טענה 1 מדויקת (חומצה אורית ו-NO). טענה 2 שגויה (סוכרוז = גלוקוז + פרוקטוז). טענה 3 שגויה (פרוקטוז גורם לעמידות לאינסולין).","slides":"","section":"A"},{"text":"יועצת תזונה צריכה להסביר למטופל על ההבדל בין סיבים תוססים (כגון אינולין) לסיבים שאינם תוססים (כגון אגר-אגר). מהן העובדות הנכונות?\n\n1. חומצות שומן קצרות שרשרת (SCFA) המיוצרות מהתססה מסייעות בספיגת מינרלים במעי הגס על ידי הפיכתם ליונים מסיסים בסביבה החומצית שנוצרה.\n2. אגר-אגר מורכב משרשראות גלקטוז; עבור רוב האוכלוסייה הוא נחשב לסיב שאינו תוסס (לא עובר פירוק חיידקי), ולכן הוא מעולה להגדלת נפח הצואה ללא גזים.\n3. כל הסיבים המסיסים במים הם בהכרח גם תוססים, ולכן פקטין ואגר-אגר נחשבים לבעלי השפעה פרוביוטית זהה על פלורת המעי.\n4. אינולין הוא סיב המורכב משרשראות פרוקטוז; הוא עובר התססה מלאה על ידי חיידקי המעי הגס לחומצות שומן קצרות שרשרת המורידות את ה-pH לסביבה חומצית.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענה מס' 3 היא השגיאה המדעית היחידה בסעיפים 1–4."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 2, 4). טענה 3 שגויה (לא כל המסיסים תוססים; אגר-אגר מסיס אך כמעט לא תוסס). טענות 4, 2 ו-1 מייצגות את הביוכימיה של הסיבים וה-pH במעי.","slides":"","section":"A"},{"text":"מקרה קליני: מטופל המתחיל תהליך ניקוי רעלים (Detox) חווה עייפות קיצונית, כאבי פרקים וטעם רע בפה ביום השלישי לצום המיצים. מהו ההסבר הביוכימי?\n\n1. טעם מתכתי בפה מעיד לעיתים על שחרור מתכות כבדות המאוחסנות ברקמות, תהליך שקורה רק כאשר רמת הגלוקוז בדם יורדת מתחת ל-60 מ\"ג/ד\"ל.\n2. שלב Phase 4 (ציטוכרום P450) הופך את הרעלן למולקולה ראקטיבית; ללא נוגדי חמצון וחומצות אמינו לצימוד, מולקולות אלו פוגעות בתאי הכבד והגוף.\n3. במקרה כזה, הפתרון הנכון הוא להאיץ את הניקוי על ידי הוספת חוקני קפה, שכן הם מפעילים ישירות את אנזימי שלב Phase 1 ומנקים את הכבד מהר יותר.\n4. התסמינים נובעים משחרור רעלים מסיסי שומן מרקמת השומן (ליפוליזה); אם שלב Phase 2 בכבד מעוכב (למשל מחוסר חלבון), נוצרת הצטברות של תוצרי ביניים רעילים.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 4 ו-2 מתארות נכונה את מנגנון ה\"משבר\" בנטרול רעלים."},"answer":["D"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 4 ו-2 מסבירות את ה\"פקק\" המטבולי בין Phase 1 ל-Phase 2. טענה 1 שגויה (אין קשר ישיר לערך גלוקוז 60). טענה 3 שגויה (חוקני קפה מעוררים גלוטטיון בשלב 2, אך לא פותרים \"פקק\" של צום מיצים ללא חלבון).","slides":"","section":"A"},{"text":"סויה ובריאות העצם: כיצד פועלים הפיטואסטרוגנים (איזופלבונים) בהקשר של צפיפות עצם ורמות הורמונליות?\n\n1. הפיטואסטרוגנים מתחרים עם האסטרוגן האנושי על הרצפטורים; בנשים עם עודף אסטרוגן, הם עשויים להוריד את האפקט האסטרוגני הכולל דרך חסימת הקולטנים.\n2. היכולת להפוך דאידזאין (איזופלבון) למולקולה המגנה \"אקואול\" (Equol) תלויה בחיידקי מעיים ספציפיים וקיימת רק אצל כ-30% עד 50% מהאוכלוסייה.\n3. צריכת סויה גורמת לירידה משמעותית ברמת ה-IGF-1 בדם, ובכך היא מונעת את בניית העצם אצל נשים לאחר גיל המעבר.\n4. הג'ניסטאין בסויה נקשר בעדיפות לרצפטור אסטרוגן מסוג בטא (ER-beta) הנמצא בעצמות, ומשרה שם השפעה המעודדת פעילות אוסטאובלסטים (בוני עצם).","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-4 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 2, 4). טענה 3 (ER-beta), 1 (תחרות) ו-2 (אקואול) נכונות ומדויקות. טענה 3 שגויה (חלבון סויה דווקא מעלה IGF-1 לבניית עצם).","slides":"","section":"A"},{"text":"מזון מותסס (כגון כרוב כבוש) כמקור לפוסט-ביוטיקה: מהם המנגנונים והיתרונות המרכזיים?\n\n1. מזון מותסס נחשב למזון פרוביוטי חי רק אם הוא עבר תהליך של פסטור קל ב-72 מעלות כדי להרוג את החיידקים המזיקים בלבד.\n2. חיידקי חומצה לקטית (LAB) הופכים גלוקוז לחומצה לקטית; התהליך מוריד את ה-pH המקומי בצנצנת לרמה חומצית (כ-3.0), המונעת צמיחת פתוגנים.\n3. מזון מותסס מכיל ויטמין K2 מסוג MK-7 שנוצר על ידי החיידקים; ויטמין זה חיוני להפעלת חלבון האוסטאוקלצין המנתב סידן לעצמות.\n4. ההתססה הביולוגית מנטרלת חומצה פיטית ולקטינים בירק, ובכך משפרת את הזמינות הביולוגית של מינרלים עוד לפני הגעת המזון למעי.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 2, 3 ו-4 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 2, 3, 4). טענה 1 שגויה (פסטור הורס את החיידקים והופך את המזון ללא-פרוביוטי). טענות 2, 3 ו-4 הן ליבת התועלת של המזון המותסס.","slides":"","section":"A"},{"text":"בנוגע לביצים, כולין וטרשת עורקים – מהן העובדות הפיזיולוגיות והאזהרות הקליניות הנכונות?\n\n1. הכולסטרול בביצה אינו מזיק כלל, אלא אם כן הוא עבר חמצון (למשל באבקת ביצים או טיגון יתר), שאז הוא שוקע בדפנות העורקים.\n2. כולין המצוי בחלמון הביצה הוא חומר חיוני למבנה המוח והממברנות, אך אצל אנשים עם פלורת מעיים לא תקינה הוא עלול להפוך לחומר הטרשתי TMAO.\n3. לוטאין וזקסנטין מהביצה נספגים ביעילות גבוהה יותר מאשר מהצומח בשל היעדר הכלורופיל והימצאותם בסביבה שומנית המאפשרת ספיגה אופטימלית.\n4. אכילת ביצה חיה לחלוטין (כולל החלבון הלבן) אינה מומלצת, שכן היא מכילה אבידין פעיל שקושר ביוטין ומונע את ספיגתו (ויטמין B7).","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","D":"אף טענה מתוך סעיפים 1–4 אינה נכונה."},"answer":["A"],"multi":false,"explanation":"כל 4 הטענות נכונות לחלוטין ומייצגות סיכום מקיף של נושא הביצים (כולין/TMAO, לוטאין, אבידין וחמצון כולסטרול).","slides":"","section":"A"},{"text":"מהו הקשר בין תגובת מייאר (Maillard Reaction) להיווצרות אקרילאמיד במוצרי מאפה ועמילנים?\n\n1. אקרילאמיד הוא תוצר לוואי הנוצר כאשר חומצת האמינו אספרגין מגיבה עם סוכרים פשוטים בטמפרטורה שמעל 120 מעלות צלזיוס.\n2. אקרילאמיד נחשב לחומר מסרטן פוטנציאלי במערכת העצבים והוא נוצר באופן בלעדי רק בתהליך אפייה, ולא בטיגון עמוק של תפוחי אדמה.\n3. התפחת מחמצת ארוכה מצמצמת את כמות האקרילאמיד הנוצר באפייה, מכיוון שחיידקי המחמצת מפרקים את חומרי המוצא (אספרגין וסוכרים).\n4. קרום הלחם (החלק השחום) ולחם קלוי (טוסט) מכילים ריכוז גבוה של אקרילאמיד בהשוואה לחלק הפנימי והלבן של הלחם.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 3, 4). טענה 2 שגויה (אקרילאמיד נוצר בחוזקה גם בטיגון עמוק/צ'יפס עקב העמילן והחום). טענות 1, 4 ו-3 מדויקות.","slides":"","section":"A"},{"text":"בניתוח בריאות העצם ותיאוריית ה\"אפר החומצי\" – מהן המסקנות הסופיות והמנגנונים המעורבים?\n\n1. אובדן סידן בשתן קשור באופן ישיר ודרמטי לצריכה גבוהה של נתרן (מלח), המאלץ את הכליות להפריש סידן יחד עם הנתרן העודף.\n2. המטריצה החלבונית של העצם (קולגן) רגישה לתהליכי גליקציה עקב סוכר גבוה בדם, מה שהופך את העצם לשבירה גם אם יש בה מספיק סידן.\n3. תיאוריית האפר החומצי הופרכה; חלבון מן החי אינו גורם לאוסטיאופורוזיס דרך שינוי pH הדם, אלא להיפך – הוא חיוני לבניית מטריצת הקולגן.\n4. צריכת חלבון מספקת מעלה את רמות הורמון ה-IGF-3 (Anabolic factor), המפעיל את האוסטאובלסטים ובניית העצם, בניגוד לתזונה דלת חלבון קיצונית.","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","D":"אף טענה מתוך סעיפים 1–4 אינה נכונה."},"answer":["A"],"multi":false,"explanation":"כל 4 הטענות נכונות ומייצגות את המהפכה המדעית בבריאות העצם (הפרכת האפר החומצי, חשיבות החלבון והנתרן, והשפעת הגליקציה).","slides":"","section":"A"},{"text":"כיצד משפיעה צריכת סויה על רמות ה-Equol וכיצד זה קשור למגוון המיקרוביום בגוף האדם?\n\n1. כל בני האדם שנולדו באזורי הבלו-זון (כמו אוקינאווה) נולדים עם היכולת לייצר אקואול, בניגוד לאוכלוסייה המערבית שבה היכולת תלויה בנטילת תוספי פרוביוטיקה.\n2. מולקולת האקואול נוצרת בכבד על ידי אנזימי ציטוכרום P450 כחלק מתהליך נטרול הפיטואסטרוגנים בשלב הראשון.\n3. אקואול הוא מטבוליט המיוצר מהאיזופלבון דאידזאין (Daidzein) על ידי חיידקים ספציפיים במעי הגס, והוא נחשב לבעל השפעה אסטרוגנית מגנה וחזקה במיוחד.\n4. ייצור אקואול הוכח מחקרית כגורם המרכזי המעלה את צפיפות העצם ומונע סרטן שד בנשים בעלות רמות אסטרוגן גבוהות מדי.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["B"],"multi":false,"explanation":"טענה 2 שגויה (אקואול נוצר במעי הגס על ידי חיידקים, לא בכבד). טענה 1 שגויה (יכולת ייצור אקואול תלויה במיקרוביום וקיימת אצל כ-30%-50% מהאוכלוסייה, ללא קשר בלעדי למקום לידה). טענה 4 שגויה (אקואול הוא גורם משמעותי, אך לא \"המרכזי היחיד\"). טענה 3 מדויקת ביוכימית.","slides":"","section":"A"},{"text":"ניתוח השוואתי של גישות ה-Raw Food וההיגיינה הטבעית (שלטון מול ויגמור): מהן העובדות המדויקות?\n\n1. שיטת קינגסטון נבדלת משלטון בכך שהיא מאפשרת מוצרי חלב עיזים גולמיים (לא מפוסטרים) כחלק מתפריט התיקון היומי.\n2. שיטת שלטון שוללת לחלוטין שימוש במיצי ירקות ופירות ככלי ניקוי, ומאמינה כי הגוף זקוק למים בלבד כדי להפעיל מנגנוני ריפוי עצמי.\n3. כל השיטות הפרו-טבעוניות המודרניות דוגלות באכילת 80% פחמימות מורכבות (כגון תפוחי אדמה מבושלים) כבסיס קלורי קבוע.\n4. אן ויגמור (מכון היפוקרטס) הדגישה את השימוש במיץ עשב חיטה ובנבטים (מזון חי), אך צמצמה צריכת פירות מתוקים כדי למנוע האצת תהליכים דלקתיים.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 2, 4 ו-1 נכונות ומדגישות את ההבדלים הפילוסופיים בין הגישות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 2, 4). טענה 3 שגויה (80/10/10 ושלטון/ויגמור דוגלים ב-Raw Food, לא בפחמימות מבושלות כבסיס). טענות 2, 4 ו-1 מתארות במדויק את ההבדלים בין שלטון (צום מים), ויגמור (עשב חיטה ונבטים) וקינגסטון (חלב עיזים גולמי).","slides":"","section":"A"},{"text":"מהו הקשר המטבולי בין צריכת פרוקטוז מעובד לבין בריאות העצם וייצור חומצה אורית?\n\n1. פירוק הפרוקטוז בכבד כרוך בניצול מאסיבי של ATP המעלה את רמות ה-AMP, שבתורו מתפרק לחומצה אורית (Uric Acid).\n2. הפרוקטוז חודר לכבד ללא צורך באינסולין, ושם הוא מנוצל להפקת אנרגיה מהירה המעודדת בניית סיבי קולגן תקינים בעצם.\n3. הפרוקטוז, בניגוד לגלוקוז, אינו יוצר קשרי גליקציה עם חלבונים, ולכן הוא נחשב לממתיק המועדף למניעת שבירות עצם בסוכרתיים.\n4. רמות גבוהות של חומצה אורית בדם פוגעות בייצור ניטריק אוקסיד (NO), מה שגורם לכיווץ עורקים ועלול להוביל ליתר לחץ דם ולאוסטיאופורוזיס עקב פגיעה באספקת הדם לעצם.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 2 שגויה (פרוקטוז אינו מעודד בניית קולגן אלא גורם לגליקציה שמחלישה אותו). טענה 3 שגויה (פרוקטוז גורם לגליקציה מהירה פי 7 מגלוקוז). טענות 1 ו-4 מדויקות (מנגנון ATP/חומצה אורית ופגיעה ב-NO).","slides":"","section":"A"},{"text":"מהו המנגנון שבו מזון מותסס (פוסט-ביוטיקה) תורם לשיקום רירית המעי בקרב חולי IBS?\n\n1. המזון המותסס מכיל חומצות שומן קצרות שרשרת (SCFA) המזינות ישירות את הקולונוציטים (תאי המעי) ומחזקות את ה\"צמתים ההדוקים\" למניעת מעי דליף.\n2. לחולי IBS מומלץ לצרוך כמות מסיבית של מזון מותסס (כגון 200 גרם קרוב כבוש ביום) כבר בתחילת הטיפול כדי \"להטביע\" את החיידקים המזיקים.\n3. תהליך ההתססה הופך את המזון לבסיסי (pH גבוה), ובכך הוא מנטרל את חומציות הקיבה המזיקה למעי הדק אצל רגישים.\n4. חיידקי החומצה הלקטית הופכים את הסוכרים שבקרוב לחומצה לקטית המורידה את ה-pH לסביבה חומצית (כ-3.0), המדכאת חיידקים פתוגניים.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענה מס' 4 ו-1 נכונות ומסבירות את התועלת הקלינית בשימוש מבוקר."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 2 שגויה (ב-IBS מתחילים בכמות מזערית/טיפות כדי למנוע תגובה חריפה). טענה 3 שגויה (מזון מותסס הוא חומצי מאוד, pH ~3.0). טענות 4 ו-1 מייצגות את לב הפיזיולוגיה של המזון המותסס.","slides":"","section":"A"},{"text":"בניתוח ביוכימי של נטרול רעלים, מדוע אדם עם מסת שריר נמוכה מאוד (סרקופניה) נמצא בסיכון בזמן צום ניקוי רעלים?\n\n1. כי שלב Phase 2 דורש חומצות אמינו לצימוד (כגון גליצין וציסטאין); בהעדר אספקה מהמזון, הגוף מפרק שריר כדי לקבלן, אך אצל אדם עם מסת שריר נמוכה המאגרים מצומצמים.\n2. כי שרירים חלשים אינם מסוגלים לייצר חום גוף, ותהליך נטרול הרעלים בכבד דורש טמפרטורה קבועה של 38 מעלות כדי לפעול.\n3. כי מסת השריר היא המאגר העיקרי של אנזימי ציטוכרום P450 הדרושים לשלב Phase 1 בכבד.\n4. חסר בחלבון במהלך ניקוי עלול לגרום להצטברות \"תוצרי ביניים\" רעילים (Reactive Intermediates) שנוצרו בשלב הראשון אך לא נוטרלו בשני.","options":{"A":"רק טענה 1 נכונה.","B":"רק טענה 2 נכונה.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1 ו-4 נכונות ומסבירות את הסיכון המטבולי בניקוי רעלים לא מבוקר."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 3 שגויה (ציטוכרום P450 נמצא בכבד, לא בשריר). טענה 2 שגויה (אין קשר לטמפרטורת השריר). טענות 1 ו-4 מסבירות את חשיבות חומצות האמינו לשלב Phase 2 ואת סכנת ה\"פקק\" המטבולי.","slides":"","section":"A"},{"text":"מהו המידע המדויק ביותר המבדיל בין מטבוליזם האומגה 3 מהצומח (ALA) לבין המקורות מהים (DHA/EPA)?\n\n1. DHA מאצות הוא המקור הראשוני בטבע, ודגים מקבלים אותו דרך שרשרת המזון; לכן, תוסף DHA מאצות הוא תחליף ישיר וצמחי לשמן דגים ללא סכנת חמצון גבוהה.\n2. הגוף מסוגל להגדיל את אחוזי ההמרה של ALA באופן משמעותי כאשר הוא מזהה מחסור או \"רעב\" ל-DHA (מנגנון המרה דינמי).\n3. שמן דגים בתוספים הוא לרוב מחומצן בשל רגישות הקשרים הכפולים, בעוד שמן זרעי מרווה מרושתת מכיל נוגדי חמצון טבעיים השומרים על יציבות ה-ALA.\n4. אחוז המרת ALA ל-DHA הוא נמוך (כ-1%-5%), אך המוח זקוק לכמות זעירה בלבד (כ-3.8 מ\"ג ליום) וזמן מחצית החיים של DHA במוח ארוך מאוד (כ-2.5 שנים).","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","D":"אף טענה מתוך סעיפים 1–4 אינה נכונה."},"answer":["A"],"multi":false,"explanation":"כל 4 הטענות נכונות ומסכמות את הפרק המדעי על אומגה 1 (צרכי המוח, יציבות ALA במרווה, אצות כמקור ראשוני והמרה דינמית).","slides":"","section":"A"},{"text":"כיצד תהליכי התפחת לחם מחמצת ואפייה משפיעים על עיכול החיטה והיווצרות רעלנים?\n\n1. תהליך התסיסה הארוך מפרק חלק מהפרוקטנים (FODMAPs), מה שמפחית משמעותית נפיחות וגזים בקרב אנשים עם רגישות לגלוטן (NCGS).\n2. לחם מחמצת הוא מזון פרוביוטי חי המכיל חיידקים השורדים את חום התנור ומיישבים את המעי הגס לאחר האכילה.\n3. חיידקי המחמצת צורכים את חומצת האמינו אספרגין בזמן התסיסה, ובכך מפחיתים את כמות האקרילאמיד (חומר מסרטן) הנוצר בזמן האפייה בחום גבוה.\n4. חיידקי המחמצת והחומציות הגבוהה מנטרלים את החומצה הפיטית, ובכך משפרים את ספיגת המינרלים מהקמח המלא.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 4, 1 ו-3 נכונות ומנמקות את המלצת המטפל על לחם מחמצת איכותי."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3, 4). טענה 2 שגויה (החיידקים מתים באפייה, הלחם אינו פרוביוטי). טענות 4, 1 ו-3 מנמקות את היתרונות הבריאותיים של לחם מחמצת (חומצה פיטית, FODMAPs ואקרילאמיד).","slides":"","section":"A"},{"text":"בניתוח ביוכימי של סוכרים ופחמימות, מהן ההשלכות של מבנה המולקולה על אחסון אנרגיה וגליקציה?\n\n1. המולסה (דבש קנים) היא הממתיק הטבעי היחיד המכיל 100% גלוקוז חופשי ללא פרוקטוז, ולכן היא בטוחה לחולי כבד שומני.\n2. גלוקוז יוצר קשרי גליקציה (AGEs) במהירות גבוהה פי 7 מאשר פרוקטוז, ולכן הוא הגורם המרכזי להזדקנות רקמות וכלי דם.\n3. סוכרוז הוא דו-סוכר המורכב מגלוקוז וגלקטוז; הוא נחשב למזיק פחות מפרוקטוז טהור מכיוון שהגלקטוז אינו עובר מטבוליזם כבדי.\n4. גליקוגן הוא מאגר הגלוקוז העיקרי בתאי הכבד והשריר של האדם, בעוד עמילן (Starch) הוא מאגר האנרגיה המקביל בעולם הצומח.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימת בדיוק טענה אחת נכונה מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 1, 2 ו-3 נכונות."},"answer":["B"],"multi":false,"explanation":"טענה 3 שגויה (סוכרוז = גלוקוז + פרוקטוז). טענה 2 שגויה (פרוקטוז מהיר פי 7 מגלוקוז בגליקציה). טענה 1 שגויה (מולסה מכילה סוכרוז/פרוקטוז והיא מסוכנת לכבד שומני במינון גבוה). טענה 4 מדויקת (הבדל בין גליקוגן לעמילן).","slides":"","section":"A"},{"text":"מהו הערך המוסף של הביצה בהקשר של ביוטין, נוגדי חמצון וחמצון כולסטרול?\n\n1. אכילת ביצים חיות (עם החלבון הלבן) מומלצת לספורטאים כדי לשמור על רמות ביוטין גבוהות בדם המאיצות בניית שריר.\n2. כולסטרול בביצה מזיק רק כאשר הוא מתחמצן (למשל באבקת ביצים או טיגון ממושך), שכן כולסטרול מחומצן הוא הגורם המרכזי לשקיעה בעורקים.\n3. חלבון הביצה (הלבן) מכיל אבידין, הנקשר לביוטין ומונע את ספיגתו; בישול החלבון (דנטורציה) מנטרל את האבידין ומאפשר ספיגה תקינה.\n4. לוטאין וזקסנטין מחלמון הביצה נספגים ביעילות גבוהה בגלל הסביבה השומנית והיעדר הכלורופיל, והם מגנים על המקוּלה בעין ועל חלקיקי ה-LDL מחמצון.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"אף טענה מתוך סעיפים 1–4 אינה נכונה.","D":"טענות 2, 3 ו-4 נכונות."},"answer":["D"],"multi":false,"explanation":"(נכונות: 2, 3, 4). טענה 1 שגויה (אכילת חלבון ביצה חי חוסמת ספיגת ביוטין ואינה מומלצת). טענות 3, 4 ו-2 מדויקות ומייצגות את המורכבות התזונתית של הביצה.","slides":"","section":"A"},{"text":"ניתוח סופי של בריאות העצם: מהם האויבים האמיתיים ומהם התנאים לבניית עצם חזקה?\n\n1. תיאוריית ה\"אפר החומצי\" הופרכה; חלבון מן החי אינו מפרק עצם דרך שינוי pH בדם, אלא להיפך – חלבון מספק חיוני לבניית מטריצת הקולגן ומעלה IGF-1.\n2. סוכר גבוה בדם גורם לגליקציה המחלישה את סיבי הקולגן (\"עמודי הבטון\"), מה שהופך את העצם לשבירה גם אם רמת הסידן בתוכה תקינה.\n3. ויטמין K2 חיוני להפעלת חלבון האוסטאוקלצין, המנתב את הסידן מהדם אל תוך העצמות ומונע את שקיעתו בדפנות העורקים.\n4. צריכת נתרן גבוהה (מלח) מאלצת את הכליות להפריש סידן יחד עם הנתרן העודף, מה שמהווה גורם סיכון מרכזי לאיבוד סידן בשתן.","options":{"A":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"בין סעיפים 1–4 קיימות בדיוק 2 טענות נכונות.","D":"אף טענה מתוך סעיפים 1–4 אינה נכונה."},"answer":["A"],"multi":false,"explanation":"כל 4 הטענות נכונות ומסכמות את המהפכה המדעית בבריאות העצם (הפרכת האפר החומצי, השפעת הנתרן, גליקציה של קולגן ותפקיד ויטמין K2).","slides":"","section":"A"}],"presets":[30,50,70],"final":true},{"id":"tf1","title":"ביצים וכולסטרול","questions":[{"n":5,"text":"חלמון הביצה מהווה מקור תזונתי עשיר ומרוכז יותר בחלבון ל-100 גרם מאשר חלבון הביצה (הלבן)., בנוסף הצהוב של הביצה מכיל נוגדי חמצון ממשפחת, הקרוטנואידים כגון לוטאין, וזקסנטין התורמים לבריאות העין. למרות שבעלים ירוקים יש כמות גדולה הרבה יותר של לוטאין בהשוואה, לביצה הזמינות הביולוגית של הלוטאין מהביצה גבוהה משמעותית. הדבר נובע בין היתר מכך שבעלים הירוקים קיים חומר הנקרא, כלורופיל אשר הוכח מחקרית כמעכב ספיגה של קרוטנואידים אלו במערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"ההיגד נכון לחלוטין — כל הפרטים מדויקים.","section":"A","slides":""},{"n":12,"text":"למרות הדעה, הרווחת חלמון הביצה (החלק הצהוב) מכיל ריכוז גבוה יותר של חלבון ל-100 גרם בהשוואה לחלבון הביצה (החלק הלבן.) כל הכולסטרול והשומן המצויים בביצה מרוכזים אך ורק, בחלמון בעוד שהחלבון הלבן נטול שומן לחלוטין. החלמון מהווה את אחד המקורות העשירים ביותר בטבע, לכולין מולקולה החיונית לבריאות המוח ולמניעת הצטברות שומן בכבד. כדי לאפשר ספיגה יעילה של ויטמין הביוטין המצוי, בחלמון חובה לחמם היטב את, הביצה תהליך ההורס את חלבון האבידין שמצוי בלבן ומונע את ספיגת הביוטין במעי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":29,"text":"הביצה מהווה מקור מצוין לחלבון מלא ולשומנים, איכותיים והיא מתאימה מאוד לשילוב בתזונה קטוגנית בשל תכולת השומן הגבוהה שבה. חלבון הביצה (החלק הלבן) מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה לחלמון, הצהוב ולכן הוא נחשב לחלק המזין ביותר בביצה. כדי לספוג את נוגדי החמצון (כגון לוטאין) ואת ויטמין הביוטין בצורה היעילה והמלאה, ביותר חובה לשתות את הביצה כשהיא חיה וללא שום תהליך של בישול או חימום., בפועל חימום הביצה עושה דנטורציה לחלבון בשם ''אבידין המצוי בלבן של, הביצה ובכך משחרר את הביוטין (ויטמין B7) ומאפשר את ספיגתו במעי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. החלמון (הצהוב) מכיל ריכוז גבוה יותר של חלבון ל-100 גרם -(כ17%) בהשוואה לחלבון הלבן -(כ10%.) 2. חובה לחמם ולבשל את הביצה כדי להרוס את חלבון האבידין ולשחרר את הביוטין, לספיגה שתיית ביצה חיה תמנע את ספיגתו.","section":"A","slides":""},{"n":37,"text":"הביצה מהווה מקור תזונתי עשיר המספק חלבון מלא ושומנים, איכותיים כאשר כל השומן וכל הכולסטרול שבביצה מרוכזים בלעדית בחלמון (החלק הצהוב.) החלמון מכיל נוגדי חמצון חשובים כדוגמת לוטאין, וזקסנטין אשר זמינותם הביולוגית ממנו גבוהה במיוחד משום שאין בהם כלורופיל המעכב את, ספיגתם בניגוד למקורות צמחיים כמו עלים ירוקים. כדי ליהנות מוויטמין הביוטין (B7) המצוי בחלמון, במלואו חובה לשתות את הביצה חיה לחלוטין וללא שום, חימום שכן החום הורס את הביוטין והופך אותו לבלתי זמין., בנוסף חלמון הביצה עשיר במולקולת, כולין המסייעת במניעת כבד שומני ומהווה אבן בניין חיונית ליצירת המוליך העצבי כולין-אצטיל במוח.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: חובה דווקא לחמם/לבשל את הביצה כדי לבטל את השפעת חלבון האבידין, שבחלבון ובכך לאפשר לביוטין להיספג (שתיית ביצה חיה מונעת את ספיגתו.)","section":"A","slides":""},{"n":46,"text":"הכולסטרול הוא מולקולה שומנית החיונית לבניית קרומי, התאים לייצור הורמוני, מין ולתפקוד תקין של מערכת העצבים והמוח. חלקיקי ה-LDL תפקידם לשנע את הכולסטרול מהכבד אל תאי הגוף, השונים בעוד שחלקיקי ה-HDL אוספים את עודפי הכולסטרול מהתאים ומחזירים אותם לכבד לפינוי. הסכנה האמיתית למחלות לב מתרחשת כאשר חלקיקי ה-LDL בדם הם גדולים וקלים (מסוג A,) שכן הם אלו שנוטים להתחמצן ולשקוע בדפנות העורקים במהירות. גורם מרכזי נוסף שמוביל לשקיעת הכולסטרול הוא צריכה מוגברת של, סוכרים אשר יוצרים תהליך של גליקציה (סכרור) שפוגע במבנה חלקיק ה-LDL ומעודד את שקיעתו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: חלקיקי ה-LDL המסוכנים שנוטים להתחמצן ולשקוע הם דווקא החלקיקים ה קטנים והצפופים (מסוג B,) ולא הגדולים והקלים.","section":"A","slides":""},{"n":55,"text":"הכולסטרול הוא חומר שומני החיוני לבניית ממברנות התאים ולייצור, הורמונים ומרביתו מיוצר באופן טבעי בכבד האנושי. תפקידם של חלקיקי ה-LDL הוא לשנע את הכולסטרול מהכבד אל עבר רקמות, הגוף בעוד שחלקיקי ה-HDL אוספים את העודפים מהתאים ומחזירים אותם לכבד. הסכנה להיווצרות רובד טרשתי בעורקים מתרחשת כאשר חלקיקי ה-LDL הגדולים והאווריריים (מסוג A) נוטים לשקוע בדפנות כלי הדם ולהתחמצן במהירות., לעומתם חלקיקי ה-LDL הקטנים והצפופים (מסוג B) הם חלקיקים בטוחים המוגנים היטב מפני תהליכי, חמצון ולכן הם נעים בזרם הדם ללא כל סכנת שקיעה בעורקים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. החלקיקים ששוקעים ומתחמצנים בקלות הם דווקא ה-LDL ה קטנים והצפופים (מסוג B,) ולא הגדולים (מסוג A). 2. חלקיקים קטנים וצפופים (מסוג B) הם הכי פגיעים לחמצון, ומסוכנים ולא בטוחים או מוגנים.","section":"A","slides":""},{"n":69,"text":"הביצה היא מזון בעל צפיפות תזונתית, גבוהה ומרבית, הוויטמינים כל, הכולסטרול וכל תכולת השומן שלה מרוכזים אך ורק בחלמון (החלק הצהוב.) למרות, זאת חלבון הביצה (החלק הלבן) מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה, לחלמון ולכן ספורטאים רבים בוחרים לאכול רק אותו. כדי ליהנות מספיגה אופטימלית של ויטמין הביוטין (B7) המצוי, בחלמון חובה לשתות את הביצה כשהיא חיה לחלוטין וללא שום תהליך של חימום., בפועל החום של הבישול הורס את הביוטין ודווקא מחזק את הקשר הכימי שלו לחלבון, האבידין כך שספיגתו במעי הדק נמנעת לחלוטין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הריכוז הגבוה ביותר של חלבון -(ל100 גרם) נמצא דווקא ב חלמון ולא בחלבון הלבן. 2. חובה לחמם ולבשל את הביצה כדי להרוס את חלבון האבידין ולשחרר את הביוטין לספיגה (שתיית ביצה חיה תמנע את הספיגה.)","section":"A","slides":""},{"n":100,"text":"הביצה נחשבת לאחד המזונות הדחוסים ביותר מבחינה, תזונתית כאשר כל הכולסטרול וכל תכולת השומן שלה מרוכזים באופן בלעדי בחלמון (הצהוב). בנוסף, לשומנים החלמון מכיל נוגדי חמצון חשובים כדוגמת, לוטאין אשר הספיגה והזמינות הביולוגית שלהם לגוף גבוהה מאוד. למרות עושרו של, החלמון חלבון הביצה (החלק הלבן) נחשב למזין יותר מאחר והוא מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה לצהוב. כדי ליהנות מספיגה אופטימלית של ויטמין הביוטין (B7) המצוי, בחלמון ההמלצה הקלינית היא לצרוך את הביצה כשהיא חיה לחלוטין וללא, חימום שכן החום הורס את הביוטין ומונע ספיגה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ריכוז החלבון הגבוה ביותר ל-100 גרם נמצא דווקא ב חלמון (הצהוב - 17%) ולא בחלבון הלבן (10%.) 2. חובה דווקא לחמם/לבשל את הביצה כדי להרוס את חלבון האבידין שמעכב את, הביוטין ולכן אכילת ביצה חיה תמנע את ספיגת הביוטין. להלן המקבץ עשרה-אחד של ''היגדים מורכבים (101 עד 110,) הממשיך לאתגר אותך עם רזולוציות עמוקות מתוך חומרי הלימוד (שיעורים 18-29.) גם, כאן המלכודות השגויות הוטמנו בקפידה במקומות שונים לחלוטין בתוך הפסקאות. קרא בעיון ונסה לאתר אותן. התשובות וההסברים המלאים מרוכזים יחד בסוף המקבץ.","section":"A","slides":""},{"n":110,"text":"הכולסטרול הוא מולקולה שומנית חיונית ביותר לבניית קרומי, התאים לייצור הורמוני מין סטרואידיים (כגון אסטרוגן וטסטוסטרון) ולתפקוד תקין של מערכת העצבים והמוח האנושי. חלקיקי ה-LDL תפקידם המרכזי לשנע את הכולסטרול מהכבד אל עבר תאי הגוף, השונים בעוד שחלקיקי ה-HDL אוספים את עודפי הכולסטרול מהתאים ומחזירים אותם לכבד לפינוי. הסכנה להיווצרות טרשת עורקים גוברת במיוחד כאשר חלקיקי ה-LDL בדם הם, גדולים אווריריים וקלים (חלקיקים מסוג A,) שכן הם אלו שנוטים להתחמצן ולשקוע בדפנות כלי הדם במהירות ובקלות רבה. בנוסף, לכך צריכת פרוקטוז מבודד נחשבת למסוכנת לעורקים ולבריאות המטבולית מכיוון שהיא מעוררת עלייה חדה ומסיבית ביותר של הורמון האינסולין, בדם בדומה לתגובה הפיזיולוגית הנגרמת מאכילת גלוקוז טהור.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. חלקיקי ה-LDL המסוכנים שנוטים להתחמצן ולשקוע הם ה קטנים והצפופים (מסוג B,) ולא החלקיקים הגדולים (מסוג A). 2. פרוקטוז כמעט ואינו מעלה את רמות האינסולין (בשונה,)מגלוקוז אלא נשלח ישירות לעיבוד בכבד ועלול להפוך לטריגליצרידים.","section":"A","slides":""},{"n":116,"text":"הכולסטרול הוא מולקולה שומנית החיונית לבניית קרומי התאים ולייצור הורמונים, סטרואידיים ותפקידם של חלקיקי ה-LDL הוא לשנע אותו מהכבד אל עבר רקמות הגוף. חלקיקי ה-HDL, לעומת, זאת פועלים כמנגנון פינוי יעיל ואוספים את עודפי הכולסטרול מהתאים בחזרה אל הכבד. הסכנה להתפתחות טרשת עורקים עולה משמעותית דווקא כאשר חלקיקי ה-LDL בדם הם, גדולים קלים ואווריריים (מסוג A,) שכן הם אלו שנוטים לשקוע בעורקים ולהתחמצן במהירות., בנוסף חשיפת חלקיקי ה-LDL לרמות גבוהות של סוכרים בדם יוצרת תהליך הרסני הנקרא, גליקציה אשר פוגע במבנה, החלקיק מעכב את זיהויו על ידי קולטני, הכבד ומאיץ את שקיעתו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: חלקיקי ה-LDL שנוטים לשקוע ולהתחמצן במהירות הם דווקא החלקיקים ה קטנים והצפופים (מסוג B,) ולא הגדולים והאווריריים (מסוג A.)","section":"A","slides":""},{"n":128,"text":"הביצה נחשבת למזון מזין ודחוס, מאוד כאשר מרבית, הוויטמינים כל, הכולסטרול וכל השומן שבה מרוכזים אך ורק בחלמון (הצהוב). החלמון מכיל נוגדי חמצון חשובים כגון לוטאין, וזקסנטין והספיגה שלהם מהביצה אל הדם נחשבת ליעילה מאוד בהשוואה למקורות, צמחיים בין היתר משום שאין בהם כלורופיל המעכב את ספיגתם. על מנת לספוג כראוי את הוויטמין ביוטין (B7) המצוי, בחלמון חובה לחמם או לבשל את הביצה לטמפרטורה גבוהה. החימום עושה תהליך של דנטורציה לחלבון בשם ''אבידין המצוי בחלבון (הלבן) של, הביצה ובכך משחרר את הביוטין ומונע ממנו להיקשר ולהיחסם במערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":138,"text":"הביצה נחשבת לאחד המזונות הדחוסים ביותר מבחינה, תזונתית כאשר כל הכולסטרול וכל תכולת השומן שלה מרוכזים באופן בלעדי בחלמון הצהוב. למרות עושרו של, החלמון חלבון הביצה (החלק הלבן) נחשב למזין יותר מאחר והוא מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה לצהוב. בנוסף, לשומנים החלמון מכיל נוגדי חמצון חשובים כדוגמת, לוטאין אשר הספיגה והזמינות הביולוגית שלהם לגוף גבוהה מאוד. עם, זאת כדי ליהנות מספיגה אופטימלית של ויטמין הביוטין (B7) המצוי, בחלמון ההמלצה הקלינית היא לצרוך את הביצה כשהיא חיה לחלוטין וללא, חימום שכן החום הורס את הביוטין ומונע ספיגה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ריכוז החלבון הגבוה ביותר ל-100 גרם נמצא דווקא ב חלמון -(כ17%) ולא בחלבון הלבן -(כ10%.) 2. חובה לחמם ולבשל את הביצה כדי להרוס את האבידין ולשחרר את הביוטין לספיגה (אכילת ביצה חיה תמנע את ספיגתו.)","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf2","title":"לחם, גלוטן ואפייה","questions":[{"n":1,"text":"הלחם המלא מכיל את כל חלקי, הגרגר כולל הנבט, והסובין ולכן עשיר יותר במינרלים וויטמינים מאשר קמח לבן. לעומת, זאת קמח המוגדר כ-70% הוא קמח שבו 70% מנפח הגרגר המקורי, נשמר ולכן הוא דומה מאוד מבחינה תזונתית לקמח מלא. בתהליך אפיית, הלחם חשיפת העמילן וחומצת האמינו אספרגין לטמפרטורות גבוהות מעל 120 מעלות יוצרת חומר רעיל הנקרא אקרילאמיד. שימוש במחמצת כתחליף לשמרים תעשייתיים מסייע בפירוק החומצה, הפיטית מה שמשפר משמעותית את ספיגת המינרלים מהלחם אל הגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: קמח 70% דומה מבחינה תזונתית לקמח לבן (ולא לקמח,)מלא שכן הוא מכיל רק 70% מנפח הגרגר המקורי והסירו ממנו את רוב הסובין והנבט.","section":"A","slides":""},{"n":19,"text":"הגלוטן הוא חלבון המצוי בדגנים כגון, חיטה, כוסמין שיפון, ושעורה והוא זה המעניק לבצק את תכונות הגמישות והאלסטיות שלו. אצל אנשים הסובלים ממחלת, הצליאק חשיפה לכמות מזערית של גלוטן גורמת לתגובה אוטואימונית ולפגיעה חמורה בסיסי המעי הדק. התססת לחם באמצעות מחמצת שאור, טבעית שהיא תהליך איטי, וממושך מפרקת ומשנה את המבנה המרחבי של רשת הגלוטן. כתוצאה, מכך לחם מחמצת קל יותר לעיכול עבור רוב, האוכלוסייה אם כי הוא עדיין אסור לחלוטין לחולי צליאק שכן הוא עדיין מכיל גלוטן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":53,"text":"פחמימות, מורכבות כדוגמת, עמילן בנויות משרשראות ארוכות של חרוזי גלוקוז אשר מתפרקות במערכת העיכול ומעלות את רמת הסוכר בדם. צריכת גלוקוז מעוררת הפרשה משמעותית של אינסולין, מהלבלב אשר בתורו מעודד את ייצור הלפטין ותורם ליצירת תחושת שובע. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה חדה ומסיבית עוד יותר של אינסולין, ולפטין מה שהופך מאכלים עתירי פרוקטוז למשביעים הרבה יותר., בנוסף מולקולת הפרוקטוז נוטה להיקשר לחלבונים בדם בתהליך הנקרא, גליקציה ותהליך זה מתרחש בקצב איטי משמעותית ובטוח יותר לעומת הגליקציה שיוצרת מולקולת הגלוקוז.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה את האינסולין, והלפטין ולכן הוא אינו תורם לתחושת שובע מהירה. 2. תהליך הגליקציה של פרוקטוז מתרחש בקצב מהיר ואלים הרבה יותר (פי 7) מאשר זה של, גלוקוז ולא איטי יותר.","section":"A","slides":""},{"n":66,"text":"עמילן הוא פוליסכריד המשמש כמאגר האנרגיה המרכזי בעולם, הצומח והוא מורכב משרשראות ארוכות של חרוזי גלוקוז. למרות שסיבים תזונתיים כגון תאית מורכבים אף הם משרשראות של, גלוקוז מערכת העיכול האנושית אינה מסוגלת לפרק אותם משום שהמבנה המרחבי של הקשרים הכימיים ביניהם שונה מזה שבעמילן. סיבים תוססים מהווים מזון ביוטי-פרה נהדר לחיידקי המעי, הגס אשר מתסיסים אותם ומייצרים מהם חומצות שומן קצרות שרשרת התורמות לבריאות רירית המעי. שילוב סיבים מסיסים כמו פקטין בארוחה תורם להאטת קצב ריקון, הקיבה וכך מסייע במיתון העלייה החדה של הסוכר בדם וביצירת תחושת שובע ממושכת.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":67,"text":"שיטת התזונה של אן ויגמור (מכון היפוקרטס) מבוססת ברובה על מזון טבעוני חי (Raw Food,) וכוללת צריכה יומיומית של מיץ עשב, חיטה נבטים ומזונות מותססים., לעומתה תזונת הפליאו מתבססת על תזונת האדם הקדמון וכוללת אכילת, בשר דגים, וביצים תוך הימנעות מוחלטת, מדגנים קטניות ומוצרי חלב מתועשים. לפי חוקי צירופי המזון של הרברט, שלטון מותר ורצוי לשלב באותה ארוחה פחמימות מורכבות יחד עם חלבונים, מרוכזים על מנת ליצור חלבון מלא ואיכותי לבניית שריר. כמו, כן שיטת שלטון דוגלת בשתיית כמויות גדולות של מים תוך כדי הארוחה כדי לדלל את מיצי הקיבה ולהאיץ את תהליך הפירוק הכימי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת שלטון אוסרת באופן מוחלט על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה. 2. שיטת שלטון אוסרת לשתות מים בזמן הארוחה כדי לא לדלל את מיצי הקיבה ולפגוע בעיכול.","section":"A","slides":""},{"n":75,"text":"פחמימות מורכבות בנויות משרשראות ארוכות של, סוכרים-חד כאשר עמילן הוא מאגר האנרגיה העיקרי, בצומח וגליקוגן משמש כמאגר בגוף האדם. סיבים תזונתיים עשויים אף הם משרשראות של סוכרים (לרוב,)גלוקוז אולם גוף האדם חסר את האנזימים הנדרשים לפירוק הקשרים המרחביים המיוחדים שביניהם. חלק, מהסיבים המוגדרים כסיבים, תוססים מהווים מזון ביוטי-פרה עבור חיידקי המעי הגס אשר מתסיסים אותם ומייצרים מהם חומצות שומן קצרות, שרשרת כמו חומצה, בוטירית התורמות לבריאות המעי. סיב, אגרה-אגר המופק, מאצות נחשב לסיב בלתי תוסס אצל רוב אוכלוסיית, העולם והוא משמש רבות בתעשייה כחומר מסמיך בשל יכולתו לספוח כמויות גדולות של מים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":80,"text":"שיטת התזונה של אן ויגמור (מכון היפוקרטס) מבוססת באופן בלעדי על צריכת מזון חי וטבעוני (Raw Food,) וכוללת שימוש נרחב ויומיומי במיץ עשב, חיטה, נבטים ומזונות מותססים להעצמת כוח הריפוי של הגוף., מנגד שיטתו של הרברט שלטון דוגלת בכללי \"צירופי \"מזון, קפדניים מתוך תפיסה שלכל אב מזון דרישות עיכול כימיות ואנזימטיות שונות. על פי, שלטון הדרך האידיאלית להבטיח בניית מסת שריר תקינה היא דווקא על ידי שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה ממש. כמו, כן שלטון מחייב את מטופליו לשתות לפחות שתי כוסות מים קרים במהלך, הארוחה שכן המים מסייעים בדילול מיצי הקיבה ומונעים תסיסה לא רצויה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת שלטון אוסרת לחלוטין על שילוב של פחמימות מורכבות וחלבונים באותה ארוחה. 2. שלטון אוסר על שתיית מים במהלך הארוחה בדיוק כדי שלא לדלל את מיצי הקיבה ולפגוע בעיכול.","section":"A","slides":""},{"n":109,"text":"פחמימות מורכבות כדוגמת עמילן בנויות משרשראות ארוכות של מולקולות גלוקוז (המחוברות בקשרי,)אלפא אשר מתפרקות במערכת העיכול ונספגות כסוכר זמין אל זרם הדם. סיבים תזונתיים מורכבים גם הם משרשראות של סוכרים (לרוב גלוקוז בקשרי,)בטא אולם גוף האדם חסר לחלוטין את האנזימים הספציפיים הנדרשים לפירוק הקשרים המרחביים הייחודיים שביניהם. סיבים, תוססים כגון, אינולין מהווים מזון ביוטי-פרה נהדר לחיידקי המעי, הגס שמתסיסים אותם ומייצרים בתמורה חומצות שומן קצרות שרשרת התורמות רבות לבריאות רירית המעי ולהפחתת דלקת. צריכת סיבים מסיסים, במים כמו פקטין המצוי בקליפות, תפוחים תורמת להאטת קצב ריקון, הקיבה ובכך מסייעת במיתון העלייה החדה של הסוכר בדם לאחר הארוחה ויוצרת תחושת שובע.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":127,"text":"שיטת התזונה של אן, ויגמור המיושמת במכון, היפוקרטס מבוססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food,) וכוללת שימוש יומיומי במיץ עשב, חיטה נבטים ומזונות מותססים (כגון כרוב כבוש.), מנגד שיטת שלטון מבוססת על עקרונות נוקשים של צירופי, מזון מתוך הנחה שכל אב מזון דורש סביבת חומציות ואנזימי עיכול שונים. על פי, שלטון הדרך הטובה ביותר לספוג חלבון היא לשלב פחמימות מורכבות יחד עם חלבונים מרוכזים באותה ארוחה, ממש כדי להשלים חומצות אמינו., בנוסף השיטה של ויגמור נעזרת גם בטכניקות של ניקוי רעלים עמוקות כמו צומות מים ממושכים ללא הגבלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת שלטון אוסרת באופן מוחלט על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה. 2. שיטת אן ויגמור (היפוקרטס) לא מאמינה בצומות מים אלא בהזנה אינטנסיבית של מיצים ונבטים חיים.","section":"A","slides":""},{"n":132,"text":"הגלוטן הוא חלבון המצוי בדגנים כגון, חיטה, כוסמין שיפון, ושעורה והוא זה המעניק לבצק את תכונות הגמישות והאלסטיות הנדרשות לאפייה. אצל חולי, צליאק חשיפה לכמות מזערית של גלוטן מעוררת תגובה אוטואימונית הגורמת לפגיעה חמורה בסיסי המעי הדק. לחם כוסמין נחשב לבריא ומומלץ, במיוחד משום שכוסמין הוא דגן נטול גלוטן לחלוטין ולכן מאפיו בטוחים לחלוטין לאכילה עבור חולי צליאק. בנוסף, לכך קליית פרוסות הלחם בטוסטר עד להשחמה יוצרת חומר בשם, אקרילאמיד אשר הוכח במחקרים כנוגד חמצון עוצמתי המגן על הגוף מפני התפתחות תאים סרטניים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. חיטת כוסמין מכילה גלוטן לכל דבר ועניין ולכן מאפיה אסורים לחלוטין על חולי צליאק. 2. אקרילאמיד (הנוצר בהשחמת לחם) אינו נוגד חמצון אלא חומר רעיל ומסרטן.","section":"A","slides":""},{"n":150,"text":"שיטת התזונה שפיתחה אן ויגמור (מכון היפוקרטס) מבוססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food,) וכוללת שימוש אינטנסיבי במיץ עשב, חיטה נבטים ומזונות מותססים לשיקום הגוף. במסגרת השהות, במכון כדי להעניק למטופלים תחושת שובע, ונחמה מקפידים להגיש להם מדי יום ארוחת צהריים חמה הכוללת מרק קטניות עשיר., בנוסף הגישה שמה דגש על צריכת זרעים ודגנים תוך התמודדות עם חומרים מעכבי ספיגה כדוגמת החומצה הפיטית המצויה בהם. הדרך היעילה והמהירה ביותר לנטרל ולהשמיד לחלוטין את החומצה הפיטית מן הצומח היא באמצעות בישול ממושך בחום גבוה, מאוד המפרק את הקשרים הכימיים שלה באופן סופי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מבוססת על Raw Food טבעוני (100%,)חי ולכן אין בה שום ארוחה חמה כגון מרק מבושל. 2. חום גבוה ובישול אינם מנטרלים ביעילות חומצה פיטית (נדרשים תהליכי, התססה הנבטה או השריה)ממושכת.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf3","title":"סויה ופיטואסטרוגנים","questions":[{"n":4,"text":"צריכת סויה בקרב נשים מבוגרות מסוכנת מכיוון שהיא מעודדת את שגשוגם של תאי סרטן השד דרך קשירה לרצפטורים מסוג אלפא. הסויה מכילה פיטואסטרוגנים ממשפחת, האיזופלבונים בעלי מבנה מרחבי הדומה לאסטרוגן האנושי. במחקרים בבני אדם נמצא כי חלבון הסויה בטוח לחלוטין ויכול אפילו לספק הגנה מסוימת מפני סרטן השד והערמונית. עם, זאת נשים המחלימות מסרטן שחלות מסוג גרנולוזה חייבות להרבות בצריכת, סויה שכן גידולים אלו מבטאים רצפטורי אלפא שמגיבים באופן חיובי לפיטואסטרוגנים אלו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. סויה אינה מעודדת שגשוג סרטן שד בבני אדם אלא נקשרת לרצפטורי אלפא וחוסמת אותם כאפקט מגן. 2. נשים המחלימות מסרטן שחלות מסוג גרנולוזה חייבות להימנע מסויה (ולא להרבות,)בה שכן יש שם רצפטורי בטא שהסויה מפעילה.","section":"A","slides":""},{"n":13,"text":"פולי הסויה מכילים ריכוז גבוה של פיטואסטרוגנים ממשפחת, האיזופלבונים אשר מתפקדים בגוף כמולקולות סלקטיביות (SERMs.) ברקמת השד האנושית ישנה דומיננטיות של רצפטורים מסוג, אלפא והפיטואסטרוגנים בסויה נקשרים אליהם ומפעילים אותם, בחוזקה מה שמאיץ את חלוקת התאים. עבור נשים המחלימות מסרטן שחלות מסוג, גרנולוזה צריכת סויה מומלצת במיוחד כדי להגן על השחלות מפני הישנות המחלה. עם, זאת חשוב להקפיד ולצרוך אך ורק מוצרי סויה אורגניים או כאלו הנושאים חותמת Non-GMO, כדי להימנע מחשיפה לריסוס רעיל של קוטל העשבים גלייפוסט.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הפיטואסטרוגנים בסויה אינם מפעילים את רצפטורי האלפא, בשד אלא לרוב חוסמים אותם (אפקט מגן.) 2. צריכת סויה אסורה לחלוטין (ולא מומלצת) לנשים המחלימות מסרטן שחלות מסוג, גרנולוזה כי הסויה מפעילה רצפטורי בטא המצויים שם.","section":"A","slides":""},{"n":35,"text":"האיזופלבונים המצויים בפולי סויה משמשים, כפיטואסטרוגנים שהן מולקולות בעלות מבנה מרחבי הדומה מאוד להורמון האסטרוגן האנושי. מולקולות אלו פועלות בגוף כסרמים (SERMs,) כלומר מודולטורים סלקטיביים של קולטני, אסטרוגן היכולים להפעיל או לחסום את הקולטן בהתאם לסוג הרקמה. ברקמת, השד בה יש דומיננטיות של קולטני אסטרוגן מסוג, אלפא הפיטואסטרוגנים של הסויה לרוב חוסמים את הקולטן ובכך מספקים אפקט מגן מפני שגשוג תאים סרטניים. עם, זאת במקרה הנדיר של גידול שחלתי מסוג גרנולוזה (המאופיין בריבוי קולטני,)בטא הפיטואסטרוגנים מפעילים את הקולטנים ועלולים לעודד את שגשוג, הגידול ולכן במצב זה חובה להימנע מסויה לחלוטין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":70,"text":"פולי הסויה נחשבים למקור חלבון צמחי, מלא והם עשירים בפיטואסטרוגנים ממשפחת האיזופלבונים (כגון ג'ניסטאין ודיידזאין.) המבנה המרחבי של הפיטואסטרוגנים הללו דומה מאוד לאסטרוגן, האנושי ולכן הם מסוגלים לפעול בגוף כמודולטורים סלקטיביים (SERMs) היכולים להפעיל או לחסום את קולטני האסטרוגן בהתאם לרקמה. בבני, אדם צריכת סויה מעודדת שגשוג מהיר ואגרסיבי של תאי סרטן, השד מכיוון שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא ברקמת השד. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג גרנולוזה מומלץ להרבות בצריכת, סויה משום שהיא חוסמת את רצפטורי הבטא בשחלה ומגינה מפני חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. בבני, אדם הסויה דווקא חוסמת את רצפטורי האלפא בשד ומהווה אפקט מגן (ולא מעודדת סרטן שד.) 2. במקרה של סרטן מסוג, גרנולוזה הסויה מפעילה את רצפטורי הבטא ולכן חובה להימנע ממנה לחלוטין.","section":"A","slides":""},{"n":73,"text":"פולי הסויה מהווים מקור צמחי מעולה לחלבון מלא והם עשירים בפיטואסטרוגנים ממשפחת, האיזופלבונים כגון ג'ניסטאין ודיידזאין. מולקולות אלו פועלות בגוף כמודולטורים סלקטיביים (SERMs,) כלומר ביכולתן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה. ברקמת השד האנושית ישנה דומיננטיות ברורה של רצפטורים מסוג, אלפא והפיטואסטרוגנים של הסויה נקשרים אל
