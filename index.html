wer":["N"],"multi":false,"explanation":"פרוקטוז אכן נמצא בכל הפירות ומקורותיו כוללים גם ירקות שורש, דבש, אגבה ומולסה (בניגוד לקביעות השגויות שפוסלות ירקות), ובננה וענבים דווקא עשירים ביחס גבוה של פרוקטוז (לא דל, בניגוד לקביעה השגויה), ופרוקטוז כמובן אינו נמצא רק בסוכר לבן (בניגוד לקביעה השגויה). הקביעה הרלוונטית נכונה - ולכן כשילוב הקביעות המוצגות ככלל מוחלט/בלעדי, כולן שגויות במידה זו או אחרת למעט D; עם זאת לצורך שאלה זו התשובה הרשמית \"אף תשובה אינה נכונה\" מתייחסת לניסוח המוקצן של כל אחת מהאפשרויות כפי שנוסחו (רק D תואמת את המצגת במדויק). שקופית: 17 - מקורות לפרוקטוז","slides":"","section":"A"},{"n":16,"text":"אילו מהקביעות הבאות לגבי סירופ תירס עשיר בפרוקטוז (High-Fructose Corn Syrup) נכונות?","options":{"A":"הוא נוצר בתהליך אנזימטי ההופך כמחצית מהגלוקוז לפרוקטוז","B":"הוא נוסף בעיקר למשקאות קלים ולמזון מעובד","C":"הוא קשור למצבים כגון כבד שומני, סוכרת ויתר לחץ דם","D":"הוא נדיר ביותר במזון המערבי המודרני","E":"הוא זהה לחלוטין לפרוקטוז שבפירות שלמים","F":"תעשיית המזון נמנעת ממנו לחלוטין","G":"אין לו שום השפעה בריאותית מתועדת"},"answer":["A","B","C"],"multi":true,"explanation":"סירופ תירס עשיר בפרוקטוז נוצר בתהליך אנזימטי ההופך כמחצית מהגלוקוז שבתירס לפרוקטוז, נוסף למשקאות קלים ולמזון מעובד, וקשור למצבים כמו כבד שומני, סוכרת ויתר לחץ דם - בשונה מהותית מפרוקטוז הנצרך כחלק מפרי שלם עם סיביו. שקופית: 18 - High-fructose corn syrup","slides":"","section":"A"},{"n":17,"text":"אילו מהסיבות הבאות מסבירות מדוע התעשייה משתמשת בסירופ תירס עשיר בפרוקטוז ולא בסוכר לבן רגיל?","options":{"A":"עלות הייצור נמוכה משמעותית מסוכר לבן, בזכות סובסידיות לגידול תירס ומכסי מגן על ייבוא סוכר","B":"הוא שומר על לחות המזון ומאריך חיי מדף של מאפים","C":"הוא יציב מאוד במשקאות קלים וחומציים","D":"הוא יקר משמעותית יותר מסוכר לבן","E":"הוא פוגע בלחות המזון ומקצר חיי מדף","F":"הוא בלתי יציב בתנאים חומציים","G":"אין שום סיבה כלכלית לשימוש בו"},"answer":["A","B","C"],"multi":true,"explanation":"הסיבות העיקריות לשימוש בסירופ תירס עשיר בפרוקטוז הן עלות ייצור נמוכה (סובסידיות ומכסים), שמירה על לחות/הארכת חיי מדף, ויציבות במשקאות קלים וחומציים. שקופית: 19 - למה התעשייה משתמשת בסירופ תירס עשיר בפרוקטוז","slides":"","section":"A"},{"n":18,"text":"מה ההבדל המהותי בין סירופ תירס עשיר בפרוקטוז לבין פירות (מעבר לכך ששניהם מכילים גלוקוז ופרוקטוז)?","options":{"A":"בסוכר לבן/פירות הגלוקוז והפרוקטוז קשורים זה לזה ודורשים פירוק (הידרוליזה) במעי הדק, בעוד שבסירופ התירס העשיר בפרוקטוז הם כבר חופשיים ומגיעים לכבד במהירות שיא והופכים לטריגליצרידים","B":"אין שום הבדל נוסף מעבר לזה; אין הבדל בין קצב ההגעה לכבד","C":"סירופ תירס דורש פירוק ארוך יותר מפירות; הפירות מכילים פי כמה פרוקטוז מסירופ תירס","D":"פירות מכילים גלוקוז וסירופ תירס מכיל פרוקטוז בלבד; הפירות תמיד מכילים יותר פרוקטוז חופשי מסירופ התירס"},"answer":["A"],"multi":false,"explanation":"בפירות (ובסוכר לבן) הגלוקוז והפרוקטוז קשורים זה לזה ודורשים פירוק (הידרוליזה) במעי הדק - תהליך הלוקח זמן. בסירופ תירס עשיר פרוקטוז הסוכרים כבר חופשיים, ולכן הפרוקטוז מגיע לכבד במהירות שיא והופך לטריגליצרידים, מה שעלול לגרום לכבד שומני. שקופית: 20 - ההבדל בין סירופ תירס לפירות","slides":"","section":"A"},{"n":19,"text":"אילו מהקביעות הבאות לגבי חוסר ספיגה של פרוקטוז (Fructose malabsorption) נכונות?","options":{"A":"ספיגה חלקית של פרוקטוז גורמת לו לעבור למעי הגס ולהיות מותסס שם על ידי חיידקים","B":"תסיסת פרוקטוז יוצרת גז מימן, שנספג לדם ונפלט דרך הריאות","C":"מבחן נשיפה לגז מימן עשוי להעיד על בעיה בספיגת פרוקטוז","D":"תסיסת הפרוקטוז במעי הגס עלולה לגרום לתפיחות, גזים, שלשול וכאבי בטן","E":"תזונה עשירה בפרוקטוז לאורך זמן עלולה לגרום לייצור מוגבר של נשאי הספיגה בממברנה","F":"ספיגת פרוקטוז תמיד מלאה ומושלמת ואינה תלויה בכמות","G":"כל הקביעות הנ\"ל, מלבד F, נכונות"},"answer":["G"],"multi":false,"explanation":"פרוקטוז שאינו נספג במלואו במעי הדק ממשיך למעי הגס, שם הוא מותסס ויוצר גז מימן (הניתן לזיהוי במבחן נשיפה) וכן חומצות וגזים נוספים הגורמים לתפיחות, גזים, שלשול וכאבי בטן; תזונה עשירה בפרוקטוז לאורך זמן עלולה גם להגביר את ייצור נשאי הספיגה. שקופית: 21 - ספיגת הפרוקטוז - חוסר ספיגה","slides":"","section":"A"},{"n":20,"text":"אילו מהקביעות הבאות לגבי אכילת פירות אחרי הארוחה נכונות?","options":{"A":"אין מחקרים ישירים המראים נזק מאכילת פירות אחרי הארוחה","B":"למרות היעדר מחקרים, רוב שיטות התזונה בעולם הבריאות ממליצות להימנע מאכילת פירות אחרי הארוחה","C":"אכילת פרי אחרי ארוחה (עם שומן/חלבון) מובילה לעליית סוכר נמוכה יותר בהשוואה לאכילתו על בטן ריקה","D":"עבור רוב האנשים אין מניעה לאכול פרי אחרי הארוחה","E":"קקאו נחשב במצגת לקינוח לגיטימי, טוב יותר מכל קינוח אחר","F":"אכילת פרוקטוז לאחר ארוחה עלולה להגדיל את אחוז הפרוקטוז שאינו נספג במעי הדק","G":"כל הקביעות הנ\"ל נכונות"},"answer":["G"],"multi":false,"explanation":"כל הקביעות תואמות את תוכן המצגת: אין מחקרים ישירים על נזק, אך רוב הגישות התזונתיות ממליצות נגד זאת; אכילת פרי אחרי ארוחה (עם שומן/חלבון) מורידה את עליית הסוכר בהשוואה לבטן ריקה; קקאו הוגדר קינוח לגיטימי. שקופית: 22 - אכילת תוריפ אחרי ארוחה","slides":"","section":"A"},{"n":21,"text":"מהו הרציונל המדעי שהוצג להימנעות מפירות בהרעבת גידולים סרטניים (ולמה יש בו סימני שאלה)?","options":{"A":"תאים סרטניים מסוימים מבטאים כמויות גבוהות של נשא GLUT5 המאפשר להם לשאוב פרוקטוז גם כשיש \"תחרות\" על גלוקוז, ופרוקטוז אף מספק לתא הסרטני אבני בניין ל-RNA","B":"יש לכן היגיון להימנע מסוכר לבן/חום ומסירופ תירס עשיר בפרוקטוז, אך לא ברור מדוע שההגיון הזה יחול גם על פירות שלמים","C":"הרעבה אמיתית מתרחשת רק בתזונה קטוגנית","D":"אין שום מחקר שמראה קשר בין פרוקטוז לגידולים סרטניים","E":"יש עדויות לריפוי סרטן בכל סוגי התזונה, כולל תזונה עתירת פירות","F":"חלק מהגישות מתירות אכילת קמח לבן/קינואה תוך הימנעות מפירות, מה שמעורר תמיהה לגבי עקביות הרציונל","G":"כל הקביעות הנ\"ל, מלבד D, נכונות"},"answer":["G"],"multi":false,"explanation":"יש בסיס מחקרי לכך שסוגי סרטן מסוימים מנצלים פרוקטוז (דרך נשא GLUT5) הן לאנרגיה והן כאבני בניין ל-RNA, מה שמצדיק הימנעות מסוכר/סירופ מרוכזים - אך המצגת מציגה סימני שאלה לגבי הרחבת ההיגיון הזה להימנעות מפירות שלמים, בין היתר לאור עדויות לריפוי סרטן בגישות תזונתיות שונות כולל עתירות פירות, ואי-עקביות בהיתר לאכול קמוסטה/קינואה. שקופית: 27, 29 - פירות וסרטן והרציונל בהרעבת גידול מפרוקטוז","slides":"","section":"A"},{"n":22,"text":"אילו מהקביעות הבאות לגבי גלקטוז נכונות?","options":{"A":"המקור הכמעט-יחיד לגלקטוז הוא כחלק מהדו-סוכר לקטוז","B":"תאי הגוף יודעים לנצל גלקטוז ישירות כאנרגיה ללא צורך בהמרה","C":"גלקטוז נמצא על פני השטח של תאים כחלק ממערכות זיהוי (כולל סוג הדם) ומהווה מרכיב במיאלין ובגלקטוליפידים","D":"גלקטוז אינו קיים בטבע כלל","E":"גלקטוז חייב להפוך לגלוקוז כדי לשמש כאנרגיה","F":"הכבד אינו מסוגל לייצר גלקטוז מגלוקוז","G":"גלקטוז מהווה מקור אנרגיה ישיר וזמין יותר מגלוקוז"},"answer":["A","C","E"],"multi":true,"explanation":"גלקטוז מגיע בעיקר מהלקטוז, אינו יכול לשמש ישירות כאנרגיה (חייב להפוך לגלוקוז דרך הכבד), ומשמש כמרכיב על פני שטח תאים (כולל קביעת סוג דם), במיאלין ובגלקטוליפידים. שקופית: 28 - גלקטוז","slides":"","section":"A"},{"n":23,"text":"מדוע צריכת מוצרי חלב (עשירים בגלקטוז) אינה גורמת בדרך כלל לכבד שומני באותה מידה כמו עודף פרוקטוז, אך עדיין עלולה \"לתרום\" לכבד שומני?","options":{"A":"קשה מאוד להעמיס גלקטוז - נדרשות כמויות גדולות מאוד של מוצרי חלב בזמן קצר, והאדם ירגיש תופעות בטניות מעודף לקטוז הרבה לפני שהגלקטוז יגיע לכבד; אך מוצרי חלב מעלים אינסולין, וזה \"מורה\" לכבד לאגור שומן","B":"גלקטוז אינו נספג כלל לדם; מוצרי חלב אינם מעלים אינסולין בכלל","C":"הכבד אינו מסוגל להפוך גלקטוז לגלוקוז; אין קשר בין אינסולין לאגירת שומן בכבד","D":"גלקטוז זהה בהשפעתו לפרוקטוז חופשי מסירופ תירס; עודף גלקטוז תמיד גורם לכבד שומני חמור יותר מפרוקטוז"},"answer":["A"],"multi":false,"explanation":"קשה להעמיס גלקטוז בכמות שתזיק (וגם יגרמו תופעות בטניות קודם), אך מוצרי חלב עדיין יכולים \"לתרום\" ליצירת כבד שומני משום שהם מעלים אינסולין, וזה \"מורה\" לכבד לאגור שומן. שקופית: 29 - גלקטוז - חידון מהיר","slides":"","section":"A"},{"n":24,"text":"מה ההרכב של שלושת הדו-סוכרים המרכזיים לפי המצגת?","options":{"A":"סוכרוז = גלוקוז + פרוקטוז; לקטוז = גלוקוז + גלקטוז; מלטוז = גלוקוז + גלוקוז","B":"סוכרוז = גלוקוז + גלוקוז; לקטוז = גלוקוז + פרוקטוז; מלטוז = גלוקוז + גלקטוז","C":"כל שלושת הדו-סוכרים מורכבים מגלוקוז בלבד","D":"סוכרוז = פרוקטוז + גלקטוז","E":"לקטוז = פרוקטוז + פרוקטוז","F":"מלטוז = גלקטוז + גלקטוז","G":"אין דו-סוכרים המכילים גלוקוז"},"answer":["A"],"multi":false,"explanation":"סוכרוז מורכב מגלוקוז ופרוקטוז, לקטוז מגלוקוז וגלקטוז, ומלטוז משתי מולקולות גלוקוז. שקופית: 22-27 - דו-סוכרים / סוכרוז","slides":"","section":"A"},{"n":25,"text":"אילו מהקביעות הבאות לגבי סוכרוז ובריאות השן נכונות?","options":{"A":"עששת נגרמת מהפיכת סוכר לחומצה לקטית על ידי חיידקים - זו החומצה שפוגעת באמייל השן, לא הסוכר עצמו","B":"סוכרוז גורם לעששת יותר מכל שאר סוגי הסוכרים","C":"חיידקי סטרפטוקוקוס מוטנס מייצרים מסוכרוז חומר דביק (גלוקן) המאפשר להם להידבק לשן וליצור פלאק","D":"הסוכר הגורם הכי פחות נזק לשיניים הוא לקטוז","E":"מרקם המזון (דביק/גמיש לעומת נוזלי) אינו משפיע על מידת הנזק לשיניים","F":"עמילן אינו יכול לגרום נזק לשיניים בשום מצב","G":"קרמל נוצר מחימום סוכרוז לטמפרטורה גבוהה, בה הגלוקוז והפרוקטוז מתפרקים ונוצרות מולקולות חדשות"},"answer":["A","B","C","D","G"],"multi":true,"explanation":"החומצה הלקטית (תוצר פירוק חיידקי של הסוכר) היא הפוגעת באמייל; סוכרוז גורם לעששת יותר מכל שאר הסוכרים, בעיקר דרך יצירת גלוקן דביק על ידי חיידקי סטרפטוקוקוס מוטנס; לקטוז הוא הפחות מזיק לשיניים; מרקם המזון (דביק וגמיש) כן משפיע ומגביר נזק; ועמילן יכול לגרום נזק אם הוא נדבק לשיניים לזמן ארוך; קרמל נוצר מחימום סוכרוז לטמפרטורה גבוהה. שקופית: 32-35 - סוכרוז ובריאות השן וקרמל","slides":"","section":"A"},{"n":26,"text":"מהי ההגדרה של תהליך \"הידרוליזה\" בהקשר לפירוק סוכרוז?","options":{"A":"פירוק מולקולה לשני חלקים תוך כדי תגובה עם מים (H2O) - חלק אחד הולך לגלוקוז וחלק לפרוקטוז","B":"חימום סוכרוז ללא מים; תהליך שמתרחש אך ורק בכבד","C":"הפיכת סוכרוז לחומצה לקטית; תהליך היוצר גלקטוז מסוכרוז","D":"תהליך המתרחש אך ורק במעי הגס; תהליך פירוק ללא מעורבות אנזימים כלל"},"answer":["A"],"multi":false,"explanation":"הידרוליזה היא פירוק מולקולת סוכרוז לשני חלקים (גלוקוז ופרוקטוז) תוך כדי תגובה עם מים; חומצת הקיבה מתחילה את התהליך, אך רובו מתבצע במעי הדק בעזרת אנזים הסוכראז, הפועל מהר מאוד. שקופית: 31 - סוכרוז - הידרוליזה","slides":"","section":"A"},{"n":27,"text":"אילו מהקביעות הבאות לגבי לקטוז נכונות?","options":{"A":"לקטוז מורכב מגלוקוז וגלקטוז והוא המקור לגלקטוז עבור תינוקות","B":"רק האנזים לקטאז יודע לפרק את הקשר בין גלוקוז לגלקטוז בלקטוז","C":"לקטוז מסייע לספיגת סידן, מגנזיום ואבץ במעי, מה שהופך את החלב למקור יעיל לבניית עצמות","D":"לקטוז קיים בשפע בממלכת הצומח","E":"חלב לעולם אינו מכיל כמות סוכר משמעותית","F":"לקטוז מתוק יותר מסוכרוז ביחס שווה","G":"אין קשר בין לקטוז לספיגת מינרלים"},"answer":["A","B","C"],"multi":true,"explanation":"לקטוז מורכב מגלוקוז וגלקטוז, הוא המקור לגלקטוז עבור תינוקות, רק האנזים לקטאז מפרק אותו, והוא מסייע לספיגת סידן/מגנזיום/אבץ - מה שהופך את החלב למקור יעיל לבניית עצמות. בטבע לקטוז קיים רק ביונקים (לא בשפע בצומח), ולמרות תכולת סוכר גבוהה החלב אינו מתוק כמו כוס מיץ פירות בעל אותה כמות סוכר. שקופית: 35 - לקטוז","slides":"","section":"A"},{"n":28,"text":"אילו מהקביעות הבאות לגבי אי-סבילות ללקטוז נכונות?","options":{"A":"אחרי סיום ההיניקה, אין צורך לייצר לקטאז אלא אם האדם ממשיך לצרוך מוצרי חלב","B":"באירופה האנזים מיוצר לכל החיים אצל רוב האוכלוסייה, בעוד שבמזרח אסיה רבים אינם סבילים ללקטוז","C":"חלק מהאנשים הלא-סבילים ללקטוז יכולים לאכול גבינות קשות, כי רוב הלקטוז יוצא עם מי הגבינה","D":"יוגורט קל יותר לעיכול עבור לא-סבילים ללקטוז, כי חיידקים פרוביוטיים כבר פירקו חלק מהלקטוז לחומצה לקטית","E":"אי-סבילות ללקטוז היא מצב אחיד וזהה אצל כל האנשים ברחבי העולם","F":"אי-סבילות ללקטוז אינה קשורה כלל לכמות מוצרי החלב הנצרכת","G":"כמות האנזים הלקטאז קבועה מלידה ואינה משתנה לעולם"},"answer":["A","B","C","D"],"multi":true,"explanation":"לאחר ההיניקה אין צורך פיזיולוגי בייצור לקטאז ללא המשך צריכת חלב; יש הבדל אזורי/עממי משמעותי (אירופה מול מזרח אסיה); גבינות קשות מכילות פחות לקטוז כי הוא יוצא עם מי הגבינה; ויוגורט קל יותר לעיכול הודות לפירוק חלקי של הלקטוז על ידי חיידקים פרוביוטיים. אי-סבילות ללקטוז היא ספקטרום, לא מצב אחיד. שקופית: 36 - אי-סבילות ללקטוז","slides":"","section":"A"},{"n":29,"text":"אילו מהקביעות הבאות לגבי מלטוז ומעכבי מלטאז נכונות?","options":{"A":"מלטוז מורכב משתי מולקולות גלוקוז, ומקורו הפנימי הוא פירוק עמילן בגוף, והחיצוני - זרעי דגנים מונבטים","B":"האנזים המפרק מלטוז נקרא מלטאז","C":"הירקות והעלים מכילים חומרים המעכבים מלטאז, כגון לוטאולין וקוורצטין","D":"קינמון (ציילוני) פועל בין היתר על ידי עיכוב מלטאז, חיקוי פעולת אינסולין, והאטת ריקון הקיבה","E":"מומלץ להוסיף קינמון עם הארוחה העמילנית ולא לאחריה","F":"לחם ובירה מרגישים \"עמילניים\" ולא מתוקים, למרות שהם מזרימים הרבה סוכר למחזור הדם","G":"כל הקביעות הנ\"ל נכונות"},"answer":["G"],"multi":false,"explanation":"מלטוז (שני גלוקוזים) נוצר מפירוק עמילן פנימי או מדגנים מונבטים חיצוניים ומפורק על ידי מלטאז; ירקות ועלים מכילים מעכבי מלטאז שונים (לוטאולין, קוורצטין ועוד), וקינמון ציילוני פועל במספר מנגנונים (עיכוב מלטאז, חיקוי אינסולין, האטת ריקון קיבה) ומומלץ להוספה יחד עם הארוחה העמילנית. שקופית: 37-39 - מלטוז, מעכבי מלטאז וקינמון","slides":"","section":"A"},{"n":30,"text":"אילו מהקביעות הבאות בהשוואת הממתיקים הטבעיים (דבש, סילאן, מולסה, אגבה, סירופ מייפל) נכונות?","options":{"A":"לאגבה יש את האינדקס הגליקמי הנמוך ביותר מכל הממתיקים, כי היא מכילה בעיקר פרוקטוז חופשי - אך היא נחשבת המסוכנת ביותר בזכות ריכוז הפרוקטוז הגבוה, היעדר סיבים ומינרלים/ויטמינים כמעט אפסיים","B":"המולסה הכהה (Blackstrap) מכילה את הפעילות האנטי-אוקסידנטית הגבוהה ביותר מבין הממתיקים המבוססים על סוכר, ואת ריכוז המינרלים הגבוה ביותר","C":"סילאן (תמרים) מכיל גלוקוז ופרוקטוז חופשיים כבר בתמר עצמו לפני הבישול, בזכות אנזים הסוכראז הפעיל בתמר","D":"אף אחד מהממתיקים הטבעיים המרוכזים אינו מכיל סיבים תזונתיים משמעותיים","E":"סירופ מייפל עשיר יחסית במנגן, המשמש כקו-פקטור לאנזימים ולבניית עצמות ורקמות חיבור","F":"דבש מעלה סוכרים בדם בקלות רבה יותר מסוכר לבן, כי הגלוקוז והפרוקטוז שבו כבר חופשיים (בעקבות פירוק אנזימטי בקיבת הדבורה)","G":"כל הקביעות הנ\"ל נכונות"},"answer":["G"],"multi":false,"explanation":"כל הקביעות תואמות את השוואת הממתיקים הטבעיים במצגת: אגבה - GI נמוך אך המסוכנת ביותר; מולסה כהה - הכי עשירה במינרלים ובנוגדי חמצון; סילאן - סוכרים חופשיים כבר בתמר עצמו; אף אחד מהם אינו מכיל סיבים משמעותיים (למעט התמר השלם עצמו, בניגוד לסילאן המופק ממנו); סירופ מייפל עשיר במנגן; ודבש מעלה סוכר בקלות רבה בזכות סוכרים חופשיים. שקופית: 30-41 - ממתיקים טבעיים (דבש, סילאן, מולסה, אגבה, סירופ מייפל)","slides":"","section":"A"},{"n":26,"text":"מהו האינדקס הגליקמי, לפי הגדרתו המקורית?","options":{"A":"מדד שפיתח ד\"ר ג'נקינס מאוניברסיטת טורונטו, המודד את עליית רמת הגלוקוז בדם שעות מסוימות לאחר אכילת מזון מסוים, בהשוואה לגלוקוז או ללחם לבן","B":"מדד לרמת הנתרן במזון; מדד לכמות החלבון במזון","C":"מדד לכמות הקלוריות במזון; מדד לרמת השומן הרווי במזון","D":"מדד שאינו קשור כלל לרמת סוכר בדם; מדד שפותח על ידי ארגון הבריאות העולמי בלבד"},"answer":["A"],"multi":false,"explanation":"האינדקס הגליקמי פותח על ידי ד\"ר ג'נקינס מאוניברסיטת טורונטו, ומודד את עליית רמת הגלוקוז בדם מספר שעות לאחר אכילת מזון מסוים, בהשוואה לגלוקוז טהור או ללחם לבן (שערכו מוגדר כ-100). שקופית: 25 - הגדרת האינדקס הגליקמי","slides":"","section":"A"},{"n":27,"text":"אילו מהגורמים הבאים משפיעים על התגובה הגליקמית, לפי המצגת?","options":{"A":"מידת עיבוד המזון (מזון גולמי לעומת מזון מעובד)","B":"סוג וכמות העמילופקטין בעמילן","C":"צבע האריזה של המזון","D":"חלבון ושומן במזון מפחיתים את הערך הגליקמי","E":"חוזק הכוח בו לועסים את המזון בלבד","F":"חומץ ואלכוהול בתבשיל מעלים את הערך הגליקמי","G":"מידת הבשלת הפרי אינה משפיעה כלל"},"answer":["A","B","D"],"multi":true,"explanation":"הגורמים המשפיעים על התגובה הגליקמית כוללים מידת עיבוד המזון, סוג וכמות העמילופקטין, וכן חלבון ושומן במזון (המפחיתים את הערך הגליקמי) - בניגוד לקביעה השגויה שם חומץ ואלכוהול דווקא מורידים (ולא מעלים) ערך גליקמי, ובניגוד לקביעה השגויה שכן משפיעה מידת הבשלת הפרי. שקופית: 26 - מה משפיע על התגובה הגליקמית","slides":"","section":"A"},{"n":28,"text":"אילו מהקביעות הבאות לגבי סיבים והאינדקס הגליקמי נכונות?","options":{"A":"השפעת הסיבים על האינדקס הגליקמי תלויה - היא משתנה בהתאם לאופן הכנת המזון","B":"פריכיות אורז מלא נמצאות בעלות אינדקס גליקמי גבוה מאוד למרות שיש בהן סיבים","C":"מזון מותפח כמו פופקורן דומה בהתנהגותו לפריכיות אורז מלא","D":"פסטה מקמח מלא - תלוי במידת הבישול (Al Dente לעומת Well Done)","E":"טחינת הגרגיר לקמח כלל אינה משפיעה על ההשפעה של הסיבים על הערך הגליקמי","F":"סיבים תמיד מורידים את הערך הגליקמי ללא יוצא מן הכלל","G":"אין שום קשר בין אופן הכנת המזון לערך הגליקמי"},"answer":["A","B","C","D"],"multi":true,"explanation":"השפעת הסיבים על האינדקס הגליקמי תלויה מאוד באופן הכנת המזון - פריכיות אורז מלא (ומזון מותפח כמו פופקורן) הן בעלות אינדקס גליקמי גבוה מאוד למרות תכולת הסיבים; פסטה מקמח מלא תלויה במידת הבישול; וטחינת הגרגיר לקמח כן פוגעת משמעותית בהשפעת הסיבים על הערך הגליקמי (בניגוד לקביעה השגויה). שקופית: 27 - האם סיבים משפיעים על האינדקס הגליקמי","slides":"","section":"A"},{"n":29,"text":"מהו האינדקס העומס הגליקמי (Glycemic Load), וכיצד הוא מחושב?","options":{"A":"הערך הגליקמי בלבד, ללא כל שקלול נוסף","B":"שקלול הערך הגליקמי עם הכמות שנאכלה בפועל: הערך הגליקמי מחולק ב-100 וכפול בכמות הפחמימות שנאכלה","C":"מדד המתעלם לחלוטין מכמות הפחמימות שנאכלה","D":"מדד המבוסס אך ורק על כמות הקלוריות","E":"עומס גליקמי של כ-10 ומטה נחשב נמוך","F":"עומס גליקמי של 20 ומעלה נחשב גבוה","G":"עומס גליקמי אמצעי הוא סביב 20"},"answer":["B","E","F","G"],"multi":true,"explanation":"העומס הגליקמי שוקלל את הערך הגליקמי עם כמות הפחמימות שנאכלה בפועל (ערך גליקמי חלקי 100, כפול כמות הפחמימות שנאכלה); עומס גליקמי של כ-10 נחשב נמוך, סביב 20 בינוני, ו-20 ומעלה גבוה. פתרון זה נועד לתקן בעיה מבנית באינדקס הגליקמי - כמות גדולה של מזון בעל ערך גליקמי נמוך עדיין יכולה לגרום לעלייה חדה בסוכר הדם. שקופית: 29 - האינדקס העומס הגליקמי","slides":"","section":"A"},{"n":30,"text":"אילו מהקביעות הבאות לגבי מגבלות נוספות של מדדי הסוכר (עומס גליקמי, אינדקס אינסולין ו-DayTwo) נכונות?","options":{"A":"יש מזונות בעלי ערך גליקמי נמוך שבכל זאת מעלים משמעותית אינסולין - ולכן פותח \"אינדקס האינסולין\"","B":"DayTwo מתאים המלצות מזון לפי בדיקת פלורת המעיים, אך פלורת המעיים דינמית ומשתנה בהתאם לתזונה, תרופות, סטרס ועוד","C":"ההמלצות של DayTwo תמיד תואמות אכילה בריאה","D":"עומס גליקמי ותגובה גליקמית משתנים גם אצל אותו אדם עצמו בזמנים שונים","E":"מה שנאכל בלילה משפיע משמעותית על העומס הגליקמי של ארוחת הבוקר למחרת","F":"אופן הבישול (חום נמוך לזמן ארוך מול חום גבוה לזמן קצר) משפיע משמעותית על הערך הגליקמי","G":"כמות השומן בארוחה אינה משפיעה כלל על העומס הגליקמי"},"answer":["A","B","D","E","F"],"multi":true,"explanation":"רוב הקביעות נכונות בפועל: אינדקס האינסולין פותח כי יש מזונות בעלי GI נמוך שמעלים אינסולין; DayTwo מתבסס על פלורת מעיים דינמית שאינה תמיד תואמת אכילה בריאה (ולכן קביעה זו שגויה); עומס גליקמי משתנה מאדם לאדם וגם אצל אותו אדם; ארוחת לילה משפיעה על עומס בוקר; ואופן הבישול וכמות השומן משפיעים משמעותית על העומס הגליקמי (ולכן קביעה זו שגויה). שקופית: 30-31 - מגבלות המודלים - אינדקס אינסולין ו-DayTwo","slides":"","section":"A"},{"n":1,"text":"מטופל סוכרתי שותה משקאות קלים ממותקים בסירופ תירס עשיר בפרוקטוז ומדווח על עלייה במשקל ובעיות בכבד. מהו ההסבר הפיזיולוגי המתאים ביותר?","options":{"A":"הפרוקטוז החופשי בסירופ מגיע לכבד במהירות שיא והופך לטריגליצרידים, מה שעלול לגרום לכבד שומני ולעמידות לאינסולין","B":"הבעיה נובעת מגלוטן שבמשקה; משקאות קלים אינם קשורים לתפקוד הכבד","C":"הסירופ מעלה בעיקר גלקטוז ולא פרוקטוז; הסירופ מכיל אך ורק גלוקוז שאינו קשור כלל לכבד שומני","D":"פרוקטוז מהמשקה תמיד נספג באיטיות בזכות סיבים תזונתיים; אין שום הבדל בין שתיית משקה ממותק בסירופ תירס לאכילת פרי שלם"},"answer":["A"],"multi":false,"explanation":"בסירופ תירס עשיר בפרוקטוז, בניגוד לפרי שלם, הגלוקוז והפרוקטוז חופשיים וללא סיבים, כך שהפרוקטוז מגיע לכבד במהירות שיא והופך לטריגליצרידים - מה שעלול לגרום לכבד שומני ולמעגל של עמידות לאינסולין. שקופית: 18-20 - סירופ תירס עשיר בפרוקטוז וכבד שומני","slides":"","section":"B"},{"n":2,"text":"מטופלת מדווחת על נפיחות, גזים וכאבי בטן לאחר אכילת כמות גדולה של תפוחים ואגסים על בטן ריקה. מהו ההסבר הסביר ביותר?","options":{"A":"מדובר בספיגה חלקית של הפרוקטוז במעי הדק, כך שחלקו עובר למעי הגס ועובר שם תסיסה חיידקית היוצרת גזים וכאבי בטן","B":"הבעיה נובעת מעודף גלקטוז; מדובר תמיד באלרגיה לגלוטן","C":"אין קשר בין פרי לתסמינים אלו; מדובר בהכרח בזיהום חיידקי במזון","D":"תפוחים ואגסים אינם מכילים פרוקטוז כלל; הסימפטומים נובעים מעודף חלבון בתפוחים"},"answer":["A"],"multi":false,"explanation":"ספיגת הפרוקטוז במעי הדק אינה מלאה; פרוקטוז שאינו נספג עובר למעי הגס ומותסס שם על ידי חיידקים, מה שיוצר גז מימן וחומצות הגורמים לתפיחות, גזים וכאבי בטן. שקופית: 21 - ספיגת הפרוקטוז - חוסר ספיגה","slides":"","section":"B"},{"n":3,"text":"מטופל עם עששת חוזרת שואל אילו הרגלי אכילת ממתקים מסוכנים במיוחד לשיניים. מה תשיב לו בהתבסס על המצגת?","options":{"A":"מזון דביק וגמיש (כמו סוכריות טופי, פירות יבשים, עוגיות) מכיל סוכרוז שנשאר צמוד לשן זמן רב יותר מאשר שתייה, ומעלה סיכון לעששת","B":"חיידקי הפה אינם קשורים כלל לעששת; משקה ממותק מסוכן יותר משוקולד דביק","C":"לקטוז הוא הסוכר המזיק ביותר לשיניים; אין שום הבדל במרקם המזון מבחינת נזק לשיניים","D":"עמילן אינו יכול לגרום נזק לשיניים בשום נסיבות; רק שתיית משקאות ממותקים מסוכנת, מזון מוצק לעולם לא"},"answer":["A"],"multi":false,"explanation":"מרקם המזון משפיע על משך ההידבקות לשן - מזון דביק וגמיש (סוכריות, פירות יבשים, עוגיות) נשאר צמוד לשן זמן רב יותר משתייה, ומעלה סיכון לעששת (בעיקר בזכות סוכרוז, הגורם היעיל ביותר לעששת מבין הסוכרים). שקופית: 33 - סוכרוז ובריאות השן","slides":"","section":"B"},{"n":4,"text":"מטופלת אינה סובלת מוצרי חלב נוזליים אך מדווחת שהיא יכולה לאכול גבינה קשה וגם יוגורט ללא בעיה. כיצד תסביר זאת?","options":{"A":"גבינות קשות מכילות רוב הלקטוז שיוצא עם מי הגבינה, ויוגורט קל יותר לעיכול כי חיידקים פרוביוטיים כבר פירקו חלק מהלקטוז לחומצה לקטית","B":"גבינה ויוגורט אינם מכילים כלל חלב; הלקטאז נוצר מחדש בכל מוצר חלב שונה","C":"גבינה קשה מכילה יותר לקטוז מחלב נוזלי; יוגורט תמיד קשה יותר לעיכול מחלב רגיל","D":"הסבר זה אינו רלוונטי לאי-סבילות ללקטוז; אי-סבילות ללקטוז היא מצב הכל-או-כלום, ולכן אין הסבר אפשרי"},"answer":["A"],"multi":false,"explanation":"באי-סבילות ללקטוז (שהיא ספקטרום ולא מצב אחיד), גבינות קשות מכילות פחות לקטוז כי רובו יוצא עם מי הגבינה, ויוגורט קל יותר לעיכול הודות לפירוק חלקי של הלקטוז לחומצה לקטית על ידי חיידקים פרוביוטיים בתהליך התסיסה. שקופית: 36 - אי-סבילות ללקטוז","slides":"","section":"B"},{"n":5,"text":"מטופל בעל היסטוריה של כבד שומני שואל אם עליו להימנע לחלוטין מכל הפירות. מה ההמלצה המבוססת ביותר לפי החומר?","options":{"A":"אין צורך להימנע מפירות שלמים; הבעיה העיקרית קשורה בעיקר לפרוקטוז חופשי ומרוכז (סירופ תירס, סוכר, מיצים) ולא לפרי שלם עם סיביו, שבו הספיגה איטית יותר","B":"יש להימנע רק מבננות; אין שום הבדל בין פרי שלם למיץ פרי","C":"יש להימנע מפירות אך להרבות בסוכר לבן; פרי שלם מסוכן פי כמה מסירופ תירס עשיר בפרוקטוז","D":"כן, יש להימנע לחלוטין מכל הפירות ללא יוצא מן הכלל; יש להעדיף אך ורק מיצי פירות טריים על פני פירות שלמים"},"answer":["A"],"multi":false,"explanation":"הבעיה של פרוקטוז וכבד שומני קשורה בעיקר לצריכה מרוכזת של פרוקטוז חופשי (סירופ תירס, סוכר, כמויות גדולות בזמן קצר) ולא לפרי שלם, שבו הסיבים מאטים את ספיגת הפרוקטוז ומקטינים משמעותית את הסיכון. שקופית: 23-24 - TG ופרוקטוז וכבד שומני","slides":"","section":"B"},{"n":6,"text":"מטופלת בהריון שאינה צורכת מוצרי חלב שואלת מהיכן יגיע גלקטוז לחלב האם שלה. מה התשובה הנכונה?","options":{"A":"בלוטות החלב מייצרות גלקטוז מגלוקוז שנע בדם, כך שאין צורך בצריכת מוצרי חלב כדי לייצר לקטוז בחלב אם","B":"יש לצרוך דווקא עודף מוצרי חלב במהלך ההנקה כדי להבטיח גלקטוז מספק","C":"הכבד אינו מסוגל לייצר גלקטוז; תינוקות אינם זקוקים ללקטוז בחלב אם","D":"חלב אם אינו מכיל כלל לקטוז; גלקטוז אינו נחוץ כלל לתינוק; גלקטוז יכול להגיע רק ממוצרי חלב, ולכן היא חייבת לצרוך אותם"},"answer":["A"],"multi":false,"explanation":"הגוף (בלוטות החלב) יודע לייצר גלקטוז מגלוקוז הנע בדם, ולכן גם אישה מניקה שאינה צורכת מוצרי חלב יכולה לייצר לקטוז (גלוקוז+גלקטוז) בחלבה עבור התינוק. שקופית: 29 - גלקטוז - חידון מהיר","slides":"","section":"B"},{"n":7,"text":"מאמן כושר שואל מתי ולמה מומלץ לרצי מרתון \"לרוקן\" את מאגרי הגליקוגן שלהם לפני תחרות. מה ההסבר הנכון?","options":{"A":"יש לעבור לתזונה קטוגנית עם אימון מפרך לכמה ימים לפני התחרות כדי לרוקן את מאגרי הגליקוגן, ואז יום לפני התחרות לאכול כמות פחמימות גדולה - כדי לדחות או למנוע את תופעת \"הקיר\"","B":"תופעת \"הקיר\" אינה קשורה למאגרי גליקוגן; יש להימנע מפחמימות לחלוטין גם לפני התחרות","C":"תזונה קטוגנית לפני התחרות אינה חלק מהשיטה; ריקון גליקוגן אינו קשור כלל לביצועים בריצה","D":"יש לאכול פחמימות רבות דווקא בזמן התחרות בלבד; יש לרוקן גליקוגן ולהישאר ריקים עד התחרות עצמה"},"answer":["A"],"multi":false,"explanation":"הטריק כולל דלדול מאגרי הגליקוגן (תזונה קטוגנית + אימון מפרך) ולאחר מכן \"פיצוי יתר\" - אכילת פחמימות מרובה יום לפני התחרות - כדי למקסם את מאגרי הגליקוגן ולדחות/למנוע את תופעת \"הקיר\". שקופית: 10 - הטריק של רצי מרתון","slides":"","section":"B"},{"n":8,"text":"מטופל עם תסמינים של נפיחות וגזים לאחר אכילת פירות שואל אם כדאי לבצע בדיקה לאבחון הבעיה. מה ההמלצה הנכונה בהתבסס על החומר?","options":{"A":"מבחן נשיפה לגז מימן עשוי להעיד על בעיה בספיגת פרוקטוז","B":"יש לבדוק רק את רמת האינסולין בצום","C":"הבדיקה היחידה הרלוונטית היא בדיקת עששת","D":"יש לבצע רק בדיקת דם לגלוטן; יש לבדוק רמת גלקטוז בדם בלבד","E":"אין שום בדיקה רלוונטית לבעיה זו; אין קשר בין תסמינים אלו לפרוקטוז"},"answer":["A"],"multi":false,"explanation":"מבחן נשיפה לגז מימן (Hydrogen breath test) עשוי להעיד על בעיה בספיגת פרוקטוז, מכיוון שפרוקטוז שאינו נספג ומגיע למעי הגס מותסס שם ויוצר גז מימן הנספג לדם ונפלט דרך הריאות. שקופית: 21 - ספיגת הפרוקטוז","slides":"","section":"B"},{"n":9,"text":"מטופלת שרוצה להמתיק תה בצורה שתסייע גם באיזון רמות סוכר שואלת אם יש תוסף טבעי שיכול לעזור. מה ההמלצה המבוססת ביותר מהחומר?","options":{"A":"תוספת מקל קינמון (ציילוני) לתה ירוק אחרי הארוחה, בזכות עיכוב מלטאז, חיקוי פעולת אינסולין והאטת ריקון הקיבה","B":"יש להוסיף קינמון קסיה (לא ציילוני) בלבד בכמות בלתי מוגבלת","C":"תוספת סירופ תירס עשיר בפרוקטוז; יש להימנע מקינמון לחלוטין בכל מצב","D":"תוספת סוכר לבן רגיל; תוספת מולסה בכמות גדולה; אין שום תוסף טבעי שיכול לסייע באיזון רמות סוכר"},"answer":["A"],"multi":false,"explanation":"קינמון (רצוי ציילוני, בעל פחות קומרין) פועל במספר מנגנונים לאיזון סוכר - עיכוב מלטאז, חיקוי פעולת אינסולין, והאטת ריקון הקיבה - ומומלץ להוספה עם/אחרי הארוחה העמילנית, למשל עם תה ירוק. שקופית: 38-39 - קינמון","slides":"","section":"B"},{"n":10,"text":"מטופל שסובל מכבד שומני ומעוניין לבחור ממתיק טבעי \"הכי פחות מזיק\" עבורו, בהתחשב בעומס הפרוקטוז החופשי, שואל בין אגבה למולסה כהה. מה תמליץ ומדוע?","options":{"A":"מולסה כהה, כי אגבה מכילה את ריכוז הפרוקטוז החופשי הגבוה ביותר מבין הממתיקים (ולכן מוגדרת המסוכנת ביותר), בעוד שהמולסה עשירה במינרלים ובנוגדי חמצון וכמעט נטולת פרוקטוז חופשי מרוכז באותה מידה","B":"אגבה, כי היא הכי מתוקה; אגבה נטולת פרוקטוז לחלוטין","C":"שניהם זהים לחלוטין מבחינת פרוקטוז; מולסה מכילה יותר פרוקטוז חופשי מאגבה","D":"יש להעדיף דווקא סירופ תירס עשיר בפרוקטוז; אין שום הבדל רלוונטי לכבד שומני בין הממתיקים"},"answer":["A"],"multi":false,"explanation":"אגבה מכילה בעיקר פרוקטוז חופשי בריכוז הגבוה ביותר מבין הממתיקים הטבעיים ומוגדרת במצגת \"המסוכנת ביותר\", בעוד שמולסה (בפרט Blackstrap) עשירה במינרלים ובפעילות אנטי-אוקסידנטית גבוהה, ומהווה אופציה עדיפה יחסית עבור מי שרוצה למזער עומס פרוקטוז חופשי. שקופית: 34-41 - השוואת ממתיקים טבעיים","slides":"","section":"B"},{"n":9,"text":"מטופל בודק את רמת הסוכר שלו לאחר אכילת אותה ארוחה בימים שונים, ומגלה תגובות שונות מאוד. הוא שואל מדוע האינדקס הגליקמי לא חוזה את התגובה שלו במדויק. מה ההסבר הנכון?","options":{"A":"התגובה הגליקמית לכל מזון משתנה מאדם לאדם וגם אצל אותו אדם בזמנים שונים, בהתאם למגוון פלורת המעיים, מה שנאכל בלילה הקודם, ואופן הכנת המזון","B":"אין שום הסבר אפשרי לתופעה זו; פלורת המעיים אינה משפיעה כלל על תגובת הסוכר","C":"מה שנאכל בלילה הקודם לא משפיע על תגובת הבוקר; תגובת הסוכר תלויה אך ורק בגנטיקה וזהה בכל מצב","D":"אופן הכנת המזון אינו משפיע על התגובה הגליקמית; האינדקס הגליקמי הוא מדד קבוע לחלוטין ואינו יכול להשתנות בשום מצב"},"answer":["A"],"multi":false,"explanation":"התגובה הגליקמית משתנה מאדם לאדם וגם אצל אותו אדם בזמנים שונים, בהתאם למגוון פלורת המעיים (המשתנה גם היא), למה שנאכל בארוחה הקודמת (למשל בלילה שלפני), ולאופן הכנת המזון (טמפרטורה ומשך הבישול) - כל אלו הופכים את האינדקס הגליקמי למדד לא מדויק ברמת הפרט. שקופית: 28, 30 - בעיות באינדקס הגליקמי ובכל המודלים","slides":"","section":"B"},{"n":10,"text":"מטופלת מגלה שמזון מסוים בעל ערך גליקמי נמוך גורם לה בכל זאת לעלייה חדה ברמת האינסולין. היא שואלת איזה מדד עשוי להסביר את התופעה. מה תשיב?","options":{"A":"אינדקס האינסולין (Insulin index) - שפותח בדיוק כדי לתעד מזונות בעלי ערך גליקמי נמוך שבכל זאת מעלים אינסולין באופן משמעותי","B":"אין שום מדד שיכול להסביר תופעה זו; אין שום מזון שיכול להראות פער כזה","C":"עומס גליקמי הוא המדד היחיד הרלוונטי כאן; תגובת אינסולין אינה קשורה כלל לערך גליקמי של מזון","D":"האינדקס הגליקמי תמיד תואם באופן מושלם לתגובת האינסולין; מדד DayTwo מבוסס אך ורק על ערך גליקמי ולא על פלורת מעיים"},"answer":["A"],"multi":false,"explanation":"אינדקס האינסולין פותח בדיוק כדי לטפל בבעיה שבה מזונות מסוימים אינם מעלים סוכר בדם (ערך גליקמי נמוך) אך בכל זאת מעלים משמעותית אינסולין. שקופית: 30 - אינדקס האינסולין","slides":"","section":"B"},{"n":9000,"text":"בפירות עשירי פרוקטוז כמו בננה וענבים יש יחס גבוה של פרוקטוז לגלוקוז — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["B"],"multi":false,"explanation":"המשפט שגוי על פי החומר. פרוקטוז אכן נמצא בכל הפירות ומקורותיו כוללים גם ירקות שורש, דבש, אגבה ומולסה (בניגוד לקביעות השגויות שפוסלות ירקות), ובננה וענבים דווקא עשירים ביחס גבוה של פרוקטוז (לא דל, בניגוד לקביעה השגויה), ופרוקטוז כמובן אינו נמצא רק בסוכר לבן (בניגוד לקביעה השגויה). הקביעה הרלוונטית נכונה - ולכן כשילוב הקביעות המוצגות ככלל מוחלט/בלעדי, כולן שגויות במידה זו או אחרת למעט D; עם זאת לצורך שאלה זו התשובה הרשמית \"אף תשובה אינה נכונה\" מתייחסת לניסוח המוקצן של כל אחת מהאפשרויות כפי שנוסחו (רק D תואמת את המצגת במדויק). שקופית: 17 - מקורות לפרוקטוז","slides":"","section":"A","tf":1},{"n":9001,"text":"השפעת הסיבים על האינדקס הגליקמי תלויה - היא משתנה בהתאם לאופן הכנת המזון — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["A"],"multi":false,"explanation":"המשפט נכון על פי החומר. השפעת הסיבים על האינדקס הגליקמי תלויה מאוד באופן הכנת המזון - פריכיות אורז מלא (ומזון מותפח כמו פופקורן) הן בעלות אינדקס גליקמי גבוה מאוד למרות תכולת הסיבים; פסטה מקמח מלא תלויה במידת הבישול; וטחינת הגרגיר לקמח כן פוגעת משמעותית בהשפעת הסיבים על הערך הגליקמי (בניגוד לקביעה השגויה). שקופית: 27 - האם סיבים משפיעים על האינדקס הגליקמי","slides":"","section":"A","tf":1},{"n":9002,"text":"אי-סבילות ללקטוז אינה קשורה כלל לכמות מוצרי החלב הנצרכת — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["B"],"multi":false,"explanation":"המשפט שגוי על פי החומר. לאחר ההיניקה אין צורך פיזיולוגי בייצור לקטאז ללא המשך צריכת חלב; יש הבדל אזורי/עממי משמעותי (אירופה מול מזרח אסיה); גבינות קשות מכילות פחות לקטוז כי הוא יוצא עם מי הגבינה; ויוגורט קל יותר לעיכול הודות לפירוק חלקי של הלקטוז על ידי חיידקים פרוביוטיים. אי-סבילות ללקטוז היא ספקטרום, לא מצב אחיד. שקופית: 36 - אי-סבילות ללקטוז","slides":"","section":"A","tf":1},{"n":9003,"text":"גלקטוז מהווה מקור אנרגיה ישיר וזמין יותר מגלוקוז — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["B"],"multi":false,"explanation":"המשפט שגוי על פי החומר. גלקטוז מגיע בעיקר מהלקטוז, אינו יכול לשמש ישירות כאנרגיה (חייב להפוך לגלוקוז דרך הכבד), ומשמש כמרכיב על פני שטח תאים (כולל קביעת סוג דם), במיאלין ובגלקטוליפידים. שקופית: 28 - גלקטוז","slides":"","section":"A","tf":1},{"n":9004,"text":"עומס גליקמי אמצעי הוא סביב 20 — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["A"],"multi":false,"explanation":"המשפט נכון על פי החומר. העומס הגליקמי שוקלל את הערך הגליקמי עם כמות הפחמימות שנאכלה בפועל (ערך גליקמי חלקי 100, כפול כמות הפחמימות שנאכלה); עומס גליקמי של כ-10 נחשב נמוך, סביב 20 בינוני, ו-20 ומעלה גבוה. פתרון זה נועד לתקן בעיה מבנית באינדקס הגליקמי - כמות גדולה של מזון בעל ערך גליקמי נמוך עדיין יכולה לגרום לעלייה חדה בסוכר הדם. שקופית: 29 - האינדקס העומס הגליקמי","slides":"","section":"A","tf":1},{"n":9005,"text":"תסיסה קשורה לפירוק גלוקוז ולא לחלבון — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["B"],"multi":false,"explanation":"המשפט שגוי על פי החומר. תסיסה היא אחד מאופני פירוק הגלוקוז בהיעדר חמצן, המתבצעת על ידי חיידקים או שמרים, ומוכרת מתעשיות כמו אפייה ותסיסה אלכוהולית. שקופית: 4 - אופני פירוק גלוקוז ללא חמצן","slides":"","section":"A","tf":1},{"n":9006,"text":"הגליקוגן הוא כדור מסועף (ולא שרשרת ישרה) כדי לאפשר גישה מהירה לאנזימים רבים בו-זמנית ממספר קצוות — נכון או שגוי?","options":{"A":"נכון","B":"שגוי"},"answer":["A"],"multi":false,"explanation":"המשפט נכון על פי החומר. גליקוגן מכיל כ-30,000 מולקולות גלוקוז סביב חלבון גליקוגנין במרכזו, ומבנהו המסועף מאפשר גישה מהירה לאנזימים ממספר קצוות בו-זמנית. גליקוגן הכבד שומר על רמת סוכר תקינה בדם עבור המוח, בעוד גליקוגן השריר משרת רק את השריר בו הוא נמצא ואינו משתחרר חזרה לדם. שקופית: 8-9 - גליקוגן","slides":"","section":"A","tf":1}]},{"id":"21","title":"מצגת 21 — גלוטן ולחם","questions":[{"text":"מהו הרכיב שבזכותו בצק מקמח חיטה תופח ואוורירי?","options":{"A":"העמילן, שסופח מים ומתנפח בחום","B":"הגלוטן, היוצר רשת הלוכדת את גזי ההתפחה","C":"חומצה פיטית, המשחררת פחמן דו-חמצני","D":"הסיבים המסיסים, היוצרים ג'ל צמיגי"},"answer":["B"],"multi":false,"explanation":"הגלוטן יוצר את 'רשת הגלוטן' הלוכדת גזים ומאפשרת לבצק לתפוח - ולכן דווקא קמח דגנים תופח.","slides":"2 - מה מיוחד בלחם","section":"A"},{"text":"על פי הרמב\"ם, איזה לחם נחשב עדיף לבריאות?","options":{"A":"לחם מסולת נקייה ומנופה היטב","B":"לחם מגרעינים גסים, בלתי נקלפים ומנוקים (מתוקן כראוי)","C":"לחם מצות, לאורך כל השנה","D":"לחם שנילוש בשמן זית"},"answer":["B"],"multi":false,"explanation":"הרמב\"ם מעדיף לחם 'מגרעינים גסים, בלתי נקלפים ומנוקים' ומסתייג מלחם מסולת נקייה שיש בו 'עובי, דבוק וקושי עיכול'.","slides":"3 - מאיזו חיטה","section":"A"},{"text":"מהו התקן שקבע מכון התקנים להגדרת 'לחם מלא' (אף שיישומו אינו ודאי)?","options":{"A":"לפחות 51% קמח מלא","B":"לפחות 80% קמח מלא","C":"בדיוק 70% קמח מלא","D":"100% קמח מלא, ותקן זה כבר אושר ונאכף"},"answer":["B"],"multi":false,"explanation":"בעבר החוק התיר שם 'מלא' כבר מ-51% קמח מלא; מכון התקנים החליט על לפחות 80%. הרצון ל-100% טרם עוגן (נכון לאפריל 2026).","slides":"7 - האם הלחם המלא באמת מלא","section":"A"},{"text":"מדוע לטחינת קמח ביתית ממש לפני האפייה יש יתרון?","options":{"A":"הטחינה הטרייה מעלה את תכולת הגלוטן","B":"נוגדי החמצון שבקמח הולכים לאיבוד עם הזמן מרגע הטחינה","C":"טחינה טרייה מורידה את הערך הגליקמי בחצי","D":"הקמח הטרי מכיל יותר ויטמין K2"},"answer":["B"],"multi":false,"explanation":"עם הזמן מרגע הטחינה נוגדי החמצון הולכים לאיבוד; בטחינה ביתית טוחנים ממש לפני האפייה ושומרים עליהם, וגם מוודאים טחינת הגרגר בשלמותו.","slides":"9 - יתרונות טחינה ביתית","section":"A"},{"text":"מהי המשמעות המעשית של ההבדל הגליקמי בין לחם לבן ללחם מלא, לפי המצגת?","options":{"A":"לחם מלא כמעט אינו מעלה סוכר ולכן מתאים לאיזון סוכרת","B":"ההבדל קטן יחסית (לבן ~70-75, מלא ~60-65); עדיף מלא, אך לצורך איזון סוכר שום לחם לא באמת מסייע","C":"לחם מלא מעלה סוכר יותר מלבן בשל תכולת הסיבים","D":"הערך הגליקמי תלוי אך ורק בכמות הסוכר שמוסיפים"},"answer":["B"],"multi":false,"explanation":"הערכים הממוצעים קרובים (לבן 70-75, מלא 60-65); הטחינה מבטלת חלק מהאפקט. עדיף מלא, אך לאיזון סוכר שום לחם לא באמת מסייע.","slides":"9 - הבדל גליקמי","section":"A"},{"text":"מהי הסיבה המרכזית להעדפת התססה במחמצת על פני שמרים?","options":{"A":"מחמצת מוסיפה ללחם ויטמין K2 וברזל זמין","B":"מחמצת מנטרלת יותר חומצה פיטית (~62% מול ~38% בשמרים) ולכן משפרת ספיגת מינרלים","C":"מחמצת מקצרת מאוד את זמן ההתפחה","D":"מחמצת מעלה את תכולת הגלוטן ומשפרת תפיחה"},"answer":["B"],"multi":false,"explanation":"התפחה בשמרים מפחיתה חומצה פיטית ב-38%, ובמחמצת ב-62%; פחות חומצה פיטית והחומציות הגבוהה משפרות ספיגת מינרלים (מגנזיום, זרחן).","slides":"13 - העדפת מחמצת","section":"A"},{"text":"האם לחם מחמצת בטוח לחולי צליאק?","options":{"A":"כן, המחמצת מפרקת את כל הגלוטן","B":"לא - הפירוק חלקי בלבד (כ-30%-80% בתלות בזמן ההתפחה) ואינו מלא","C":"כן, בתנאי שההתפחה נמשכת מעל 12 שעות","D":"כן, אם מוסיפים לבצק אנזים פיטאז"},"answer":["B"],"multi":false,"explanation":"מחקר 2007 הראה פירוק חלקי (30%-80%) של הגלוטן במחמצת - לרמה שכבר אינה בעיה לרגישים, אך לא פירוק מלא, ולכן אינו מתאים לצליאק.","slides":"14 - פירוק הגלוטן","section":"A"},{"text":"מה נכון לגבי שלב הלישה ורשת הגלוטן, לפי המחקרים שהוצגו?","options":{"A":"זמן לישה ארוך חשוב יותר מעוצמת הלישה","B":"עוצמת לישה חשובה יותר מזמן; רשת גלוטן נוצרת גם בהתססה ארוכה (מעל 12 שעות) עם לישה מינימלית","C":"לישה כלל אינה משפיעה על מבנה הבצק","D":"עדיפה תמיד לישה חלשה וארוכה"},"answer":["B"],"multi":false,"explanation":"עדיפה לישה חזקה קצרה על פני חלשה וארוכה; ורשת גלוטן נוצרת גם בהתססה ארוכה מעל 12 שעות עם לישה מינימלית.","slides":"16 - אופן הלישה","section":"A"},{"text":"מדוע פשטידה המותפחת בסודה לשתייה נחותה מבחינת פירוק חומצה פיטית?","options":{"A":"הסודה מעלה חומציות ומאיצה פיטאז","B":"הסודה מורידה חומציות ולכן מעכבת את פעילות הפיטאז, וההתפחה נעשית מגז ולא בקמח עצמו","C":"הסודה קושרת אליה את המינרלים","D":"הסודה הופכת את העמילן לעמילן עמיד"},"answer":["B"],"multi":false,"explanation":"סודה לשתייה מורידה רמת חומציות ולכן מעכבת פיטאז; בנוסף היא יוצרת התפחה מגז (CO2) והקמח עצמו כמעט לא משתנה - בניגוד לשמרים/מחמצת.","slides":"18 - פשטידה עם סודה","section":"A"},{"text":"על פי מחקר 2018, מה עשוי להיות מקור התסמינים אצל חלק ניכר מ'הרגישים לגלוטן'?","options":{"A":"הגלוטן בלבד, כפי שחשבו קודם","B":"רגישות לפרוקטן (אינולין) שבחיטה - תסמיני IBS היו רבים יותר בקבוצת הפרוקטן, בעוד קבוצת הגלוטן דיווחה כמו פלצבו","C":"עודף חומצה פיטית","D":"האקרילאמיד שבלחם"},"answer":["B"],"multi":false,"explanation":"במחקר 2018 קבוצת הפרוקטן דיווחה על הרבה יותר תסמיני IBS, וקבוצת הגלוטן דיווחה כמו פלצבו - ייתכן שהרגישות היא לפרוקטן ולא לגלוטן.","slides":"21 - רגישות לפרוקטן","section":"A"},{"text":"מהי הבדיקה שנחשבת האמינה ביותר לזיהוי רגישות לגלוטן?","options":{"A":"נוגדני IgG בדם","B":"מבחן אלימינציה (לפחות 3 שבועות, רצוי חודש)","C":"נוגדני IgA ברוק","D":"נוגדני IgA בצואה"},"answer":["B"],"multi":false,"explanation":"מבחן האלימינציה מוגדר במצגת כאמין ביותר לרגישות לגלוטן, ונמשך לפחות 3 שבועות ורצוי חודש. יש להבחין בין צליאק, אלרגיה ורגישות.","slides":"20 - איך לדעת","section":"A"},{"text":"מדוע כמעט ואין לחמי שעורה?","options":{"A":"טעמה של השעורה מר מדי לאפייה","B":"בשעורה כמות הגלוטן הנמוכה ביותר, ולכן הבצק קשה, תופח גרוע ולא נוח ללישה","C":"השעורה יקרה מכל הדגנים","D":"החוק אוסר אפיית לחם משעורה"},"answer":["B"],"multi":false,"explanation":"כמות הגלוטן בשעורה נמוכה ביותר, ולכן הבצק קשה ותופח גרוע - ונמנעים ממנה בתעשיית הלחמים. בישראל צורכים שעורה כגריסים/גריסי פנינה.","slides":"24 - אין לחמי שעורה","section":"A"},{"text":"מהם המרכיבים של 'לחם בריא' לפי סיכום המצגת?","options":{"A":"קמח לבן, מים, שמרים ומעט סוכר","B":"קמח מלא, מים, מחמצת ומלח","C":"קמח מלא, שמן זית, דבש ומלח","D":"סולת, מים, שמרים ומלח"},"answer":["B"],"multi":false,"explanation":"לחם בריא = ארבעה מרכיבים בלבד: קמח מלא (גרגר שנטחן בשלמותו), מים, מחמצת ומלח - ללא שמן וללא סוכר.","slides":"25 - סיכום ביניים","section":"A"},{"text":"מדוע פריכיות כוסמין אינן תחליף בריא ללחם מחמצת?","options":{"A":"הן מכילות גלוטן רב מדי","B":"אין בהן התססה - ולכן נטרול חומצה פיטית מועט, וההתפחה משנה את העמילן כך שהערך הגליקמי גבוה","C":"הן דלות מדי בקלוריות","D":"הן עוברות התססה ארוכה מדי"},"answer":["B"],"multi":false,"explanation":"בפריכיות אין התססה, ולכן אין הפעלת פיטאז (פירוק חומצה פיטית מועט), והשינוי במבנה העמילן מקנה להן ערך גליקמי גבוה לעומת לחם.","slides":"26 - פריכיות","section":"A"},{"text":"מהו סייטן?","options":{"A":"מוצר סויה מותסס עשיר בליזין","B":"בצק/קמח שנשטף עד הסרת רוב העמילן, ונותר בעיקר גלוטן (חלבון לא מלא, דל ליזין)","C":"קמח מלא שעבר הנבטה","D":"תחליף בשר על בסיס קטניות"},"answer":["B"],"multi":false,"explanation":"סייטן עשוי מבצק שנשטף עד הסרת רוב העמילן, ונותר בעיקר גלוטן; כ-77% מהקלוריות מחלבון, אך זהו חלבון לא מלא כי בחיטה כמעט אין ליזין.","slides":"27-28 - סייטן","section":"A"},{"text":"כיצד נוצר אקרילאמיד?","options":{"A":"מבישול עמילן במים רותחים","B":"מתגובה בין סוכר לחומצה האמינית אספרגין, בטמפ' מעל 120° (לא בעמילן מבושל או שלא חומם)","C":"מהקפאה ממושכת של עמילן","D":"מהתססת בצק במחמצת"},"answer":["B"],"multi":false,"explanation":"אקרילאמיד נוצר בתגובה בין סוכר לאספרגין בחום מעל 120° (צ'יפס/טוסט); הוא אינו נמצא בעמילן שבושל או שלא חומם כלל.","slides":"32 - אקרילאמיד","section":"A"},{"text":"מדוע צ'יפס מסחרי/קפוא מכיל לרוב פחות אקרילאמיד מצ'יפס ביתי?","options":{"A":"כי הוא מטוגן בטמפ' נמוכה יותר","B":"בזכות תהליך 'חליטה' (Blanching) - השריה במים חמים שמוציאה סוכרים משכבת השטח לפני הטיגון","C":"כי משתמשים בו בשמן איכותי יותר","D":"כי הוא דק בהרבה"},"answer":["B"],"multi":false,"explanation":"צ'יפס מסחרי עובר 'חליטה' (השריה במים חמים 70-90°) שמוציאה סוכרים משכבת השטח - ולכן פחות אקרילאמיד לעומת ביתי.","slides":"33-34 - חליטה","section":"A"},{"text":"במחקר שהשווה שיטות הכנה - היכן נוצרה כמות האקרילאמיד הגבוהה ביותר?","options":{"A":"בטיגון עמוק","B":"במכשיר אוויר חם (Air fryer)","C":"בתנור אפייה","D":"בהשריה במים בלבד"},"answer":["B"],"multi":false,"explanation":"במחקר: טיגון עמוק 8.94, תנור 7.43, אייר-פרייר 12.19 מק\"ג/ק\"ג - האוויר החם הגבוה ביותר; חום גבוה ויובש מעודדים יצירת אקרילאמיד.","slides":"35 - אוויר חם","section":"A"},{"text":"מהו המקור העשיר ביותר בחשיפה לאקרילאמיד?","options":{"A":"טוסט מושחם","B":"עשן סיגריות (למעשנים פי 3-5 סמני חשיפה בדם)","C":"קפה נמס","D":"שקדים קלויים"},"answer":["B"],"multi":false,"explanation":"בעשן הסיגריה יש אקרילאמיד רב; למעשנים פי 3-5 סמני חשיפה בדם - כך שעישון הוא מקור משמעותי בהרבה מהתזונה.","slides":"41 - המקור העשיר ביותר","section":"A"},{"text":"מדוע לפסטה ערך גליקמי נמוך יותר מאשר ללחם?","options":{"A":"כי מוסיפים לפסטה סיבים","B":"בזכות עמילן עמיד (בישול חלקי) והעמילן ה'כלוא' ברשת הגלוטן - דבר שאינו מתרחש בלחם","C":"כי הפסטה עשירה בחלבון","D":"כי בפסטה אין כלל עמילן זמין"},"answer":["B"],"multi":false,"explanation":"לפסטה ערך גליקמי נמוך יותר מלחם בשל עמילן עמיד (אל-דנטה) והעמילן ה'כלוא' ברשת הגלוטן - תופעה שאינה קיימת בלחם.","slides":"43 - פסטה מול לחם","section":"A"},{"text":"מהי חיטת דורום?","options":{"A":"דגן נפרד שאינו חיטה","B":"זן חיטה קשה ונפוץ (עשיר בגלוטן); פסטה מדורום רגיל שקולה לפסטה מקמח לבן","C":"זן חיטה נטול גלוטן","D":"סוג של סולת מבושלת"},"answer":["B"],"multi":false,"explanation":"דורום הוא זן חיטה קשה (הנפוץ במזה\"ת) עם כמות גלוטן רבה יותר (גלוטן רטוב 27% מול 24%); פסטה מדורום רגיל = מקמח לבן, ומדורום מלא = מקמח מלא.","slides":"44 - דורום","section":"A"},{"text":"היכן ומתי הומצאו הפתיתים?","options":{"A":"באיטליה בימי הביניים","B":"בישראל בתקופת הצנע (שנות ה-50), כתחליף אורז ('אורז בן גוריון')","C":"ביפן במאה ה-19","D":"במרוקו, כמנת חג מסורתית"},"answer":["B"],"multi":false,"explanation":"הפתיתים הומצאו בתקופת הצנע בתחילת שנות ה-50 עקב מחסור באורז; בן גוריון ביקש מ'אוסם' תחליף אורז - ונקראו 'אורז בן גוריון'. בעולם: 'קוסקוס ישראלי'.","slides":"51-52 - פתיתים","section":"A"},{"text":"אילו מהקביעות הבאות לגבי יתרונות לחם המחמצת נכונות?","options":{"A":"משפרת את ספיגת המינרלים מהלחם (נטרול חומצה פיטית)","B":"מקלה על עיכול הגלוטן ומפחיתה בסבירות גבוהה סיכון לרגישות","C":"מביאה לערך גליקמי נמוך יותר לאחר הארוחה","D":"מוסיפה ללחם ויטמין K2 בכמות משמעותית","E":"מפרקת את הגלוטן במלואו ולכן הלחם בטוח לצליאק"},"answer":["A","B","C"],"multi":true,"explanation":"שלושת יתרונות המחמצת: שיפור ספיגת מינרלים, הקלה על עיכול הגלוטן, וערך גליקמי נמוך יותר. אין בלחם מחמצת K2 (או זניח), והפירוק חלקי בלבד - לא בטוח לצליאק.","slides":"15 - סיכום יתרונות מחמצת","section":"A"},{"text":"אילו מהקביעות הבאות לגבי אקרילאמיד נכונות?","options":{"A":"נוצר מתגובה בין סוכר לאספרגין בטמפ' מעל 120°","B":"בצ'יפס מסחרי לרוב פחות אקרילאמיד מביתי, בזכות החליטה","C":"עשן סיגריות הוא מקור חשיפה משמעותי יותר מהתזונה","D":"נמצא גם בעמילן שבושל במים או שלא חומם כלל","E":"רוב המחקרים בבני אדם הוכיחו קשר חד-משמעי לסרטן"},"answer":["A","B","C"],"multi":true,"explanation":"שלוש הקביעות הראשונות נכונות. אקרילאמיד אינו נוצר בעמילן מבושל/שלא חומם, ורוב המחקרים בבני אדם (כולל מטא-אנליזות) לא מצאו קשר חד-משמעי לסרטן.","slides":"32-41 - אקרילאמיד","section":"A"},{"text":"אילו מהקביעות הבאות לגבי לחם שיפון נכונות?","options":{"A":"מכיל את כמות הסיבים הגבוהה ביותר מבין הדגנים","B":"תופח פחות טוב (פחות גלוטן) ולכן דחוס וכבד יותר","C":"תמך בירידה במשקל יותר מלחם חיטה מלאה (תחושת שובע)","D":"עשיר בגלוטן יותר מחיטה ולכן תופח טוב יותר","E":"מייצר פחות אקרילאמיד מאשר חיטה"},"answer":["A","B","C"],"multi":true,"explanation":"לשיפון פחות גלוטן (דחוס וכבד), אך הכי הרבה סיבים מבין הדגנים ותמיכה בירידה במשקל בזכות שובע. שיפון דווקא מייצר יותר אקרילאמיד מחיטה.","slides":"23,37 - שיפון","section":"A"},{"text":"אילו מהתיאוריות הבאות מוצעות במצגת להסבר היווצרות רגישות לגלוטן באוכלוסייה?","options":{"A":"מעבר לשמרים תעשייתיים במקום מחמצת","B":"פיתוח זן חיטה עתיר גלוטן באמצעות הכלאות","C":"הוספת גלוטן לבצק","D":"אכילה מרובה של מוצרי חיטה","E":"הנדסה גנטית ישירה של גן הגלוטן בחיטה"},"answer":["A","B","C","D"],"multi":true,"explanation":"ארבע התיאוריות: שמרים תעשייתיים, זן עתיר גלוטן (בהכלאות), הוספת גלוטן לבצק, ואכילה מרובה. הזן נוצר בהכלאות - לא בהנדסה גנטית.","slides":"20 - מדוע נוצרה רגישות","section":"A"},{"text":"אילו מהקביעות הבאות לגבי סייטן נכונות?","options":{"A":"עשוי מבצק שנשטף עד להסרת רוב העמילן","B":"כ-77% מהקלוריות שבו מגיעות מחלבון (גלוטן)","C":"חלבון לא מלא, בשל מיעוט ליזין בחיטה","D":"עשיר בסיבים, מינרלים וויטמינים","E":"מקורו באירופה, בתקופת ימי הביניים"},"answer":["A","B","C"],"multi":true,"explanation":"סייטן: בצק שנשטף (נותר גלוטן), ~77% קלוריות מחלבון, חלבון לא מלא (דל ליזין). הוא דל בסיבים/מינרלים/ויטמינים, ומקורו בסין (נזירים בודהיסטים).","slides":"27-29 - סייטן","section":"A"},{"text":"אילו מהקביעות הבאות מסבירות מדוע לפסטה ערך גליקמי נמוך יותר מלחם?","options":{"A":"בפסטה שבושלה חלקית (אל-דנטה) נותר עמילן עמיד","B":"העמילן בפסטה 'כלוא' ברשת הגלוטן, בניגוד ללחם","C":"לפסטה מלאה ערך גליקמי גבוה משמעותית מפסטה לבנה","D":"פסטה מעלה סוכר יותר מלחם לבן"},"answer":["A","B"],"multi":true,"explanation":"שתי הסיבות: עמילן עמיד (בישול חלקי) ועמילן 'כלוא' ברשת הגלוטן שאינו בלחם. ההבדל הגליקמי בין פסטה מלאה ללבנה קטן, ולפסטה ערך נמוך מלחם.","slides":"43 - פסטה מול לחם","section":"A"},{"text":"אילו מהקביעות הבאות לגבי חיטה ירוקה (פריקי) נכונות?","options":{"A":"מכילה יותר סוכרים פשוטים ופחות עמילן מחיטה בשלה","B":"התגובה הגליקמית שלה נמוכה יותר, ככל הנראה בזכות כמות סיבים גדולה","C":"עשירה יותר בנוגדי חמצון, ויטמיני B ו-C, ובליזין","D":"ערך גליקמי גבוה מאוד בשל הסוכרים הפשוטים"},"answer":["A","B","C"],"multi":true,"explanation":"בחיטה ירוקה יותר סוכרים פשוטים אך התגובה הגליקמית דווקא נמוכה יותר (בזכות סיבים), והיא עשירה יותר בנוגדי חמצון, ויטמיני B/C וליזין.","slides":"26 - פריקי","section":"A"},{"text":"אילו מהקביעות הבאות לגבי קוסקוס נכונות?","options":{"A":"קוסקוס רגיל שקול מבחינה תזונתית לקמח לבן","B":"הוא עשוי מגרגרי סולת שהותפחו באמצעות אידוי/בישול","C":"אינו עובר התססה במחמצת ולכן נטרול חומצה פיטית מועט","D":"עובר התססה ארוכה במחמצת המשפרת ספיגת מינרלים"},"answer":["A","B","C"],"multi":true,"explanation":"קוסקוס = סולת (חלקיקי קמח לבן גדולים) שהותפחה באידוי; רגיל שקול לקמח לבן, ואינו עובר התססה במחמצת - ולכן נטרול חומצה פיטית מועט וספיגת מינרלים פחותה.","slides":"45-48 - קוסקוס","section":"A"},{"text":"מטופל עם IBS משוכנע שהוא 'רגיש לגלוטן'. מה מלמד מחקר 2018 שהוצג לגבי מקור תסמיניו?","options":{"A":"התסמינים נובעים מהגלוטן בלבד ויש להימנע ממנו לחלוטין","B":"ייתכן שהרגישות היא לפרוקטן שבחיטה ולא לגלוטן - תסמיני ה-IBS היו רבים יותר בקבוצת הפרוקטן, והגלוטן היה זהה לפלצבו","C":"התסמינים נובעים מעודף אקרילאמיד","D":"יש להפחית שומן בתזונה"},"answer":["B"],"multi":false,"explanation":"במחקר 2018 קבוצת הפרוקטן דיווחה על הרבה יותר תסמיני IBS, בעוד קבוצת הגלוטן דיווחה כמו פלצבו - ייתכן שחלק ניכר מ'הרגישים לגלוטן' רגישים בעצם לפרוקטן.","slides":"21 - פרוקטן","section":"B"},{"text":"מטופלת מבקשת המלצה על הלחם הבריא ביותר. מהי ההמלצה המתאימה ביותר?","options":{"A":"לחם מקמח מלא (גרגר שנטחן בשלמותו), מים, מחמצת ומלח","B":"לחם מלא תעשייתי משמרים, עם מעט דבש לשיפור הטעם","C":"לחם לבן מסולת, קל לעיכול","D":"פריכיות כוסמין כתחליף מלא ללחם"},"answer":["A"],"multi":false,"explanation":"לחם בריא = קמח מלא (גרגר שנטחן בשלמותו), מים, מחמצת ומלח - ללא שמן וסוכר; מחמצת (ולא שמרים) היא שינוי משמעותי.","slides":"25 - סיכום","section":"B"},{"text":"חולה צליאק שמע שמחמצת 'מפרקת גלוטן' ושואל אם מותר לו לחם מחמצת. מה תשיב/י?","options":{"A":"מותר - המחמצת מפרקת את כל הגלוטן","B":"לא - הפירוק חלקי בלבד (30%-80%) ולכן אינו בטוח לצליאק","C":"מותר בתנאי שההתפחה מעל 12 שעות","D":"מותר עם תוסף אנזים פיטאז"},"answer":["B"],"multi":false,"explanation":"מחמצת מפרקת גלוטן חלקית (30%-80%) בלבד ולא במלואו - ולכן לחם מחמצת אינו מתאים/בטוח לחולי צליאק.","slides":"14 - פירוק הגלוטן","section":"B"},{"text":"מטופל אוהב צ'יפס ומודאג מאקרילאמיד. אילו מהפעולות הבאות יפחיתו את רמת האקרילאמיד בהכנה ביתית?","options":{"A":"השריית מקלוני תפוח האדמה במים חמים (~80°) עם מעט חומץ לפני האפייה","B":"לייבש היטב ולאפות עד גוון זהוב בהיר בלבד (לא כהה)","C":"לטגן בטמפ' גבוהה מאוד עד השחמה כהה וקריספית","D":"להשתמש באייר-פרייר בחום גבוה למשך זמן ארוך"},"answer":["A","B"],"multi":true,"explanation":"חליטה (השריה ב-80° עם חומץ) והכנה עד גוון זהוב בהיר מפחיתות אקרילאמיד; חום גבוה, יובש והשחמה כהה (טיגון עמוק/אייר-פרייר ממושך) מעלים אותו.","slides":"35 - חליטה ביתית","section":"B"},{"text":"טבעוני המסתמך על סייטן כמקור חלבון עיקרי מגיע להתייעצות. מהי ההמלצה התזונתית המרכזית?","options":{"A":"להגדיל משמעותית את כמות הסייטן","B":"להוסיף קטניות ובמיוחד סויה - כי בסייטן חסר ליזין והחלבון אינו מלא","C":"להחליף לסייטן מקמח לבן בלבד","D":"לצרוך את הסייטן עם רוטב סויה כמקור החלבון היחיד"},"answer":["B"],"multi":false,"explanation":"סייטן (גלוטן) דל בליזין (חלבון לא מלא); ההמלצה: להוסיף קטניות, ובעיקר סויה העשירה בליזין, להשלמת החלבון.","slides":"29 - סייטן","section":"B"},{"text":"מטופלת מודאגת מסיכון סרטן מאקרילאמיד בטוסט יומי. מהי התגובה המאוזנת ביותר לפי המצגת?","options":{"A":"להפסיק כל מזון קלוי, בשל קשר מוכח וחד-משמעי לסרטן","B":"החשיפה התזונתית נמוכה בהרבה מהמינון המזיק (WHO: פי 500 מתחת לנזק עצבי), רוב המחקרים לא מצאו קשר לסרטן, והעישון מקור גדול בהרבה; מעשית - להעדיף גוון זהוב בהיר ולהימנע משרוף","C":"אקרילאמיד תזונתי מסוכן יותר מעישון","D":"אין צורך בכל זהירות, אפשר לאכול גם שרוף"},"answer":["B"],"multi":false,"explanation":"ה-WHO: החשיפה נמוכה פי 500 מהמינון המזיק עצבית; רוב המחקרים (כולל מטא-אנליזות) לא מצאו קשר לסרטן, והעישון מקור משמעותי בהרבה. מעשית: להעדיף גוון זהוב בהיר ולהימנע משרוף.","slides":"39-41 - הצד השני","section":"B"},{"text":"מטופל עם אוסטאופורוזיס מבקש לשפר ספיגת מינרלים מהלחם. מה עדיף להמליץ?","options":{"A":"לחם משמרים תעשייתיים","B":"לחם מחמצת מקמח מלא - המחמצת מנטרלת חומצה פיטית (~62%) ומשפרת זמינות מגנזיום וזרחן","C":"פריכיות כוסמין","D":"לחם לבן מסולת נקייה"},"answer":["B"],"multi":false,"explanation":"מחמצת מנטרלת חומצה פיטית (~62% מול 38% בשמרים) והחומציות משפרת זמינות מינרלים (מגנזיום, זרחן) - ולכן לחם מחמצת מקמח מלא עדיף לספיגת מינרלים.","slides":"13 - מחמצת","section":"B"},{"text":"מטופל עם סוכרת מתלבט בין פסטה ללחם. אילו מהקביעות הבאות נכונות ורלוונטיות להחלטתו?","options":{"A":"לפסטה ערך גליקמי נמוך יותר מלחם, בין היתר בזכות עמילן 'כלוא' ברשת הגלוטן","B":"בישול אל-דנטה משאיר חלק מהעמילן כעמילן עמיד ומפחית את התגובה הגליקמית","C":"עדיף לשלב את הפסטה עם ירקות/חלבון/שומן להורדת הערך הגליקמי לארוחה","D":"פסטה מלאה מעלה סוכר הרבה יותר מפסטה לבנה"},"answer":["A","B","C"],"multi":true,"explanation":"לפסטה ערך גליקמי נמוך מלחם (עמילן עמיד + עמילן כלוא ברשת הגלוטן); אל-דנטה מפחית תגובה גליקמית; ושילוב עם ירקות/חלבון/שומן מוריד את הערך הגליקמי לארוחה. ההבדל בין פסטה מלאה ללבנה קטן.","slides":"30,42-43 - פסטה","section":"B"}],"presets":[10,20,30,40]},{"id":"","title":"מבחן גמר — הסמכה מתקדמת ברפואה תזונתית","questions":[{"text":"מטופל הסובל מטרשת עורקים מתקדמת ומערכת עיכול רגישה שואל על צריכת ביצים. לפי המנגנונים הפיזיולוגיים שנלמדו, מהן העובדות המדויקות ביותר שעליך להציג בפניו?\n\n1. ביצה היא המקור העשיר ביותר ללוטאין וזקסנטין, אך בשל היעדר הכלורופיל והימצאות השומן בחלמון, ספיגתם לרשתית העין נמוכה פי כמה מאשר צריכת קייל מבושל.\n2. כולין המצוי בחלמון הביצה הוא חיוני למבנה התאים, אך אצל אנשים עם פלורת מעיים לא מאוזנת הוא עלול להפוך ל-TMAO, מולקולה המעודדת תהליכי טרשת עורקים.\n3. חלבון הביצה מכיל אבידין שחוסם ספיגת ביוטין, ולכן לאנשים עם טרשת עורקים מומלץ לצרוך ביצים חיות בלבד כדי לשמור על גמישות כלי הדם.\n4. הכולסטרול בביצה מתחמצן בקלות רבה במגע עם חמצן וטמפרטורה גבוהה (כמו בביצה עין או באבקת ביצים), וכולסטרול מחומצן הוא הגורם המרכזי לשקיעה בדפנות העורק.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"רק טענה מס' 2 נכונה.","D":"כל הטענות בסעיפים 1–4 שגויות מיסודן."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 2 מדויקת (TMAO והקשר לפלורה). טענה 4 מדויקת (חמצון הכולסטרול הוא הבעיה בטרשת). טענה 1 שגויה (להיפך: ספיגת לוטאין מביצה גבוהה פי כמה מזו של קייל בגלל השומן והיעדר הכלורופיל). טענה 3 שגויה (אבידין מנוטרל בבישול, ואין המלצה לביצים חיות בטרשת).","slides":"","section":"A"},{"text":"תהליך נטרול הרעלים (Detox) בכבד כולל שלבים קריטיים. מהו ההסבר הביוכימי המדויק לאתגרים בשלבים אלו?\n\n1. שלב Phase 2 דורש מולקולות צימוד כמו גלוטטיון או חומצות אמינו (ציסטאין, גליצין) כדי להפוך את תוצרי הביניים למסיסי מים וניתנים להפרשה.\n2. רעלים מסיסי שומן נאגרים ברקמת השומן, ולכן ירידה מהירה מאוד במשקל עלולה להציף את מחזור הדם ברעלים בקצב גבוה מיכולת הנטרול של הכבד.\n3. שלב Phase 1 משתמש באנזימי ציטוכרום P450 כדי להפוך רעלים מסיסי שומן למולקולות ביניים פעילות, שהן לעיתים רעילות יותר מהרעלן המקורי.\n4. במהלך צום מיצים ממושך ללא אספקת חלבון, הגוף מגביר את קצב Phase 2 בזכות האנזימים החיים המצויים במיץ הירקות הירוק.","options":{"A":"סעיפים 3, 1 ו-2 נכונים.","B":"סעיפים 3 ו-1 נכונים בלבד.","C":"סעיפים 3, 1 ו-4 נכונים.","D":"רק סעיף 2 נכון."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 2, 3). טענה 4 (Reactive intermediates) וטענה 3 (צורך בחלבון לצימוד) הן לב מנגנון הניקוי. טענה 1 (שחרור רעלים מהשומן) היא הסיכון העיקרי בירידה מהירה. טענה 4 שגויה (צום מיצים ללא חלבון מעכב את שלב 2 ומסכן את המטופל).","slides":"","section":"A"},{"text":"מטופלת בת 52 מדווחת על ירידה בצפיפות העצם (אוסטיאופניה) ושואלת על שילוב סויה בתזונה. כיצד פועל מנגנון ה-SERM בסויה בהקשר זה?\n\n1. השפעת הסויה על צפיפות העצם תלויה ביכולת של חיידקי המעי להפוך דאידזאין למולקולת אקואול (Equol), יכולת הקיימת אצל כ-30%-50% מהאוכלוסייה בלבד.\n2. סויה מעלה את רמת ה-IGF-1 בדם, הורמון המעודד בניית עצם אך במקביל הוכח כמוריד משמעותית את הסיכון לסרטן השד בכל גיל.\n3. ברקמת השד, שם דומיננטי רצפטור אסטרוגן מסוג אלפא (ER-alpha), הפיטואסטרוגנים חוסמים את הרצפטור ומונעים מהאסטרוגן האנושי החזק לעורר חלוקת תאים מוגברת.\n4. האיזופלבונים בסויה דומים במבנהם לאסטרוגן ונקשרים בעדיפות גבוהה לרצפטור אסטרוגן מסוג בטא (ER-beta) הנמצא בעצמות, ובכך מפעילים תאים בוני עצם.","options":{"A":"סעיפים 4 ו-3 נכונים בלבד.","B":"סעיפים 4, 3 ו-1 נכונים.","C":"סעיפים 3 ו-2 נכונים.","D":"כל הסעיפים 1–4 נכונים."},"answer":["B"],"multi":false,"explanation":"(נכונות: 1, 3, 4). טענה 4 ו-3 מסבירות את הסלקטיביות של SERMs (בטא בעצם, אלפא בשד). טענה 1 מדויקת (חשיבות האקואול). טענה 2 שגויה (IGF-1 גבוה הוא גורם סיכון לסרטן השד, לא מגן).","slides":"","section":"A"},{"text":"בניתוח פיזיולוגי של סוכרים, מהו המנגנון שדרכו פרוקטוז (סוכר פירות) משפיע על המטבוליזם, בניגוד לגלוקוז?\n\n1. הפרוקטוז משפר את הרגישות לאינסולין בטווח הארוך מכיוון שהוא מונע מהלבלב להפריש אינסולין בכמויות גבוהות בזמן הארוחה.\n2. פרוקטוז אינו דורש אינסולין כדי להיכנס לתאים, ולכן הוא עובר מטבוליזם כמעט בלעדי בכבד, שם הוא הופך לטריגליצרידים (שומן כבדי).\n3. גלוקוז גורם לתהליך גליקציה (קישור סוכר לחלבון) מהיר פי 7 מזה של הפרוקטוז, ולכן גלוקוז הוא הגורם המרכזי להזדקנות הרקמות.\n4. פירוק הפרוקטוז בכבד צורך ATP בקצב מהיר, מה שמוביל ליצירת חומצה אורית (Uric Acid) כתוצר לוואי, המעלה סיכון ליתר לחץ דם וגאוט.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"רק טענה מס' 2 נכונה.","D":"כל הטענות שגויות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 2 ו-4 מתארות את ה\"טרגדיה\" של הפרוקטוז (מטבוליזם כבדי, טריגליצרידים וחומצה אורית). טענה 3 שגויה (פרוקטוז עושה גליקציה מהירה פי 7 מגלוקוז). טענה 1 שגויה (פרוקטוז גורם לעמידות לאינסולין בטווח הארוך).","slides":"","section":"A"},{"text":"מהו ההסבר המדויק ביותר להשפעת הסיבים התזונתיים על רמות הכולסטרול וספיגת המינרלים במעי?\n\n1. סיבים תוססים עוברים התססה על ידי חיידקי המעי הגס לחומצות שומן קצרות שרשרת (SCFA), המורידות את ה-pH במעי ומסייעות להמסת מינרלים וספיגתם.\n2. צריכת סיבים מרובה תמיד מובילה לחסרים בברזל ואבץ בשל המטען החשמלי השלילי של הסיב שדוחה את המינרלים החיוביים.\n3. סיבים בלתי מסיסים (כמו ליגנין) מעכבים את האנזים מלטאזה בטרסריון, ובכך מונעים ספיגת פחמימות מורכבות לדם.\n4. סיבים מסיסים (כמו פקטין) יוצרים ג'ל צמיגי שקושר אליו מלחי מרה; הכבד נאלץ למשוך כולסטרול מהדם כדי לייצר מלחי מרה חדשים, ובכך רמת ה-LDL יורדת.","options":{"A":"סעיפים 4 ו-1 נכונים.","B":"סעיפים 4, 1 ו-3 נכונים.","C":"רק סעיף 4 נכון.","D":"כל הטענות בסעיפים 1–4 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 2 (פקטין וכולסטרול) וטענה 4 (SCFA והמסת מינרלים) הן מנגנונים מרכזיים. טענה 3 שגויה (לוטאולין מעכב מלטאזה, לא ליגנין). טענה 2 שגויה (מזון מהצומח עשיר במינרלים כך שהכמות המוחלטת הנספגת גבוהה למרות העיכוב).","slides":"","section":"A"},{"text":"מטופל עם תסמונת המעי הרגיש (IBS) מבקש לדעת מדוע לחם מחמצת מומלץ עבורו יותר מלחם רגיל. מהו ההסבר המדעי המבוסס על החומר הנלמד?\n\n1. המחמצת הופכת את הלחם למזון פרוביוטי חי, שכן החיידקים המועילים שורדים את חום התנור ומגיעים למעי הגס לשיקום הפלורה.\n2. חיידקי המחמצת מפרקים את הלקטינים שבקמח באופן מוחלט בזמן ההתפחה, מה שמונע דליפת מעי אצל חולי צליאק.\n3. רמת החומציות הגבוהה בלחם מחמצת מפעילה את האנזים פיטאז (Phytase), שמפרק את החומצה הפיטית ומשחרר מינרלים כמו מגנזיום ואבץ לספיגה.\n4. תהליך התסיסה הארוך של המחמצת מפרק חלק מהפרוקטנים (FODMAPs) הנמצאים בחיטה, שהם הסיבה המרכזית לגזים ונפיחות אצל סובלים מ-IBS.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"רק טענה מס' 4 נכונה.","D":"כל הטענות שגויות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 1 (פירוק FODMAPs) וטענה 3 (פיטאז וחומצה פיטית) הן הסיבות לעדיפות המחמצת ב-IBS. טענה 2 שגויה (מחמצת לא הופכת לחם לבטוח לצליאק). טענה 1 שגויה (החיידקים מתים באפייה).","slides":"","section":"A"},{"text":"לפניך היגד מורכב על שיטות תזונה. קבע האם הוא נכון או לא נכון: \"שיטת 80/10/10 (דוקטור גרהם) היא שיטת Raw Food טבעונית המבוססת על פירות כמקור אנרגיה עיקרי. השיטה שוללת שימוש בבלנדר ובחקלאות מודרנית בטענה שהאדם צריך לאכול כמו הקופים בטבע. היתרון הגדול של השיטה הוא מניעת מחסור בויטמינים ומינרלים בזכות צריכת הפירות המסיבית, אך היא אינה מתאימה כטיפול לסוכרתיים בגלל עומס הפרוקטוז.\"\n\n1. לא נכון – השיטה דווקא מעודדת שימוש בבלנדר להכנת שייקים מפירות וירקות.\n2. לא נכון – הבעיה המרכזית בשיטה היא דווקא סכנה למחסור בחלבון, מינרלים וויטמינים מסוימים עקב דלילות קלורית וחוסר גיוון.\n3. נכון – זהו תיאור מדויק של עקרונות השיטה והביקורת עליה.\n4. לא נכון – השיטה אינה טבעונית אלא מאפשרת צריכה מתונה של דגי ים קטנים.","options":{"A":"ההיגד נכון למעט המשפט על החקלאות.","B":"יש שתי טעויות מהותיות בהיגד המופיעות בסעיפים 1 ו-2.","C":"רק טענה 1 נכונה.","D":"כל התשובות שגויות."},"answer":["B"],"multi":false,"explanation":"טענה 1 שגויה (חסידי 80/10/10 משתמשים בבלנדר למרות שלילת הטכנולוגיה). טענה 2 שגויה (השיטה מובילה לחסרים קשים בחלבון ומינרלים, וזו אחת הביקורות המרכזיות עליה).","slides":"","section":"A"},{"text":"בנוגע לאומגה 3 מהצומח (ALA) ומהים (DHA/EPA), מהן העובדות הפיזיולוגיות הנכונות ביותר?\n\n1. המוח זקוק לכמות קטנה מאוד של DHA ביום (כ-3.8 מ\"ג), וזמן מחצית החיים של DHA במוח הוא ארוך מאוד (כ-2.5 שנים), מה שמגן על טבעונים מחסר מהיר.\n2. DHA מאצות הוא המקור הראשוני בטבע ל-DHA, והדגים מקבלים אותו דרך שרשרת המזון; לכן, תוסף DHA מאצות הוא תחליף ישיר ובטוח לשמן דגים.\n3. יכולת ההמרה של הגוף מ-ALA (פשתן, צ'יה) ל-DHA היא נמוכה מאוד (אחוזים בודדים), אך היא גדלה משמעותית כאשר הגוף נמצא במצב של \"רעב\" ל-DHA.\n4. שמן זרעי מרווה מרושתת נחשב למקור עדיף על שמן דגים בתוספים מכיוון שהוא מכיל נוגדי חמצון טבעיים המונעים את חמצון האומגה 3, בניגוד לשמן דגים שנוטה להתעפש.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","C":"רק טענה מס' 3 נכונה.","D":"רק טענה 1 נכונה."},"answer":["B"],"multi":false,"explanation":"כל 4 הטענות נכונות ומסכמות את סוגיית האומגה 4 (דינמיות המרה, צורכי המוח, יציבות מרווה מרושתת ואצות כמקור ראשוני).","slides":"","section":"A"},{"text":"מהו ההבדל המהותי בין \"תזונה קטוגנית\" ל\"תזונה קרניבורית\" לפי העקרונות שנלמדו?\n\n1. ה\"שפעת קטו\" (Keto Flu) היא תופעה המתרחשת רק בתזונה קרניבורית בשל המעבר המהיר לשריפת חלבונים במקום גלוקוז.\n2. בתזונה קרניבורית קיים סיכון גבוה יותר לחסרים בויטמין C ובנוגדי חמצון צמחיים בהשוואה לתזונה קטוגנית המאפשרת ירקות עליים וקישואים.\n3. תזונה קטוגנית היא הכלי הטיפולי המועדף לטווח ארוך (שנים) עבור כל אדם, בעוד תזונה קרניבורית היא תמיד כלי טיפולי מוגבל בזמן.\n4. תזונה קטוגנית מבוססת על שומן (70%+) וחלבון מתון כדי להגיע לקטוזיס, בעוד תזונה קרניבורית מבוססת על מזון מן החי בלבד ושוללת סיבים תזונתיים וצומח לחלוטין.","options":{"A":"סעיפים 4 ו-2 נכונים.","B":"סעיפים 4, 2 ו-3 נכונים.","C":"רק סעיף 4 נכון.","D":"כל הסעיפים שגויות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 4 ו-2 מבדילות בין קטו (שומן, עם ירקות) לקרניבורי (בשר בלבד, ללא סיבים, סיכון לחסר ויטמין C). טענה 3 שגויה (קטוגנית לא הוכחה כאופטימלית לכל החיים). טענה 1 שגויה (שפעת קטו קיימת בשתי השיטות).","slides":"","section":"A"},{"text":"מקרה קליני: מטופל הסובל מגזים, נפיחות ורעב תמידי מבקש לעבור לתזונת \"העמילנים\" (Starch Diet). מה עליך להסביר לו על השלכות השיטה?\n\n1. אדם עם רגישות לקטינים או IBS עלול לחוות החמרה משמעותית בנפיחות ובגזים בשל צריכת כמות גבוהה של קטניות ודגנים מבושלים.\n2. העמילנים בשיטה זו עוברים מטבוליזם איטי יותר מפירות, ולכן רמת האינסולין נשארת יציבה ונמוכה לאורך כל היום, מה שמונע עמידות לאינסולין.\n3. שיטת הסטארש-דייט מעודדת שימוש נרחב בשמני זרעים מזוקקים (קנולה, סויה) כדי לספק את חומצות השומן החסרות בתפריט המבוסס על עמילן.\n4. השיטה מתבססת על פחמימות מורכבות (תפוחי אדמה, דגנים, קטניות) כמקור קלורי עיקרי, מה שמספק תחושת שובע בזכות מתיחת דפנות הקיבה וגירוי סיבי ה-Stretch.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"רק טענה מס' 4 נכונה.","D":"רק טענה 1 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 4 מדויקת (נפח ומתיחה). טענה 1 מדויקת (בעיית הלקטינים והסיבים ב-IBS). טענה 2 שגויה (עמילן מעלה אינסולין ועלול להחמיר עמידות אצל רגישים). טענה 3 שגויה (השיטה שוללת שמנים מזוקקים לחלוטין).","slides":"","section":"A"},{"text":"מטופל המעוניין לעבור לתזונה המבוססת על גישות ה-Raw Food (אן ויגמור או 80/10/10) שואל על ההיבטים המטבוליים והסיכונים. מהי התשובה המקצועית ביותר?\n\n1. המכנה המשותף לכל שיטות ה-Raw Food הוא שלילה מוחלטת של שומנים מרוכזים כמו אבוקדו ואגוזים, בטענה שהם מעכבים את ניקוי הרעלים התאי.\n2. אצל אן ויגמור (מכון היפוקרטס), השימוש המסיבי במיץ עשב חיטה נועד לספק לגוף \"דם צמחי\" (כלורופיל) הדומה להמוגלובין, אך השיטה דוגלת בצמצום פירות מתוקים כדי לא להזין תהליכים דלקתיים.\n3. שיטת 80/10/10 דוגלת בכך ש-80% מהקלוריות יגיעו מפחמימות (בעיקר פירות), מה שעלול להוביל לחסרים בחלבון ובמינרלים אצל מי שאינו מקפיד על כמות אדירה של עלים ירוקים.\n4. פירות בתזונת Raw Food נספגים לאט יותר בזכות האנזימים החיים שבהם, ולכן רמת האינסולין בדם נשארת נמוכה וקבועה לאורך כל היום בניגוד למזון מבושל.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"רק טענה 1 נכונה.","C":"סעיפים 3 ו-2 מתארים נכונה את הגישות והסיכונים שבהן.","D":"כל הטענות בסעיפים 1–4 שגויות מיסודן."},"answer":["C"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 3 מדויקת (סיכון חסר חלבון ב-80/10/10). טענה 2 מדויקת (עשב חיטה והגבלת פירות אצל אן ויגמור). טענה 4 שגויה (פירות מעלים סוכר מהר). טענה 1 שגויה (אן ויגמור מאפשרת אבוקדו ואגוזים כמרכיב משמעותי).","slides":"","section":"A"},{"text":"מהו הקשר הביוכימי והפיזיולוגי בין אפיית לחם, אקרילאמיד ועיכול המזון לפי החומר הנלמד?\n\n1. לחם מחמצת נחשב ל\"פרוביוטיקה איכותית\" למעי הגס, שכן מושבות החיידקים שבמחמצת שורדות את חום האפייה ומיישבות את המעיים לאחר האכילה.\n2. קמח \"כפרי\" הוא הגדרה חוקית המבטיחה שהגרעין נטחן בשלמותו (100% מלא), ולכן הוא תמיד עדיף על פני לחם מחמצת מקמח כוסמין.\n3. תהליך התפחת מחמצת ארוך מצמצם את כמות האקרילאמיד הנוצר באפייה, מכיוון שחיידקי הלקטובצילוס צורכים את חומרי המוצא (הסוכרים והאספרגין) בזמן התסיסה.\n4. אקרילאמיד הוא תוצר לוואי של תגובת מייאר, הנוצר כאשר חומצת אמינו (אספרגין) מגיבה עם סוכרים בחום גבוה (מעל 120 מעלות), ולכן לחם קלוי (טוסט) מכיל יותר ממנו מאשר לחם רגיל.","options":{"A":"רק טענה 1 נכונה.","B":"סעיפים 4, 3 ו-1 נכונים.","C":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","D":"טענה מס' 4 היא היחידה שנכונה מדעית."},"answer":["C"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 4 מדויקת (מנגנון אקרילאמיד). טענה 3 מדויקת (מחמצת מפחיתה אקרילאמיד). טענה 1 שגויה (החיידקים מתים בתנור). טענה 2 שגויה (אין הגדרה חוקית ל\"כפרי\", וזו טעות טיפולית).","slides":"","section":"A"},{"text":"בניתוח מנגנון הניקוי הכבדי (Detox), מהם האתגרים הקליניים המרכזיים במעבר בין שלב אחד לשלב שתיים?\n\n1. מולקולות ה-Intermediates של השלב הראשון הן מסיסות מים לחלוטין, ולכן אם השלב השני מתעכב, הן פשוט מופרשות מהר יותר בשתן ללא נזק.\n2. שלב Phase 1 הופך רעלים מסיסי שומן לתרכובות ביניים (Intermediates) שהן לעיתים רעילות ופעילות יותר מהרעלן המקורי, מה שיוצר סטרס חמצוני גבוה בכבד.\n3. שלב Phase 2 דורש זמינות גבוהה של חומצות אמינו (כמו ציסטאין וגליצין) לצורך צימוד (Conjugation), ולכן צום מיצים קיצוני ללא חלבון עלול להוביל להצטברות רעלים מסוכנת.\n4. רוב הרעלים המודרניים נאגרים בתאי הלבלב, ולכן שלב Phase 1 מתמקד בשחרורם לזרם הדם באמצעות הורמון הגלוקגון בלבד.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","B":"רק טענה 1 נכונה.","C":"סעיפים 2 ו-3 נכונים ומדגישים את חשיבות החלבון בניקוי רעלים.","D":"כל הסעיפים 1–4 נכונים ומשלימים זה את זה."},"answer":["C"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 2 מדויקת (Reactive Intermediates). טענה 3 מדויקת (צורך בחלבון ל-Phase 2). טענה 4 שגויה (רעלים נאגרים בשומן, לא בלבלב). טענה 1 שגויה (הן רעילות ומסוכנות אם אינן מנוטרלות).","slides":"","section":"A"},{"text":"מטופלת הסובלת מאוסטאופורוזיס שואלת על תזונה חומצית/בסיסית ועל תפקיד הקולגן. מהו ההסבר המדויק ביותר שעליך לתת לה?\n\n1. מדד PRAL חיובי מעיד על כך שהמזון הוא בסיסי ומומלץ לבריאות העצם, בעוד מדד שלילי מעיד על מזון חומצי המפרק את המטריצה החלבונית.\n2. מזון חומצי גורם לירידה ב-pH של הדם ל-6.5, מה שמאלץ את העצם לשחרר מגנזיום כבופר מיידי כדי למנוע מוות תאי.\n3. סוכר גבוה בדם גורם לגליקציה של סיבי הקולגן (ה\"בטון\" של העצם), מה שיוצר קשרים מצליבים פגומים שהופכים את העצם לשבירה וחלשה, ללא קשר לרמת הסידן.\n4. תיאוריית ה\"אפר החומצי\" הופרכה, שכן הגוף מאזן את ה-pH בדם באמצעות הכליות והריאות, וצריכת חלבון (גם מהחי) דווקא תורמת לבניית עצם דרך העלאת IGF-1.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","D":"טענה מס' 3 היא ההסבר המרכזי היחיד לשבירות עצם בסוכרתיים."},"answer":["C"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 4 מדויקת (הפרכת האפר החומצי וחשיבות החלבון). טענה 3 מדויקת (גליקציה וקולגן בעצם). טענה 1 שגויה (PRAL שלילי הוא בסיסי). טענה 2 שגויה (ה-pH בדם נשמר קבוע ב-7.4).","slides":"","section":"A"},{"text":"מהו הערך התזונתי של הביצה בהקשר של הגנה על הראייה וסיכונים קרדיו-וסקולריים (מחלות לב)?\n\n1. חלמון הביצה הוא המקור הזמין ביותר ללוטאין וזקסנטין, שכן הם מגיעים בסביבה שומנית וללא כלורופיל, מה שמשפר את ספיגתם לרשתית פי כמה לעומת עלים ירוקים.\n2. אכילת ביצים מעלה את ה-LDL אצל רוב האוכלוסייה בצורה כה חמורה, עד כי המדע המודרני ממליץ לכל אדם להגביל את הצריכה לביצה אחת בשבועיים.\n3. לוטאין המצוי בביצה אינו רגיש לחום כלל, ולכן טיגון עמוק של ביצים (באבקת ביצים או חביתה יבשה) הוא הדרך המועדפת לשמירה על נוגדי החמצון.\n4. כולין בביצה חיוני למוח, אך אצל אנשים עם פלורת מעיים לא מאוזנת הוא עלול להפוך ל-TMAO, חומר המזרז הצטברות פלאק טרשתי בעורקים.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"סעיפים 1 ו-4 נכונים ומייצגים את המורכבות של צריכת ביצים.","D":"רק טענה 2 נכונה."},"answer":["C"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 1 מדויקת (זמינות ביולוגית של לוטאין מביצה). טענה 4 מדויקת (כולין, פלורה ו-TMAO). טענה 2 שגויה (השפעת הביצה על כולסטרול בדם זניחה לרוב). טענה 3 שגויה (טיפול בחום גבוה מחמצן כולסטרול ומזיק).","slides":"","section":"A"},{"text":"בהשוואה בין שיטת קינגסטון לשיטת המקרוביוטיקה, מהם ההבדלים המהותיים בהגדרת המזון והטיפול?\n\n1. שיטת קינגסטון מאפשרת מוצרי חלב עיזים לא מפוסטרים ושמה דגש על איכות המזון (אורגני/טבעי), בעוד המקרוביוטיקה שוללת חלב אך מאפשרת דגים.\n2. שתי השיטות דוגלות בצום מים ממושך של 21 יום ככלי הטיפולי הראשון לכל מחלה כרונית.\n3. קינגסטון שוללת אכילת פירות בבוקר וממליצה על דייסת דגנים מבושלת, בעוד המקרוביוטיקה מעודדת שייקים של פירות חיים בבוקר.\n4. המקרוביוטיקה מבוססת על איזון \"יין ויאנג\", דוגלת במזון מבושל ומאודה, ושוללת ירקות סולניים (עגבנייה, חציל) ופירות טרופיים.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"סעיפים 1 ו-4 נכונים ומדויקים לפי עקרונות השיטות.","D":"כל הטענות בסעיפים 1–4 נכונות."},"answer":["C"],"multi":false,"explanation":"(נכונות: 1, 4). טענה 1 מדויקת (חלב עיזים בקינגסטון מול דגים במקרוביוטיקה). טענה 4 מדויקת (יין ויאנג ושלילת סולניים). טענה 2 שגויה (רק שלטון דוגל בצום מים ככלי מרכזי). טענה 3 שגויה (קינגסטון דוגלת בפירות בבוקר).","slides":"","section":"A"},{"text":"מהו המנגנון הביוכימי של הפרוקטוז (סוכר פירות) וכיצד הוא נבדל מגלוקוז בהשפעתו על הגוף?\n\n1. מולסה (דבש קנים) היא הממתיק היחיד המכיל 100% גלוקוז ללא פרוקטוז, ולכן היא המומלצת ביותר לפי המדע המודרני לסוכרתיים.\n2. פרוקטוז עובר מטבוליזם כמעט בלעדי בכבד, שם הוא הופך לטריגליצרידים (שומן כבדי) וגורם לעלייה בחומצה אורית כתוצר לוואי של צריכת ATP מהירה.\n3. גלוקוז מעלה את רמת האינסולין בדם, בעוד שפרוקטוז משפר את הרגישות לאינסולין בטווח הארוך דרך הפעלת רצפטורים בכליות.\n4. פרוקטוז גורם לתהליך גליקציה (קישור לחלבונים) בקצב מהיר פי 7 מגלוקוז, מה שמאיץ תהליכי הזדקנות ונזק לרקמות.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"סעיפים 2 ו-4 נכונים ומתארים את הסיכון המטבולי שבפרוקטוז.","D":"טענה מס' 2 היא היחידה שנכונה."},"answer":["C"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 2 מדויקת (מטבוליזם כבדי וחומצה אורית). טענה 4 מדויקת (גליקציה מהירה פי 7). טענה 3 שגויה (פרוקטוז גורם לעמידות לאינסולין). טענה 1 שגויה (מולסה היא סוכרוז = גלוקוז+פרוקטוז).","slides":"","section":"A"},{"text":"מהן התועלות של מזון מותסס (כגון כרוב כבוש) בהשוואה לתוספי פרוביוטיקה, ומהם כללי הזהירות?\n\n1. תהליך ההתססה הופך את הירק לבסיסי מאוד (pH 8.0), ובכך הוא מנטרל לחלוטין את חומצות הקיבה ומאפשר עיכול מהיר של פחמימות.\n2. מזון מותסס מספק סינרגיה של חיידקים חיים (פרוביוטיקה) יחד עם תוצרי המטבוליזם שלהם (פוסט-ביוטיקה כמו ויטמין K2 וחומצות שומן קצרות שרשרת).\n3. לחולי IBS מומלץ להתחיל ב\"הפצצה\" של חצי כוס מי כבושים ביום כדי ליצור שינוי מהיר בפלורה, שכן המערכת שלהם זקוקה לתיקון דחוף.\n4. סיבי הירק במזון המותסס מהווים הגנה פיזית לחיידקים מפני חומציות הקיבה, מה שמשפר את הגעתם למעי הגס בהשוואה לכמוסות.","options":{"A":"רק טענה 1 נכונה.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","C":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","D":"טענה מס' 2 נכונה באופן מוחלט, אך השאר שגויות."},"answer":["B"],"multi":false,"explanation":"(נכונות: 2, 4). טענה 2 מדויקת (פוסט-ביוטיקה ו-K2). טענה 4 מדויקת (הגנה פיזית על החיידקים). טענה 3 שגויה (ב-IBS מתחילים בכמויות מזעריות). טענה 1 שגויה (ה-pH הוא חומצי מאוד, כ-3.0).","slides":"","section":"A"},{"text":"סויה ובריאות האישה: כיצד פועל מנגנון ה-SERM (Genistein) ברקמות השונות?\n\n1. צריכת סויה מעלה את רמת ה-IGF-1 בדם, ובכך היא מהווה גורם מגן משמעותי מפני סרטן השד אצל נשים צעירות.\n2. ברקמת השד, שם דומיננטי רצפטור אלפא (ER-alpha), הפיטואסטרוגנים חוסמים את הרצפטור ומונעים מהאסטרוגן האנושי החזק לעורר חלוקה תאית מסוכנת.\n3. הפיטואסטרוגנים בסויה נקשרים בעדיפות לרצפטור אסטרוגן מסוג בטא (ER-beta) המצוי בעצמות ומפעילים אותו, מה שתורם לבניית עצם.\n4. פורמולת סויה לתינוקות היא פתרון אופטימלי, שכן רמת האיזופלבונים שבה נמוכה בהרבה ממה שתינוק יכול לספוג דרך חלב אם.","options":{"A":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–4.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"רק טענה 1 נכונה.","D":"רק טענה מס' 2 נכונה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 3 מדויקת (הפעלה של ER-beta בעצם). טענה 2 מדויקת (חסימה של ER-alpha בשד). טענה 1 שגויה (IGF-1 גבוה הוא גורם סיכון לסרטן). טענה 4 שגויה (רמת האיזופלבונים בפורמולות גבוהה פי מאות מבוגר).","slides":"","section":"A"},{"text":"מהן העובדות הפיזיולוגיות הנכונות לגבי סיבים תזונתיים וספיגת מינרלים?\n\n1. רפינוז הוא סיב המצוי בקטניות אשר אינו עובר התססה כלל, ולכן הוא בטוח לחלוטין למי שסובל מגזים ונפיחות (IBS).\n2. סיבים תוססים (כמו אינולין) מתפרקים במעי הגס לחומצות שומן קצרות שרשרת (SCFA), המורידות את ה-pH המקומי ומסייעות להמסת מינרלים וספיגתם.\n3. המזונות העשירים בסיבים (ירקות וזרעים) הם לרוב גם המקורות העשירים ביותר במינרלים, כך שהכמות המוחלטת הנספגת נותרת גבוהה למרות עיכוב הספיגה הראשוני.\n4. סיבים בלתי מסיסים (כמו ליגנין) מעכבים את האנזים מלטאזה, ובכך הם הגורם המרכזי למניעת עמידות לאינסולין אצל צמחונים.","options":{"A":"סעיפים 2 ו-3 נכונים בלבד.","B":"רק טענה 1 נכונה.","C":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","D":"כל הטענות שגויות מיסודן."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3). טענה 2 מדויקת (SCFA והורדת pH לספיגה). טענה 3 מדויקת (המקור המינרלי גבוה יותר בסיבים). טענה 4 שגויה (לוטאולין מעכב מלטאזה, לא ליגנין). טענה 1 שגויה (רפינוז תוסס מאוד ועושה גזים).","slides":"","section":"A"},{"text":"מטופל הסובל מרגישות לגלוטן ומבקש להבין את הפיזיולוגיה של הלחם \"המתוקן\" שואל אותך על סוגי קמחים ותהליכי אפייה. מהן העובדות המדויקות שעליך להציג לו?\n\n1. קמח \"כפרי\" הוא הגדרה חוקית מחייבת בישראל המבטיחה לפחות 90% קמח מלא הנטחן בשלמותו עם הסובין והנבט.\n2. אקרילאמיד הוא חומר מסרטן פוטנציאלי הנוצר בתגובת מייאר (Maillard) בין חומצת אמינו לסוכר בזמן קליית לחם או אפייה ממושכת בחום גבוה.\n3. כוסמין הוא זן קדום של חיטה המכיל פחות גלוטן באופן משמעותי מחיטה מודרנית, אך הוא עדיין מכיל גלוטן ואינו בטוח לחולי צליאק.\n4. לחם מחמצת אינו נחשב למזון פרוביוטי \"חי\" מכיוון שהחיידקים המועילים שהתסיסו את הבצק נהרסים בטמפרטורת האפייה הגבוהה בתנור.\n5. חלבון הגלוטן מורכב מגליאדין וגלוטנין; התפחת מחמצת ארוכה מפרקת אותו לחלוטין והופכת את הלחם לבטוח לחלוטין לחולי צליאק.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–5.","C":"כל הטענות נכונות ומהוות בסיס לבחירת לחם איכותי."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3, 4). טענה 5 שגויה (לא מפרקת לחלוטין, לא בטוח לצליאק). טענה 1 שגויה (אין הגדרה חוקית ל\"קמח כפרי\"). טענות 2 (כוסמין), 2 (אקרילאמיד) ו-4 (חיידקים מתים באפייה) נכונות. (שימי לב שגם טענה 1 במקור כללה את הפיטאז שהיא נכונה, אך הורדה כדי לשמור על 2 נכונות ב-1-4).","slides":"","section":"A"},{"text":"בניתוח מטבולי של סוכרים, מהן ההשלכות הביוכימיות של צריכת פרוקטוז וגלוקוז על בריאות הכבד ותהליכי הזדקנות?\n\n1. סוכר פירות (פרוקטוז) משפר את הרגישות לאינסולין בטווח הארוך מכיוון שאינו דורש אינסולין לכניסה לתאים, ובכך הוא מונע כבד שומני.\n2. גליקוגן הוא מאגר הגלוקוז העיקרי בעולם הצומח, בעוד שעמילן משמש כמאגר האנרגיה הזמין ביותר בתאי השריר והכבד של האדם.\n3. גליקציה (AGEs) היא קישור בלתי הפיך של מולקולת סוכר לחלבון; הפרוקטוז גורם לתהליך זה בקצב מהיר פי 7 מאשר גלוקוז.\n4. פרוקטוז עובר מטבוליזם כמעט בלעדי בכבד, שם הוא הופך לטריגליצרידים וגורם לעלייה בחומצה אורית (Uric Acid) כתוצר לוואי של פירוק ATP מהיר.\n5. סוכרוז הוא דו-סוכר המורכב מגלוקוז וגלקטוז, וריכוזו בסלק נחשב לנמוך יחסית (כ-10% מסך הסוכרים שבו).","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–5.","C":"כל הטענות בסעיפים 1–5 שגויות מיסודן."},"answer":["B"],"multi":false,"explanation":"(נכונות: 3, 4). טענה 5 שגויה (סוכרוז = גלוקוז+פרוקטוז). טענה 2 שגויה (הפוך: עמילן בצומח, גליקוגן בחי). טענה 1 שגויה (פרוקטוז גורם לעמידות לאינסולין).","slides":"","section":"A"},{"text":"השוואה קלינית בין שיטות תזונה טבעיות: כיצד נבדלות שיטות הקינגסטון, המקרוביוטיקה ושלטון בהתייחסותן למזון וריפוי?\n\n1. המקרוביוטיקה מבוססת על איזון אנרגטי (יין ויאנג), דוגלת במזון מבושל ומאודה, שוללת ירקות סולניים ופירות טרופיים, ומאפשרת דגים.\n2. שיטת אן ויגמור (מכון היפוקרטס) היא שיטת Raw Food המעודדת צריכה מסיבית של פירות מתוקים וסירופים טבעיים כמקור אנרגיה לחולי סרטן.\n3. שיטת קינגסטון מאפשרת צריכת מוצרי חלב עיזים שלא עברו פסטור, מעודדת אכילת פירות בבוקר ושמה דגש מרכזי על איכות המזון וטבעיותו.\n4. שיטת שלטון (\"ההיגיינה הטבעית\") מעודדת שימוש יומיומי בפורמולות של צמחי מרפא מרוכזים ומיצי ירקות ככלי העיקרי לניקוי המעי והכבד.","options":{"A":"המכנה המשותף לכל השיטות הללו הוא התפיסה שרעלים, חסרים תזונתיים וסטרס הם השורש לכל המחלות הכרוניות המודרניות.","B":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–4.","C":"קיימות בדיוק 4 טענות נכונות מתוך סעיפים 1–4.","D":"רק טענות 3 ו-1 נכונות באופן מוחלט."},"answer":["D"],"multi":false,"explanation":"(נכונות: 1, 3). טענה 4 שגויה (שלטון התנגד לצמחי מרפא). טענה 2 שגויה (אן ויגמור צמצמה פירות). טענות 3 ו-1 מדויקות..","slides":"","section":"A"},{"text":"מהו המנגנון הפיזיולוגי שדרכו סיבים תזונתיים משפיעים על רמות הכולסטרול בדם ועל ספיגת המינרלים במעי הגס?\n\n1. חומצות שומן קצרות שרשרת (כמו בוטירט) המיוצרות מהתססת סיבים מזינות את תאי האפיתל במעי הגס וקשורות להפחתת סיכון לסרטן המעי.\n2. רפינוז הוא סיב המצוי בקטניות אשר אינו עובר התססה על ידי חיידקים כלל, ולכן הוא המרכיב המרכזי המונע גזים ונפיחות אצל סובלים מ-IBS.\n3. אגר-אגר הוא סיב המופק מעמילן תירס מהונדס, המורכב משרשרת גלוקוז \"הפוכה\" שהגוף אינו יודע לפרק, ובכך הוא מזרז ריקון קיבה.\n4. סיבים מסיסים (כמו פקטין) יוצרים ג'ל צמיגי שקושר אליו מלחי מרה; הכבד נאלץ למשוך כולסטרול מהדם לייצור מרה חדשה, ובכך רמת ה-LDL יורדת.\n5. סיבים תוססים (כמו אינולין) מתפרקים על ידי חיידקי המעי הגס לחומצות שומן קצרות שרשרת (SCFA), המורידות את ה-pH המקומי ומסייעות להמסת מינרלים וספיגתם.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–5.","C":"טענה מס' 1 היא הנכונה היחידה."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 4, 5). טענה 3 שגויה (אגר עשוי מגלקטוז, מעצות). טענה 2 שגויה (רפינוז תוסס מאוד ועושה גזים). טענה 1 נכונה (בוטירט וסרטן המעי).","slides":"","section":"A"},{"text":"תהליך הניקוי הביוכימי בכבד (Detox) והסיכונים הקליניים: מה קורה כאשר המאזן בין Phase 1 ל-Phase 2 משתבש?\n\n1. הופעת \"סימני ניקוי\" כמו כאבי ראש חזקים ובחילות מעידה לרוב על כך ש-Phase 1 פועל בעוצמה גבוהה אך Phase 2 אינו עומד בקצב הצימוד.\n2. שלב Phase 2 דורש צימוד של מולקולות (כמו גלוטטיון או חומצות אמינו) כדי להפוך את הרעלן למסיס מים לחלוטין ולאפשר את הפרשתו בשתן ובצואה.\n3. צום מיצים קיצוני ללא אספקת חלבון (חומצות אמינו) הוא הדרך המהירה והבטוחה ביותר לזירוז Phase 2, שכן הוא מנקה את הכבד מעומס חלבוני.\n4. שלב Phase 4 (אנזימי P450) הופך רעלים מסיסי שומן למולקולות ביניים ראקטיביות (Intermediates), שהן לעיתים רעילות ומסוכנות יותר מהרעלן המקורי.\n5. ירידה מהירה מאוד במשקל במהלך ניקוי רעלים מומלצת במיוחד מכיוון שהרעלנים מופרשים ישירות מהשומן דרך האור מבלי לעבור במחזור הדם.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 5 טענות נכונות מתוך סעיפים 1–5.","C":"כל הטענות בסעיפים 3 ו-5 נכונות."},"answer":["A"],"multi":false,"explanation":"(נכונות: 1, 2, 4). טענה 3 שגויה (Phase 2 דורש חלבון/חומצות אמינו לצימוד). טענה 5 שגויה (רעלים עוברים בדם ועלולים להציף אותו). טענות 4, 2 ו-1 מדויקות.","slides":"","section":"A"},{"text":"מטופלת המודאגת מבריאות העצם ומסרטן השד שואלת על שילוב סויה בתפריט. כיצד עליך להסביר לה את מנגנון ה-SERM?\n\n1. פולי סויה ירוקים (אדממה) הם בטוחים למאכל רק אם הם נושאים אישור שהם עברו הנדסה גנטית (GMO) המקנה להם עמידות לחמצון השומן.\n2. היכולת להפוך דאידזאין למולקולת אקואול (Equol) – המולקולה הפעילה והמגנה ביותר בסויה – תלויה בחיידקי המעי וקיימת אצל 30%-50% מהאוכלוסייה בלבד.\n3. ברקמת השד, שם נפוץ רצפטור אסטרוגן מסוג אלפא (ER-alpha), הפיטואסטרוגנים חוסמים את הרצפטור ומונעים מהאסטרוגן האנושי החזק לעורר חלוקת תאים מוגברת.\n4. איזופלבונים בסויה נקשרים בעדיפות גבוהה לרצפטור אסטרוגן מסוג בטא (ER-beta) המצוי בעצמות, ובכך הם מפעילים את הקולטן ומעודדים בניית עצם.\n5. סויה מעלה באופן דרמטי את רמת ה-IGF-1 בדם, הורמון המוכח כמדכא גידולים בשד ומגן מפני סרטן במערכת הרבייה הנשית.","options":{"A":"קיימות בדיוק 3 טענות נכונות מתוך סעיפים 1–5.","B":"קיימות בדיוק 2 טענות נכונות מתוך סעיפים 1–5.","C":"רק טענה 2 נכונה באופן מוחלט."},"answer":["A"],"multi":false,"explanation":"(נכונות: 2, 3, 4). טענה 5 שגויה (IGF-1 גבוה הוא גורם סיכון לסרטן השד). טענה 1 שגויה (סויה GMO סופחת רעלים ומזיקה). טענות 4, 3 ו-2 מדויקות ביוכימית.","slides":"","section":"A"},{"text":"ביצים וכולסטרול – ניתוח עומק: מהו הערך המוסף של הביצה ומהן הסכנות הפוטנציאליות לפי המנגנונים שנלמדו?\n\n1. כולין המצוי בשפע בביצים חיוני למבנה התאים, אך אצל אנשים עם פלורת מעיים לא מאוזנת הוא עלול להפוך ל-TMAO, חומר המעודד טרשת עורקים.\n2. אכילת ביצים חיות (כולל החלבון הלבן) מומלצת במיוחד מכיוון שהיא משמרת את האבידין במצבו הפעיל, מה שמשפר את ספיגת הביוטין בגוף.\n3. הלוטאין והזקסנטין מהביצה נספגים טוב יותר מאשר אלו שבקייל או תרד, כי הם מגיעים מומסים בשומ
