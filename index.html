מורכבות יחד עם חלבונים, מרוכזים על מנת ליצור חלבון מלא ואיכותי לבניית שריר. כמו, כן שיטת שלטון דוגלת בשתיית כמויות גדולות של מים תוך כדי הארוחה כדי לדלל את מיצי הקיבה ולהאיץ את תהליך הפירוק הכימי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת שלטון אוסרת באופן מוחלט על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה. 2. שיטת שלטון אוסרת לשתות מים בזמן הארוחה כדי לא לדלל את מיצי הקיבה ולפגוע בעיכול.","section":"A","slides":""},{"n":68,"text":"הכבד הוא האיבר המרכזי האחראי על מערך ניקוי הרעלים, בגוף ופעולתו העיקרית היא המרת רעלים מסיסי שומן למולקולות פולריות מסיסות מים שניתן להפריש בשתן. התהליך מתבצע בשני שלבים, עיקריים כאשר בשלב הראשון הכבד נעזר באנזימי ציטוכרום P450 כדי ליצור מולקולת, ביניים שלרוב היא אלימה וריאקטיבית יותר מהרעלן המקורי. בזמן תוכנית לניקוי, רעלים מומלץ מאוד לצרוך מיץ אשכוליות באופן קבוע משום שהוא ממריץ את פעילות אנזימי הציטוכרום ומזרז את השלב הראשון., בנוסף חובה להקפיד על הימצאות בעודף קלורי משמעותי בימי, הניקוי על מנת לספק לגוף את האנרגיה העצומה הדרושה לפירוק רקמות שומן ישנות ולשחרור הרעלים מתוכן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מיץ אשכוליות (בגלל הנרינג'ין) מעכב וחוסם את פעילות אנזימי הציטוכרום P450, ואסור לצריכה בניקוי רעלים. 2. כדי לפרק שומן ולשחרר, רעלים חובה להימצא ב גירעון קלורי, ולא בעודף קלורי.","section":"A","slides":""},{"n":69,"text":"הביצה היא מזון בעל צפיפות תזונתית, גבוהה ומרבית, הוויטמינים כל, הכולסטרול וכל תכולת השומן שלה מרוכזים אך ורק בחלמון (החלק הצהוב.) למרות, זאת חלבון הביצה (החלק הלבן) מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה, לחלמון ולכן ספורטאים רבים בוחרים לאכול רק אותו. כדי ליהנות מספיגה אופטימלית של ויטמין הביוטין (B7) המצוי, בחלמון חובה לשתות את הביצה כשהיא חיה לחלוטין וללא שום תהליך של חימום., בפועל החום של הבישול הורס את הביוטין ודווקא מחזק את הקשר הכימי שלו לחלבון, האבידין כך שספיגתו במעי הדק נמנעת לחלוטין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הריכוז הגבוה ביותר של חלבון -(ל100 גרם) נמצא דווקא ב חלמון ולא בחלבון הלבן. 2. חובה לחמם ולבשל את הביצה כדי להרוס את חלבון האבידין ולשחרר את הביוטין לספיגה (שתיית ביצה חיה תמנע את הספיגה.)","section":"A","slides":""},{"n":70,"text":"פולי הסויה נחשבים למקור חלבון צמחי, מלא והם עשירים בפיטואסטרוגנים ממשפחת האיזופלבונים (כגון ג'ניסטאין ודיידזאין.) המבנה המרחבי של הפיטואסטרוגנים הללו דומה מאוד לאסטרוגן, האנושי ולכן הם מסוגלים לפעול בגוף כמודולטורים סלקטיביים (SERMs) היכולים להפעיל או לחסום את קולטני האסטרוגן בהתאם לרקמה. בבני, אדם צריכת סויה מעודדת שגשוג מהיר ואגרסיבי של תאי סרטן, השד מכיוון שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא ברקמת השד. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג גרנולוזה מומלץ להרבות בצריכת, סויה משום שהיא חוסמת את רצפטורי הבטא בשחלה ומגינה מפני חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. בבני, אדם הסויה דווקא חוסמת את רצפטורי האלפא בשד ומהווה אפקט מגן (ולא מעודדת סרטן שד.) 2. במקרה של סרטן מסוג, גרנולוזה הסויה מפעילה את רצפטורי הבטא ולכן חובה להימנע ממנה לחלוטין.","section":"A","slides":""},{"n":71,"text":"בשר מהווה מקור מצוין לברזל מסוג \"\"הם (Heme Iron,) אשר נספג ביעילות גבוהה במערכת העיכול בהשוואה לברזל ממקור צמחי. יתרה, מכך כאשר צורכים מקורות צמחיים עשירים, בברזל מומלץ לשלב באותה ארוחה מזונות המכילים ויטמין C (כמו גמבה או,)לימון שכן ויטמין זה משפר באופן משמעותי את ספיגת הברזל אל זרם הדם. לעומת, זאת נוכחות של, סידן כגון שתיית חלב פרה יחד עם, הארוחה עלולה לפגוע ולעכב את ספיגת הברזל. על פי גישתו התזונתית של הרמב\"ם לבריאות, איתנה יש להקפיד על אכילת בשר בקר שמן על בסיס יומיומי כדי לשמר את כוחו הפיזי של הגוף ולבנות מסת שריר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: הרמב\"ם התנגד לאכילת בקר יומיומית והמליץ להימנע מבקר שמן, תוך העדפה ברורה לאכילת עוף כבשר הקל והנוח יותר לעיכול בשגרה.","section":"A","slides":""},{"n":72,"text":"תיאוריית התזונה החומצית מתבססת על כך שתוצרי הלוואי של עיכול מזונות כמו בשר ודגנים (העשירים בזרחן וגופרית) משאירים שאריות חומציות בגוף המופרשות בשתן. תומכי השיטה טוענים כי אכילת מזונות אלו מובילה לירידה חדה וקבועה ברמת ה-pH של נוזל הדם, עצמו מה שגורם לעצמות לשחרר סידן למחזור הדם כמנגנון פיצוי סותר חומצה., בפועל הרפואה המודרנית והמדע מוכיחים כי רמת החומציות בדם נשמרת תמיד מאוזנת ויציבה הודות למנגנוני הפיצוי של הכליות והריאות. עם, זאת עודף חלבון מן החי נחשב למזיק מאוד לאוכלוסייה המבוגרת (בני 65,)ומעלה ולכן ההמלצה הקלינית היא להפחית כליל צריכת חלבון בגיל זה כדי למנוע את דלדול העצם (אוסטאופורוזיס).","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח בעקבות, תזונה אלא נשאר קבוע לחלוטין. 2. ההמלצה לאוכלוסייה מבוגרת (מעל 65) היא דווקא להרבות ולהוסיף חלבון כדי לשמר מסת שריר, ועצם ולא להפחית כליל.","section":"A","slides":""},{"n":73,"text":"פולי הסויה מהווים מקור צמחי מעולה לחלבון מלא והם עשירים בפיטואסטרוגנים ממשפחת, האיזופלבונים כגון ג'ניסטאין ודיידזאין. מולקולות אלו פועלות בגוף כמודולטורים סלקטיביים (SERMs,) כלומר ביכולתן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה. ברקמת השד האנושית ישנה דומיננטיות ברורה של רצפטורים מסוג, אלפא והפיטואסטרוגנים של הסויה נקשרים אליהם אך לרוב חוסמים את, פעולתם ובכך מספקים אפקט מגן. למרות יתרונות, אלו על נשים שהחלימו מסרטן השד להימנע לחלוטין מכל מוצר, סויה שכן הוכח מחקרית כי צריכתה מזרזת הופעת גרורות ומגדילה משמעותית את סיכויי חזרת המחלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: צריכת סויה אינה מזרזת או מגדילה חזרת סרטן;שד נהפוך, הוא הפיטואסטרוגנים חוסמים את רצפטורי האלפא בשד ומהווים אפקט, מגן ולכן אין מניעה לנשים שהחלימו לצרוך סויה.","section":"A","slides":""},{"n":74,"text":"בתהליך ניקוי, רעלים הגוף נדרש לפרק רקמות שומן שבהן נאגרו רעלים מסיסי, שומן ולכן הימצאות בגירעון קלורי היא תנאי הכרחי ובסיסי לתחילת הניקוי. כדי להאיץ את תהליך הניקוי בשלביו הראשונים ולהקל על עבודת, הכבד מומלץ מאוד לשלב שפע של מיץ אשכוליות בתפריט, היומי שכן הוא מעורר וממריץ את אנזימי שלב 1. תהליך ההמרה של רעלן מסיס שומן למולקולה מסיסת מים מתרחש בכבד וכולל שני שלבים מרכזיים. בשלב הראשון (Phase 1,) הכבד מסתייע באנזימי ציטוכרום P450 כדי להוסיף אטום קטן לרעלן (מה שלעיתים הופך אותו לריאקטיבי,)יותר ולאחר מכן בשלב השני מוצמדת אליו מולקולה גדולה שהופכת אותו למסיס מים לחלוטין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מיץ אשכוליות מכיל ''נרינג'ין אשר מעכב וחוסם את פעילות אנזימי הציטוכרום P450 של שלב 1 (ולא,)ממריץ ולכן חובה להימנע ממנו לחלוטין בניקוי רעלים.","section":"A","slides":""},{"n":75,"text":"פחמימות מורכבות בנויות משרשראות ארוכות של, סוכרים-חד כאשר עמילן הוא מאגר האנרגיה העיקרי, בצומח וגליקוגן משמש כמאגר בגוף האדם. סיבים תזונתיים עשויים אף הם משרשראות של סוכרים (לרוב,)גלוקוז אולם גוף האדם חסר את האנזימים הנדרשים לפירוק הקשרים המרחביים המיוחדים שביניהם. חלק, מהסיבים המוגדרים כסיבים, תוססים מהווים מזון ביוטי-פרה עבור חיידקי המעי הגס אשר מתסיסים אותם ומייצרים מהם חומצות שומן קצרות, שרשרת כמו חומצה, בוטירית התורמות לבריאות המעי. סיב, אגרה-אגר המופק, מאצות נחשב לסיב בלתי תוסס אצל רוב אוכלוסיית, העולם והוא משמש רבות בתעשייה כחומר מסמיך בשל יכולתו לספוח כמויות גדולות של מים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":76,"text":"תהליך הפסטור שחלב פרה עובר במחלבות נועד להשביח את המבנה המרחבי של חלבון, הקזאין ובכך הוא הופך את החלב לקל ונוח בהרבה לעיכול ולספיגה עבור בני אדם. מעבר, לכך חלב פרה מכיל כמות יפה של, סידן חלבונים נוספים כגון מי גבינה (Whey,) וסוכר הנקרא, לקטוז הדורש את האנזים לקטאז לשם פירוקו במעי. למרות תכולת הסידן, הגבוהה מחקר האחיות של, הרווארד שעקב אחר נשים לאורך, שנים הראה כי שתייה מרובה של חלב כלל אינה מפחיתה את הסיכון לשברים בצוואר הירך. יתרה, מזאת צריכת חלב ומוצריו גורמת לעלייה בהפרשת אינסולין וכן מעודדת את הכבד לייצר את ההורמון IGF-1, אשר מאיץ תהליכי גדילה ושגשוג תאים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: תהליך הפסטור (חימום) הורס ופוגע במבנה הטבעי של חלבוני החלב, ובאנזימים מה שהופך את החלב ל קשה יותר לעיכול (ולא משביח או מקל עליו.)","section":"A","slides":""},{"n":77,"text":"דגי ים עמוק מקבלים את חומצות השומן מסוג אומגה 3 (EPA ו-DHA) באופן טבעי מתוך התזונה, שלהם המבוססת על אצות ימיות. חומצות שומן אלו קריטיות לבריאות, האדם ותורמות משמעותית להתפתחות, המוח לשיפור תפקוד מערכת העצבים ולמניעת תהליכים דלקתיים. הסכנה העיקרית באכילת דגי אוקיינוס היא הרעלת, כספית אך למרבה המזל דגים אלו מכילים גם כמויות גבוהות של ויטמין C, שנקשר לכספית ומנטרל את רעילותה לחלוטין בתוך גוף הדג. עבור, טבעונים צריכת חומצת השומן הצמחית ALA מזרעי פשתן מהווה תחליף, מושלם שכן הכבד האנושי הבוגר ממיר את ה-ALA ל-DHA ביעילות אדירה של למעלה מ-85%.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. דגים נעזרים במינרל סלניום (ולא בויטמין C) כדי לנטרל את רעילות הכספית. 2. יכולת ההמרה של ALA ל-DHA אצל בוגרים היא אפסית עד זניחה (מתחת ל-5%,) ולא למעלה מ-85%.","section":"A","slides":""},{"n":78,"text":"תהליך ההתססה הביתית של ירקות נשען על יצירת סביבה פתוחה ומאווררת, היטב על מנת לאפשר חדירה מקסימלית של חיידקי חומצה לקטית מהאוויר הפתוח אל תוך הצנצנת. המלח המוסף לקדרה בשלבים הראשונים אינו מהווה מזון עבור החיידקים, הפרוביוטיים אלא נועד למשוך נוזלים מהירק (אוסמוזה) ולעכב את צמיחתם של חיידקי ריקבון ועובש. במהלך, ההתססה חיידקי החומצה הלקטית מפרקים את הסוכר הטבעי המצוי בירק ומפרישים חומצה, לקטית הגורמת לצניחה של ה-pH ומשמרת את המזון לאורך זמן רב. צריכת ירקות מותססים אלו מספקת פרוביוטיקה, עשירה מנטרלת את החומצה, הפיטית משפרת את ספיגת המינרלים, בגוף ואף תורמת לייצור רב של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: תהליך ההתססה מחייב יצירת סביבה אנאירובית וסגורה היטב (ללא חמצן) מתחת לפני, המים וחשיפה לאוויר הפתוח תעודד התפתחות של עובש וריקבון.","section":"A","slides":""},{"n":79,"text":"ויטמין B12 הוא ויטמין ייחודי המיוצר בטבע על ידי חיידקים ומיקרואורגניזמים, בלבד ולכן בעלי חיים וצמחים מקבלים אותו מן הסביבה החיצונית או מפלורת המעי שלהם. תהליך הספיגה של הוויטמין מתחיל, בקיבה שם הוא חייב להיקשר לחלבון מיוחד בשם \"הגורם \"הפנימי (Intrinsic Factor) כדי שיוכל לשרוד את המעבר במערכת העיכול., בפועל הוויטמין נספג אל מחזור הדם רק בחלקו האחרון של המעי הדק, (האילאום) ולאחר מכן משונע אל מאגרי הכבד. תוספי התזונה הזולים בשוק מכילים לרוב, ציאנוקובלמין צורה סינתטית אותה הכבד נאלץ להמיר לתרכובת, פעילה תהליך היוצר כמות עצומה וקטלנית של רעל ציאניד המחייבת פינוי דחוף בבית חולים עקב הרעלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: תוסף ציאנוקובלמין מייצר כמות מזערית וזניחה של ציאניד שהגוף מנטרל ומפנה בקלות, רבה ואינו גורם להרעלת ציאניד קטלנית.","section":"A","slides":""},{"n":80,"text":"שיטת התזונה של אן ויגמור (מכון היפוקרטס) מבוססת באופן בלעדי על צריכת מזון חי וטבעוני (Raw Food,) וכוללת שימוש נרחב ויומיומי במיץ עשב, חיטה, נבטים ומזונות מותססים להעצמת כוח הריפוי של הגוף., מנגד שיטתו של הרברט שלטון דוגלת בכללי \"צירופי \"מזון, קפדניים מתוך תפיסה שלכל אב מזון דרישות עיכול כימיות ואנזימטיות שונות. על פי, שלטון הדרך האידיאלית להבטיח בניית מסת שריר תקינה היא דווקא על ידי שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה ממש. כמו, כן שלטון מחייב את מטופליו לשתות לפחות שתי כוסות מים קרים במהלך, הארוחה שכן המים מסייעים בדילול מיצי הקיבה ומונעים תסיסה לא רצויה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת שלטון אוסרת לחלוטין על שילוב של פחמימות מורכבות וחלבונים באותה ארוחה. 2. שלטון אוסר על שתיית מים במהלך הארוחה בדיוק כדי שלא לדלל את מיצי הקיבה ולפגוע בעיכול.","section":"A","slides":""},{"n":81,"text":"פחמימות וקטניות מלאות מכילות כמות יפה של מינרלים חיוניים כגון, ברזל אבץ, וסידן אך הם קשורים לחומצה פיטית המעכבת את ספיגתם במעי. תהליכי השריה והנבטה של קטניות מפעילים אנזימים טבעיים המפרקים את החומצה, הפיטית ובכך משפרים משמעותית את הזמינות הביולוגית של המינרלים. הדרך המהירה והיעילה ביותר לנטרל את החומצה הפיטית לחלוטין היא דווקא על ידי בישול ממושך בחום, גבוה הממיס ומשמיד אותה., בנוסף שילוב של מזון עשיר בוויטמין C יחד עם ארוחת הקטניות מסייע להגביר בצורה ניכרת את ספיגת הברזל מסוג הם-נון (Non-Heme) אל זרם הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: בישול בחום גבוה אינו מנטרל ביעילות את החומצה הפיטית (נדרשת, התססה הנבטה או השריה ממושכת לשם)כך.","section":"A","slides":""},{"n":82,"text":"גישת התזונה החומצית טוענת שמזונות מסוימים (כמו, בשר דגים וגבינות) מייצרים תוצרי לוואי חומציים לאחר תהליך העיכול וחילוף החומרים בגוף. לפי תומכי, הגישה אכילה מרובה של מזונות חלבוניים אלו מובילה לצניחה משמעותית וקבועה ברמת החומציות (pH) של נוזל, הדם מה שמחייב את העצמות לשחרר סידן למחזור הדם כדי לאזן את החומציות., למעשה הפיזיולוגיה האנושית מוכיחה שרמת ה-pH בדם נשמרת קבועה לחלוטין (7.35-7.45) על ידי מנגנוני הפיצוי של הריאות, והכליות ללא קשר לסוג המזון. יתרה, מכך מחקרים מודרניים הוכיחו שתזונה חומצית היא הגורם הישיר והראשוני שהופך תאים בריאים לתאים סרטניים היוצרים גרורות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רמת ה-pH בדם לעולם אינה צונחת לרמות מסוכנות בגלל מזון חומצי. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים (הסרטן עצמו הוא זה שמייצר את החומציות סביבו כאסטרטגיית)הישרדות.","section":"A","slides":""},{"n":83,"text":"הפרוקטוז הוא סוכר-חד המצוי באופן טבעי, בפירות בדבש, ובמייפל ולאחר ספיגתו במעי הוא משונע ישירות אל הכבד לעיבוד מטבולי. צריכת פרוקטוז גורמת לעלייה חדה ומהירה ברמות האינסולין והלפטין, בדם מנגנון המעניק לגוף תחושת שובע ממושכת ויעילה לאחר הארוחה. כאשר הכבד מקבל כמות גדולה של פרוקטוז שאינו יכול להמיר לגלוקוז או לאגור, כגלייקוגן הוא הופך את העודפים הללו לטריגליצרידים. עודפי השומן שנוצרים בכבד עלולים להצטבר בתוכו ולגרום למצב של כבד, שומני או לנדוד במחזור הדם ולהיאגר ברקמות השומן בשאר חלקי הגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: פרוקטוז כמעט ואינו מעלה את רמות האינסולין (בשונה,)מגלוקוז ולכן הוא מפריש פחות לפטין ו אינו יוצר תחושת שובע יעילה.","section":"A","slides":""},{"n":84,"text":"ויטמין B12 הוא בעל מבנה מולקולרי מורכב המכיל אטום קובלט, במרכזו והוא מסונתז בטבע אך ורק על ידי חיידקים ומיקרואורגניזמים. ספיגתו התקינה במערכת העיכול מותנית בקישור לחלבון בשם 'הגורם 'הפנימי (Intrinsic Factor) המופרש מדופנות, הקיבה אך הספיגה לדם מתבצעת בפועל רק בסופו של המעי הדק. אנשים הבוחרים בתזונה טבעונית יכולים לספק את כל תצרוכת הוויטמין הדרושה להם בבטחה באמצעות שילוב יומיומי של אצת, ספירולינה המכילה B12 פעיל וזמין לבני אדם. תוסף התזונה מסוג מתילקובלמין נחשב לנגזרת איכותית, ויעילה שכן הוא מספק את הוויטמין בצורתו הפעילה ואינו דורש תהליך המרה נוסף בכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: ספירולינה ואצות אינן מכילות B12 פעיל לבני, אדם אלא -\"פסאודוB12 \" (אנלוג של הוויטמין) החוסם את הקולטנים ואינו מועיל לגוף.","section":"A","slides":""},{"n":85,"text":"שמן זית נחשב לאחד השמנים הבריאים והמומלצים ביותר, בתזונה שכן הוא עשיר מאוד בחומצת השומן האולאית שהיא חומצת שומן רוויהב-לתי-חד (אומגה 9) השומרת על יציבות יחסית בחימום. כאשר מעוניינים לטגן בשמן עמוק בטמפרטורות, גבוהות מומלץ להשתמש דווקא בשמן זרעי, ענבים מאחר והוא מכיל אחוז עצום של אומגה 6 המעניקה לו עמידות מוחלטת בפני חמצון בחום. שמנים תעשייתיים זולים כגון שמן קנולה ושמן, סויה עוברים לרוב תהליכי זיקוק אגרסיביים הכוללים חימום גבוה וממיסים כימיים כדי לנטרל ריחות ולהאריך חיי מדף. חמצון של שומנים בזרם, הדם ובפרט חמצון של חלקיקי ה-LDL הקטנים, והצפופים הוא גורם משמעותי המוביל ליצירת פלאק טרשתי בדפנות העורקים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שמן זרעי ענבים עשיר באומגה 6)רוויהב-לתי-(רב ולכן הוא מתחמצן מהר מאוד בחום ואינו בטוח או יציב לטיגון עמוק.","section":"A","slides":""},{"n":86,"text":"צריכת בשר מספקת לגוף האדם חלבון מלא בעל ערך ביולוגי, גבוה וכן ברזל ושלל ויטמינים מקבוצת B החשובים לתפקוד מערכת העצבים והדם. הגישה התזונתית של הרמב\"ם תומכת באכילת מזון מן, החי אך הוא ממליץ להעדיף עוף משום שהוא קל יותר, לעיכול ולהימנע ככל האפשר מאכילת בקר שמן בשגרה. כאשר צורכים, בשר איברים פנימיים כדוגמת כבד נחשבים לנקיים ולבריאים ביותר, לאכילה מאחר והם פועלים כמסננת יעילה שרק מעבירה דרכה רעלים מבלי לאגור אותם כלל. צריכת בשר מבקר שרעה באחו וניזון מעשב טבעי (Grass-fed) תספק לאדם יחס תזונתי מאוזן וטוב יותר של חומצות שומן אומגה 3 לעומת אומגה 6, בהשוואה לבקר שפוטם בדגנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: איברים פנימיים כמו כבד וכליות אינם נקיים, אלא הם מסננים שאוגרים בתוכם עומס רב של מתכות כבדות ורעלים שחודרים לגוף החיה.","section":"A","slides":""},{"n":87,"text":"דגי אוקיינוס נחשבים למקור הישיר והטוב ביותר לחומצות שומן מסוג EPA ו-DHA, שאותן הם אינם מייצרים בעצמם אלא מקבלים מתזונתם המבוססת על אצות ימיות. חומצות שומן אלו חיוניות למבנה, המוח לתפקוד מערכת העצבים המרכזית ולהורדת רמות הדלקת בגוף. האתגר המרכזי באכילת דגי ים בימינו הוא נוכחותה של מתכת, הכספית אולם דגים אלו מכילים גם כמות אדירה של ויטמין C שמנטרל לחלוטין את רעילות הכספית במערכת העיכול. גברים ונשים בוגרים שאינם צורכים דגים כלל יכולים לסמוך על צריכת אגוזי מלך, ופשתן שכן הכבד האנושי ממיר בקלות מעל ל-90% מחומצת השומן הצמחית ALA ל-DHA הפעילה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. החומר בדג שמנטרל את רעילות הכספית הוא המינרל סלניום (ולא ויטמין C). 2. יכולת ההמרה של ALA ל-DHA אצל בוגרים היא אפסית וזניחה (לרוב פחות מ-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":88,"text":"צרבת היא תחושת צריבה כואבת באזור החזה, והוושט הנגרמת כאשר תוכן הקיבה החומצי עולה בחזרה כלפי מעלה ופוגע ברירית. בניגוד לדעה הרווחת ולטיפול התרופתי, הנפוץ אצל אנשים רבים הסובלים מצרבת כרונית הבעיה אינה בהכרח עודף של חומצת, קיבה אלא דווקא מחסור בחומציות המונע את סגירתו ההרמטית של השוער התחתון של הוושט. כדי לפתור צרבת במהירות וביעילות לטווח, הארוך ההמלצה הקלינית היא לשתות כוס מים עם שתי כפיות סודה לשתייה מיד לאחר כל, ארוחה שכן היא מרפאת את שורש הבעיה בקיבה., בנוסף נשים בהיריון סובלות לעיתים קרובות מצרבת בשל הלחץ הפיזי שמפעיל הרחם הגדל על, הקיבה וכן בשל שינויים הורמונליים המרפים את השריר השוער.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שתיית סודה לשתייה באופן קבוע מנטרלת את חומצת הקיבה ומקלה, רגעית אך מחמירה את שורש הבעיה לטווח הארוך (שכן היא מורידה עוד יותר את החומציות הנדרשת לסגירת)השוער.","section":"A","slides":""},{"n":89,"text":"תהליך ההתססה הביתית (כגון הכנת כרוב כבוש) מבוסס על יצירת סביבה חסרת, חמצן בתוך צנצנת ומתחת לפני, המים המעודדת שגשוג סלקטיבי של חיידקי חומצה לקטית. המלח שמתווסף לתערובת אינו מהווה מזון לחיידקים, אלו אלא נועד לדכא ולעכב את התפתחותם של חיידקי ריקבון ועובש בשלבי ההתססה הראשונים. ככל שהחיידקים הטובים מתרבים ומפרקים את הסוכר המצוי, בירק הם מפרישים כתוצר לוואי חומצה לקטית המורידה את ה-pH ומשמרת את המזון. ירקות מותססים מספקים לגוף מאות זנים שונים של חיידקים, פרוביוטיים והתהליך עצמו מפרק את החומצה הפיטית וכן מייצר כמויות משמעותיות של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":90,"text":"שיטת שלטון לצירופי מזון קובעת כלל מרכזי לפיו אין לשלב באותה ארוחה פחמימות מורכבות יחד עם חלבונים, מרוכזים משום שהם דורשים אנזימי עיכול שונים וסביבות חומציות סותרות בקיבה., מנגד שיטתה של אן ויגמור (מכון היפוקרטס) מבוססת באופן בלעדי על מזון טבעוני חי (Raw Food,) וכוללת שימוש טיפולי יומי במיץ עשב, חיטה נבטים ונבטוטים. כדי להקל על הטיפול ולהעניק תחושת, שובע מכון היפוקרטס דואג לשלב לפחות ארוחה חמה אחת ביום המורכבת ממרק קטניות ודגנים מבושלים. למרות ההקפדה על תזונה, חיה שיטת ויגמור מעודדת מאוד צריכה יומיומית של מזונות מותססים (כגון כרוב כבוש לא מפוסטר) על מנת לשקם את פלורת המעיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שיטת אן ויגמור מבוססת על Raw Food טבעוני וחי לחלוטין (100%,) ו אינה כוללת כלל ארוחות חמות של מרקים ודגנים מבושלים.","section":"A","slides":""},{"n":91,"text":"צום מים של 36 עד 40 שעות נחשב לכלי טיפולי יעיל המעודד את מנגנון, האוטופגיה בו התאים מפרקים חלבונים פגומים ואברונים מזדקנים. במהלך צום, כזה רמות האינסולין צונחות והגוף עובר בהדרגה לשרוף חומצות שומן וגופי קטון כמקור אנרגיה. מסיבה, זו הורמון הרעב (גרלין) ממשיך לטפס בהתמדה ככל שהצום מתארך אל מעבר ליומיים. כתוצאה, מכך ביום השלישי והרביעי, לצום רוב האנשים יחוו תחושת רעב קשה ובלתי נשלטת שתחייב אותם לשבור את הצום. לאחר שבירת צום מים, ארוך ההמלצה היא לאכול ארוחות קטנות מאוד וקלות לעיכול (כמו,)פירות כדי לא להעמיס על מערכת העיכול ששבתה מפעילות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רמות הגרלין (הורמון הרעב) יורדות ככל שהצום, מתארך ולכן הוא לא מטפס בהתמדה. 2. ביום השלישי לצום רוב האנשים מדווחים כי הרעב הפיזי נעלם לחלוטין, ולא על תחושת רעב בלתי נשלטת.","section":"A","slides":""},{"n":92,"text":"תזונה טבעונית המבוססת על הצומח יכולה לספק לגוף שפע של נוגדי, חמצון סיבים תזונתיים, וויטמינים אך היא דורשת תכנון כדי למנוע חסרים ספציפיים. בניגוד לברזל המצוי, בבשר הברזל המצוי בקטניות ובירקות ירוקים הוא מסוג ברזל ''הם (Heme Iron,) הנספג במעי ביעילות מקסימלית של כ-90% כדי. לשפר את ספיגת המינרלים הללו, מהצומח גישות רבות ממליצות להנביט או להתסיס את הזרעים והקטניות במטרה לנטרל את החומצה הפיטית שמעכבת ספיגה. בנוסף, לכך טבעונים יכולים לספק את כל תצרוכת ויטמין ה-B12 שלהם באופן טבעי, ובטוח באמצעות שילוב יומיומי של אצת ספירולינה המכילה את הוויטמין בצורתו הפעילה לאדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הברזל בקטניות ובירקות ירוקים הוא מסוג הם-נון (Non-Heme) שנספג פחות, טוב ולא ברזל ''הם. 2. אצת ספירולינה מכילה -\"פסאודוB12 \" (אנלוג של הוויטמין) שאינו פעיל בגוף, האדם ולכן אינה מהווה מקור אמין לוויטמין B12.","section":"A","slides":""},{"n":93,"text":"פולי הסויה מכילים תרכובות צמחיות הנקראות פיטואסטרוגנים (ממשפחת, האיזופלבונים כגון,)ג'ניסטאין אשר להן מבנה מרחבי הדומה להורמון האסטרוגן האנושי. בגוף, האדם מולקולות אלו מתפקדות כמודולטורים סלקטיביים של קולטני אסטרוגן (SERMs,) כלומר הן יכולות להפעיל או לחסום את הקולטן בהתאם לסוג הרקמה. ברקמת השד האנושית ישנה דומיננטיות של קולטני אסטרוגן מסוג אלפא. כאשר הפיטואסטרוגנים מהסויה נקשרים לקולטני האלפא, הללו הם לרוב חוסמים את, פעולתם ובכך מספקים לגוף אפקט מגן התורם להאטת שגשוגם של תאים סרטניים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":94,"text":"הפחמימות הפשוטות הנפוצות ביותר בתזונתנו הן סוכרים-חד כגון גלוקוז, ופרוקטוז אשר מתפרקים ונספגים אל מחזור הדם. לאחר אכילת, גלוקוז הלבלב מפריש אינסולין המכניס את הסוכר לתאים ומעודד הפרשת, לפטין מה שתורם לתחושת שובע. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של אינסולין, ולפטין מה שהופך מאכלים עתירי פרוקטוז למשביעים ביותר לטווח ארוך. כאשר עודפי פרוקטוז מגיעים אל הכבד והוא אינו מצליח להמירם לאנרגיה, זמינה הם מומרים באופן בלעדי למאגרי גליקוגן בתוך תאי, השריר שם הם נשמרים כמאגר אנרגיה לשעת חירום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה אינסולין ולפטין בהשוואה, לגלוקוז ולכן הוא משרה פחות תחושת שובע. 2. תאי שריר אינם יכולים לאגור פרוקטוז;כגליקוגן עודפי פרוקטוז מומרים על ידי הכבד ל טריגליצרידים (שומן).","section":"A","slides":""},{"n":95,"text":"איכות השמן הנצרך בתזונה משפיעה עמוקות על בריאות כלי, הדם במיוחד כאשר מדובר בחימום וטיגון היוצרים רדיקלים חופשיים במגע עם חמצן. שמן זית איכותי בכבישה קרה עשיר בחומצת שומן אולאית (אומגה 9,) המעניקה לו יציבות יחסית וטובה בטמפרטורות בישול מתונות. כאשר מעוניינים לטגן בשמן עמוק ובטמפרטורות, גבוהות שמן זרעי ענבים נחשב לבחירה הבטוחה והאידיאלית ביותר משום שהוא חסין לחלוטין מפני התחמצנות. יתרה, מכך שמן קנולה מופק גם הוא אך ורק בתהליך מסורתי וטבעי של כבישה, קרה ללא שום שימוש בממיסים כימיים או בתהליכי דאודוריזציה בחום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן זרעי ענבים עשיר באומגה 6, הוא מתחמצן מהר מאוד בחימום ו אסור לטיגון עמוק. 2. שמן קנולה מופק בתהליך תעשייתי אגרסיבי הכולל חום גבוה וממיסים כימיים, (הקסאן) ולא בכבישה קרה מסורתית.","section":"A","slides":""},{"n":96,"text":"תהליך ההתססה המסורתי של, ירקות כדוגמת הכנת כרוב כבוש, ביתי מתבסס על יצירת סביבה חסרת חמצן לחלוטין בתוך הצנצנת (מתחת לפני הנוזל.) בסביבה אנאירובית, זו חיידקים המצויים באופן טבעי על, הירק הנקראים חיידקי חומצה, לקטית משגשגים ומתרבים ללא מפריע. המלח שמוסיפים לקדרה אינו משמש כמזון לאותם, חיידקים אלא תפקידו למשוך נוזלים מהירק ולעכב חיידקי ריקבון ועובש בשלבי ההתססה הראשונים. במהלך, התהליך חיידקי החומצה הלקטית מפרקים את הסוכר הטבעי, שבכרוב מפרישים חומצה לקטית המורידה את ה-pH, ובמקביל תורמים לנטרול החומצה הפיטית ולייצור ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מפרט את תהליך ההתססה הביתית בצורה מדויקת ושלמה.","section":"A","slides":""},{"n":97,"text":"תיאוריית התזונה בסיסיתה-חומצית גורסת כי מזונות, שונים כגון, בשר דגים, ודגנים משאירים בגוף \"\"אפר מטבולי העשיר בזרחן וגופרית המופרש בסופו של דבר בשתן. אכילה מרובה של מזונות חלבוניים אלו גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח באופן תדיר לרמות מסכנות, חיים מה שמאלץ את העצמות להפריש סידן לדם כחומר סותר חומצה., בפועל הרפואה המודרנית יודעת שרמת החומציות בשתן אכן משתנה בהתאם לתזונה ומשקפת את תהליך הפינוי של, הכלייה אך נוזל הדם נשמר תמיד יציב. עם, זאת הוכח מדעית מעל לכל ספק כי סביבה חומצית הנוצרת ישירות מהמזון שאנו אוכלים היא הגורם המרכזי והישיר שהופך תאים בריאים לתאים סרטניים היוצרים גרורות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח בגלל מזון, חומצי אלא נשמר תמיד יציב הודות לריאות ולכליות. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים, (להיפך הגידול הסרטני הוא שמייצר את הסביבה החומצית בגלל חילוף החומרים האנאירובי)שלו.","section":"A","slides":""},{"n":98,"text":"האיבר העיקרי בגוף הנושא בנטל המרת הרעלים מסיסי השומן למולקולות מסיסות מים הניתנות להפרשה בשתן הוא הכבד. תהליך מורכב זה מתבצע במפעל הכימי של הכבד בשני שלבים, עוקבים הנקראים Phase 1 ו-Phase 2. בשלב הראשון (Phase 1,) הכבד משתמש בשפע של חומצות, אמינו כגון גליצין, וגלוטמין כדי להצמיד לרעלן מולקולה ענקית שהופכת אותו למסיס מים באופן מלא וסופי. במהלך תוכנית אגרסיבית לניקוי, רעלים מומלץ לשתות באופן קבוע מיץ, אשכוליות משום שהוא מכיל חומר בשם ''נרינג'ין אשר ממריץ ומזרז בחוזקה את עבודת אנזימי הציטוכרום P450 של הכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת חומצות אמינו ומולקולה ענקית מתרחשת ב שלב 2 (Phase 2,) ולא בשלב 1. 2. נרינג'ין במיץ אשכוליות מעכב וחוסם את פעילות אנזימי ציטוכרום P450, ולכן אוסרים עליו לחלוטין בזמן ניקוי רעלים (כדי לא לתקוע את שלב 1.)","section":"A","slides":""},{"n":99,"text":"בעולם הבריאות הטבעית התפתחו גישות רבות המנסות להתוות את הדרך האולטימטיבית לאריכות ימים. שיטת התזונה של אן ויגמור (מכון,)היפוקרטס מתבססת באופן בלעדי על צריכת מזון חי וטבעוני (Raw Food,) וכוללת שימוש יומיומי במיץ עשב חיטה ובנבטים. כדי להעניק למטופלים תחושת, שובע מקפידים במכון היפוקרטס להגיש להם מדי יום ארוחת צהריים חמה הכוללת מרק קטניות ודגנים מבושלים., מנגד שיטתו של הרברט שלטון אוסרת לחלוטין על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה, ארוחה מתוך תפיסה שלכל אב מזון דרישות עיכול שונות. כמו, כן שלטון מחייב את מטופליו לשתות לפחות שתי כוסות מים קרים במהלך כל, ארוחה על מנת לדלל את מיצי הקיבה ולמנוע תסיסה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מכון היפוקרטס מבוסס 100% על מזון חי (Raw Food) ולכן מעולם אינו מגיש מרק חם או דגנים מבושלים. 2. שיטת שלטון אוסרת בתכלית האיסור על שתיית מים עם, הארוחה כדי לא לדלל את מיצי הקיבה.","section":"A","slides":""},{"n":100,"text":"הביצה נחשבת לאחד המזונות הדחוסים ביותר מבחינה, תזונתית כאשר כל הכולסטרול וכל תכולת השומן שלה מרוכזים באופן בלעדי בחלמון (הצהוב). בנוסף, לשומנים החלמון מכיל נוגדי חמצון חשובים כדוגמת, לוטאין אשר הספיגה והזמינות הביולוגית שלהם לגוף גבוהה מאוד. למרות עושרו של, החלמון חלבון הביצה (החלק הלבן) נחשב למזין יותר מאחר והוא מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה לצהוב. כדי ליהנות מספיגה אופטימלית של ויטמין הביוטין (B7) המצוי, בחלמון ההמלצה הקלינית היא לצרוך את הביצה כשהיא חיה לחלוטין וללא, חימום שכן החום הורס את הביוטין ומונע ספיגה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ריכוז החלבון הגבוה ביותר ל-100 גרם נמצא דווקא ב חלמון (הצהוב - 17%) ולא בחלבון הלבן (10%.) 2. חובה דווקא לחמם/לבשל את הביצה כדי להרוס את חלבון האבידין שמעכב את, הביוטין ולכן אכילת ביצה חיה תמנע את ספיגת הביוטין. להלן המקבץ עשרה-אחד של ''היגדים מורכבים (101 עד 110,) הממשיך לאתגר אותך עם רזולוציות עמוקות מתוך חומרי הלימוד (שיעורים 18-29.) גם, כאן המלכודות השגויות הוטמנו בקפידה במקומות שונים לחלוטין בתוך הפסקאות. קרא בעיון ונסה לאתר אותן. התשובות וההסברים המלאים מרוכזים יחד בסוף המקבץ.","section":"A","slides":""},{"n":101,"text":"ויטמין B12 המצוי במזון מן החי קשור תמיד, לחלבון ולכן ספיגתו מתחילה בקיבה הדורשת רמת חומציות נאותה ואת האנזים פפסין כדי לנתקו מהחלבון. לאחר, השחרור הוויטמין נקשר בקיבה לחלבון מעבר זמני הנקרא R-binder המגן עליו בסביבה החומצית. כאשר הקומפלקס מגיע, לתריסריון אנזימי הלבלב מפרקים את ה-R-binder, והוויטמין נקשר מיד לחלבון 'הגורם 'הפנימי (Intrinsic Factor.) קומפלקס זה ממשיך את דרכו במעי ונספג אל מחזור הדם כבר בתחילתו של התריסריון ביעילות רבה וללא כל דיחוי. מי שנוטל תוסף תזונה מסוג ציאנוקובלמין יכול להיות, רגוע שכן מדובר בנגזרת פעילה לחלוטין שאינה דורשת שום תהליך המרה נוסף בכבד וזמינה מיידית לשימוש התאים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-B12 נספג אל מחזור הדם רק בסופו של המעי הדק (האילאום סופי,) ולא בתריסריון. 2. תוסף ציאנוקובלמין אינו נגזרת, פעילה אלא תרכובת סינתטית המחייבת תהליך המרה בכבד (למתילקובלמין) לפני שהתאים יכולים להשתמש בה.","section":"A","slides":""},{"n":102,"text":"שומנים במזון רגישים מאוד לתהליכי חמצון כאשר הם נחשפים, לאור לחום, ולחמצן תהליך שפוגע באיכותם ויוצר רדיקלים חופשיים. חומצות שומן, רוויות שאינן מכילות קשרים כפולים במבנה הכימי, שלהן נחשבות ליציבות ביותר ועמידות בפני חמצון בטמפרטורות, גבוהות ולכן שומן רווי (כמו שמן קוקוס) מתאים לבישול., לעומתן חומצות שומן, רוויותב-לתי-חד כמו האומגה 9 המצויה בשמן, זית מכילות קשר כפול אחד ולכן שומרות על יציבות יחסית בחימום מתון. חומצות שומן רוויותב-לתי-רב ממשפחת אומגה 3 ואומגה 6 הן הפגיעות והרגישות ביותר, לחמצון ולכן טיגון ממושך בשמנים אלו (כגון שמן זרעי ענבים או חמניות) גורם ליצירת רעלים מסוכנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":103,"text":"בשר לסוגיו מספק לגוף חלבון מלא בעל ערך ביולוגי, גבוה וכן ברזל מסוג ''הם (Heme) הנספג ביעילות גבוהה במערכת העיכול. על פי גישתו התזונתית של הרמב\"ם לבריאות, איתנה מומלץ לאכול בשר בקר שמן על בסיס יומיומי כדי לשמר את כוחו הפיזי של הגוף ולבנות מסת שריר במהירות. כאשר אדם בוחר לצרוך מזון מן, החי עליו לדעת שאיברים פנימיים כגון כבד צוברים ואוגרים בתוכם עומס רב של רעלים ומתכות כבדות שסוננו במהלך חיי החיה. בניגוד למה שנהוג, לחשוב בשר בקר שניזון מעשב טבעי במרעה פתוח (Grass-fed) זהה לחלוטין בהרכב האומגה 3 שלו לבקר שפוטם בדגנים במכלאות, תעשייתיות ואין ביניהם שום הבדל קליני.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הרמב\"ם התנגד לאכילת בקר שמן יומיומית בשל היותו קשה, לעיכול והמליץ דווקא על עוף בשגרה. 2. בקר הניזון מעשב (Grass-fed) מציג פרופיל חומצות שומן שונה לחלוטין וטוב משמעותית (יותר אומגה 3 ופחות אומגה 6) לעומת בקר שפוטם בדגנים.","section":"A","slides":""},{"n":104,"text":"צום מים הנמשך מעל ל-36 שעות מהווה את אחד הכלים העוצמתיים ביותר להפעלת מנגנון האוטופגיה, בגוף תהליך החיוני לניקוי וריפוי עמוק. בתהליך ניקוי תאי-תוך, זה הגוף מפרק אברונים פגומים וחלבונים ישנים כדי למחזר אותם ולהפיק מהם אנרגיה זמינה לתאים. במהלך, הצום רמות האינסולין צונחות באופן, משמעותי מה שמאפשר לגוף לגשת אל מאגרי השומן שלו ולהתחיל לייצר גופי קטון כדלק חלופי וחיוני למוח. בניגוד לחשש הטבעי מפני רעב הולך, וגובר מחקרים ועדויות קליניות מראים כי רמות הורמון הרעב (גרלין) דווקא יורדות ככל שהצום, מתארך ולכן הרעב הפיזי נעלם כמעט לחלוטין ביום השלישי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מציג בצורה מדויקת את הקשר בין צום מים, ארוך, אוטופגיה וירידת הורמון הגרלין.","section":"A","slides":""},{"n":105,"text":"שיטת התזונה של אן, ויגמור המיושמת במכון היפוקרטס, המפורסם מבוססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food) שלא עבר שום תהליך של חימום או בישול. במסגרת, השיטה חל איסור מוחלט על אכילת מזונות מותססים כגון כרוב, כבוש בטענה שחיידקי החומצה הלקטית משבשים ומזהמים את הפלורה הטבעית של המעיים באדם החולה. לעומת, זאת השיטה מקדמת באופן יומיומי ואינטנסיבי שימוש במיץ עשב, חיטה נבטים ונבטוטים מגוונים להעצמת כוח הריפוי והניקוי של הגוף. כדי להקל על תחושת הרעב של המטופלים במכון ולספק נחמה, פסיכולוגית מקפידים להגיש להם מדי יום ארוחת צהריים חמה אחת הכוללת מרק קטניות עשיר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת אן ויגמור מעודדת ודורשת אכילה יומיומית של מזונות מותססים כדי לשקם את פלורת המעיים. 2. השיטה מבוססת 100% על מזון חי, וקר ולכן לעולם אין בה ארוחות חמות או מרקים מבושלים.","section":"A","slides":""},{"n":106,"text":"דגי אוקיינוס נחשבים למקור, זמין ישיר ועשיר לחומצות השומן החיוניות מסוג EPA ו-DHA, שאותן הם מקבלים ומאגרים ישירות מאכילת אצות ימיות זעירות. חומצות שומן אלו ידועות בתרומתן הקריטית להתפתחות מוח, העובר לשמירה על בריאות כלי, הדם ולהפחתת תהליכי דלקת סיסטמיים בגוף האדם. האתגר המרכזי והמדאיג באכילת דגי ים בימינו הוא נוכחות מתכת הכספית הרעילה במימי, האוקיינוסים אולם למרבה המזל דגים אלו מכילים גם כמות אדירה של ויטמין C הנקשר לכספית ומנטרל את רעילותה לחלוטין. כדי למזער את החשיפה לרעלים ולמתכות, כבדות מומלץ תמיד להעדיף צריכה של דגים קטנים הנמצאים בתחתית שרשרת המזון (כדוגמת,)סרדינים שכן הם צוברים פחות רעלים מדגים טורפים גדולים כגון טונה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: המינרל שמגן על הדג (ועלינו) מפני רעילות, הכספית בכך שהוא נקשר אליה ומנטרל, אותה הוא סלניום, ולא ויטמין C.","section":"A","slides":""},{"n":107,"text":"תיאוריית התזונה החומצית גורסת שמזונות עתירי חלבון כגון, בשר דגים וגבינות משאירים לאחר תהליך חילוף החומרים שאריות מטבוליות)\"(\"אפר עשירות בזרחן וגופרית. צריכה מרובה של חלבונים אלו מובילה לצניחה משמעותית וקבועה ברמת ה-pH של נוזל, הדם מה שמחייב את העצמות לשחרר כמויות אדירות של סידן לזרם הדם על מנת לנטרל את החומציות המסכנת חיים., בפועל הרפואה מודעת לכך שרמת החומציות בשתן אכן משתנה בהתאם לתזונה ומשקפת את תהליך הפינוי התקין של הכלייה, החוצה בעוד נוזל הדם נשאר יציב. מעבר לסכנת דלדול העצם, (אוסטאופורוזיס) הוכח מדעית מעל לכל ספק כי סביבה חומצית הנוצרת ישירות כתוצאה מהמזון שאנו אוכלים היא הגורם הראשוני והישיר שהופך תאים בריאים לתאים סרטניים אלימים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח בעקבות המזון שאנו, אוכלים אלא נשמר תמיד יציב לחלוטין. 2. תזונה חומצית אינה גורמת לתאים להפוך לסרטניים, (להיפך התא הסרטני הוא זה שמייצר את החומציות סביבו כחלק מחילוף החומרים הלקוי)שלו.","section":"A","slides":""},{"n":108,"text":"הכבד פועל כמפעל הסינון הראשי של הגוף וממיר רעלים מסיסי שומן (הנאגרים ברקמות השומן) למולקולות מסיסות מים הניתנות להפרשה קלה ומהירה בשתן או בצואה. תהליך פיזיולוגי מורכב זה מתבצע בשני שלבים, עיקריים כאשר בשלב הראשון (Phase 1) הכבד נעזר באנזימי ציטוכרום P450 כדי ליצור מולקולת, ביניים שלרוב היא אלימה וריאקטיבית בהרבה מהרעלן המקורי. כדי לסייע ולתמוך בכבד בזמן תוכנית אינטנסיבית לניקוי, רעלים מומלץ לשתות באופן קבוע מיץ, אשכוליות משום שהחומר ''נרינג'ין שבו מעודד וממריץ בחוזקה את פעילות אנזימי שלב 1. יתרה, מזאת חובה להקפיד על הימצאות בעודף קלורי משמעותי בימי, הניקוי כדי לספק לגוף את האנרגיה העצומה והזמינה הדרושה לשחרור הרעלים החוצה מתוך רקמות השומן העמוקות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מיץ אשכוליות (בגלל הנרינג'ין) מעכב וחוסם את אנזימי שלב 1 (ציטוכרום P450,) ולכן אוסרים עליו לחלוטין בניקוי רעלים. 2. התנאי הבסיסי לשחרור רעלים מרקמת השומן הוא הימצאות ב גירעון קלורי, ולא בעודף קלורי (שיוביל רק לצבירת שומן נוסף.)","section":"A","slides":""},{"n":109,"text":"פחמימות מורכבות כדוגמת עמילן בנויות משרשראות ארוכות של מולקולות גלוקוז (המחוברות בקשרי,)אלפא אשר מתפרקות במערכת העיכול ונספגות כסוכר זמין אל זרם הדם. סיבים תזונתיים מורכבים גם הם משרשראות של סוכרים (לרוב גלוקוז בקשרי,)בטא אולם גוף האדם חסר לחלוטין את האנזימים הספציפיים הנדרשים לפירוק הקשרים המרחביים הייחודיים שביניהם. סיבים, תוססים כגון, אינולין מהווים מזון ביוטי-פרה נהדר לחיידקי המעי, הגס שמתסיסים אותם ומייצרים בתמורה חומצות שומן קצרות שרשרת התורמות רבות לבריאות רירית המעי ולהפחתת דלקת. צריכת סיבים מסיסים, במים כמו פקטין המצוי בקליפות, תפוחים תורמת להאטת קצב ריקון, הקיבה ובכך מסייעת במיתון העלייה החדה של הסוכר בדם לאחר הארוחה ויוצרת תחושת שובע.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":110,"text":"הכולסטרול הוא מולקולה שומנית חיונית ביותר לבניית קרומי, התאים לייצור הורמוני מין סטרואידיים (כגון אסטרוגן וטסטוסטרון) ולתפקוד תקין של מערכת העצבים והמוח האנושי. חלקיקי ה-LDL תפקידם המרכזי לשנע את הכולסטרול מהכבד אל עבר תאי הגוף, השונים בעוד שחלקיקי ה-HDL אוספים את עודפי הכולסטרול מהתאים ומחזירים אותם לכבד לפינוי. הסכנה להיווצרות טרשת עורקים גוברת במיוחד כאשר חלקיקי ה-LDL בדם הם, גדולים אווריריים וקלים (חלקיקים מסוג A,) שכן הם אלו שנוטים להתחמצן ולשקוע בדפנות כלי הדם במהירות ובקלות רבה. בנוסף, לכך צריכת פרוקטוז מבודד נחשבת למסוכנת לעורקים ולבריאות המטבולית מכיוון שהיא מעוררת עלייה חדה ומסיבית ביותר של הורמון האינסולין, בדם בדומה לתגובה הפיזיולוגית הנגרמת מאכילת גלוקוז טהור.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. חלקיקי ה-LDL המסוכנים שנוטים להתחמצן ולשקוע הם ה קטנים והצפופים (מסוג B,) ולא החלקיקים הגדולים (מסוג A). 2. פרוקטוז כמעט ואינו מעלה את רמות האינסולין (בשונה,)מגלוקוז אלא נשלח ישירות לעיבוד בכבד ועלול להפוך לטריגליצרידים.","section":"A","slides":""},{"n":111,"text":"קטניות ודגנים מלאים מהווים מקור חשוב למינרלים כדוגמת ברזל, ואבץ אך הם מכילים גם חומצה פיטית הנקשרת למינרלים אלו במעי ומונעת את ספיגתם. כדי לנטרל את החומצה הפיטית ביעילות ולהפוך את המינרלים לזמינים עבור, הגוף הדרך המומלצת והיעילה ביותר היא בישול ממושך בטמפרטורות, גבוהות תהליך שמשמיד אותה לחלוטין. גישות תזונה רבות מעודדות לחילופין תהליכי, השריה הנבטה והתססה טבעיים כדי לשפר את הערך התזונתי של הזרעים ולעכל אותם בקלות., בנוסף שילוב של פירות או ירקות העשירים בוויטמין C יחד עם ארוחת הקטניות יגביר באופן משמעותי את ספיגת הברזל מסוג הם-נון (Non-Heme) אל זרם הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: בישול בחום גבוה אינו משמיד או מנטרל את החומצה הפיטית (נדרשת השריה, ממושכת הנבטה או התססה לשם)כך.","section":"A","slides":""},{"n":112,"text":"אכילת בשר מספקת לגוף האדם חלבונים מלאים לבניית, רקמות וכן ברזל מסוג \"\"הם (Heme Iron) הנספג ביעילות גבוהה וללא עכבות במערכת העיכול. על פי גישתו הרפואית של, הרמב\"ם כדי לשמור על גוף חזק ובריא יש להקפיד על אכילת בשר בקר שמן על בסיס יומיומי., מנגד כאשר מדובר על צריכת איברים פנימיים כגון, כבד יש לקחת בחשבון שאיברים אלו מתפקדים כמסננת ואוגרים בתוכם עומס כבד של רעלים ומתכות. במטרה למזער נזקים, דלקתיים מומלץ להעדיף בקר שניזון מעשב טבעי באחו (Grass-fed,) שכן הוא מכיל יחס מאוזן וטוב יותר של חומצות שומן אומגה 3 לאומגה 6 בהשוואה לבקר שפוטם בדגנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: הרמב\"ם התנגד לאכילת בקר שמן יומיומית בשל היותו קשה, לעיכול והמליץ דווקא להעדיף עוף בשגרה.","section":"A","slides":""},{"n":113,"text":"חלב פרה נחשב בתרבות המערבית למקור הסידן, העיקרי ולכן הוא מומלץ לעיתים קרובות למניעת שברים בקרב האוכלוסייה המבוגרת. עם, זאת מחקר האחיות המפורסם של אוניברסיטת, הרווארד שעקב אחרי עשרות אלפי, נשים מצא כי צריכה של שלוש כוסות חלב ביום מפחיתה ב-50% את הסיכון לשברים בצוואר הירך., בנוסף תהליך הפסטור התעשייתי שחלב עובר במחלבות נועד להשביח את המבנה המרחבי של האנזימים הטבעיים, שבו ובכך הוא מקל משמעותית על פירוק החלבון בקיבה. מעבר ללקטוז, ולקזאין חלב מכיל חלבון מי גבינה (Whey) אשר מעלה בחדות את רמות האינסולין בדם וכן מעודד את הכבד לייצר את הורמון הגדילה IGF-1.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות הראה שצריכת חלב אינה מפחיתה שברים בצוואר הירך (ואולי אף מחמירה.) 2. פסטור בחום הורס ומשחית את האנזימים הטבעיים, שבחלב מה שמקשה על העיכול.","section":"A","slides":""},{"n":114,"text":"צום מים ממושך של מעל ל-36 שעות נחשב לכלי טיפולי יעיל המפעיל את מנגנון, האוטופגיה שבו התאים מפרקים חלבונים פגומים ואברונים מזדקנים. במהלך ימי, הצום רמות האינסולין בדם, צונחות מה שמאפשר לגוף לפרק רקמות שומן ולהתחיל בייצור גופי קטון כמקור אנרגיה חלופי וחיוני למוח. למרות היתרונות, הללו הורמון הרעב (גרלין) ממשיך לעלות בהתמדה ככל שהצום, מתארך ולכן ביום השלישי לצום רוב האנשים מדווחים על רעב קיצוני ובלתי נשלט. בכדי לצאת מצום מים ארוך, בבטחה ההמלצה הקלינית היא לשבור את הצום בהדרגה, רבה רצוי באמצעות ארוחות קטנות מאוד כדוגמת, פירות על מנת שלא להעמיס על מערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: הורמון הגרלין (רעב) יורד ככל שהצום, מתארך ולכן ביום השלישי הרעב הפיזי לרוב נעלם לחלוטין (ולא הופך לבלתי נשלט.)","section":"A","slides":""},{"n":115,"text":"נטרול רעלים מסיסי שומן מתבצע בעיקר במפעל הכימי של, הכבד במטרה להמיר אותם למולקולות מסיסות מים שניתן יהיה להפריש החוצה דרך השתן. התהליך מורכב משני שלבים, עיקריים כאשר בשלב הראשון (Phase 1) הכבד נעזר באנזימי ציטוכרום P450 כדי ליצור מולקולת, ביניים שלרוב היא רעילה וריאקטיבית יותר מהרעלן המקורי. כדי לתמוך בכבד ולזרז את פעילות האנזימים בשלב, הראשון ההמלצה היא לשתות מיץ אשכוליות מדי יום לאורך תוכנית הניקוי. יתרה, מזאת חובה להקפיד על הימצאות בעודף קלורי משמעותי בימי, הניקוי כדי לספק לגוף את האנרגיה הדרושה לשחרור הרעלים מתוך רקמות השומן העמוקות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מיץ אשכוליות (בגלל הנרינג'ין) מעכב וחוסם את פעילות אנזימי שלב 1, ואסור לצריכה בניקוי רעלים. 2. ניקוי רעלים משומן מחייב הימצאות ב גירעון קלורי, ולא בעודף קלורי (שיוביל רק לצבירת שומן נוסף.)","section":"A","slides":""},{"n":116,"text":"הכולסטרול הוא מולקולה שומנית החיונית לבניית קרומי התאים ולייצור הורמונים, סטרואידיים ותפקידם של חלקיקי ה-LDL הוא לשנע אותו מהכבד אל עבר רקמות הגוף. חלקיקי ה-HDL, לעומת, זאת פועלים כמנגנון פינוי יעיל ואוספים את עודפי הכולסטרול מהתאים בחזרה אל הכבד. הסכנה להתפתחות טרשת עורקים עולה משמעותית דווקא כאשר חלקיקי ה-LDL בדם הם, גדולים קלים ואווריריים (מסוג A,) שכן הם אלו שנוטים לשקוע בעורקים ולהתחמצן במהירות., בנוסף חשיפת חלקיקי ה-LDL לרמות גבוהות של סוכרים בדם יוצרת תהליך הרסני הנקרא, גליקציה אשר פוגע במבנה, החלקיק מעכב את זיהויו על ידי קולטני, הכבד ומאיץ את שקיעתו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: חלקיקי ה-LDL שנוטים לשקוע ולהתחמצן במהירות הם דווקא החלקיקים ה קטנים והצפופים (מסוג B,) ולא הגדולים והאווריריים (מסוג A.)","section":"A","slides":""},{"n":117,"text":"תיאוריית התזונה החומצית טוענת שמזונות כגון, בשר עוף ודגנים משאירים שאריות מטבוליות העשירות בזרחן וגופרית המופרשות בסופו של דבר בשתן. תומכי הגישה גורסים כי צריכה מרובה של חלבונים אלו גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח באופן תדיר לרמות חומציות המסכנות חיים. כתוצאה, מכך הם טוענים שהעצמות נאלצות לשחרר כמויות אדירות של סידן לתוך זרם הדם כדי לאזן את, החומציות מה שמוביל לאוסטאופורוזיס., למעשה הוכח מדעית מעל לכל ספק כי סביבה חומצית הנוצרת ישירות מהמזון שאנו אוכלים היא הגורם הראשוני והמרכזי שהופך תאים בריאים לתאים סרטניים ממאירים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רמת ה-pH של נוזל הדם לעולם אינה צונחת בגלל מזון, חומצי אלא נשמרת יציבה לחלוטין. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים, (להיפך הסרטן עצמו מייצר את הסביבה)החומצית.","section":"A","slides":""},{"n":118,"text":"פולי הסויה נחשבים למקור חלבון צמחי, איכותי והם עשירים בפיטואסטרוגנים ממשפחת האיזופלבונים המהווים מודולטורים סלקטיביים (SERMs.) למולקולות אלו ישנו מבנה מרחבי הדומה לאסטרוגן, האנושי מה שמאפשר להן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה הספציפית. בבני, אדם צריכת סויה מעודדת שגשוג אגרסיבי של תאי סרטן, השד מכיוון שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא הנפוצים ברקמה זו. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג גרנולוזה מומלץ דווקא להרבות בצריכת, סויה שכן היא מגינה על השחלות ומונעת את חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. בבני, אדם הפיטואסטרוגנים של הסויה חוסמים את רצפטורי האלפא בשד ומספקים אפקט מגן (לא מעודדים שגשוג.) 2. לנשים שהחלימו מסרטן מסוג גרנולוזה אסור לחלוטין לצרוך, סויה כיוון שהיא מפעילה שם את רצפטורי הבטא.","section":"A","slides":""},{"n":119,"text":"דגי אוקיינוס נחשבים למקור תזונתי מצוין לחומצות השומן EPA ו-DHA, החיוניות לתפקוד המוח ולמניעת, דלקות שאותן הם צוברים באופן טבעי מאכילת אצות ימיות. הסכנה העיקרית באכילת דגי ים היא הרעלת כספית הפוגעת במערכת, העצבים אך למרבה המזל בשר הדג מכיל רמות גבוהות של ויטמין C שמנטרל את רעילותה לחלוטין. טבעונים הנמנעים מדגים יכולים לקבל את כל תצרוכת ה-DHA שלהם מאגוזי מלך, ומפשתן שכן הכבד האנושי ממיר מעל ל-85% מחומצת ה-ALA ל-DHA פעילה ללא כל קושי. בכדי למזער נזקים, פוטנציאליים ההמלצה הקלינית היא להעדיף צריכה של דגים קטנים הממוקמים בתחתית שרשרת, המזון דוגמת, סרדינים שכן הם צוברים פחות רעלים לעומת דגים טורפים ענקיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. המינרל שמנטרל את רעילות הכספית בדג הוא סלניום (ולא ויטמין C). 2. שיעור ההמרה של ALA ל-DHA אצל בוגרים הוא אפסי וזניח (מתחת ל-5%,) ולא מעל 85%.","section":"A","slides":""},{"n":120,"text":"פחמימות פשוטות מגיעות בצורת סוכרים-חד כדוגמת גלוקוז, ופרוקטוז והן נספגות במהירות למחזור הדם לאחר תהליך העיכול במעי. בניגוד, לגלוקוז צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של הורמון, האינסולין מה שמעודד הפרשת לפטין ותורם לתחושת שובע ממושכת מאוד. הכבד מטפל בעודפי הפרוקטוז הללו על ידי המרתם המהירה לטריגליצרידים, (שומנים) אשר עלולים להצטבר ולגרום להתפתחות של כבד שומני או לנדוד ולהיאגר ברקמות השומן. משום, כך סירופ, אגבה המשווק לרוב כמוצר, טבעי נחשב לממתיק המומלץ והבריא ביותר משום שהוא מורכב מגלוקוז טהור ואינו מכיל פרוקטוז כלל.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה את רמות האינסולין בהשוואה, לגלוקוז ולכן אינו מעודד מספיק הפרשת לפטין ולא יוצר תחושת שובע ממושכת. 2. סירופ אגבה נחשב לממתיק בעייתי ביותר משום שהוא מכיל ריכוז אדיר של פרוקטוז (70% - 90%,) ולא גלוקוז טהור.","section":"A","slides":""},{"n":121,"text":"סויה מכילה פיטואסטרוגנים בשם, איזופלבונים בעלי מבנה מרחבי הדומה מאוד לאסטרוגן האנושי. מולקולות צמחיות אלו פועלות בגוף כמודולטורים סלקטיביים (SERMs,) כלומר הן מסוגלות להפעיל או לחסום קולטני אסטרוגן בהתאם לרקמה. ברקמת, העצם בה קיימים בעיקר קולטני, בטא פיטואסטרוגנים מסויה חוסמים את הרצפטורים הללו ומאיצים תהליכי דלדול עצם (אוסטאופורוזיס) בגיל המעבר. לגבי סרטן, השד מכיוון שברקמה זו שולטים רצפטורי, אלפא הפיטואסטרוגנים מפעילים אותם בחוזקה וגורמים לשגשוג תאים סרטניים מהיר אצל נשים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ברקמת העצם (רצפטורי,)בטא סויה דווקא מפעילה את הקולטנים ועוזרת לשמור על צפיפות העצם (ולא מאיצה אוסטאופורוזיס.) 2. ברקמת השד בבני אדם (רצפטורי,)אלפא סויה דווקא חוסמת את הקולטנים ומהווה אפקט מגן (ולא מפעילה אותם לשגשוג סרטני.)","section":"A","slides":""},{"n":122,"text":"התססת כרוב ביתית דורשת יצירת סביבה אנאירובית (ללא,)חמצן מתחת לפני, הנוזל כדי שחיידקי חומצה לקטית יוכלו לשגשג. במהלך, ההתססה חיידקים אלו ניזונים מהסוכר הטבעי המצוי בכרוב ומפרישים חומצה לקטית המורידה את רמת החומציות (pH) בצנצנת. רמת החומציות, הנמוכה יחד עם המלח שהוספנו בתחילת, התהליך מונעת התפתחות ושגשוג של חיידקי ריקבון ועובש שאינם רצויים. אכילת כרוב כבוש ביתי על בסיס קבוע מספקת לגוף מגוון רחב של חיידקים פרוביוטיים מעולים ומסייעת בייצור טבעי של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":123,"text":"ויטמין B12 מסונתז בטבע אך ורק על ידי חיידקים, ומיקרואורגניזמים ולכן הוא אינו מיוצר עצמאית על ידי צמחים או בעלי חיים. כדי לספוג את הוויטמין בגוף, האדם הקיבה מפרישה את חלבון ה-R-binder אשר מוביל את הוויטמין עד לספיגתו הסופית בתחילת המעי הדק (התריסריון). טבעונים יכולים להשיג את כל תצרוכת ה-B12 שלהם בבטחה וללא חסרים מאצות כגון, ספירולינה המכילות את הוויטמין בצורתו הפעילה והזמינה. תוסף התזונה מתילקובלמין נחשב לתוסף איכותי במיוחד משום שהוא מגיע בגירסתו הפעילה של הוויטמין ואינו דורש תהליכי המרה (מתילציה) נוספים בכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הספיגה הסופית של ויטמין B12 אל הדם נעשית ב סוף המעי הדק (באילאום) כשהוא קשור ל-Intrinsic Factor, ולא בתריסריון דרך R-binder. 2. אצת ספירולינה מכילה 'פסאודו B12 ' (אנלוג לא,)פעיל ולכן אינה מהווה מקור אמין או זמין לטבעונים.","section":"A","slides":""},{"n":124,"text":"חומצות שומן, רוויותב-לתי-חד כגון חומצה אולאית (אומגה 9) המצויה בשמן, זית מכילות קשר כפול אחד ולכן נחשבות ליציבות יחסית בחימום ולמתאימות לבישול., לעומתן שמנים תעשייתיים זולים כמו שמן סויה וקנולה עוברים תהליך מיצוי מסורתי בכבישה קרה, בלבד כדי לשמור על צבעם הבהיר ועל נוגדי החמצון שבהם. כאשר מעוניינים לטגן בשמן עמוק ובטמפרטורה גבוהה, מאוד שמן זרעי ענבים הוא הבחירה הבטוחה ביותר משום שהוא מכיל ריכוז עצום של אומגה 6 שעמידה לחלוטין בפני חמצון. חמצון של שומנים בזרם, הדם ובפרט חמצון של חלקיקי ה-LDL הקטנים, והצפופים הוא הגורם המרכזי המוביל ליצירת פלאק טרשתי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמנים תעשייתיים (סויה/קנולה) עוברים תהליך אגרסיבי של, זיקוק חימום גבוה וממיסים כימיים, ולא כבישה קרה מסורתית. 2. שמן זרעי ענבים עשיר מאוד באומגה 6,)רוויב-לתי-(רב ולכן הוא מתחמצן בקלות ואינו בטוח לטיגון עמוק.","section":"A","slides":""},{"n":125,"text":"מטרתו המרכזית של תהליך ניקוי הרעלים בכבד היא להמיר רעלים מסיסי שומן (הנאגרים ברקמות) למולקולות מסיסות מים שניתן להפריש החוצה דרך השתן. התהליך הכימי הזה מתבצע בשני, שלבים כאשר בשלב הראשון (Phase 1) הכבד משתמש בחומצות אמינו כגון גליצין וגלוטמין כדי להצמיד מולקולה גדולה לרעלן ולהפוך אותו למסיס מים באופן מלא. כדי לתמוך בפעילות הכבד ולהאיץ את תהליך הניקוי בשלביו, הראשונים מומלץ מאוד לשתות מיץ אשכוליות על בסיס, יומיומי שכן חומר הנרינג'ין שבו ממריץ את אנזימי הציטוכרום P450 חובה. לזכור שרק במצב של גירעון קלורי רקמות השומן מתפרקות ומשחררות את הרעלים הכלואים בהן אל מחזור הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת מולקולה גדולה וחומצות אמינו מתרחשת ב שלב השני (Phase 2,) ולא בשלב הראשון. 2. מיץ אשכוליות מכיל נרינג'ין שדווקא חוסם ומעכב את אנזימי שלב 1, ולכן אוסרים עליו לחלוטין בזמן ניקוי רעלים.","section":"A","slides":""},{"n":126,"text":"חלב פרה נחשב בתרבות המערבית למקור משמעותי ועיקרי, לסידן וארגוני בריאות רבים ממליצים על צריכתו לשמירה על בניית העצם. עם, זאת מחקר האחיות המפורסם של אוניברסיטת הרווארד הוכיח ששתיית שלוש כוסות חלב ביום מחזקת את העצמות ומפחיתה ב-50% את הסיכון לשברים בצוואר הירך אצל נשים מבוגרות. חלבוני, החלב ובפרט חלבון מי הגבינה (Whey,) מעלים בחדות את רמות האינסולין בדם לאחר, הארוחה ובמקביל הם מדכאים לחלוטין את ייצור ההורמון IGF-1, בכבד מה שמפחית את הסיכון להתפתחות גידולים סרטניים., בנוסף חלבונים אלו יוצרים אפקט של גדילה ושגשוג תאים שאינו מומלץ לאנשים מבוגרים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות של הרווארד מצא שחלב לא מפחית שברים (ואף עלול להעלות את הסיכון להם.) 2. חלבון מי הגבינה (Whey) דווקא מעלה מאוד את ייצור ההורמון IGF-1 המעודד שגשוג תאים (ולא מדכא אותו.)","section":"A","slides":""},{"n":127,"text":"שיטת התזונה של אן, ויגמור המיושמת במכון, היפוקרטס מבוססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food,) וכוללת שימוש יומיומי במיץ עשב, חיטה נבטים ומזונות מותססים (כגון כרוב כבוש.), מנגד שיטת שלטון מבוססת על עקרונות נוקשים של צירופי, מזון מתוך הנחה שכל אב מזון דורש סביבת חומציות ואנזימי עיכול שונים. על פי, שלטון הדרך הטובה ביותר לספוג חלבון היא לשלב פחמימות מורכבות יחד עם חלבונים מרוכזים באותה ארוחה, ממש כדי להשלים חומצות אמינו., בנוסף השיטה של ויגמור נעזרת גם בטכניקות של ניקוי רעלים עמוקות כמו צומות מים ממושכים ללא הגבלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שיטת שלטון אוסרת באופן מוחלט על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה. 2. שיטת אן ויגמור (היפוקרטס) לא מאמינה בצומות מים אלא בהזנה אינטנסיבית של מיצים ונבטים חיים.","section":"A","slides":""},{"n":128,"text":"הביצה נחשבת למזון מזין ודחוס, מאוד כאשר מרבית, הוויטמינים כל, הכולסטרול וכל השומן שבה מרוכזים אך ורק בחלמון (הצהוב). החלמון מכיל נוגדי חמצון חשובים כגון לוטאין, וזקסנטין והספיגה שלהם מהביצה אל הדם נחשבת ליעילה מאוד בהשוואה למקורות, צמחיים בין היתר משום שאין בהם כלורופיל המעכב את ספיגתם. על מנת לספוג כראוי את הוויטמין ביוטין (B7) המצוי, בחלמון חובה לחמם או לבשל את הביצה לטמפרטורה גבוהה. החימום עושה תהליך של דנטורציה לחלבון בשם ''אבידין המצוי בחלבון (הלבן) של, הביצה ובכך משחרר את הביוטין ומונע ממנו להיקשר ולהיחסם במערכת העיכול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":129,"text":"דגי הים העמוק מהווים מקור חשוב ומרכזי לחומצות שומן מסוג EPA ו-DHA, שאותן הם מייצרים באופן טבעי בכבד שלהם כחלק מחילוף החומרים הבסיסי מבלי להזדקק למקור חיצוני. אחת הסכנות העיקריות באכילת דגי אוקיינוס גדולים היא הרעלת, כספית אך דגים אלו עשירים בוויטמין C טבעי שנקשר לכספית בגופם ומנטרל את השפעתה העצבית לחלוטין. עבור טבעונים הנמנעים, מדגים צריכת זרעי פשתן ואגוזי מלך מבטיחה אספקה, מספקת שכן גוף האדם הבוגר ממיר ביעילות אדירה של מעל ל-90% את חומצת השומן הצמחית ALA ל-DHA., ככלל כדי למזער את החשיפה, לרעלים מומלץ תמיד לצרוך דגים קטנים יותר הנמצאים בתחתית שרשרת המזון.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 3 טעויות, (כן !שלוש:) 1. דגים אינם מייצרים אומגה 3, אלא מקבלים אותה מאכילת אצות. 2. החומר בדג שמנטרל כספית הוא סלניום, ולא ויטמין C. 3. שיעור ההמרה של ALA ל-DHA באדם בוגר הוא אפסי וזניח (מתחת ל-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":130,"text":"הפחמימות הפשוטות הנפוצות בתזונתנו הן גלוקוז, ופרוקטוז הנספגות במעי ומגיעות אל זרם הדם. לאחר צריכת, גלוקוז הלבלב מפריש אינסולין המסייע לסוכר להיכנס, לתאים וכן מעודד הפרשת לפטין התורם באופן ישיר ליצירת תחושת שובע במוח. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של רמות האינסולין, והלפטין ולכן מאכלים עתירי פרוקטוז משביעים הרבה יותר ולאורך זמן רב יותר מאשר גלוקוז. כאשר עודפי פרוקטוז מגיעים אל הכבד והוא אינו יכול להמירם, לאנרגיה הם נאגרים ישירות בתוך תאי השריר בצורה של גליקוגן צפוף כמאגר לשעת חירום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז מבודד כמעט ו אינו מעלה את רמות האינסולין (בשונה,)מגלוקוז ולכן הוא לא יוצר תחושת שובע יעילה. 2. עודפי פרוקטוז בכבד מומרים ל טריגליצרידים (שומן,) ולא נאגרים כגליקוגן בתאי השריר.","section":"A","slides":""},{"n":131,"text":"צרבת היא תחושת צריבה כואבת באזור החזה, והוושט הנגרמת כאשר תוכן הקיבה החומצי עולה כלפי מעלה ופוגע ברירית הרגישה. בניגוד לדעה, הרווחת אצל אנשים רבים הסובלים מצרבת כרונית הבעיה אינה נובעת מעודף של חומצת, קיבה אלא דווקא ממחסור בחומציות המונע את סגירתו ההרמטית של השוער התחתון. כדי לפתור את הצרבת ביעילות ולרפא את שורש הבעיה לטווח, הארוך ההמלצה הקלינית היא לשתות כוס מים עם שתי כפיות סודה לשתייה לאחר כל ארוחה. יתרה, מכך נשים בהיריון כמעט ולעולם אינן סובלות, מצרבת משום שהשינויים ההורמונליים בגופן מכווצים ומחזקים את שריר השוער התחתון באופן טבעי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. סודה לשתייה מקלה רגעית אך מנטרלת את חומצת הקיבה ובכך מחמירה את שורש הבעיה לטווח הארוך (שהרי הבעיה היא חוסר חומציות.) 2. נשים בהיריון סובלות מאוד מצרבת בגלל לחץ פיזי של הרחם ומשום שפרוגסטרון דווקא מרפה את שריר השוער.","section":"A","slides":""},{"n":132,"text":"הגלוטן הוא חלבון המצוי בדגנים כגון, חיטה, כוסמין שיפון, ושעורה והוא זה המעניק לבצק את תכונות הגמישות והאלסטיות הנדרשות לאפייה. אצל חולי, צליאק חשיפה לכמות מזערית של גלוטן מעוררת תגובה אוטואימונית הגורמת לפגיעה חמורה בסיסי המעי הדק. לחם כוסמין נחשב לבריא ומומלץ, במיוחד משום שכוסמין הוא דגן נטול גלוטן לחלוטין ולכן מאפיו בטוחים לחלוטין לאכילה עבור חולי צליאק. בנוסף, לכך קליית פרוסות הלחם בטוסטר עד להשחמה יוצרת חומר בשם, אקרילאמיד אשר הוכח במחקרים כנוגד חמצון עוצמתי המגן על הגוף מפני התפתחות תאים סרטניים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. חיטת כוסמין מכילה גלוטן לכל דבר ועניין ולכן מאפיה אסורים לחלוטין על חולי צליאק. 2. אקרילאמיד (הנוצר בהשחמת לחם) אינו נוגד חמצון אלא חומר רעיל ומסרטן.","section":"A","slides":""},{"n":133,"text":"שיטת שלטון לצירופי מזון קובעת כלל ברור האוסר לחלוטין על שילוב של פחמימות מורכבות וחלבונים מרוכזים באותה ארוחה בשל דרישות עיכול שונות., מנגד שיטתה של אן ויגמור המיושמת במכון היפוקרטס מתבססת באופן בלעדי על צריכת מזון טבעוני חי (Raw Food) ומיץ עשב חיטה. כדי להקל על המטופלים ולהעניק להם תחושת שובע, ונחמה מקפידים במכון להגיש מדי יום ארוחת צהריים חמה הכוללת מרק קטניות ודגנים מבושלים., בנוסף על פי שיטת שלטון חובה לשתות לפחות שתי כוסות מים קרים במהלך הארוחה על מנת לדלל את מיצי הקיבה ולמנוע תסיסה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מכון היפוקרטס (אן ויגמור) דוגל ב-100% מזון, חי ולכן לעולם אין בו ארוחות חמות של קטניות מבושלות. 2. שיטת שלטון אוסרת בתכלית האיסור לשתות מים במהלך הארוחה כדי לא לדלל את מיצי הקיבה.","section":"A","slides":""},{"n":134,"text":"צום מים ממושך של מעל ל-36 שעות נחשב לכלי טיפולי עוצמתי המפעיל ביעילות את מנגנון האוטופגיה בגוף. בתהליך ניקוי תאי-תוך, זה התאים מפרקים אברונים פגומים וחלבוני פסולת ישנים על מנת למחזר אותם ולהפיק מהם אנרגיה. במהלך ימי, הצום רמות האינסולין צונחות, משמעותית מה שמאפשר לגוף לגשת למאגרי השומן ולהתחיל בייצור גופי קטון כמקור דלק חלופי למוח. בניגוד לחשש, הטבעי מחקרים ועדויות קליניות מראים כי רמות הורמון הרעב (גרלין) דווקא יורדות ככל שהצום, מתארך ולכן הרעב הפיזי נעלם כמעט לחלוטין ביום השלישי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":135,"text":"פולי הסויה מהווים מקור חלבון צמחי איכותי והם עשירים בפיטואסטרוגנים ממשפחת האיזופלבונים המתפקדים כמודולטורים סלקטיביים (SERMs.) למולקולות אלו ישנו מבנה מרחבי הדומה לאסטרוגן, האנושי המאפשר להן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה. בבני, אדם צריכת סויה מעודדת שגשוג אגרסיבי של תאי סרטן, השד מכיוון שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא הנפוצים ברקמה זו. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג גרנולוזה מומלץ דווקא להרבות בצריכת, סויה שכן היא מגינה על השחלות ומונעת את חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. בבני, אדם הפיטואסטרוגנים של הסויה חוסמים את רצפטורי האלפא בשד ומהווים אפקט מגן (ולא מעודדים סרטן.) 2. בסרטן מסוג גרנולוזה אסור לחלוטין לצרוך סויה כי היא מפעילה שם את רצפטורי הבטא ומעודדת שגשוג.","section":"A","slides":""},{"n":136,"text":"תהליך נטרול הרעלים מסיסי השומן מתבצע בעיקר במפעל הכימי של הכבד במטרה להמירם למולקולות מסיסות מים שניתן להפריש בשתן. בשלב הראשון (Phase 1,) הכבד משתמש בשפע של חומצות אמינו כגון גליצין וגלוטמין כדי להצמיד לרעלן מולקולה ענקית שהופכת אותו למסיס מים באופן מלא. כדי לתמוך בפעילות הכבד ולהאיץ את תהליך הניקוי בשלביו, הראשונים מומלץ לשתות מיץ אשכוליות מדי, יום שכן חומר הנרינג'ין שבו ממריץ בחוזקה את אנזימי הציטוכרום P450 יחד. עם, זאת התנאי הבסיסי לשחרור הרעלים הללו מתוך רקמות השומן אל מחזור הדם הוא הימצאות האדם בגירעון קלורי משמעותי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת חומצות אמינו ומולקולה ענקית היא הפעולה של שלב 2 (Phase 2,) ולא שלב 1. 2. הנרינג'ין באשכוליות מעכב וחוסם את פעילות אנזימי הציטוכרום P450, ולכן מיץ אשכוליות אסור לחלוטין בניקוי רעלים.","section":"A","slides":""},{"n":137,"text":"תהליך ההתססה המסורתי של, ירקות כדוגמת הכנת כרוב כבוש, ביתי מתבסס על יצירת סביבה חסרת חמצן לחלוטין מתחת לפני הנוזל. בסביבה אנאירובית, זו חיידקי חומצה לקטית המצויים באופן טבעי על הירק משגשגים ומתרבים ללא מפריע. המלח שמוסיפים לקדרה אינו משמש כמזון לאותם, חיידקים אלא תפקידו המרכזי הוא למשוך נוזלים מהירק ולעכב חיידקי ריקבון ועובש. במהלך, התהליך החיידקים מפרקים את הסוכר, הטבעי מפרישים חומצה לקטית המורידה את ה-pH, ובמקביל תורמים לנטרול החומצה הפיטית ולייצור ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":138,"text":"הביצה נחשבת לאחד המזונות הדחוסים ביותר מבחינה, תזונתית כאשר כל הכולסטרול וכל תכולת השומן שלה מרוכזים באופן בלעדי בחלמון הצהוב. למרות עושרו של, החלמון חלבון הביצה (החלק הלבן) נחשב למזין יותר מאחר והוא מכיל ריכוז גבוה בהרבה של חלבון ל-100 גרם בהשוואה לצהוב. בנוסף, לשומנים החלמון מכיל נוגדי חמצון חשובים כדוגמת, לוטאין אשר הספיגה והזמינות הביולוגית שלהם לגוף גבוהה מאוד. עם, זאת כדי ליהנות מספיגה אופטימלית של ויטמין הביוטין (B7) המצוי, בחלמון ההמלצה הקלינית היא לצרוך את הביצה כשהיא חיה לחלוטין וללא, חימום שכן החום הורס את הביוטין ומונע ספיגה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ריכוז החלבון הגבוה ביותר ל-100 גרם נמצא דווקא ב חלמון -(כ17%) ולא בחלבון הלבן -(כ10%.) 2. חובה לחמם ולבשל את הביצה כדי להרוס את האבידין ולשחרר את הביוטין לספיגה (אכילת ביצה חיה תמנע את ספיגתו.)","section":"A","slides":""},{"n":139,"text":"דגי הים העמוק מהווים מקור חשוב ומרכזי לחומצות שומן מסוג EPA ו-DHA, שאותן הם מייצרים באופן טבעי בכבד שלהם כחלק מחילוף החומרים הבסיסי מבלי להזדקק למקור חיצוני. אחת הסכנות העיקריות באכילת דגי אוקיינוס גדולים היא הרעלת, כספית אך דגים אלו עשירים בוויטמין C טבעי שנקשר לכספית בגופם ומנטרל את השפעתה העצבית לחלוטין. עבור טבעונים הנמנעים, מדגים צריכת זרעי פשתן ואגוזי מלך מבטיחה אספקה, מספקת שכן גוף האדם הבוגר ממיר ביעילות אדירה של מעל ל-85% את חומצת השומן הצמחית ALA ל-DHA., ככלל כדי למזער את החשיפה לרעלים ולמתכות, כבדות מומלץ תמיד לצרוך דגים קטנים יותר הנמצאים בתחתית שרשרת המזון.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 3 טעויות: 1. דגים אינם מייצרים אומגה 3, אלא מקבלים אותה מאכילת אצות. 2. החומר בדג שמנטרל כספית הוא סלניום ולא ויטמין C. 3. שיעור ההמרה של ALA ל-DHA אצל בוגרים הוא אפסי וזניח <(5%,) ולא מעל 85%.","section":"A","slides":""},{"n":140,"text":"הפחמימות הפשוטות הנפוצות בתזונתנו הן גלוקוז, ופרוקטוז הנספגות במעי ומגיעות אל זרם הדם כמקור אנרגיה. לאחר צריכת, גלוקוז הלבלב מפריש אינסולין המסייע לסוכר להיכנס, לתאים וכן מעודד הפרשת לפטין התורם ליצירת תחושת שובע. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של רמות האינסולין, והלפטין ולכן מאכלים עתירי פרוקטוז משביעים הרבה יותר ולאורך זמן. כאשר עודפי פרוקטוז מגיעים אל, הכבד הם נאגרים ישירות בתוך תאי השריר בצורה של גליקוגן;צפוף משום, כך סירופ אגבה נחשב לממתיק המומלץ והבריא ביותר מאחר והוא מורכב מגלוקוז טהור ללא פרוקטוז.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 3 טעויות: 1. פרוקטוז כמעט ואינו מעלה אינסולין ולכן לא יוצר תחושת שובע. 2. הכבד ממיר עודפי פרוקטוז ל טריגליצרידים (שומנים) ולא לגליקוגן בשריר. 3. סירופ אגבה מכיל ריכוז עצום של פרוקטוז (70% - 90%) ולכן הוא בעייתי, מאוד ולא גלוקוז טהור.","section":"A","slides":""},{"n":141,"text":"צום מים ממושך של 36 עד 40 שעות נחשב לטריגר העוצמתי ביותר להפעלת מנגנון האוטופגיה (ניקוי תאי-תוך) בגופנו. במהלך, הצום רמות האינסולין צונחות והגוף מתחיל לפרק רקמות שומן ולייצר גופי קטון כמקור אנרגיה למוח. בניגוד למיתוס, הרווח מחקרים מראים כי רמות הורמון הרעב (גרלין) דווקא הולכות ועולות בהתמדה ככל שהצום, מתארך ולכן היום השלישי הוא תמיד הקשה ביותר. למרות היתרונות העצומים של הצום בשיקום, הפיזיולוגי חובה לזכור כי אנשים, משקלב-תת נשים בהיריון ואנשים הסובלים מהפרעות אכילה מנועים לחלוטין מלבצע צומות אלו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מחקרים מראים שרמות הגרלין (הורמון הרעב) יורדות ככל שהצום, מתארך ולכן ביום השלישי הרעב הפיזי דווקא נעלם (ולא הופך לקשה ביותר.)","section":"A","slides":""},{"n":142,"text":"איכות השמן שאנו צורכים משפיעה רבות על, בריאותנו במיוחד כאשר חושפים אותו לטמפרטורות גבוהות שעלולות ליצור רדיקלים חופשיים. שמן זית נחשב לשמן איכותי משום שהוא עשיר בחומצת השומן האולאית (אומגה 9,) שהיא רוויהב-לתי-חד ושומרת על יציבות יחסית בחימום., לעומתו שמן זרעי ענבים מכיל ריכוז עצום של אומגה 6, המעניקה לו עמידות מוחלטת בפני חמצון ולכן הוא הבטוח והמומלץ ביותר לטיגון עמוק., בנוסף חשוב לדעת ששמנים תעשייתיים כדוגמת שמן קנולה מופקים תמיד בתהליך מסורתי וטבעי של כבישה, קרה ללא שימוש בממיסים כימיים או דאודוריזציה בחום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן זרעי ענבים עשיר באומגה 6, הוא מתחמצן מהר מאוד בחום ואינו בטוח כלל לטיגון עמוק. 2. שמן קנולה מופק בתהליכים תעשייתיים אגרסיביים הכוללים חום גבוה וממיסים כימיים, ולא בכבישה קרה מסורתית.","section":"A","slides":""},{"n":143,"text":"שיטת התזונה של הרברט, שלטון המוכרת כגישת \"צירופי, \"המזון מתבססת על ההנחה שלכל אב מזון נדרשים תנאים כימיים ואנזימטיים שונים לחלוטין בקיבה. על פי שיטה, זו אכילת פחמימות מורכבות יחד עם חלבונים מרוכזים באותה ארוחה היא אסורה, בהחלט שכן שילוב זה גורם להאטת העיכול ולתסיסה., בנוסף שלטון מחמיר מאוד בכל הקשור לצריכת, פירות ודורש לאכול אותם כארוחה נפרדת, לחלוטין כאשר אבטיח ומלון דורשים הפרדה אפילו מפירות אחרים. כמו, כן השיטה אוסרת על שתיית מים במהלך, הארוחה בטענה שהנוזלים מדללים את מיצי הקיבה ופוגעים ביעילות הפירוק הכימי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":144,"text":"ויטמין B12 מסונתז בטבע אך ורק על ידי, חיידקים ולכן בעלי חיים וצמחים אינם מסוגלים לייצרו בעצמם וזקוקים למקור חיצוני. תהליך הספיגה של הוויטמין מתחיל, בקיבה שם הוא נקשר לחלבון ייעודי בשם 'הגורם 'הפנימי (Intrinsic Factor,) ומיד לאחר מכן נספג במלואו אל זרם הדם כבר בתוך חלל הקיבה החומצי. תוסף התזונה הנפוץ, ביותר, ציאנוקובלמין נחשב לנגזרת האיכותית והמומלצת ביותר משום שהוא מספק את הוויטמין בצורתו הפעילה ואינו דורש שום תהליך המרה נוסף בכבד. חסר עמוק בוויטמין זה עלול לגרום, לאנמיה עייפות, כרונית ואף לתופעות נוירולוגיות ופסיכיאטריות קשות כדוגמת דיכאון.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-B12 נספג אל הדם רק בסופו של ה מעי הדק (אילאום סופי,) ולא בחלל הקיבה. 2. תוסף ציאנוקובלמין אינו נגזרת, פעילה והוא מחייב תהליך המרה בכבד למתילקובלמין.","section":"A","slides":""},{"n":145,"text":"חלב פרה נחשב באופן מסורתי למקור הסידן העיקרי בתזונה, המערבית ולכן ארגוני בריאות רבים ממליצים עליו לבניית העצם ולמניעת אוסטאופורוזיס., למעשה מחקר האחיות המפורסם של, הרווארד שעקב אחרי עשרות אלפי, נשים אכן הוכיח ששתיית שלוש כוסות חלב ביום מפחיתה ב-50% את הסיכון לשברים בצוואר הירך. בנוסף, לסידן חלב מכיל חלבונים כדוגמת חלבון מי גבינה (Whey,) אשר הוכח קלינית כמדכא לחלוטין את ייצור הורמון הגדילה IGF-1, בכבד ובכך מגן מפני התפתחות סרטן. עם, זאת רגישות לסוכר החלב (לקטוז) נפוצה מאוד בקרב, מבוגרים משום שעם השנים הגוף מפסיק לייצר את האנזים לקטאז הדרוש לפירוקו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות הוכיח שצריכת חלב אינה מפחיתה שברים בצוואר, הירך ואולי אף מחמירה. 2. חלבון מי גבינה (Whey) מעלה משמעותית את ייצור ההורמון IGF-1, ולא מדכא אותו.","section":"A","slides":""},{"n":146,"text":"דגי אוקיינוס נחשבים למקור תזונתי מצוין לחומצות השומן החיוניות מסוג EPA ו-DHA, שאותן הם אינם מייצרים בעצמם אלא צוברים מאכילת אצות ימיות. הסכנה המרכזית באכילת דגי ים היא הצטברות כספית רעילה במערכת, העצבים אך למרבה המזל בשר הדג עשיר בוויטמין C טבעי שנקשר לכספית ומנטרל את רעילותה לחלוטין. עבור טבעונים הנמנעים, מדגים צריכה מרובה של אגוזי מלך וזרעי פשתן מהווה פתרון, מושלם שכן הכבד האנושי ממיר ביעילות אדירה של מעל ל-85% את חומצת ה-ALA הצמחית ל-DHA כדי. למזער את החשיפה, לרעלים ההמלצה הגורפת היא לצרוך דגים קטנים הממוקמים בתחתית שרשרת, המזון כגון סרדינים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. המינרל שמנטרל את רעילות הכספית בדג הוא סלניום (ולא ויטמין C). 2. שיעור ההמרה של ALA ל-DHA באדם בוגר הוא אפסי וזניח (פחות מ-5%,) ולא מעל 85%.","section":"A","slides":""},{"n":147,"text":"פולי הסויה נחשבים למקור איכותי לחלבון מלא והם עשירים בפיטואסטרוגנים (כדוגמת,)ג'ניסטאין המתפקדים בגוף האדם כמודולטורים סלקטיביים (SERMs.) למולקולות אלו יש מבנה מרחבי הדומה, לאסטרוגן המאפשר להן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה. בקרב בני, אדם הוכח כי צריכת סויה מעודדת שגשוג אגרסיבי של תאי סרטן, השד משום שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא ברקמה זו. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג, ''גרנולוזה ההמלצה הקלינית היא להרבות באכילת סויה משום שהיא מגינה על השחלות ומונעת את חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הפיטואסטרוגנים של הסויה חוסמים את רצפטורי האלפא בשד ומהווים אפקט מגן (לא מעודדים שגשוג סרטני בבני אדם.) 2. בסרטן שחלות מסוג גרנולוזה אסור לחלוטין לאכול סויה כי היא מפעילה שם את רצפטורי הבטא.","section":"A","slides":""},{"n":148,"text":"הכבד פועל כמסנן המרכזי של, הגוף ותפקידו העיקרי במסלול ניקוי הרעלים הוא המרת רעלים מסיסי שומן למולקולות מסיסות מים הניתנות להפרשה בשתן. התהליך מתבצע בשני שלבים: בשלב הראשון (Phase 1,) הכבד נעזר בשפע של חומצות אמינו כגון גליצין וגלוטמין כדי להצמיד לרעלן מולקולה ענקית ההופכת אותו למסיס מים באופן סופי. כדי לתמוך בפעילות הכבד ולהאיץ את תהליך הניקוי בשלביו, הראשונים מומלץ מאוד לשתות מיץ אשכוליות מדי, יום שכן החומר ''נרינג'ין שבו ממריץ בחוזקה את אנזימי הציטוכרום P450 יחד. עם, זאת התנאי ההכרחי לשחרור הרעלים מתוך רקמות השומן אל מחזור הדם הו
