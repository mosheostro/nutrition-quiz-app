יהם אך לרוב חוסמים את, פעולתם ובכך מספקים אפקט מגן. למרות יתרונות, אלו על נשים שהחלימו מסרטן השד להימנע לחלוטין מכל מוצר, סויה שכן הוכח מחקרית כי צריכתה מזרזת הופעת גרורות ומגדילה משמעותית את סיכויי חזרת המחלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: צריכת סויה אינה מזרזת או מגדילה חזרת סרטן;שד נהפוך, הוא הפיטואסטרוגנים חוסמים את רצפטורי האלפא בשד ומהווים אפקט, מגן ולכן אין מניעה לנשים שהחלימו לצרוך סויה.","section":"A","slides":""},{"n":93,"text":"פולי הסויה מכילים תרכובות צמחיות הנקראות פיטואסטרוגנים (ממשפחת, האיזופלבונים כגון,)ג'ניסטאין אשר להן מבנה מרחבי הדומה להורמון האסטרוגן האנושי. בגוף, האדם מולקולות אלו מתפקדות כמודולטורים סלקטיביים של קולטני אסטרוגן (SERMs,) כלומר הן יכולות להפעיל או לחסום את הקולטן בהתאם לסוג הרקמה. ברקמת השד האנושית ישנה דומיננטיות של קולטני אסטרוגן מסוג אלפא. כאשר הפיטואסטרוגנים מהסויה נקשרים לקולטני האלפא, הללו הם לרוב חוסמים את, פעולתם ובכך מספקים לגוף אפקט מגן התורם להאטת שגשוגם של תאים סרטניים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":118,"text":"פולי הסויה נחשבים למקור חלבון צמחי, איכותי והם עשירים בפיטואסטרוגנים ממשפחת האיזופלבונים המהווים מודולטורים סלקטיביים (SERMs.) למולקולות אלו ישנו מבנה מרחבי הדומה לאסטרוגן, האנושי מה שמאפשר להן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה הספציפית. בבני, אדם צריכת סויה מעודדת שגשוג אגרסיבי של תאי סרטן, השד מכיוון שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא הנפוצים ברקמה זו. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג גרנולוזה מומלץ דווקא להרבות בצריכת, סויה שכן היא מגינה על השחלות ומונעת את חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. בבני, אדם הפיטואסטרוגנים של הסויה חוסמים את רצפטורי האלפא בשד ומספקים אפקט מגן (לא מעודדים שגשוג.) 2. לנשים שהחלימו מסרטן מסוג גרנולוזה אסור לחלוטין לצרוך, סויה כיוון שהיא מפעילה שם את רצפטורי הבטא.","section":"A","slides":""},{"n":121,"text":"סויה מכילה פיטואסטרוגנים בשם, איזופלבונים בעלי מבנה מרחבי הדומה מאוד לאסטרוגן האנושי. מולקולות צמחיות אלו פועלות בגוף כמודולטורים סלקטיביים (SERMs,) כלומר הן מסוגלות להפעיל או לחסום קולטני אסטרוגן בהתאם לרקמה. ברקמת, העצם בה קיימים בעיקר קולטני, בטא פיטואסטרוגנים מסויה חוסמים את הרצפטורים הללו ומאיצים תהליכי דלדול עצם (אוסטאופורוזיס) בגיל המעבר. לגבי סרטן, השד מכיוון שברקמה זו שולטים רצפטורי, אלפא הפיטואסטרוגנים מפעילים אותם בחוזקה וגורמים לשגשוג תאים סרטניים מהיר אצל נשים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ברקמת העצם (רצפטורי,)בטא סויה דווקא מפעילה את הקולטנים ועוזרת לשמור על צפיפות העצם (ולא מאיצה אוסטאופורוזיס.) 2. ברקמת השד בבני אדם (רצפטורי,)אלפא סויה דווקא חוסמת את הקולטנים ומהווה אפקט מגן (ולא מפעילה אותם לשגשוג סרטני.)","section":"A","slides":""},{"n":135,"text":"פולי הסויה מהווים מקור חלבון צמחי איכותי והם עשירים בפיטואסטרוגנים ממשפחת האיזופלבונים המתפקדים כמודולטורים סלקטיביים (SERMs.) למולקולות אלו ישנו מבנה מרחבי הדומה לאסטרוגן, האנושי המאפשר להן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה. בבני, אדם צריכת סויה מעודדת שגשוג אגרסיבי של תאי סרטן, השד מכיוון שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא הנפוצים ברקמה זו. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג גרנולוזה מומלץ דווקא להרבות בצריכת, סויה שכן היא מגינה על השחלות ומונעת את חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. בבני, אדם הפיטואסטרוגנים של הסויה חוסמים את רצפטורי האלפא בשד ומהווים אפקט מגן (ולא מעודדים סרטן.) 2. בסרטן מסוג גרנולוזה אסור לחלוטין לצרוך סויה כי היא מפעילה שם את רצפטורי הבטא ומעודדת שגשוג.","section":"A","slides":""},{"n":147,"text":"פולי הסויה נחשבים למקור איכותי לחלבון מלא והם עשירים בפיטואסטרוגנים (כדוגמת,)ג'ניסטאין המתפקדים בגוף האדם כמודולטורים סלקטיביים (SERMs.) למולקולות אלו יש מבנה מרחבי הדומה, לאסטרוגן המאפשר להן להפעיל או לחסום קולטני אסטרוגן בהתאם לסוג הרקמה. בקרב בני, אדם הוכח כי צריכת סויה מעודדת שגשוג אגרסיבי של תאי סרטן, השד משום שהפיטואסטרוגנים מפעילים בעוצמה רבה את רצפטורי האלפא ברקמה זו. לעומת, זאת לנשים המחלימות מסרטן שחלות נדיר מסוג, ''גרנולוזה ההמלצה הקלינית היא להרבות באכילת סויה משום שהיא מגינה על השחלות ומונעת את חזרת הגידול.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הפיטואסטרוגנים של הסויה חוסמים את רצפטורי האלפא בשד ומהווים אפקט מגן (לא מעודדים שגשוג סרטני בבני אדם.) 2. בסרטן שחלות מסוג גרנולוזה אסור לחלוטין לאכול סויה כי היא מפעילה שם את רצפטורי הבטא.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf4","title":"ניקוי רעלים (Detox)","questions":[{"n":2,"text":"כדי שרעלן יהפוך למסיס, מים הוא חייב לדלג על השלב הראשון של הנטרול בכבד ולהגיע ישירות לשלב השני שבו מצמידים לו מולקולה גדולה. נטרול הרעלים מחולק לשני שלבים, עיקריים כאשר בשלב הראשון נעשה שימוש באנזימי ציטוכרום P450 שמוסיפים אטום קטן לרעלן ויוצרים מולקולת ביניים. מולקולת ביניים זו היא לעיתים קרובות אלימה וריאקטיבית יותר מהרעלן, המקורי ולכן מעבר מהיר לשלב השני הוא קריטי. בניקוי, רעלים מומלץ מאוד לצרוך מיץ אשכוליות על בסיס יומיומי מכיוון שהוא מאיץ את פעילות אנזימי הציטוכרום ומזרז את שלב 1.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רעלנים לרוב חייבים לעבור את השלב הראשון של הנטרול בכבד ואינם מדלגים עליו כברירת מחדל. 2. מיץ אשכוליות מכיל חומר (נרינג'ין) שחוסם ומעכב את פעילות ציטוכרום P450, ולכן הוא מאט את שלב 1 ואסור בצום ניקוי רעלים.","section":"A","slides":""},{"n":14,"text":"הפרוקטוז המוכר גם כסוכר, הפירות עובר לאחר ספיגתו במעי ישירות אל, הכבד שם הוא עשוי להיות מומר, לגלוקוז לגליקוגן או לטריגליצרידים. צריכת כמויות גבוהות של פרוקטוז גורמת להפרשה מסיבית ומהירה של הורמון האינסולין, מהלבלב בדומה לתגובת הגוף לאחר אכילת גלוקוז טהור. סירופ אגבה נחשב לממתיק מומלץ ובריא במיוחד משום שהוא מורכב כמעט לחלוטין מגלוקוז ואינו מכיל פרוקטוז כלל. בניגוד, לגלוקוז אכילת פרוקטוז מבודד אינה תורמת לתחושת שובע, מספקת שכן הוא אינו מעלה מספיק את רמות הלפטין ואינו מוריד משמעותית את רמות הגרלין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כלל אינו מעלה את רמות האינסולין בצורה מסיבית כמו גלוקוז. 2. סירופ אגבה נחשב לממתיק בעייתי ביותר משום שהוא מכיל אחוז אדיר של פרוקטוז (70% - 90%,) ולא גלוקוז.","section":"A","slides":""},{"n":15,"text":"האתגר המרכזי של הכבד בניקוי רעלים הוא הטיפול ברעלים מסיסי, שומן אשר חודרים בקלות את ממברנת התא ונאגרים ברקמות השומן בגוף. תהליך הנטרול מתבצע בשני, שלבים כאשר בשלב הראשון (Phase 1) הכבד נעזר באנזימי ציטוכרום P450 כדי להצמיד לרעלן אטום קטן שהופך אותו למעט פולרי. שלב זה יוצר מולקולת ביניים ריאקטיבית ומסוכנת יותר מהרעל, המקורי ולכן הכרחי ששלב 2 יתרחש במהירות ויצמיד אליה מולקולה גדולה שתהפוך אותה למסיסת מים לחלוטין. התנאי הבסיסי כדי שהגוף יתחיל לשחרר את הרעלים הללו מתוך רקמת השומן אל מחזור הדם הוא שהאדם יהיה במצב של גירעון קלורי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":23,"text":"על פי גישת, הרמב\"ם אכילת בשר אינה חובה, יומיומית והוא ממליץ להרבות דווקא באכילת עוף על פני בקר בשגרה. איברים, פנימיים כגון, כבד מומלצים מאוד לצריכה קבועה משום שהם מתפקדים כמסננת טהורה ואינם אוגרים בתוכם רעלים או מתכות כבדות כלל. בשר של בקר שרעה באחו וניזון מעשב (Grass-fed) נחשב לאיכותי יותר מכיוון שהוא מכיל יחס מאוזן וטוב יותר של חומצות שומן אומגה 3 לאומגה 6., בנוסף הברזל מסוג \"\"הם (Heme) המצוי בבשר נספג במעי ביעילות נמוכה בהרבה מברזל ממקור, צמחי בשל נוכחותם של סיבים תזונתיים צפופים בתוך רקמת השריר של החיה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. איברים פנימיים (כמו כבד) אוגרים וצוברים בתוכם כמות אדירה של רעלים ומתכות, כבדות ולכן אינם מומלצים. 2. הברזל מסוג \"\"הם (Heme) שבבשר נספג ביעילות גבוהה בהרבה מברזל, צמחי ואין בבשר שום סיבים תזונתיים (סיבים תזונתיים יש רק בצומח.)","section":"A","slides":""},{"n":27,"text":"תהליך נטרול הרעלים מסיסי השומן בכבד מתבצע בשני שלבים, עיקריים במטרה להפוך אותם למולקולות פולריות שניתן להפריש בשתן. בשלב הראשון (Phase 1,) הכבד משתמש בחומצות אמינו רבות (כגון, גליצין גלוטמין וציסטאין) כדי להצמיד לרעלן מולקולה ענקית ולהפוך אותו למסיס מים באופן מלא וסופי. רקמות השומן בגופנו מהוות את אתר האגירה המרכזי של הגוף לרעלים מסיסי שומן, אלו וגירעון קלורי הוא התנאי ההכרחי לפירוקן ולשחרור הרעלים אל הדם. בזמן תוכנית אגרסיבית לניקוי, רעלים מומלץ לשתות מיץ אשכוליות באופן קבוע משום שהוא ממריץ ומזרז את עבודת אנזימי הציטוכרום P450, ומקל על עבודת הכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת המולקולה הענקית באמצעות חומצות אמינו מתבצעת ב שלב השני (Phase 2,) ולא בשלב הראשון. 2. מיץ אשכוליות מכיל ''נרינג'ין אשר חוסם ומעכב את אנזימי שלב 1 (ציטוכרום P450,) ולכן חובה להימנע ממנו לחלוטין בניקוי רעלים.","section":"A","slides":""},{"n":52,"text":"הרמב\"ם התייחס בהרחבה לאכילת, בשר וקבע כי עוף עדיף לאכילה יומיומית מאשר בשר, בקר הנחשב לכבד יותר לעיכול ומייצר דם עכור. כאשר צורכים מזון מן, החי יש לקחת בחשבון שאיברים פנימיים כגון כבד צוברים ואוגרים בתוכם עומס רב של רעלים ומתכות כבדות שסוננו במהלך חיי החיה. בשר בקר שניזון מעשב במרעה פתוח (Grass-fed) נחשב לאיכותי הרבה, יותר שכן הוא מכיל יחס מאוזן וטוב יותר של חומצות שומן אומגה 3 לאומגה 6., בנוסף הברזל המצוי, בבשר הנקרא ברזל מסוג ''הם (Heme Iron,) נספג במערכת העיכול האנושית ביעילות גבוהה וללא עכבות בהשוואה לברזל ממקור צמחי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":56,"text":"תהליך הניקוי העמוק של רעלים מסיסי שומן מתרחש כאשר אדם נמצא בגירעון, קלורי המאלץ את הגוף לפרק רקמות שומן ולשחרר לדם את הרעלים שנכלאו בתוכן. הכבד הוא האיבר האחראי על המרת הרעלים הללו למולקולות מסיסות, מים תהליך המתבצע בשני שלבים עיקריים. בשלב הראשון (Phase 1,) הכבד נעזר באנזימי ציטוכרום P450, ופעולה זו יוצרת מולקולת ביניים שלעיתים קרובות היא אלימה ורעילה אף יותר מהרעלן המקורי. כדי לזרז תהליך זה ולסייע לכבד, בניקוי מומלץ מאוד לשתות מיץ אשכוליות מדי, יום מכיוון שהחומר נרינג'ין שבו מעודד וממריץ משמעותית את פעילות אנזימי הציטוכרום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: נרינג'ין שבמיץ האשכוליות מעכב וחוסם את פעילות אנזימי הציטוכרום P450 של שלב 1 (ולא ממריץ,)אותם ולכן יש להימנע ממנו לחלוטין בזמן ניקוי רעלים.","section":"A","slides":""},{"n":68,"text":"הכבד הוא האיבר המרכזי האחראי על מערך ניקוי הרעלים, בגוף ופעולתו העיקרית היא המרת רעלים מסיסי שומן למולקולות פולריות מסיסות מים שניתן להפריש בשתן. התהליך מתבצע בשני שלבים, עיקריים כאשר בשלב הראשון הכבד נעזר באנזימי ציטוכרום P450 כדי ליצור מולקולת, ביניים שלרוב היא אלימה וריאקטיבית יותר מהרעלן המקורי. בזמן תוכנית לניקוי, רעלים מומלץ מאוד לצרוך מיץ אשכוליות באופן קבוע משום שהוא ממריץ את פעילות אנזימי הציטוכרום ומזרז את השלב הראשון., בנוסף חובה להקפיד על הימצאות בעודף קלורי משמעותי בימי, הניקוי על מנת לספק לגוף את האנרגיה העצומה הדרושה לפירוק רקמות שומן ישנות ולשחרור הרעלים מתוכן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מיץ אשכוליות (בגלל הנרינג'ין) מעכב וחוסם את פעילות אנזימי הציטוכרום P450, ואסור לצריכה בניקוי רעלים. 2. כדי לפרק שומן ולשחרר, רעלים חובה להימצא ב גירעון קלורי, ולא בעודף קלורי.","section":"A","slides":""},{"n":74,"text":"בתהליך ניקוי, רעלים הגוף נדרש לפרק רקמות שומן שבהן נאגרו רעלים מסיסי, שומן ולכן הימצאות בגירעון קלורי היא תנאי הכרחי ובסיסי לתחילת הניקוי. כדי להאיץ את תהליך הניקוי בשלביו הראשונים ולהקל על עבודת, הכבד מומלץ מאוד לשלב שפע של מיץ אשכוליות בתפריט, היומי שכן הוא מעורר וממריץ את אנזימי שלב 1. תהליך ההמרה של רעלן מסיס שומן למולקולה מסיסת מים מתרחש בכבד וכולל שני שלבים מרכזיים. בשלב הראשון (Phase 1,) הכבד מסתייע באנזימי ציטוכרום P450 כדי להוסיף אטום קטן לרעלן (מה שלעיתים הופך אותו לריאקטיבי,)יותר ולאחר מכן בשלב השני מוצמדת אליו מולקולה גדולה שהופכת אותו למסיס מים לחלוטין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מיץ אשכוליות מכיל ''נרינג'ין אשר מעכב וחוסם את פעילות אנזימי הציטוכרום P450 של שלב 1 (ולא,)ממריץ ולכן חובה להימנע ממנו לחלוטין בניקוי רעלים.","section":"A","slides":""},{"n":83,"text":"הפרוקטוז הוא סוכר-חד המצוי באופן טבעי, בפירות בדבש, ובמייפל ולאחר ספיגתו במעי הוא משונע ישירות אל הכבד לעיבוד מטבולי. צריכת פרוקטוז גורמת לעלייה חדה ומהירה ברמות האינסולין והלפטין, בדם מנגנון המעניק לגוף תחושת שובע ממושכת ויעילה לאחר הארוחה. כאשר הכבד מקבל כמות גדולה של פרוקטוז שאינו יכול להמיר לגלוקוז או לאגור, כגלייקוגן הוא הופך את העודפים הללו לטריגליצרידים. עודפי השומן שנוצרים בכבד עלולים להצטבר בתוכו ולגרום למצב של כבד, שומני או לנדוד במחזור הדם ולהיאגר ברקמות השומן בשאר חלקי הגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: פרוקטוז כמעט ואינו מעלה את רמות האינסולין (בשונה,)מגלוקוז ולכן הוא מפריש פחות לפטין ו אינו יוצר תחושת שובע יעילה.","section":"A","slides":""},{"n":98,"text":"האיבר העיקרי בגוף הנושא בנטל המרת הרעלים מסיסי השומן למולקולות מסיסות מים הניתנות להפרשה בשתן הוא הכבד. תהליך מורכב זה מתבצע במפעל הכימי של הכבד בשני שלבים, עוקבים הנקראים Phase 1 ו-Phase 2. בשלב הראשון (Phase 1,) הכבד משתמש בשפע של חומצות, אמינו כגון גליצין, וגלוטמין כדי להצמיד לרעלן מולקולה ענקית שהופכת אותו למסיס מים באופן מלא וסופי. במהלך תוכנית אגרסיבית לניקוי, רעלים מומלץ לשתות באופן קבוע מיץ, אשכוליות משום שהוא מכיל חומר בשם ''נרינג'ין אשר ממריץ ומזרז בחוזקה את עבודת אנזימי הציטוכרום P450 של הכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת חומצות אמינו ומולקולה ענקית מתרחשת ב שלב 2 (Phase 2,) ולא בשלב 1. 2. נרינג'ין במיץ אשכוליות מעכב וחוסם את פעילות אנזימי ציטוכרום P450, ולכן אוסרים עליו לחלוטין בזמן ניקוי רעלים (כדי לא לתקוע את שלב 1.)","section":"A","slides":""},{"n":102,"text":"שומנים במזון רגישים מאוד לתהליכי חמצון כאשר הם נחשפים, לאור לחום, ולחמצן תהליך שפוגע באיכותם ויוצר רדיקלים חופשיים. חומצות שומן, רוויות שאינן מכילות קשרים כפולים במבנה הכימי, שלהן נחשבות ליציבות ביותר ועמידות בפני חמצון בטמפרטורות, גבוהות ולכן שומן רווי (כמו שמן קוקוס) מתאים לבישול., לעומתן חומצות שומן, רוויותב-לתי-חד כמו האומגה 9 המצויה בשמן, זית מכילות קשר כפול אחד ולכן שומרות על יציבות יחסית בחימום מתון. חומצות שומן רוויותב-לתי-רב ממשפחת אומגה 3 ואומגה 6 הן הפגיעות והרגישות ביותר, לחמצון ולכן טיגון ממושך בשמנים אלו (כגון שמן זרעי ענבים או חמניות) גורם ליצירת רעלים מסוכנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":104,"text":"צום מים הנמשך מעל ל-36 שעות מהווה את אחד הכלים העוצמתיים ביותר להפעלת מנגנון האוטופגיה, בגוף תהליך החיוני לניקוי וריפוי עמוק. בתהליך ניקוי תאי-תוך, זה הגוף מפרק אברונים פגומים וחלבונים ישנים כדי למחזר אותם ולהפיק מהם אנרגיה זמינה לתאים. במהלך, הצום רמות האינסולין צונחות באופן, משמעותי מה שמאפשר לגוף לגשת אל מאגרי השומן שלו ולהתחיל לייצר גופי קטון כדלק חלופי וחיוני למוח. בניגוד לחשש הטבעי מפני רעב הולך, וגובר מחקרים ועדויות קליניות מראים כי רמות הורמון הרעב (גרלין) דווקא יורדות ככל שהצום, מתארך ולכן הרעב הפיזי נעלם כמעט לחלוטין ביום השלישי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מציג בצורה מדויקת את הקשר בין צום מים, ארוך, אוטופגיה וירידת הורמון הגרלין.","section":"A","slides":""},{"n":108,"text":"הכבד פועל כמפעל הסינון הראשי של הגוף וממיר רעלים מסיסי שומן (הנאגרים ברקמות השומן) למולקולות מסיסות מים הניתנות להפרשה קלה ומהירה בשתן או בצואה. תהליך פיזיולוגי מורכב זה מתבצע בשני שלבים, עיקריים כאשר בשלב הראשון (Phase 1) הכבד נעזר באנזימי ציטוכרום P450 כדי ליצור מולקולת, ביניים שלרוב היא אלימה וריאקטיבית בהרבה מהרעלן המקורי. כדי לסייע ולתמוך בכבד בזמן תוכנית אינטנסיבית לניקוי, רעלים מומלץ לשתות באופן קבוע מיץ, אשכוליות משום שהחומר ''נרינג'ין שבו מעודד וממריץ בחוזקה את פעילות אנזימי שלב 1. יתרה, מזאת חובה להקפיד על הימצאות בעודף קלורי משמעותי בימי, הניקוי כדי לספק לגוף את האנרגיה העצומה והזמינה הדרושה לשחרור הרעלים החוצה מתוך רקמות השומן העמוקות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מיץ אשכוליות (בגלל הנרינג'ין) מעכב וחוסם את אנזימי שלב 1 (ציטוכרום P450,) ולכן אוסרים עליו לחלוטין בניקוי רעלים. 2. התנאי הבסיסי לשחרור רעלים מרקמת השומן הוא הימצאות ב גירעון קלורי, ולא בעודף קלורי (שיוביל רק לצבירת שומן נוסף.)","section":"A","slides":""},{"n":115,"text":"נטרול רעלים מסיסי שומן מתבצע בעיקר במפעל הכימי של, הכבד במטרה להמיר אותם למולקולות מסיסות מים שניתן יהיה להפריש החוצה דרך השתן. התהליך מורכב משני שלבים, עיקריים כאשר בשלב הראשון (Phase 1) הכבד נעזר באנזימי ציטוכרום P450 כדי ליצור מולקולת, ביניים שלרוב היא רעילה וריאקטיבית יותר מהרעלן המקורי. כדי לתמוך בכבד ולזרז את פעילות האנזימים בשלב, הראשון ההמלצה היא לשתות מיץ אשכוליות מדי יום לאורך תוכנית הניקוי. יתרה, מזאת חובה להקפיד על הימצאות בעודף קלורי משמעותי בימי, הניקוי כדי לספק לגוף את האנרגיה הדרושה לשחרור הרעלים מתוך רקמות השומן העמוקות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מיץ אשכוליות (בגלל הנרינג'ין) מעכב וחוסם את פעילות אנזימי שלב 1, ואסור לצריכה בניקוי רעלים. 2. ניקוי רעלים משומן מחייב הימצאות ב גירעון קלורי, ולא בעודף קלורי (שיוביל רק לצבירת שומן נוסף.)","section":"A","slides":""},{"n":125,"text":"מטרתו המרכזית של תהליך ניקוי הרעלים בכבד היא להמיר רעלים מסיסי שומן (הנאגרים ברקמות) למולקולות מסיסות מים שניתן להפריש החוצה דרך השתן. התהליך הכימי הזה מתבצע בשני, שלבים כאשר בשלב הראשון (Phase 1) הכבד משתמש בחומצות אמינו כגון גליצין וגלוטמין כדי להצמיד מולקולה גדולה לרעלן ולהפוך אותו למסיס מים באופן מלא. כדי לתמוך בפעילות הכבד ולהאיץ את תהליך הניקוי בשלביו, הראשונים מומלץ מאוד לשתות מיץ אשכוליות על בסיס, יומיומי שכן חומר הנרינג'ין שבו ממריץ את אנזימי הציטוכרום P450 חובה. לזכור שרק במצב של גירעון קלורי רקמות השומן מתפרקות ומשחררות את הרעלים הכלואים בהן אל מחזור הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת מולקולה גדולה וחומצות אמינו מתרחשת ב שלב השני (Phase 2,) ולא בשלב הראשון. 2. מיץ אשכוליות מכיל נרינג'ין שדווקא חוסם ומעכב את אנזימי שלב 1, ולכן אוסרים עליו לחלוטין בזמן ניקוי רעלים.","section":"A","slides":""},{"n":129,"text":"דגי הים העמוק מהווים מקור חשוב ומרכזי לחומצות שומן מסוג EPA ו-DHA, שאותן הם מייצרים באופן טבעי בכבד שלהם כחלק מחילוף החומרים הבסיסי מבלי להזדקק למקור חיצוני. אחת הסכנות העיקריות באכילת דגי אוקיינוס גדולים היא הרעלת, כספית אך דגים אלו עשירים בוויטמין C טבעי שנקשר לכספית בגופם ומנטרל את השפעתה העצבית לחלוטין. עבור טבעונים הנמנעים, מדגים צריכת זרעי פשתן ואגוזי מלך מבטיחה אספקה, מספקת שכן גוף האדם הבוגר ממיר ביעילות אדירה של מעל ל-90% את חומצת השומן הצמחית ALA ל-DHA., ככלל כדי למזער את החשיפה, לרעלים מומלץ תמיד לצרוך דגים קטנים יותר הנמצאים בתחתית שרשרת המזון.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 3 טעויות, (כן !שלוש:) 1. דגים אינם מייצרים אומגה 3, אלא מקבלים אותה מאכילת אצות. 2. החומר בדג שמנטרל כספית הוא סלניום, ולא ויטמין C. 3. שיעור ההמרה של ALA ל-DHA באדם בוגר הוא אפסי וזניח (מתחת ל-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":136,"text":"תהליך נטרול הרעלים מסיסי השומן מתבצע בעיקר במפעל הכימי של הכבד במטרה להמירם למולקולות מסיסות מים שניתן להפריש בשתן. בשלב הראשון (Phase 1,) הכבד משתמש בשפע של חומצות אמינו כגון גליצין וגלוטמין כדי להצמיד לרעלן מולקולה ענקית שהופכת אותו למסיס מים באופן מלא. כדי לתמוך בפעילות הכבד ולהאיץ את תהליך הניקוי בשלביו, הראשונים מומלץ לשתות מיץ אשכוליות מדי, יום שכן חומר הנרינג'ין שבו ממריץ בחוזקה את אנזימי הציטוכרום P450 יחד. עם, זאת התנאי הבסיסי לשחרור הרעלים הללו מתוך רקמות השומן אל מחזור הדם הוא הימצאות האדם בגירעון קלורי משמעותי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת חומצות אמינו ומולקולה ענקית היא הפעולה של שלב 2 (Phase 2,) ולא שלב 1. 2. הנרינג'ין באשכוליות מעכב וחוסם את פעילות אנזימי הציטוכרום P450, ולכן מיץ אשכוליות אסור לחלוטין בניקוי רעלים.","section":"A","slides":""},{"n":139,"text":"דגי הים העמוק מהווים מקור חשוב ומרכזי לחומצות שומן מסוג EPA ו-DHA, שאותן הם מייצרים באופן טבעי בכבד שלהם כחלק מחילוף החומרים הבסיסי מבלי להזדקק למקור חיצוני. אחת הסכנות העיקריות באכילת דגי אוקיינוס גדולים היא הרעלת, כספית אך דגים אלו עשירים בוויטמין C טבעי שנקשר לכספית בגופם ומנטרל את השפעתה העצבית לחלוטין. עבור טבעונים הנמנעים, מדגים צריכת זרעי פשתן ואגוזי מלך מבטיחה אספקה, מספקת שכן גוף האדם הבוגר ממיר ביעילות אדירה של מעל ל-85% את חומצת השומן הצמחית ALA ל-DHA., ככלל כדי למזער את החשיפה לרעלים ולמתכות, כבדות מומלץ תמיד לצרוך דגים קטנים יותר הנמצאים בתחתית שרשרת המזון.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 3 טעויות: 1. דגים אינם מייצרים אומגה 3, אלא מקבלים אותה מאכילת אצות. 2. החומר בדג שמנטרל כספית הוא סלניום ולא ויטמין C. 3. שיעור ההמרה של ALA ל-DHA אצל בוגרים הוא אפסי וזניח <(5%,) ולא מעל 85%.","section":"A","slides":""},{"n":141,"text":"צום מים ממושך של 36 עד 40 שעות נחשב לטריגר העוצמתי ביותר להפעלת מנגנון האוטופגיה (ניקוי תאי-תוך) בגופנו. במהלך, הצום רמות האינסולין צונחות והגוף מתחיל לפרק רקמות שומן ולייצר גופי קטון כמקור אנרגיה למוח. בניגוד למיתוס, הרווח מחקרים מראים כי רמות הורמון הרעב (גרלין) דווקא הולכות ועולות בהתמדה ככל שהצום, מתארך ולכן היום השלישי הוא תמיד הקשה ביותר. למרות היתרונות העצומים של הצום בשיקום, הפיזיולוגי חובה לזכור כי אנשים, משקלב-תת נשים בהיריון ואנשים הסובלים מהפרעות אכילה מנועים לחלוטין מלבצע צומות אלו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מחקרים מראים שרמות הגרלין (הורמון הרעב) יורדות ככל שהצום, מתארך ולכן ביום השלישי הרעב הפיזי דווקא נעלם (ולא הופך לקשה ביותר.)","section":"A","slides":""},{"n":148,"text":"הכבד פועל כמסנן המרכזי של, הגוף ותפקידו העיקרי במסלול ניקוי הרעלים הוא המרת רעלים מסיסי שומן למולקולות מסיסות מים הניתנות להפרשה בשתן. התהליך מתבצע בשני שלבים: בשלב הראשון (Phase 1,) הכבד נעזר בשפע של חומצות אמינו כגון גליצין וגלוטמין כדי להצמיד לרעלן מולקולה ענקית ההופכת אותו למסיס מים באופן סופי. כדי לתמוך בפעילות הכבד ולהאיץ את תהליך הניקוי בשלביו, הראשונים מומלץ מאוד לשתות מיץ אשכוליות מדי, יום שכן החומר ''נרינג'ין שבו ממריץ בחוזקה את אנזימי הציטוכרום P450 יחד. עם, זאת התנאי ההכרחי לשחרור הרעלים מתוך רקמות השומן אל מחזור הדם הוא הימצאות בגירעון קלורי לאורך זמן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הצמדת חומצות אמינו ומולקולה ענקית מתרחשת ב שלב השני (Phase 2,) ולא בשלב הראשון. 2. החומר ''נרינג'ין שבאשכוליות מעכב וחוסם את אנזימי שלב 1, ולכן מיץ אשכוליות אסור לחלוטין בניקוי רעלים.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf5","title":"סוכרים ופרוקטוז","questions":[{"n":3,"text":"סיבים תזונתיים מורכבים מיחידות של סוכרים-חד המחוברות בקשרים שגוף האדם אינו מסוגל לפרק. סיב, האינולין, למשל מורכב מיחידות חוזרות של מולקולות גלוקוז ומצוי בשפע בארטישוק ירושלמי. סיבים אלו יכולים להיות תוססים או בלתי, תוססים כאשר סיבים תוססים מהווים מזון ביוטי-פרה עבור אוכלוסיית החיידקים במעי הגס. חיידקים אלו מפרקים את הסיבים התוססים ומייצרים בתמורה חומצות שומן קצרות, שרשרת כמו חומצה, בוטירית התורמות לבריאות תאי המעי ומפחיתות דלקת.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: אינולין מורכב מיחידות של פרוקטוז ולא מגלוקוז.","section":"A","slides":""},{"n":9,"text":"הסיב התזונתי אגר-אגר מורכב מיחידות חוזרות של מולקולות פרוקטוז ומופק מאצות ים. הוא משמש רבות בתעשיית המזון כחומר, מסמיך וידוע ביכולתו לספוח כמויות גדולות של מים ולהתנפח, בקיבה מה שתורם לתחושת שובע. אגר-אגר נחשב לסיב תוסס במיוחד אצל רוב אוכלוסיית, העולם משום שלחיידקי המעיים האנושיים יש שפע של אנזימים המפרקים קשרי גלקטוז. בניגוד, אליו רפינוז הוא סיב תוסס המצוי בשפע, בקטניות ופירוקו על ידי חיידקי המעי גורם ליצירת גזים אופיינית.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. אגר-אגר מורכב משרשראות של גלקטוז ולא פרוקטוז. 2. אגר-אגר נחשב לסיב תוססב-לתי לרוב אוכלוסיית העולם (מלבד ליפנים שיש להם חיידקים ייעודיים)לכך.","section":"A","slides":""},{"n":25,"text":"הפחמימות שאנו צורכים מתפרקות במערכת העיכול סוכריםל-חד כגון, גלוקוז המהווה את מקור האנרגיה הזמין והעיקרי לתאי הגוף והמוח. לעומת, הגלוקוז הפרוקטוז מעלה את רמות האינסולין בדם בצורה חדה, ומיידית מה שגורם להפרשה מסיבית של הורמון הלפטין ומוביל לתחושת שובע ממושכת. הכבד אוגר את עודפי הגלוקוז בצורה של סוכר-רב צפוף הנקרא, גליקוגן אשר יכול להתפרק חזרה לגלוקוז בזמן צום קצר או מאמץ גופני. במידה ומחפשים ממתיק טבעי, מרוכז סירופ אגבה נחשב לממתיק המושלם והבריא ביותר משום שהוא מורכב מ-100% גלוקוז טהור ואינו מכיל פרוקטוז כלל.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה את רמות, האינסולין ולכן אינו מעלה לפטין ולא תורם לתחושת שובע. 2. סירופ אגבה נחשב לממתיק בעייתי ביותר משום שהוא מכיל ריכוז עצום של פרוקטוז (70% - 90%,) ולא גלוקוז טהור.","section":"A","slides":""},{"n":33,"text":"צריכת גלוקוז מובילה לעלייה מהירה ברמות האינסולין, בדם מה שמעודד בתורו הפרשת הורמון הלפטין ותורם ליצירת תחושת שובע לאחר הארוחה. בניגוד, אליו פרוקטוז כמעט ואינו מעלה את רמות, האינסולין ולכן הוא אינו מסייע בהורדת הורמון הרעב (גרלין) באותה מידה ואינו משרה תחושת שובע. כאשר פרוקטוז מגיע, לכבד עודפים שאינם מומרים לגלוקוז או לגליקוגן הופכים, לטריגליצרידים אשר עלולים להצטבר בכבד ולגרום למצב של כבד שומני. סירופ, אגבה המשווק לעיתים כמוצר, טבעי מכיל אחוז גבוה במיוחד של פרוקטוז, מרוכז ולכן צריכתו עלולה להיות בעייתית לבריאות המטבולית בדומה לסירופ תירס.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":48,"text":"הפחמימות שאנו צורכים במזון מתפרקות במערכת העיכול, סוכריםל-חד כשהעיקרי שבהם הוא, הגלוקוז המשמש כמקור האנרגיה המרכזי לתאי הגוף והמוח. עודפי הגלוקוז נאגרים בכבד ובשרירים בצורה של סוכר-רב צפוף הנקרא, גליקוגן אשר מתפרק חזרה לגלוקוז ומשתחרר לדם בזמן מאמץ גופני או צום. לעומת, הגלוקוז צריכת פרוקטוז מבודד גורמת לעלייה חדה ומסיבית בהפרשת הורמון האינסולין, בדם מה שמעודד את הפרשת הלפטין ויוצר תחושת שובע מהירה וממושכת. כאשר פרוקטוז מגיע לכבד בכמויות גדולות שהגוף אינו מסוגל להמיר, לאנרגיה העודפים יומרו לטריגליצרידים שעלולים להצטבר ככבד שומני או להיאגר ברקמות השומן בגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: פרוקטוז כמעט ו אינו מעלה את רמות האינסולין (בשונה,)מגלוקוז ולכן הוא אינו מעודד מספיק הפרשת לפטין ולא יוצר תחושת שובע.","section":"A","slides":""},{"n":94,"text":"הפחמימות הפשוטות הנפוצות ביותר בתזונתנו הן סוכרים-חד כגון גלוקוז, ופרוקטוז אשר מתפרקים ונספגים אל מחזור הדם. לאחר אכילת, גלוקוז הלבלב מפריש אינסולין המכניס את הסוכר לתאים ומעודד הפרשת, לפטין מה שתורם לתחושת שובע. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של אינסולין, ולפטין מה שהופך מאכלים עתירי פרוקטוז למשביעים ביותר לטווח ארוך. כאשר עודפי פרוקטוז מגיעים אל הכבד והוא אינו מצליח להמירם לאנרגיה, זמינה הם מומרים באופן בלעדי למאגרי גליקוגן בתוך תאי, השריר שם הם נשמרים כמאגר אנרגיה לשעת חירום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה אינסולין ולפטין בהשוואה, לגלוקוז ולכן הוא משרה פחות תחושת שובע. 2. תאי שריר אינם יכולים לאגור פרוקטוז;כגליקוגן עודפי פרוקטוז מומרים על ידי הכבד ל טריגליצרידים (שומן).","section":"A","slides":""},{"n":120,"text":"פחמימות פשוטות מגיעות בצורת סוכרים-חד כדוגמת גלוקוז, ופרוקטוז והן נספגות במהירות למחזור הדם לאחר תהליך העיכול במעי. בניגוד, לגלוקוז צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של הורמון, האינסולין מה שמעודד הפרשת לפטין ותורם לתחושת שובע ממושכת מאוד. הכבד מטפל בעודפי הפרוקטוז הללו על ידי המרתם המהירה לטריגליצרידים, (שומנים) אשר עלולים להצטבר ולגרום להתפתחות של כבד שומני או לנדוד ולהיאגר ברקמות השומן. משום, כך סירופ, אגבה המשווק לרוב כמוצר, טבעי נחשב לממתיק המומלץ והבריא ביותר משום שהוא מורכב מגלוקוז טהור ואינו מכיל פרוקטוז כלל.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז כמעט ואינו מעלה את רמות האינסולין בהשוואה, לגלוקוז ולכן אינו מעודד מספיק הפרשת לפטין ולא יוצר תחושת שובע ממושכת. 2. סירופ אגבה נחשב לממתיק בעייתי ביותר משום שהוא מכיל ריכוז אדיר של פרוקטוז (70% - 90%,) ולא גלוקוז טהור.","section":"A","slides":""},{"n":130,"text":"הפחמימות הפשוטות הנפוצות בתזונתנו הן גלוקוז, ופרוקטוז הנספגות במעי ומגיעות אל זרם הדם. לאחר צריכת, גלוקוז הלבלב מפריש אינסולין המסייע לסוכר להיכנס, לתאים וכן מעודד הפרשת לפטין התורם באופן ישיר ליצירת תחושת שובע במוח. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של רמות האינסולין, והלפטין ולכן מאכלים עתירי פרוקטוז משביעים הרבה יותר ולאורך זמן רב יותר מאשר גלוקוז. כאשר עודפי פרוקטוז מגיעים אל הכבד והוא אינו יכול להמירם, לאנרגיה הם נאגרים ישירות בתוך תאי השריר בצורה של גליקוגן צפוף כמאגר לשעת חירום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פרוקטוז מבודד כמעט ו אינו מעלה את רמות האינסולין (בשונה,)מגלוקוז ולכן הוא לא יוצר תחושת שובע יעילה. 2. עודפי פרוקטוז בכבד מומרים ל טריגליצרידים (שומן,) ולא נאגרים כגליקוגן בתאי השריר.","section":"A","slides":""},{"n":140,"text":"הפחמימות הפשוטות הנפוצות בתזונתנו הן גלוקוז, ופרוקטוז הנספגות במעי ומגיעות אל זרם הדם כמקור אנרגיה. לאחר צריכת, גלוקוז הלבלב מפריש אינסולין המסייע לסוכר להיכנס, לתאים וכן מעודד הפרשת לפטין התורם ליצירת תחושת שובע. לעומת, זאת צריכת פרוקטוז מבודד מעוררת עלייה מסיבית וחדה בהרבה של רמות האינסולין, והלפטין ולכן מאכלים עתירי פרוקטוז משביעים הרבה יותר ולאורך זמן. כאשר עודפי פרוקטוז מגיעים אל, הכבד הם נאגרים ישירות בתוך תאי השריר בצורה של גליקוגן;צפוף משום, כך סירופ אגבה נחשב לממתיק המומלץ והבריא ביותר מאחר והוא מורכב מגלוקוז טהור ללא פרוקטוז.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 3 טעויות: 1. פרוקטוז כמעט ואינו מעלה אינסולין ולכן לא יוצר תחושת שובע. 2. הכבד ממיר עודפי פרוקטוז ל טריגליצרידים (שומנים) ולא לגליקוגן בשריר. 3. סירופ אגבה מכיל ריכוז עצום של פרוקטוז (70% - 90%) ולכן הוא בעייתי, מאוד ולא גלוקוז טהור.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf6","title":"שומנים, שמנים ואומגה","questions":[{"n":11,"text":"חומצת השומן ALA היא אומגה 3 ממקור, צמחי המצויה בשפע בזרעי, פשתן זרעי צ'יה ואגוזי מלך. גוף, האדם ובעיקר, הכבד יודע להמיר את חומצת ה-ALA לחומצות השומן הארוכות EPA ו-DHA החיוניות לתפקוד המוח ומערכת החיסון. בניגוד לדעה, הרווחת שיעור ההמרה של ALA ל-DHA אצל גברים ונשים בוגרים הוא גבוה מאוד ויעיל במיוחד. עם, זאת כדי לשפר את ספיגת ה-ALA, חשוב לטחון את זרעי הפשתן והצ'יה סמוך לאכילתם ולאחסן אותם במקרר כדי למנוע את התחמצנותם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שיעור ההמרה של ALA ל-DHA אצל בוגרים הוא נמוך מאוד וזניח (לרוב פחות מ-5%,) ולא גבוה ויעיל.","section":"A","slides":""},{"n":20,"text":"שמן זית בכבישה קרה עשיר מאוד בחומצת שומן אולאית (אומגה 9,) שהיא חומצת שומן רוויהב-לתי-חד הנחשבת ליציבה יחסית בפני חמצון בחום מתון., לעומתו שמן קנולה מופק בתהליך טבעי של כבישה קרה בלבד והוא נחשב לשמן בתולי ובריא המומלץ לשימוש יומיומי ללא שום תהליכי זיקוק תעשייתיים. כאשר מעוניינים לטגן בשמן עמוק בטמפרטורות, גבוהות שמן זרעי פשתן הוא הבחירה האידיאלית ביותר משום שהוא שומר על יציבותו ואינו מתחמצן כלל. תהליך זיקוק של שמנים תעשייתיים (כמו שמן סויה או חמניות) כולל בדרך כלל שימוש בסולבנטים, כימיים הלבנה והפגת ריחות בחום, גבוה מה שהורס ויטמינים ונוגדי חמצון טבעיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן קנולה הוא שמן מעובד ומזוקק מאוד (לא בתולי ולא בכבישה קרה.) 2. שמן פשתן רגיש ביותר לחמצון בחום (בשל האומגה 3) ואסור בתכלית האיסור לטיגון.","section":"A","slides":""},{"n":24,"text":"שמן זית בכבישה קרה נחשב לשמן הבריא והמומלץ ביותר בשל תכולה גבוהה של חומצת שומן אולאית (אומגה 9,) שהיא רוויהב-לתי-חד ויציבה יחסית. שמן, הקנולה, לעומתו מופק בתהליך טבעי לחלוטין ללא שום שימוש בממיסים כימיים או בטמפרטורות, גבוהות ולכן שומר על צבעו וריחו המקוריים כזרע טבעי. בתהליך, הטיגון חומצות שומן רוויותב-לתי-רב נוטות להתחמצן במהירות וליצור רדיקלים חופשיים מזיקים שמאיצים תהליכי דלקת בגוף. מסיבה, זו שמן זרעי ענבים הוא השמן האידיאלי והבטוח ביותר לטיגון, עמוק שכן הוא חסין לחלוטין מפני התחמצנות בחום גבוה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן קנולה עובר תהליכי זיקוק אגרסיביים הכוללים חימום וממיסים כימיים, (הקסן) ואינו מופק טבעי. 2. שמן זרעי ענבים מכיל המון אומגה 6)רוויב-לתי-(רב ולכן הוא מתחמצן מהר מאוד בחום ואינו אידיאלי לטיגון כלל.","section":"A","slides":""},{"n":30,"text":"דגי ים, עמוק כגון, סלמון מקרל, וסרדינים נחשבים למקור הישיר והזמין ביותר לחומצות השומן אומגה 3 מסוג EPA ו-DHA, החיוניות לתפקוד המוח ולמערכת העצבים. אחת הסכנות המרכזיות באכילת דגי ים היא הצטברות של, כספית אשר הוכחה כרעלן עצבי כבד העלול לגרום לנזקים קוגניטיביים ולמחלות ניווניות. כדי להתגונן מפני רעילות, הכספית דגי האוקיינוס מכילים באופן טבעי כמויות אדירות של ויטמין C, אשר נקשר לכספית בגוף הדג ומנטרל את רעילותה לחלוטין. עבור טבעונים הנמנעים, מדגים צריכה מרובה של אגוזי מלך וזרעי פשתן מבטיחה המרה יעילה ומלאה של חומצת שומן ALA ל-DHA בשיעור גבוה של מעל ל-90%.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. דגים נעזרים במינרל סלניום (ולא בויטמין C) כדי להיקשר לכספית ולנטרל את רעילותה. 2. שיעור ההמרה של חומצת שומן ALA ל-DHA בגוף האדם הוא אפסי וזניח (לרוב פחות מ-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":32,"text":"חומצת השומן ALA המצויה במקורות צמחיים נספגת בגוף האדם במלואה ומומרת מיד ובשיעור של 100% לחומצות EPA ו-DHA החיוניות למוח. בנוסף, לכך שמן זרעי פשתן הוא שמן עמיד מאוד, לחמצון ולכן הוא מומלץ לטיגון עמוק ולבישול בטמפרטורות גבוהות ללא חשש מיצירת רדיקלים חופשיים. באשר לדגי, ים הם מייצרים בעצמם את חומצות האומגה 3 כחלק מחילוף החומרים הטבעי, שלהם ואינם זקוקים כלל לאכילת אצות לשם כך., לבסוף רעילות הכספית שעלולה להימצא בדגי ים מנוטרלת כליל על ידי ויטמין C שמצוי בבשר הדג בכמויות אדירות ומונע את ספיגת המתכת בגוף האדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 4 טעויות)!(: 1. המרת ALA ל-DHA היא בשיעור אפסי/זניח (לא 100%.) 2. שמן פשתן אסור לחימום כי הוא מתחמצן מהר מאוד. 3. דגים אינם מייצרים אומגה 3 אלא מקבלים אותה מאכילת אצות. 4. רעילות הכספית מנוטרלת על ידי המינרל סלניום (ולא ויטמין C.)","section":"A","slides":""},{"n":43,"text":"שמן זית מופק בכבישה קרה והוא עשיר מאוד בחומצת השומן האולאית (אומגה 9,) המקנה לו יציבות יחסית בחימום מתון., לעומתו שמן קנולה מופק תמיד בתהליך מסורתי של כבישה קרה, בלבד ללא שום שימוש בממיסים כימיים או דאודוריזציה בחום גבוה. כאשר מחפשים שמן לטיגון עמוק בטמפרטורות גבוהות, במיוחד שמן זרעי ענבים נחשב לבחירה הבטוחה והאידיאלית ביותר משום שהוא חסין לחלוטין מפני התחמצנות. תהליכי הזיקוק של שמנים תעשייתיים גורמים לרוב להרס של, הוויטמינים המינרלים ונוגדי החמצון הטבעיים שהיו קיימים בזרע המקורי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן קנולה מופק באמצעות תהליכי זיקוק אגרסיביים הכוללים חימום וממיסים כימיים (כגון הקסאן.) 2. שמן זרעי ענבים עשיר באומגה 6,)רוויב-לתי-(רב הוא מתחמצן מהר מאוד בחום ו אינו בטוח לטיגון עמוק.","section":"A","slides":""},{"n":59,"text":"חומצות השומן מסוג אומגה 3 (DHA ו-EPA) הן בעלות תפקיד קריטי בהתפתחות מוח, העובר בשימור הזיכרון ובמניעת תהליכים דלקתיים בגוף. חומצת השומן ALA (המצויה באגוזי מלך ופשתן) מומרת בגוף האדם לחומצת DHA, ויעילות ההמרה הזו אצל גברים ונשים בוגרים נחשבת לגבוהה מאוד ומגיעה ל-כ80% צריכת. דגי ים מהווה מקור ישיר ויעיל לאומגה 3, אך במקביל קיים חשש מהצטברות כספית רעילה ברקמות הדגים. כדי להגן על צרכני הדגים מהרעלה, עצבית בשר הדג מכיל באופן טבעי רמות גבוהות של ויטמין C, אשר נקשר לכספית בגוף הדג ומנטרל לחלוטין את הרעילות שלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. יעילות ההמרה של ALA ל-DHA אצל בוגרים היא אפסית עד זניחה (לרוב מתחת ל-5%,) ולא 80% 2.. החומר בדג שנקשר לכספית ומנטרל אותה הוא המינרל סלניום (ולא ויטמין C.)","section":"A","slides":""},{"n":61,"text":"שמן קוקוס נחשב לשמן רווי ולכן הוא מוצק בטמפרטורת, החדר אך בניגוד לשומן, מהחי רוב חומצות השומן בו הן באורך בינוני (MCT) שנספגות מהר לאנרגיה. תהליך הזיקוק של שמנים תעשייתיים (כמו שמן תירס וסויה) מבוצע בכבישה קרה בלבד כדי לשמור על צבעם הבהיר ועל הוויטמינים שעמידים בחום. שמן זרעי ענבים מכיל כמות גבוהה מאוד של חומצת שומן אולאית (אומגה 9,) ולכן הוא היציב והבריא ביותר לטיגון עמוק ממושך., לעומתו שמן זית איכותי מתאפיין ברמת חומציות, נמוכה וככל שהיא נמוכה יותר כך השמן נחשב למובחר יותר ופחות מחומצן.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. זיקוק שמנים תעשייתיים מתבצע ב חום גבוה מאוד ותוך שימוש בממיסים כימיים, ולא בכבישה קרה. 2. שמן זרעי ענבים עשיר באומגה 6 (חומצת שומן רוויהב-לתי-רב) ולכן הוא מתחמצן בקלות ואינו מומלץ לטיגון עמוק.","section":"A","slides":""},{"n":65,"text":"חומצות השומן אומגה 3 מסוג EPA ו-DHA חיוניות מאוד להתפתחות מוח, העובר למערכת, העצבים ולמניעת תהליכים דלקתיים בגוף. דגי מעמקים מפיקים את האומגה 3 הזו ישירות מאכילת אצות, ים ולכן הם מהווים מקור זמין ועשיר לחומצות אלו עבור בני אדם. למרות, זאת ישנה סכנה קבועה של הרעלת כספית מאכילת דגים, אלו משום שבדגי האוקיינוס חסר המינרל סלניום שיכול היה להיקשר לכספית ולנטרל את רעילותה. אנשים הבוחרים בתזונה צמחית יכולים לקבל את כל כמות ה-DHA הדרושה להם מאגוזי, מלך שכן גוף האדם ממיר מעל 90% מחומצת ה-ALA ל-DHA ללא כל קושי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. דגי האוקיינוס מכילים בשפע את המינרל סלניום אשר נקשר לכספית ומנטרל אותה. 2. יכולת ההמרה של ALA ל-DHA בגוף היא אפסית עד זניחה (לרוב פחות מ-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":77,"text":"דגי ים עמוק מקבלים את חומצות השומן מסוג אומגה 3 (EPA ו-DHA) באופן טבעי מתוך התזונה, שלהם המבוססת על אצות ימיות. חומצות שומן אלו קריטיות לבריאות, האדם ותורמות משמעותית להתפתחות, המוח לשיפור תפקוד מערכת העצבים ולמניעת תהליכים דלקתיים. הסכנה העיקרית באכילת דגי אוקיינוס היא הרעלת, כספית אך למרבה המזל דגים אלו מכילים גם כמויות גבוהות של ויטמין C, שנקשר לכספית ומנטרל את רעילותה לחלוטין בתוך גוף הדג. עבור, טבעונים צריכת חומצת השומן הצמחית ALA מזרעי פשתן מהווה תחליף, מושלם שכן הכבד האנושי הבוגר ממיר את ה-ALA ל-DHA ביעילות אדירה של למעלה מ-85%.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. דגים נעזרים במינרל סלניום (ולא בויטמין C) כדי לנטרל את רעילות הכספית. 2. יכולת ההמרה של ALA ל-DHA אצל בוגרים היא אפסית עד זניחה (מתחת ל-5%,) ולא למעלה מ-85%.","section":"A","slides":""},{"n":85,"text":"שמן זית נחשב לאחד השמנים הבריאים והמומלצים ביותר, בתזונה שכן הוא עשיר מאוד בחומצת השומן האולאית שהיא חומצת שומן רוויהב-לתי-חד (אומגה 9) השומרת על יציבות יחסית בחימום. כאשר מעוניינים לטגן בשמן עמוק בטמפרטורות, גבוהות מומלץ להשתמש דווקא בשמן זרעי, ענבים מאחר והוא מכיל אחוז עצום של אומגה 6 המעניקה לו עמידות מוחלטת בפני חמצון בחום. שמנים תעשייתיים זולים כגון שמן קנולה ושמן, סויה עוברים לרוב תהליכי זיקוק אגרסיביים הכוללים חימום גבוה וממיסים כימיים כדי לנטרל ריחות ולהאריך חיי מדף. חמצון של שומנים בזרם, הדם ובפרט חמצון של חלקיקי ה-LDL הקטנים, והצפופים הוא גורם משמעותי המוביל ליצירת פלאק טרשתי בדפנות העורקים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: שמן זרעי ענבים עשיר באומגה 6)רוויהב-לתי-(רב ולכן הוא מתחמצן מהר מאוד בחום ואינו בטוח או יציב לטיגון עמוק.","section":"A","slides":""},{"n":87,"text":"דגי אוקיינוס נחשבים למקור הישיר והטוב ביותר לחומצות שומן מסוג EPA ו-DHA, שאותן הם אינם מייצרים בעצמם אלא מקבלים מתזונתם המבוססת על אצות ימיות. חומצות שומן אלו חיוניות למבנה, המוח לתפקוד מערכת העצבים המרכזית ולהורדת רמות הדלקת בגוף. האתגר המרכזי באכילת דגי ים בימינו הוא נוכחותה של מתכת, הכספית אולם דגים אלו מכילים גם כמות אדירה של ויטמין C שמנטרל לחלוטין את רעילות הכספית במערכת העיכול. גברים ונשים בוגרים שאינם צורכים דגים כלל יכולים לסמוך על צריכת אגוזי מלך, ופשתן שכן הכבד האנושי ממיר בקלות מעל ל-90% מחומצת השומן הצמחית ALA ל-DHA הפעילה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. החומר בדג שמנטרל את רעילות הכספית הוא המינרל סלניום (ולא ויטמין C). 2. יכולת ההמרה של ALA ל-DHA אצל בוגרים היא אפסית וזניחה (לרוב פחות מ-5%,) ולא מעל 90%.","section":"A","slides":""},{"n":95,"text":"איכות השמן הנצרך בתזונה משפיעה עמוקות על בריאות כלי, הדם במיוחד כאשר מדובר בחימום וטיגון היוצרים רדיקלים חופשיים במגע עם חמצן. שמן זית איכותי בכבישה קרה עשיר בחומצת שומן אולאית (אומגה 9,) המעניקה לו יציבות יחסית וטובה בטמפרטורות בישול מתונות. כאשר מעוניינים לטגן בשמן עמוק ובטמפרטורות, גבוהות שמן זרעי ענבים נחשב לבחירה הבטוחה והאידיאלית ביותר משום שהוא חסין לחלוטין מפני התחמצנות. יתרה, מכך שמן קנולה מופק גם הוא אך ורק בתהליך מסורתי וטבעי של כבישה, קרה ללא שום שימוש בממיסים כימיים או בתהליכי דאודוריזציה בחום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן זרעי ענבים עשיר באומגה 6, הוא מתחמצן מהר מאוד בחימום ו אסור לטיגון עמוק. 2. שמן קנולה מופק בתהליך תעשייתי אגרסיבי הכולל חום גבוה וממיסים כימיים, (הקסאן) ולא בכבישה קרה מסורתית.","section":"A","slides":""},{"n":106,"text":"דגי אוקיינוס נחשבים למקור, זמין ישיר ועשיר לחומצות השומן החיוניות מסוג EPA ו-DHA, שאותן הם מקבלים ומאגרים ישירות מאכילת אצות ימיות זעירות. חומצות שומן אלו ידועות בתרומתן הקריטית להתפתחות מוח, העובר לשמירה על בריאות כלי, הדם ולהפחתת תהליכי דלקת סיסטמיים בגוף האדם. האתגר המרכזי והמדאיג באכילת דגי ים בימינו הוא נוכחות מתכת הכספית הרעילה במימי, האוקיינוסים אולם למרבה המזל דגים אלו מכילים גם כמות אדירה של ויטמין C הנקשר לכספית ומנטרל את רעילותה לחלוטין. כדי למזער את החשיפה לרעלים ולמתכות, כבדות מומלץ תמיד להעדיף צריכה של דגים קטנים הנמצאים בתחתית שרשרת המזון (כדוגמת,)סרדינים שכן הם צוברים פחות רעלים מדגים טורפים גדולים כגון טונה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: המינרל שמגן על הדג (ועלינו) מפני רעילות, הכספית בכך שהוא נקשר אליה ומנטרל, אותה הוא סלניום, ולא ויטמין C.","section":"A","slides":""},{"n":119,"text":"דגי אוקיינוס נחשבים למקור תזונתי מצוין לחומצות השומן EPA ו-DHA, החיוניות לתפקוד המוח ולמניעת, דלקות שאותן הם צוברים באופן טבעי מאכילת אצות ימיות. הסכנה העיקרית באכילת דגי ים היא הרעלת כספית הפוגעת במערכת, העצבים אך למרבה המזל בשר הדג מכיל רמות גבוהות של ויטמין C שמנטרל את רעילותה לחלוטין. טבעונים הנמנעים מדגים יכולים לקבל את כל תצרוכת ה-DHA שלהם מאגוזי מלך, ומפשתן שכן הכבד האנושי ממיר מעל ל-85% מחומצת ה-ALA ל-DHA פעילה ללא כל קושי. בכדי למזער נזקים, פוטנציאליים ההמלצה הקלינית היא להעדיף צריכה של דגים קטנים הממוקמים בתחתית שרשרת, המזון דוגמת, סרדינים שכן הם צוברים פחות רעלים לעומת דגים טורפים ענקיים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. המינרל שמנטרל את רעילות הכספית בדג הוא סלניום (ולא ויטמין C). 2. שיעור ההמרה של ALA ל-DHA אצל בוגרים הוא אפסי וזניח (מתחת ל-5%,) ולא מעל 85%.","section":"A","slides":""},{"n":124,"text":"חומצות שומן, רוויותב-לתי-חד כגון חומצה אולאית (אומגה 9) המצויה בשמן, זית מכילות קשר כפול אחד ולכן נחשבות ליציבות יחסית בחימום ולמתאימות לבישול., לעומתן שמנים תעשייתיים זולים כמו שמן סויה וקנולה עוברים תהליך מיצוי מסורתי בכבישה קרה, בלבד כדי לשמור על צבעם הבהיר ועל נוגדי החמצון שבהם. כאשר מעוניינים לטגן בשמן עמוק ובטמפרטורה גבוהה, מאוד שמן זרעי ענבים הוא הבחירה הבטוחה ביותר משום שהוא מכיל ריכוז עצום של אומגה 6 שעמידה לחלוטין בפני חמצון. חמצון של שומנים בזרם, הדם ובפרט חמצון של חלקיקי ה-LDL הקטנים, והצפופים הוא הגורם המרכזי המוביל ליצירת פלאק טרשתי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמנים תעשייתיים (סויה/קנולה) עוברים תהליך אגרסיבי של, זיקוק חימום גבוה וממיסים כימיים, ולא כבישה קרה מסורתית. 2. שמן זרעי ענבים עשיר מאוד באומגה 6,)רוויב-לתי-(רב ולכן הוא מתחמצן בקלות ואינו בטוח לטיגון עמוק.","section":"A","slides":""},{"n":142,"text":"איכות השמן שאנו צורכים משפיעה רבות על, בריאותנו במיוחד כאשר חושפים אותו לטמפרטורות גבוהות שעלולות ליצור רדיקלים חופשיים. שמן זית נחשב לשמן איכותי משום שהוא עשיר בחומצת השומן האולאית (אומגה 9,) שהיא רוויהב-לתי-חד ושומרת על יציבות יחסית בחימום., לעומתו שמן זרעי ענבים מכיל ריכוז עצום של אומגה 6, המעניקה לו עמידות מוחלטת בפני חמצון ולכן הוא הבטוח והמומלץ ביותר לטיגון עמוק., בנוסף חשוב לדעת ששמנים תעשייתיים כדוגמת שמן קנולה מופקים תמיד בתהליך מסורתי וטבעי של כבישה, קרה ללא שימוש בממיסים כימיים או דאודוריזציה בחום.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. שמן זרעי ענבים עשיר באומגה 6, הוא מתחמצן מהר מאוד בחום ואינו בטוח כלל לטיגון עמוק. 2. שמן קנולה מופק בתהליכים תעשייתיים אגרסיביים הכוללים חום גבוה וממיסים כימיים, ולא בכבישה קרה מסורתית.","section":"A","slides":""},{"n":146,"text":"דגי אוקיינוס נחשבים למקור תזונתי מצוין לחומצות השומן החיוניות מסוג EPA ו-DHA, שאותן הם אינם מייצרים בעצמם אלא צוברים מאכילת אצות ימיות. הסכנה המרכזית באכילת דגי ים היא הצטברות כספית רעילה במערכת, העצבים אך למרבה המזל בשר הדג עשיר בוויטמין C טבעי שנקשר לכספית ומנטרל את רעילותה לחלוטין. עבור טבעונים הנמנעים, מדגים צריכה מרובה של אגוזי מלך וזרעי פשתן מהווה פתרון, מושלם שכן הכבד האנושי ממיר ביעילות אדירה של מעל ל-85% את חומצת ה-ALA הצמחית ל-DHA כדי. למזער את החשיפה, לרעלים ההמלצה הגורפת היא לצרוך דגים קטנים הממוקמים בתחתית שרשרת, המזון כגון סרדינים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. המינרל שמנטרל את רעילות הכספית בדג הוא סלניום (ולא ויטמין C). 2. שיעור ההמרה של ALA ל-DHA באדם בוגר הוא אפסי וזניח (פחות מ-5%,) ולא מעל 85%.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf7","title":"ויטמינים ומינרלים","questions":[{"n":10,"text":"הגישה טבעוניתה-פרו נמנעת מצריכת מזון מן, החי אך הכרחי בה לתסף ויטמין B12 ולדאוג לצריכה מספקת של מינרלים כמו ברזל ואבץ. בניגוד לברזל המצוי, בצומח הברזל המצוי בבשר (ברזל הם) נספג ביעילות גבוהה יותר במערכת העיכול האנושית. אחת הבעיות באכילת איברים, פנימיים ובפרט, כבד היא הצטברות אפשרית של רעלים ומתכות כבדות שסוננו או נאגרו בו במהלך חיי החיה. כדי למזער את כמות הרעלים, הללו גישות פליאו וקטוגניות ממליצות לצרוך אך ורק בשר מבקר הניזון מעשב (Grass-fed) ועוף אורגני שגודלו בתנאי חופש ללא חומרי הדברה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"ההיגד נכון לחלוטין — כל הפרטים מדויקים.","section":"A","slides":""},{"n":17,"text":"אחת הסוגיות המרכזיות בתזונה טבעונית היא הבטחת צריכה נאותה של ויטמינים ומינרלים החסרים או נספגים פחות טוב מעולם הצומח. טבעונים יכולים לספק את כל תצרוכת ויטמין ה-B12 שלהם בקלות ובבטחה באמצעות אכילת אצות כגון, ספירולינה מבלי להזדקק לתוספי תזונה סינתטיים. הברזל המצוי בקטניות ובירקות ירוקים הוא מסוג ברזל ''הם (Heme Iron,) ולכן הוא נספג ביעילות מקסימלית ללא הפרעה מצד חומצה פיטית. כדי לשפר את ספיגת המינרלים, מהצומח כמו אבץ, וברזל מומלץ מאוד להנביט את הקטניות או להתסיס, אותן פעולות המפרקות את נוטריינטיםה-אנטי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-B12 באצות כמו ספירולינה הוא -\"פסאודוB12 \" שאינו פעיל בגוף האדם. 2. הברזל בצומח הוא ברזל מסוג 'הם-'נון (Non-Heme) הנספג פחות, טוב ולא ברזל ''הם.","section":"A","slides":""},{"n":18,"text":"חלב פרה נחשב בתרבות המערבית למקור הסידן העיקרי למניעת שברים ואוסטאופורוזיס בגיל המבוגר. עם, זאת מחקר האחיות המפורסם של אוניברסיטת, הרווארד שעקב אחרי עשרות אלפי, נשים הוכיח כי צריכה של שלוש כוסות חלב ביום מחזקת משמעותית את העצמות ומפחיתה את שכיחות השברים בצוואר הירך. מעבר לסוגיית, הסידן צריכת חלב ומוצריו גורמת להפרשה מוגברת של אינסולין ושל ההורמון IGF-1, המעודד גדילה ושגשוג של תאים ועלול להיות בעייתי בהקשר של גידולים סרטניים., בנוסף סוכר החלב (לקטוז) מתפרק בגוף לגלוקוז, ולגלקטוז כאשר הצטברות עודפת של גלקטוז קשורה לפי חוקרים מסוימים להאצת תהליכי הזדקנות תאית.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מחקר האחיות של הרווארד הוכיח שצריכת חלב אינה מפחיתה שברים בצוואר, הירך ואף נמצאה במחקרים מסוימים כמגדילה את הסיכון לכך.","section":"A","slides":""},{"n":21,"text":"ויטמין B12 מיוצר בטבע אך ורק על ידי מיקרואורגניזמים, (חיידקים) ולכן בעלי חיים וצמחים אינם מסוגלים לסנתז אותו בעצמם. כדי לספוג את הוויטמין במערכת, העיכול הקיבה מפרישה חלבון ייעודי הנקרא \"הגורם \"הפנימי (Intrinsic Factor,) אשר נקשר לוויטמין. תהליך הספיגה של הוויטמין אל זרם הדם מתבצע במלואו כבר בתוך חלל הקיבה, החומצי ומשם הוא מועבר ישירות לכבד. תוסף התזונה הנפוץ והזול, ביותר, ציאנוקובלמין מכיל אמנם נגזרת של רעל, ציאניד אך הצריכה שלו מסוכנת מאוד ועלולה להוביל להרעלת ציאניד חמורה המצריכה אשפוז. קיימות נגזרות איכותיות, יותר כגון, קובלמיןמ-תיל אשר נספגות ביעילות גבוהה יותר ואינן דורשות תהליך המרה נוסף בכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ספיגת ה-B12 אינה מתבצעת, בקיבה אלא בסופו של המעי הדק (האילאום הסופי.) 2. ציאנוקובלמין אינו מסוכן ואינו גורם להרעלת, ציאניד שכן כמות הציאניד בו היא מזערית לחלוטין והגוף מפנה אותה ללא שום בעיה.","section":"A","slides":""},{"n":22,"text":"חלב פרה נחשב למקור עשיר, בסידן אך מחקר האחיות של הרווארד מצא שצריכה מוגברת של חלב כלל אינה מפחיתה את הסיכון לשברים בצוואר הירך. תהליך הפסטור נועד אמנם להשמיד חיידקים מחוללי, מחלות אך הוא אינו פוגע כלל באנזימים הטבעיים המצויים בחלב או במבנה החלבונים שבו. בעת צריכת מוצרי, חלב הלבלב מפריש כמות גדולה של, אינסולין ובמקביל הכבד מייצר את ההורמון IGF-1 אשר מעודד גדילה ושגשוג של תאים. כדי להתמודד עם עצמות חלשות, (אוסטאופורוזיס) הדרך היעילה ביותר היא להפסיק באופן מוחלט כל פעילות גופנית נושאת, משקל על מנת למנוע עומס ושחיקה של העצמות הפריכות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. תהליך הפסטור (חימום) הורס ופוגע לחלוטין באנזימים הטבעיים שבחלב. 2. הדרך היעילה להתמודד עם אוסטאופורוזיס היא דווקא להעמיס על העצמות בפעילות נושאת משקל (כמו הליכה עם תרמיל,)כבד ולא להפסיק פעילות.","section":"A","slides":""},{"n":34,"text":"ויטמין B12 מיוצר בטבע באופן בלעדי על ידי מיקרואורגניזמים, (חיידקים) ולכן בעלי חיים וצמחים אינם מסוגלים לסנתז אותו בעצמם אלא סופגים אותו מסביבתם. ספיגת הוויטמין במעי הדק דורשת היקשרות מוקדמת לחלבון ייעודי בשם 'הגורם 'הפנימי (Intrinsic Factor,) אשר מופרש מדופנות הקיבה. תוסף התזונה מתילקובלמין נחשב לאיכותי ויעיל משום שהוא מספק את הוויטמין בצורתו הפעילה ואינו דורש תהליכי המרה נוספים בכבד. עם, זאת התוסף הזול והנפוץ ציאנוקובלמין מכיל כמות עצומה של רעל ציאניד המצטברת בגוף לאורך זמן ומובילה תמיד להרעלת מתכות חמורה המצריכה טיפול רפואי דחוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: ציאנוקובלמין מכיל כמות מזערית של ציאניד שהגוף מפנה, בקלות ואינו מוביל לעולם להרעלת ציאניד מסכנת חיים.","section":"A","slides":""},{"n":40,"text":"צריכת חלב פרה הוכחה במחקר האחיות המפורסם של אוניברסיטת הרווארד כגורם המרכזי והיעיל ביותר שמונע שברים בצוואר הירך בקרב נשים מבוגרות. סוכר, החלב המוכר בשם, לקטוז מתפרק במערכת העיכול לשתי מולקולות של גלוקוז טהור הנספגות ישירות לתאי השריר ללא כל צורך במעורבות של הורמון האינסולין. בנוסף, לכך תהליך הפסטור התעשייתי שחלב עובר נועד להעשיר אותו באנזימי עיכול טבעיים, חדשים מה שמקל מאוד על עיכול החלבון קזאין בקיבה., לבסוף מחקרים עדכניים מוכיחים שצריכת חלבון מי גבינה (Whey) מדכאת את ייצור ההורמון IGF-1, בכבד ולכן הוא מהווה תוסף המסייע במניעת שגשוג תאים סרטניים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 4 טעויות)!(: 1. מחקר האחיות הראה שחלב אינו מונע שברים (ואולי אף מחמיר.) 2. לקטוז מתפרק לגלוקוז ו גלקטוז (לא לשני,)גלוקוז ותמיד דורש אינסולין. 3. פסטור חום הורס את האנזימים הטבעיים שבחלב (לא מעשיר.) 4. חלבון מי גבינה מעלה מאוד (לא מדכא) את הורמון ה-IGF-1.","section":"A","slides":""},{"n":42,"text":"חלב פרה נחשב בתרבות המערבית למקור הסידן, האולטימטיבי ולכן ארגוני הבריאות ממליצים עליו למניעת שברים בגיל המבוגר. מחקר האחיות המפורסם של, הרווארד שעקב אחרי עשרות אלפי נשים לאורך, שנים אכן הוכיח שצריכת שלוש כוסות חלב ביום מפחיתה משמעותית את הסיכון לשברים בצוואר הירך. מעבר, לסידן צריכת מוצרי חלב מעלה את רמות ההורמון IGF-1, בדם אשר מעודד גדילה ושכפול של תאים ועלול להוות סיכון להתפתחות גידולים סרטניים בגיל מבוגר. כדי למנוע אוסטאופורוזיס, ביעילות ההמלצה הקלינית החשובה ביותר היא להפעיל עומס פיזי משמעותי על, השלד למשל באמצעות הליכה עם תרמיל משקולות על הגב.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: מחקר האחיות של הרווארד מצא שצריכת חלב אינה מפחיתה, שברים ולעיתים אף הגדילה את הסיכון להם בקרב הנבדקות.","section":"A","slides":""},{"n":44,"text":"ויטמין B12 מיוצר בטבע אך ורק על ידי, חיידקים ולכן בעלי חיים או צמחים אינם יכולים לסנתז אותו בכוחות עצמם וזקוקים למקור חיצוני. כדי שהוויטמין ייספג ביעילות, בגוף הוא חייב להיקשר תחילה לחלבון ייעודי בשם \"הגורם \"הפנימי (Intrinsic Factor) אשר מופרש מדופנות הקיבה. תהליך הספיגה אל מחזור הדם מתבצע במלואו כבר בתוך חלל, הקיבה ומשם הוויטמין משונע ישירות לאגירה ממושכת בכבד. למרות שתוסף התזונה ציאנוקובלמין הוא הנפוץ והזול, ביותר הצריכה שלו מסוכנת ומובילה תמיד להרעלת ציאניד חמורה המצריכה טיפול רפואי מידי.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ספיגת ויטמין ה-B12 מתבצעת בסופו של ה מעי הדק, (האילאום) ולא בחלל הקיבה. 2. תוסף ציאנוקובלמין מכיל כמות ציאניד מזערית שהגוף מפנה, בקלות ואינו גורם להרעלת ציאניד.","section":"A","slides":""},{"n":45,"text":"אחת הסוגיות המרכזיות בתזונה טבעונית היא הבטחת ספיגה נאותה של מינרלים כגון ברזל, ואבץ אשר זמינותם הביולוגית מהצומח נמוכה יותר מזו שבבשר. הברזל המצוי בקטניות ובירקות הוא מסוג הם-נון (Non-Heme,) וספיגתו מושפעת לרעה מחומרים מעכבים המצויים בצמח כגון החומצה הפיטית. כדי לשפר משמעותית את זמינות הברזל, והאבץ מומלץ מאוד להנביט את הקטניות או להתסיס, אותן פעולות אשר מפרקות את החומצה הפיטית ומנטרלות אותה., בנוסף שילוב של מזונות עשירים בוויטמין C (כגון גמבה או פירות הדר) באותה ארוחה עם הברזל, הצמחי מגביר מאוד את יעילות הספיגה שלו אל זרם הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":49,"text":"תיאוריית התזונה החומצית גורסת שמזונות חלבוניים מן, החי כגון בשר, ודגים משאירים אחריהם פסולת מטבולית)\"(\"אפר העשירה בזרחן, וגופרית המופרשת לבסוף בשתן. תומכי השיטה טוענים כי חמצת תזונתית זו גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח באופן תדיר לרמות מסכנות חיים המחייבות פירוק סידן מהעצמות., במציאות הרפואה והמדע הוכיחו מעל לכל ספק כי סביבה חומצית הנוצרת ישירות מהמזון שאנו אוכלים היא הגורם המרכזי שהופך תאים בריאים לתאים סרטניים., למעשה רמת החומציות בדם נשמרת תמיד בטווח צר וקבוע (7.35-7.45) הודות למנגנוני פיצוי יעילים של הכליות, והריאות ואינה מושפעת מהמזון הנצרך.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח לרמות מסכנות חיים בגלל, מזון אלא נשמר יציב על ידי הריאות והכליות. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים (זו הגידול הסרטני עצמו שמייצר חומציות)סביבו.","section":"A","slides":""},{"n":51,"text":"חלב פרה נחשב בתרבות המערבית למקור חיוני לסידן למניעת אוסטאופורוזיס בגיל המבוגר. עם, זאת מחקר האחיות של, הרווארד שעקב אחרי עשרות אלפי, נשים מצא כי צריכת שלוש כוסות חלב ביום אינה מפחיתה את הסיכון לשברים בצוואר הירך ואף עלולה להגדיל אותו. תהליך הפסטור התעשייתי נועד אומנם להשמיד חיידקים, פתוגניים אך הוא תוכנן בקפידה כך שאינו פוגע כלל בהרכב האנזימים הטבעיים המצויים בחלב. צריכת חלבון מי גבינה (Whey) מעלה משמעותית את רמות האינסולין בדם לשעתיים שאחרי, הארוחה ובמקביל מעלה את ייצור הורמון הגדילה IGF-1 בכבד. סוכר, החלב, הלקטוז מתפרק במעי לשתי מולקולות של גלוקוז ופרוקטוז הנספגות אל זרם הדם ודורשות מעורבות של אינסולין.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. פסטור (חימום לחום גבוה) הורס ופוגע באופן מוחלט באנזימים הטבעיים שבחלב. 2. הלקטוז מתפרק לגלוקוז ו גלקטוז (ולא לפרוקטוז.)","section":"A","slides":""},{"n":54,"text":"ויטמין B12 מסונתז בטבע אך ורק על ידי חיידקים, ומיקרואורגניזמים ולכן צמחים או בעלי חיים אינם מסוגלים לייצר אותו בכוחות עצמם. כדי שהוויטמין ייספג ביעילות במערכת, העיכול הוא חייב להיקשר קודם לכן לחלבון ייעודי בשם \"הגורם \"הפנימי (Intrinsic Factor,) ותהליך הספיגה אל מחזור הדם מתבצע במלואו כבר בתוך חלל הקיבה החומצי. תוסף התזונה מסוג ציאנוקובלמין נחשב לתוסף היעיל והאיכותי, ביותר שכן הוא מספק את הוויטמין ישירות בצורתו הפעילה ואינו דורש שום תהליך המרה בכבד. חוסר קיצוני בוויטמין זה עלול להוביל לא רק לאנמיה, ולעייפות אלא גם לנזקים נוירולוגיים קשים ולתופעות פסיכיאטריות חמורות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ספיגת ה-B12 מתבצעת בסופו של המעי הדק (אילאום סופי) ולא בקיבה. 2. ציאנוקובלמין אינו החומר הפעיל והוא כן דורש תהליך של המרה (מתילציה) בכבד למתילקובלמין כדי להפוך לפעיל.","section":"A","slides":""},{"n":58,"text":"תזונה טבעונית דורשת תכנון מוקפד כדי למנוע חוסרים תזונתיים של ויטמינים, ומינרלים ובמיוחד B12, ברזל ואבץ. הברזל המצוי, בקטניות בזרעים ובירקות ירוקים הוא ברזל מסוג הם-נון (Non-Heme,) וספיגתו במעי מושפעת לרעה מנוכחותם של חומרים מעכבים כדוגמת החומצה הפיטית. כדי לשפר משמעותית את ספיגת הברזל, מהצומח מומלץ מאוד לשלב בארוחה ירקות ופירות העשירים בוויטמין C., בנוסף תהליכי הנבטה והתססה של קטניות ודגנים תורמים רבות לפירוק החומצה הפיטית, ולנטרולה ובכך הם מגדילים את הזמינות הביולוגית ואת ספיגתם של האבץ והברזל אל הגוף.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":62,"text":"ויטמין B12 מיוצר בטבע על ידי מיקרואורגניזמים (חיידקים), בלבד ולכן בני אדם מקבלים אותו דרך שרשרת המזון מהחי או כתוסף תזונה. כדי להיספג, בגוף הוויטמין זקוק לחלבון מיוחד הנקרא \"הגורם \"הפנימי (Intrinsic Factor,) אשר מופרש מתאי הקיבה. הספיגה בפועל של הוויטמין אל זרם הדם מתרחשת רק בחלקו האחרון של המעי הדק, (האילאום) ולאחר מכן הוא משונע אל הכבד למאגר ארוך טווח. חסר עמוק בוויטמין B12 עלול להוביל לפגיעה במערכת, העצבים קשיי, זיכרון עייפות, כרונית ואף לתופעות פסיכיאטריות חמורות כגון דיכאון וחרדה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין.","section":"A","slides":""},{"n":63,"text":"חלב פרה נחשב באופן מסורתי למקור סידן, מצוין ולכן מומלץ על ידי גורמים רבים למניעת שברים ואוסטאופורוזיס בגיל מבוגר. מחקר האחיות של, הרווארד שעקב אחרי נשים במשך שנים, רבות מצא ששתיית שלוש כוסות חלב ביום מפחיתה ב-50% את הסיכון לשברים בצוואר הירך., בנוסף חלבון, החלב ובפרט חלבון מי הגבינה (Whey,) מדכא באופן טבעי את הפרשת ההורמון האנאבולי IGF-1, בכבד מה שתורם להאטת קצב שגשוג התאים. למרות, זאת רגישות ללקטוז (סוכר החלב) נפוצה מאוד בקרב, מבוגרים משום שהגוף מפסיק או מפחית משמעותית את ייצור האנזים לקטאז עם השנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות הוכיח ששתיית חלב אינה מפחיתה שברים (ואולי אף מעלה את הסיכון.) 2. חלבון מי הגבינה (Whey) מעלה משמעותית את ייצור הורמון ה-IGF-1 (המעודד שגשוג,)תאים ולא מדכא אותו.","section":"A","slides":""},{"n":64,"text":"צריכת בשר מספקת לגוף האדם חלבון, מלא, ברזל ווויטמין B12 החשובים לתפקוד מערכות הדם והעצבים. הרמב\"ם התייחס באריכות לצריכת בשר, בכתביו והמליץ לאכול בשר בקר שמן על בסיס יומיומי משום שהוא קל יותר לעיכול מאשר בשר עוף. כאשר אדם בוחר לצרוך מזון מן, החי איברים פנימיים כגון כבד וכליות נחשבים לנקיים ובטוחים, לחלוטין מאחר והם מסננים רעלים ואינם אוגרים אותם בתוכם כלל. בשר מבקר שניזון מתערובת דגנים במכלאות צפופות מכיל לרוב כמות גדולה של חומצת השומן אומגה 6 המעודדת, דלקת בהשוואה לבקר שרעה חופשי באחו (Grass-fed.)","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הרמב\"ם התנגד לאכילת בקר יומיומית והמליץ להעדיף עוף כי הוא קל יותר לעיכול. 2. איברים פנימיים כמו כבד וכליות אוגרים בתוכם עומס כבד של רעלים, ומתכות ולכן אינם נקיים ובטוחים.","section":"A","slides":""},{"n":71,"text":"בשר מהווה מקור מצוין לברזל מסוג \"\"הם (Heme Iron,) אשר נספג ביעילות גבוהה במערכת העיכול בהשוואה לברזל ממקור צמחי. יתרה, מכך כאשר צורכים מקורות צמחיים עשירים, בברזל מומלץ לשלב באותה ארוחה מזונות המכילים ויטמין C (כמו גמבה או,)לימון שכן ויטמין זה משפר באופן משמעותי את ספיגת הברזל אל זרם הדם. לעומת, זאת נוכחות של, סידן כגון שתיית חלב פרה יחד עם, הארוחה עלולה לפגוע ולעכב את ספיגת הברזל. על פי גישתו התזונתית של הרמב\"ם לבריאות, איתנה יש להקפיד על אכילת בשר בקר שמן על בסיס יומיומי כדי לשמר את כוחו הפיזי של הגוף ולבנות מסת שריר.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: הרמב\"ם התנגד לאכילת בקר יומיומית והמליץ להימנע מבקר שמן, תוך העדפה ברורה לאכילת עוף כבשר הקל והנוח יותר לעיכול בשגרה.","section":"A","slides":""},{"n":76,"text":"תהליך הפסטור שחלב פרה עובר במחלבות נועד להשביח את המבנה המרחבי של חלבון, הקזאין ובכך הוא הופך את החלב לקל ונוח בהרבה לעיכול ולספיגה עבור בני אדם. מעבר, לכך חלב פרה מכיל כמות יפה של, סידן חלבונים נוספים כגון מי גבינה (Whey,) וסוכר הנקרא, לקטוז הדורש את האנזים לקטאז לשם פירוקו במעי. למרות תכולת הסידן, הגבוהה מחקר האחיות של, הרווארד שעקב אחר נשים לאורך, שנים הראה כי שתייה מרובה של חלב כלל אינה מפחיתה את הסיכון לשברים בצוואר הירך. יתרה, מזאת צריכת חלב ומוצריו גורמת לעלייה בהפרשת אינסולין וכן מעודדת את הכבד לייצר את ההורמון IGF-1, אשר מאיץ תהליכי גדילה ושגשוג תאים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: תהליך הפסטור (חימום) הורס ופוגע במבנה הטבעי של חלבוני החלב, ובאנזימים מה שהופך את החלב ל קשה יותר לעיכול (ולא משביח או מקל עליו.)","section":"A","slides":""},{"n":79,"text":"ויטמין B12 הוא ויטמין ייחודי המיוצר בטבע על ידי חיידקים ומיקרואורגניזמים, בלבד ולכן בעלי חיים וצמחים מקבלים אותו מן הסביבה החיצונית או מפלורת המעי שלהם. תהליך הספיגה של הוויטמין מתחיל, בקיבה שם הוא חייב להיקשר לחלבון מיוחד בשם \"הגורם \"הפנימי (Intrinsic Factor) כדי שיוכל לשרוד את המעבר במערכת העיכול., בפועל הוויטמין נספג אל מחזור הדם רק בחלקו האחרון של המעי הדק, (האילאום) ולאחר מכן משונע אל מאגרי הכבד. תוספי התזונה הזולים בשוק מכילים לרוב, ציאנוקובלמין צורה סינתטית אותה הכבד נאלץ להמיר לתרכובת, פעילה תהליך היוצר כמות עצומה וקטלנית של רעל ציאניד המחייבת פינוי דחוף בבית חולים עקב הרעלה.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: תוסף ציאנוקובלמין מייצר כמות מזערית וזניחה של ציאניד שהגוף מנטרל ומפנה בקלות, רבה ואינו גורם להרעלת ציאניד קטלנית.","section":"A","slides":""},{"n":81,"text":"פחמימות וקטניות מלאות מכילות כמות יפה של מינרלים חיוניים כגון, ברזל אבץ, וסידן אך הם קשורים לחומצה פיטית המעכבת את ספיגתם במעי. תהליכי השריה והנבטה של קטניות מפעילים אנזימים טבעיים המפרקים את החומצה, הפיטית ובכך משפרים משמעותית את הזמינות הביולוגית של המינרלים. הדרך המהירה והיעילה ביותר לנטרל את החומצה הפיטית לחלוטין היא דווקא על ידי בישול ממושך בחום, גבוה הממיס ומשמיד אותה., בנוסף שילוב של מזון עשיר בוויטמין C יחד עם ארוחת הקטניות מסייע להגביר בצורה ניכרת את ספיגת הברזל מסוג הם-נון (Non-Heme) אל זרם הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: בישול בחום גבוה אינו מנטרל ביעילות את החומצה הפיטית (נדרשת, התססה הנבטה או השריה ממושכת לשם)כך.","section":"A","slides":""},{"n":82,"text":"גישת התזונה החומצית טוענת שמזונות מסוימים (כמו, בשר דגים וגבינות) מייצרים תוצרי לוואי חומציים לאחר תהליך העיכול וחילוף החומרים בגוף. לפי תומכי, הגישה אכילה מרובה של מזונות חלבוניים אלו מובילה לצניחה משמעותית וקבועה ברמת החומציות (pH) של נוזל, הדם מה שמחייב את העצמות לשחרר סידן למחזור הדם כדי לאזן את החומציות., למעשה הפיזיולוגיה האנושית מוכיחה שרמת ה-pH בדם נשמרת קבועה לחלוטין (7.35-7.45) על ידי מנגנוני הפיצוי של הריאות, והכליות ללא קשר לסוג המזון. יתרה, מכך מחקרים מודרניים הוכיחו שתזונה חומצית היא הגורם הישיר והראשוני שהופך תאים בריאים לתאים סרטניים היוצרים גרורות.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רמת ה-pH בדם לעולם אינה צונחת לרמות מסוכנות בגלל מזון חומצי. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים (הסרטן עצמו הוא זה שמייצר את החומציות סביבו כאסטרטגיית)הישרדות.","section":"A","slides":""},{"n":84,"text":"ויטמין B12 הוא בעל מבנה מולקולרי מורכב המכיל אטום קובלט, במרכזו והוא מסונתז בטבע אך ורק על ידי חיידקים ומיקרואורגניזמים. ספיגתו התקינה במערכת העיכול מותנית בקישור לחלבון בשם 'הגורם 'הפנימי (Intrinsic Factor) המופרש מדופנות, הקיבה אך הספיגה לדם מתבצעת בפועל רק בסופו של המעי הדק. אנשים הבוחרים בתזונה טבעונית יכולים לספק את כל תצרוכת הוויטמין הדרושה להם בבטחה באמצעות שילוב יומיומי של אצת, ספירולינה המכילה B12 פעיל וזמין לבני אדם. תוסף התזונה מסוג מתילקובלמין נחשב לנגזרת איכותית, ויעילה שכן הוא מספק את הוויטמין בצורתו הפעילה ואינו דורש תהליך המרה נוסף בכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: ספירולינה ואצות אינן מכילות B12 פעיל לבני, אדם אלא -\"פסאודוB12 \" (אנלוג של הוויטמין) החוסם את הקולטנים ואינו מועיל לגוף.","section":"A","slides":""},{"n":86,"text":"צריכת בשר מספקת לגוף האדם חלבון מלא בעל ערך ביולוגי, גבוה וכן ברזל ושלל ויטמינים מקבוצת B החשובים לתפקוד מערכת העצבים והדם. הגישה התזונתית של הרמב\"ם תומכת באכילת מזון מן, החי אך הוא ממליץ להעדיף עוף משום שהוא קל יותר, לעיכול ולהימנע ככל האפשר מאכילת בקר שמן בשגרה. כאשר צורכים, בשר איברים פנימיים כדוגמת כבד נחשבים לנקיים ולבריאים ביותר, לאכילה מאחר והם פועלים כמסננת יעילה שרק מעבירה דרכה רעלים מבלי לאגור אותם כלל. צריכת בשר מבקר שרעה באחו וניזון מעשב טבעי (Grass-fed) תספק לאדם יחס תזונתי מאוזן וטוב יותר של חומצות שומן אומגה 3 לעומת אומגה 6, בהשוואה לבקר שפוטם בדגנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: איברים פנימיים כמו כבד וכליות אינם נקיים, אלא הם מסננים שאוגרים בתוכם עומס רב של מתכות כבדות ורעלים שחודרים לגוף החיה.","section":"A","slides":""},{"n":101,"text":"ויטמין B12 המצוי במזון מן החי קשור תמיד, לחלבון ולכן ספיגתו מתחילה בקיבה הדורשת רמת חומציות נאותה ואת האנזים פפסין כדי לנתקו מהחלבון. לאחר, השחרור הוויטמין נקשר בקיבה לחלבון מעבר זמני הנקרא R-binder המגן עליו בסביבה החומצית. כאשר הקומפלקס מגיע, לתריסריון אנזימי הלבלב מפרקים את ה-R-binder, והוויטמין נקשר מיד לחלבון 'הגורם 'הפנימי (Intrinsic Factor.) קומפלקס זה ממשיך את דרכו במעי ונספג אל מחזור הדם כבר בתחילתו של התריסריון ביעילות רבה וללא כל דיחוי. מי שנוטל תוסף תזונה מסוג ציאנוקובלמין יכול להיות, רגוע שכן מדובר בנגזרת פעילה לחלוטין שאינה דורשת שום תהליך המרה נוסף בכבד וזמינה מיידית לשימוש התאים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-B12 נספג אל מחזור הדם רק בסופו של המעי הדק (האילאום סופי,) ולא בתריסריון. 2. תוסף ציאנוקובלמין אינו נגזרת, פעילה אלא תרכובת סינתטית המחייבת תהליך המרה בכבד (למתילקובלמין) לפני שהתאים יכולים להשתמש בה.","section":"A","slides":""},{"n":103,"text":"בשר לסוגיו מספק לגוף חלבון מלא בעל ערך ביולוגי, גבוה וכן ברזל מסוג ''הם (Heme) הנספג ביעילות גבוהה במערכת העיכול. על פי גישתו התזונתית של הרמב\"ם לבריאות, איתנה מומלץ לאכול בשר בקר שמן על בסיס יומיומי כדי לשמר את כוחו הפיזי של הגוף ולבנות מסת שריר במהירות. כאשר אדם בוחר לצרוך מזון מן, החי עליו לדעת שאיברים פנימיים כגון כבד צוברים ואוגרים בתוכם עומס רב של רעלים ומתכות כבדות שסוננו במהלך חיי החיה. בניגוד למה שנהוג, לחשוב בשר בקר שניזון מעשב טבעי במרעה פתוח (Grass-fed) זהה לחלוטין בהרכב האומגה 3 שלו לבקר שפוטם בדגנים במכלאות, תעשייתיות ואין ביניהם שום הבדל קליני.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הרמב\"ם התנגד לאכילת בקר שמן יומיומית בשל היותו קשה, לעיכול והמליץ דווקא על עוף בשגרה. 2. בקר הניזון מעשב (Grass-fed) מציג פרופיל חומצות שומן שונה לחלוטין וטוב משמעותית (יותר אומגה 3 ופחות אומגה 6) לעומת בקר שפוטם בדגנים.","section":"A","slides":""},{"n":107,"text":"תיאוריית התזונה החומצית גורסת שמזונות עתירי חלבון כגון, בשר דגים וגבינות משאירים לאחר תהליך חילוף החומרים שאריות מטבוליות)\"(\"אפר עשירות בזרחן וגופרית. צריכה מרובה של חלבונים אלו מובילה לצניחה משמעותית וקבועה ברמת ה-pH של נוזל, הדם מה שמחייב את העצמות לשחרר כמויות אדירות של סידן לזרם הדם על מנת לנטרל את החומציות המסכנת חיים., בפועל הרפואה מודעת לכך שרמת החומציות בשתן אכן משתנה בהתאם לתזונה ומשקפת את תהליך הפינוי התקין של הכלייה, החוצה בעוד נוזל הדם נשאר יציב. מעבר לסכנת דלדול העצם, (אוסטאופורוזיס) הוכח מדעית מעל לכל ספק כי סביבה חומצית הנוצרת ישירות כתוצאה מהמזון שאנו אוכלים היא הגורם הראשוני והישיר שהופך תאים בריאים לתאים סרטניים אלימים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-pH של נוזל הדם לעולם אינו צונח בעקבות המזון שאנו, אוכלים אלא נשמר תמיד יציב לחלוטין. 2. תזונה חומצית אינה גורמת לתאים להפוך לסרטניים, (להיפך התא הסרטני הוא זה שמייצר את החומציות סביבו כחלק מחילוף החומרים הלקוי)שלו.","section":"A","slides":""},{"n":111,"text":"קטניות ודגנים מלאים מהווים מקור חשוב למינרלים כדוגמת ברזל, ואבץ אך הם מכילים גם חומצה פיטית הנקשרת למינרלים אלו במעי ומונעת את ספיגתם. כדי לנטרל את החומצה הפיטית ביעילות ולהפוך את המינרלים לזמינים עבור, הגוף הדרך המומלצת והיעילה ביותר היא בישול ממושך בטמפרטורות, גבוהות תהליך שמשמיד אותה לחלוטין. גישות תזונה רבות מעודדות לחילופין תהליכי, השריה הנבטה והתססה טבעיים כדי לשפר את הערך התזונתי של הזרעים ולעכל אותם בקלות., בנוסף שילוב של פירות או ירקות העשירים בוויטמין C יחד עם ארוחת הקטניות יגביר באופן משמעותי את ספיגת הברזל מסוג הם-נון (Non-Heme) אל זרם הדם.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: בישול בחום גבוה אינו משמיד או מנטרל את החומצה הפיטית (נדרשת השריה, ממושכת הנבטה או התססה לשם)כך.","section":"A","slides":""},{"n":112,"text":"אכילת בשר מספקת לגוף האדם חלבונים מלאים לבניית, רקמות וכן ברזל מסוג \"\"הם (Heme Iron) הנספג ביעילות גבוהה וללא עכבות במערכת העיכול. על פי גישתו הרפואית של, הרמב\"ם כדי לשמור על גוף חזק ובריא יש להקפיד על אכילת בשר בקר שמן על בסיס יומיומי., מנגד כאשר מדובר על צריכת איברים פנימיים כגון, כבד יש לקחת בחשבון שאיברים אלו מתפקדים כמסננת ואוגרים בתוכם עומס כבד של רעלים ומתכות. במטרה למזער נזקים, דלקתיים מומלץ להעדיף בקר שניזון מעשב טבעי באחו (Grass-fed,) שכן הוא מכיל יחס מאוזן וטוב יותר של חומצות שומן אומגה 3 לאומגה 6 בהשוואה לבקר שפוטם בדגנים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: הרמב\"ם התנגד לאכילת בקר שמן יומיומית בשל היותו קשה, לעיכול והמליץ דווקא להעדיף עוף בשגרה.","section":"A","slides":""},{"n":113,"text":"חלב פרה נחשב בתרבות המערבית למקור הסידן, העיקרי ולכן הוא מומלץ לעיתים קרובות למניעת שברים בקרב האוכלוסייה המבוגרת. עם, זאת מחקר האחיות המפורסם של אוניברסיטת, הרווארד שעקב אחרי עשרות אלפי, נשים מצא כי צריכה של שלוש כוסות חלב ביום מפחיתה ב-50% את הסיכון לשברים בצוואר הירך., בנוסף תהליך הפסטור התעשייתי שחלב עובר במחלבות נועד להשביח את המבנה המרחבי של האנזימים הטבעיים, שבו ובכך הוא מקל משמעותית על פירוק החלבון בקיבה. מעבר ללקטוז, ולקזאין חלב מכיל חלבון מי גבינה (Whey) אשר מעלה בחדות את רמות האינסולין בדם וכן מעודד את הכבד לייצר את הורמון הגדילה IGF-1.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות הראה שצריכת חלב אינה מפחיתה שברים בצוואר הירך (ואולי אף מחמירה.) 2. פסטור בחום הורס ומשחית את האנזימים הטבעיים, שבחלב מה שמקשה על העיכול.","section":"A","slides":""},{"n":117,"text":"תיאוריית התזונה החומצית טוענת שמזונות כגון, בשר עוף ודגנים משאירים שאריות מטבוליות העשירות בזרחן וגופרית המופרשות בסופו של דבר בשתן. תומכי הגישה גורסים כי צריכה מרובה של חלבונים אלו גורמת לרמת ה-pH של נוזל הדם עצמו לצנוח באופן תדיר לרמות חומציות המסכנות חיים. כתוצאה, מכך הם טוענים שהעצמות נאלצות לשחרר כמויות אדירות של סידן לתוך זרם הדם כדי לאזן את, החומציות מה שמוביל לאוסטאופורוזיס., למעשה הוכח מדעית מעל לכל ספק כי סביבה חומצית הנוצרת ישירות מהמזון שאנו אוכלים היא הגורם הראשוני והמרכזי שהופך תאים בריאים לתאים סרטניים ממאירים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. רמת ה-pH של נוזל הדם לעולם אינה צונחת בגלל מזון, חומצי אלא נשמרת יציבה לחלוטין. 2. תזונה חומצית אינה הופכת תאים בריאים לסרטניים, (להיפך הסרטן עצמו מייצר את הסביבה)החומצית.","section":"A","slides":""},{"n":123,"text":"ויטמין B12 מסונתז בטבע אך ורק על ידי חיידקים, ומיקרואורגניזמים ולכן הוא אינו מיוצר עצמאית על ידי צמחים או בעלי חיים. כדי לספוג את הוויטמין בגוף, האדם הקיבה מפרישה את חלבון ה-R-binder אשר מוביל את הוויטמין עד לספיגתו הסופית בתחילת המעי הדק (התריסריון). טבעונים יכולים להשיג את כל תצרוכת ה-B12 שלהם בבטחה וללא חסרים מאצות כגון, ספירולינה המכילות את הוויטמין בצורתו הפעילה והזמינה. תוסף התזונה מתילקובלמין נחשב לתוסף איכותי במיוחד משום שהוא מגיע בגירסתו הפעילה של הוויטמין ואינו דורש תהליכי המרה (מתילציה) נוספים בכבד.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. הספיגה הסופית של ויטמין B12 אל הדם נעשית ב סוף המעי הדק (באילאום) כשהוא קשור ל-Intrinsic Factor, ולא בתריסריון דרך R-binder. 2. אצת ספירולינה מכילה 'פסאודו B12 ' (אנלוג לא,)פעיל ולכן אינה מהווה מקור אמין או זמין לטבעונים.","section":"A","slides":""},{"n":126,"text":"חלב פרה נחשב בתרבות המערבית למקור משמעותי ועיקרי, לסידן וארגוני בריאות רבים ממליצים על צריכתו לשמירה על בניית העצם. עם, זאת מחקר האחיות המפורסם של אוניברסיטת הרווארד הוכיח ששתיית שלוש כוסות חלב ביום מחזקת את העצמות ומפחיתה ב-50% את הסיכון לשברים בצוואר הירך אצל נשים מבוגרות. חלבוני, החלב ובפרט חלבון מי הגבינה (Whey,) מעלים בחדות את רמות האינסולין בדם לאחר, הארוחה ובמקביל הם מדכאים לחלוטין את ייצור ההורמון IGF-1, בכבד מה שמפחית את הסיכון להתפתחות גידולים סרטניים., בנוסף חלבונים אלו יוצרים אפקט של גדילה ושגשוג תאים שאינו מומלץ לאנשים מבוגרים.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות של הרווארד מצא שחלב לא מפחית שברים (ואף עלול להעלות את הסיכון להם.) 2. חלבון מי הגבינה (Whey) דווקא מעלה מאוד את ייצור ההורמון IGF-1 המעודד שגשוג תאים (ולא מדכא אותו.)","section":"A","slides":""},{"n":144,"text":"ויטמין B12 מסונתז בטבע אך ורק על ידי, חיידקים ולכן בעלי חיים וצמחים אינם מסוגלים לייצרו בעצמם וזקוקים למקור חיצוני. תהליך הספיגה של הוויטמין מתחיל, בקיבה שם הוא נקשר לחלבון ייעודי בשם 'הגורם 'הפנימי (Intrinsic Factor,) ומיד לאחר מכן נספג במלואו אל זרם הדם כבר בתוך חלל הקיבה החומצי. תוסף התזונה הנפוץ, ביותר, ציאנוקובלמין נחשב לנגזרת האיכותית והמומלצת ביותר משום שהוא מספק את הוויטמין בצורתו הפעילה ואינו דורש שום תהליך המרה נוסף בכבד. חסר עמוק בוויטמין זה עלול לגרום, לאנמיה עייפות, כרונית ואף לתופעות נוירולוגיות ופסיכיאטריות קשות כדוגמת דיכאון.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. ה-B12 נספג אל הדם רק בסופו של ה מעי הדק (אילאום סופי,) ולא בחלל הקיבה. 2. תוסף ציאנוקובלמין אינו נגזרת, פעילה והוא מחייב תהליך המרה בכבד למתילקובלמין.","section":"A","slides":""},{"n":145,"text":"חלב פרה נחשב באופן מסורתי למקור הסידן העיקרי בתזונה, המערבית ולכן ארגוני בריאות רבים ממליצים עליו לבניית העצם ולמניעת אוסטאופורוזיס., למעשה מחקר האחיות המפורסם של, הרווארד שעקב אחרי עשרות אלפי, נשים אכן הוכיח ששתיית שלוש כוסות חלב ביום מפחיתה ב-50% את הסיכון לשברים בצוואר הירך. בנוסף, לסידן חלב מכיל חלבונים כדוגמת חלבון מי גבינה (Whey,) אשר הוכח קלינית כמדכא לחלוטין את ייצור הורמון הגדילה IGF-1, בכבד ובכך מגן מפני התפתחות סרטן. עם, זאת רגישות לסוכר החלב (לקטוז) נפוצה מאוד בקרב, מבוגרים משום שעם השנים הגוף מפסיק לייצר את האנזים לקטאז הדרוש לפירוקו.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאו כאן 2 טעויות: 1. מחקר האחיות הוכיח שצריכת חלב אינה מפחיתה שברים בצוואר, הירך ואולי אף מחמירה. 2. חלבון מי גבינה (Whey) מעלה משמעותית את ייצור ההורמון IGF-1, ולא מדכא אותו.","section":"A","slides":""}],"group":"tf","tf":true,"presets":[10,20,30,40]},{"id":"tf8","title":"סיבים ומיקרוביום","questions":[{"n":16,"text":"התססת, ירקות כגון הכנת כרוב כבוש, ביתי נשענת על עידוד התרבותם של חיידקי חומצה לקטית המצויים באופן טבעי על הירק. חיידקים פרוביוטיים אלו ניחנים בעמידות גבוהה לסביבה, מלוחה והחומצה הלקטית שהם מייצרים מורידה את רמת ה-pH בצנצנת לרמות שמונעות את הישרדותם של חיידקי ריקבון. כדי להבטיח התססה מוצלחת ושגשוג של החיידקים, הטובים חובה להשאיר את הירקות חשופים לאוויר הפתוח בתוך הצנצנת כדי לאפשר חדירת חמצן רב. בנוסף ליתרונות, הפרוביוטיים תהליך ההתססה מפרק חומרים מעכבי ספיגה כמו חומצה פיטית ומייצר כמות עצומה של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["B"],"multi":false,"explanation":"לא נכון. הוחבאה כאן טעות אחת: התססה חייבת להיעשות בסביבה אנאירובית (מתחת לפני, המים ללא,)חמצן ולא בחשיפה לאוויר הפתוח שמעודדת ריקבון ועובש.","section":"A","slides":""},{"n":28,"text":"התססת, ירקות כגון הכנת כרוב כבוש, ביתי היא תהליך הנשען על יצירת סביבה חסרת חמצן המעודדת שגשוג של חיידקי חומצה, לקטית המצויים באופן טבעי על הירק. חיידקים אנאירוביים אלו מפרקים את הסוכר המצוי בכרוב ומייצרים חומצה, לקטית אשר מורידה את רמת החומציות (pH) בצנצנת לרמה נמוכה של כ-2.9 ומונעת התפתחות עובש וריקבון. המלח המוסף לצנצנת אינו משמש כמזון לחיידקים, הטובים אלא נועד לדכא ולחסל חיידקים מתחרים בשלבי ההתססה הראשונים ולמשוך נוזלים מהירק. בנוסף לאספקת מאות זנים של חיידקים, פרוביוטיים התססת הכרוב מנטרלת את החומצה, הפיטית משפרת ספיגת, מינרלים ומייצרת כמות גדולה של ויטמין K2.","tf":true,"options":{"A":"נכון לחלוטין","B":"לא נכון — יש שגיאה"},"answer":["A"],"multi":false,"explanation":"נכון לחלוטין. מציג בצורה מדויקת את כל עקרונות, ההתססה תפקיד, המלח ותרומת ויטמין ה-K2 והפלורה.","section":"A","slides":""},{"n":38,"text":"התססת ירקות, מסורתית כדוגמת הכנת כרוב, כבוש מבוססת על יצירת סביבה חסרת חמצן בתוך צנצנת המאפשרת שגשוג של חיידקי חומצה לקטית. הוספת המלח בתחילת התהליך אינה נועדה להזין את החיידקים, הטובים אלא ליצור סביבה מלוחה ועוינת המעכבת את התפתחותם של חיידקי ריקבון ועובש. במהלך, ההתססה חיידקי החומצה הלקטית ניזונים מהסוכר הטבעי שבכרוב ומפרישים כתוצר לוואי חומצה לקטית המורידה משמעותית את רמת ה-pH בכלי. צריכת ירקות מותססים אלו לא רק מספקת פרוביוטיקה, עשירה אלא גם מנטרלת את החומצה, הפיטית משפרת את ספיגת המינרלים, בגוף ותורמת לייצור טבעי של
